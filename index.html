const topic=document.getElementById("topic"),catRow=document.getElementById("catRow");
const part=document.getElementById("part"),topicName=document.getElementById("topicName"),question=document.getElementById("question"),cue=document.getElementById("cue");
const position=document.getElementById("position"),seqLabel=document.getElementById("seqLabel"),progressFill=document.getElementById("progressFill");
const answer=document.getElementById("answer"),en=document.getElementById("en"),zh=document.getElementById("zh"),zhText=document.getElementById("zhText"),zhStatus=document.getElementById("zhStatus"),core=document.getElementById("core"),specialTag=document.getElementById("specialTag");
const prev=document.getElementById("prev"),next=document.getElementById("next"),reveal=document.getElementById("reveal");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function uniq(a){return [...new Set(a)]}
function mapNow(){return mode==="p1"?p1cat:p23cat}
function topicsNow(){return mode==="p1"?uniq(P1.map(x=>x[1])):uniq(P2.map(x=>x[1]))}

function drawCats(){
 const vals=["人物","事物","事件","地點"].filter(c=>Object.values(mapNow()).includes(c));
 if(!vals.includes(category))category=vals[0];
 catRow.innerHTML=vals.map(c=>`<button class="catBtn ${c===category?"active":""}" data-c="${c}">${c}</button>`).join("");
 document.querySelectorAll(".catBtn").forEach(b=>b.onclick=()=>{category=b.dataset.c;drawCats();fillTopics();});
}
function fillTopics(preferred=""){
 const map=mapNow(),list=topicsNow().filter(t=>map[t]===category);
 topic.innerHTML=list.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
 if(preferred&&list.includes(preferred))topic.value=preferred;
 buildSequence();
}
function buildSequence(){
 const t=topic.value;
 sequence=mode==="p1"?P1.filter(x=>x[1]===t):[...P2.filter(x=>x[1]===t),...P3.filter(x=>x[1]===t)];
 index=0;render();
}
function render(){
 const r=sequence[index];
 if(!r)return;
 part.textContent=r[0]; topicName.textContent=r[1]; question.textContent=r[2];
 cue.innerHTML=r[6]?.length?`<div class="cue"><b>You should say:</b><ul>${r[6].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
 specialTag.innerHTML=r[0]==="Part 2"?`<span class="p2tag">Part 2：準備 1:00 → 回答最多 2:00</span>`:r[0]==="Part 3"?`<span class="p3hint">Part 3：沒有官方每題固定秒數；練習時看自己能否約 30–40 秒講完整</span>`:"";
 en.textContent=r[3]; zhText.textContent=""; zhStatus.textContent=""; zh.classList.remove("loading"); core.innerHTML=`<b>Core：</b>${esc(r[7]||"")}`;
 answer.classList.remove("open"); reveal.textContent="看答案";
 position.textContent=`${index+1} / ${sequence.length}`;
 seqLabel.textContent=mode==="p23"?"Part 2 → Part 3":"Part 1";
 progressFill.style.width=`${((index+1)/sequence.length)*100}%`;
 prev.disabled=index===0;next.disabled=index===sequence.length-1;
 resetTimerForCurrent();
}
prev.onclick=()=>{if(index>0){index--;render();}};
next.onclick=()=>{if(index<sequence.length-1){index++;render();}};

// Chinese translation: static translations when available; otherwise translate once on demand and cache.
function hashText(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(16);
}
function splitForTranslation(text,maxLen=380){
  const paras=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(const p of paras){
    const sentences=p.match(/[^.!?]+[.!?]?/g)||[p];
    let cur="";
    for(const raw of sentences){
      const sent=raw.trim(); if(!sent)continue;
      if((cur+" "+sent).trim().length<=maxLen){cur=(cur+" "+sent).trim();}
      else{if(cur)out.push(cur);cur=sent;}
    }
    if(cur)out.push(cur);
  }
  return out;
}
async function translateWithBrowser(text){
  if(!(window.Translator&&Translator.create)) throw new Error("Browser Translator unavailable");
  let availability="available";
  if(Translator.availability){availability=await Translator.availability({sourceLanguage:"en",targetLanguage:"zh"});}
  if(availability==="unavailable") throw new Error("Chinese language pack unavailable");
  const translator=await Translator.create({sourceLanguage:"en",targetLanguage:"zh"});
  const pieces=splitForTranslation(text,700), result=[];
  for(const p of pieces) result.push(await translator.translate(p));
  if(translator.destroy)translator.destroy();
  return result.join("\n\n");
}
async function translateWithMyMemory(text){
  const pieces=splitForTranslation(text,360), result=[];
  for(const p of pieces){
    const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(p)+"&langpair=en%7Czh-TW";
    const res=await fetch(url);
    if(!res.ok)throw new Error("translation service error");
    const data=await res.json();
    const translated=data?.responseData?.translatedText;
    if(!translated)throw new Error("empty translation");
    const box=document.createElement("textarea");box.innerHTML=translated;
    result.push(box.value);
  }
  return result.join("\n\n");
}
async function translateWithGoogleFallback(text){
  const pieces=splitForTranslation(text,900), result=[];
  for(const p of pieces){
    const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q="+encodeURIComponent(p);
    const res=await fetch(url);
    if(!res.ok)throw new Error("google translate error");
    const data=await res.json();
    result.push((data?.[0]||[]).map(x=>x?.[0]||"").join(""));
  }
  return result.join("\n\n");
}
async function showChineseTranslation(){
  const r=sequence[index]; if(!r)return;
  if(r[8]){zhText.textContent=r[8];zhStatus.textContent="已內建中文翻譯";return;}
  const key="ieltsSpeakingZhV2:"+hashText(r[3]);
  const cached=localStorage.getItem(key);
  if(cached){zhText.textContent=cached;zhStatus.textContent="已從此瀏覽器快取載入";return;}
  zh.classList.add("loading");zhText.textContent="正在產生中文翻譯…";zhStatus.textContent="第一次開啟這題時會翻譯並儲存在瀏覽器，下次直接顯示。";
  try{
    let translated="";
    try{translated=await translateWithBrowser(r[3]);}
    catch(e1){
      try{translated=await translateWithMyMemory(r[3]);}
      catch(e2){translated=await translateWithGoogleFallback(r[3]);}
    }
    translated=translated.trim();
    if(!translated)throw new Error("empty translation");
    localStorage.setItem(key,translated);
    if(sequence[index]===r){zhText.textContent=translated;zhStatus.textContent="中文翻譯已快取";}
  }catch(err){
    if(sequence[index]===r){
      zhText.textContent=(r[4]||"翻譯暫時無法載入，請稍後再試。");
      zhStatus.textContent="自動翻譯暫時無法使用；目前顯示題目重點／備用中文。";
    }
  }finally{if(sequence[index]===r)zh.classList.remove("loading");}
}
reveal.onclick=()=>{const o=answer.classList.toggle("open");reveal.textContent=o?"隱藏答案":"看答案";if(o)showChineseTranslation();};
topic.onchange=buildSequence;
document.getElementById("random").onclick=()=>{const opts=[...topic.options];if(!opts.length)return;let n=Math.floor(Math.random()*opts.length);if(opts.length>1)while(n===topic.selectedIndex)n=Math.floor(Math.random()*opts.length);topic.selectedIndex=n;buildSequence();};
document.getElementById("tabP1").onclick=()=>{mode="p1";category="人物";document.getElementById("tabP1").classList.add("active");document.getElementById("tabP23").classList.remove("active");drawCats();fillTopics();};
document.getElementById("tabP23").onclick=()=>{mode="p23";category="人物";document.getElementById("tabP23").classList.add("active");document.getElementById("tabP1").classList.remove("active");drawCats();fillTopics();};

// Timer: NOT sticky and NEVER changes question automatically.
let timerId=null,running=false,phase="",left=20,elapsed=0;
const timeEl=document.getElementById("time"),timerLabel=document.getElementById("timerLabel"),timerHint=document.getElementById("timerHint"),timerStart=document.getElementById("timerStart");
function fmt(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null;running=false;timerStart.textContent="開始";}
function resetTimerForCurrent(){
 stopTimer(); const r=sequence[index]; if(!r)return;
 if(r[0]==="Part 1"){phase="p1";left=20;timeEl.textContent=fmt(left);timerLabel.textContent="Part 1 練習計時";timerHint.textContent="20 秒只是練習目標，不是官方硬性限制。";}
 else if(r[0]==="Part 2"){phase="p2prep";left=60;timeEl.textContent=fmt(left);timerLabel.textContent="Part 2｜準備";timerHint.textContent="按開始後：準備 1:00，接著自動切換成回答 2:00；不會自動跳下一題。";}
 else{phase="p3";elapsed=0;timeEl.textContent=fmt(elapsed);timerLabel.textContent="Part 3｜正數計時";timerHint.textContent="Part 3 沒有官方每題固定時間。這裡正數計時，約 30–40 秒能完整講清楚即可。";}
}
function finishCountdown(){
 stopTimer();timeEl.textContent="TIME";
}
timerStart.onclick=()=>{
 if(running){if(timerId)clearInterval(timerId);timerId=null;running=false;timerStart.textContent="繼續";return;}
 running=true;timerStart.textContent="暫停";
 if(phase==="p3"){
   timerId=setInterval(()=>{elapsed++;timeEl.textContent=fmt(elapsed);if(elapsed===30)timerHint.textContent="已到 30 秒：如果觀點完整，可以自然收尾。";if(elapsed===40)timerHint.textContent="已到 40 秒：不用硬加內容，講完就停。";},1000);
 }else{
   timerId=setInterval(()=>{
     if(left>0){left--;timeEl.textContent=fmt(left);return;}
     if(phase==="p2prep"){
       phase="p2speak";left=120;timerLabel.textContent="Part 2｜回答";timerHint.textContent="現在開始回答，最多 2:00。";timeEl.textContent=fmt(left);
     }else finishCountdown();
   },1000);
 }
};
document.getElementById("timerReset").onclick=resetTimerForCurrent;

drawCats();fillTopics();
</script>
