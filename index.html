e creative people in a team?", "Yes. Creative people can help a team see more than one solution. Creative people help others see different ways to solve a problem. For example, a team may find a new design after one person suggests an unusual idea. Different thinking can improve the final result.", "中文邏輯：先回答題目 → Yes. Creative people can help a team see more than one solution.｜理由：Creative people help others see different ways to solve a problem.｜例子：A team may find a new design after one person suggests an unusual idea.｜結果：Different thinking can improve the final result.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Creative people can help a team see more than one solution.", ""], ["Part 3", "擅⾧做手工的人", "What impact can artistic buildings have on society?", "Artistic buildings can give a city identity and make public spaces more interesting. A special building can become part of a city's identity. Design can affect how people feel about public space. For instance, people may remember a place because of one building that looks different or tells a story.", "中文邏輯：先回答題目 → Artistic buildings can give a city identity and make public spaces more interesting.｜理由：A special building can become part of a city's identity.｜例子：People may remember a place because of one building that looks different or tells a story.｜結果：Design can affect how people feel about public space.", "Part 3｜522/522 題目導向逐題校正", null, "Artistic buildings can give a city identity and make public spaces more interesting.", ""], ["Part 3", "擅⾧做手工的人", "Do children these days still like doing arts and crafts?", "Yes, many children still enjoy arts and crafts, especially when they can make something themselves. Children often enjoy making things because they can see a result they created themselves. You can see this in daily life. Cutting, drawing or building gives them control and freedom. Hands-on work can be both fun and educational.", "中文邏輯：先回答題目 → Yes, many children still enjoy arts and crafts, especially when they can make something themselves.｜理由：Children often enjoy making things because they can see a result they created themselves.｜例子：Cutting, drawing or building gives them control and freedom.｜結果：Hands-on work can be both fun and educational.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, many children still enjoy arts and crafts, especially when they can make something themselves.", ""], ["Part 3", "擅⾧做手工的人", "Why do some children enjoy making things by hand?", "Because making something by hand gives children control and a clear result they can see. Handmade work feels satisfying because progress is visible and personal. One clear example is a child can start with simple materials and slowly create a real object. The process builds patience and attention.", "中文邏輯：先回答題目 → Because making something by hand gives children control and a clear result they can see.｜理由：Handmade work feels satisfying because progress is visible and personal.｜例子：A child can start with simple materials and slowly create a real object.｜結果：The process builds patience and attention.", "Part 3｜522/522 題目導向逐題校正", null, "Because making something by hand gives children control and a clear result they can see.", ""], ["Part 3", "擅⾧做手工的人", "Do you think art classes are important for children?", "Yes. Art classes give children a chance to create, make choices and express feelings. Art classes give children a place to create without one correct answer. You can see this in daily life. Drawing or making things can help children express ideas they cannot explain easily. Art supports creativity as well as enjoyment.", "中文邏輯：先回答題目 → Yes. Art classes give children a chance to create, make choices and express feelings.｜理由：Art classes give children a place to create without one correct answer.｜例子：Drawing or making things can help children express ideas they cannot explain easily.｜結果：Art supports creativity as well as enjoyment.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Art classes give children a chance to create, make choices and express feelings.", ""], ["Part 3", "喜歡拍照的人", "When do people like taking photos?", "People usually take photos during trips, celebrations and moments they want to remember. One reason is that photos are useful because they keep memories, but taking too many can reduce attention. A simple example is a traveller may remember the camera screen more than the place itself. A few meaningful photos are often enough.", "中文邏輯：先回答題目 → People usually take photos during trips, celebrations and moments they want to remember.｜理由：Photos are useful because they keep memories, but taking too many can reduce attention.｜例子：A traveller may remember the camera screen more than the place itself.｜結果：A few meaningful photos are often enough.", "Part 3｜522/522 題目導向逐題校正", null, "People usually take photos during trips, celebrations and moments they want to remember.", ""], ["Part 3", "喜歡拍照的人", "Some people don't mind others walking into their shot when they're taking photos. What do you think?", "I do not think it is a big problem in a public place unless the person does it on purpose. One reason is that photos are useful because they keep memories, but taking too many can reduce attention. A simple example is a traveller may remember the camera screen more than the place itself. A few meaningful photos are often enough.", "中文邏輯：先回答題目 → I do not think it is a big problem in a public place unless the person does it on purpose.｜理由：Photos are useful because they keep memories, but taking too many can reduce attention.｜例子：A traveller may remember the camera screen more than the place itself.｜結果：A few meaningful photos are often enough.", "Part 3｜522/522 題目導向逐題校正", null, "I do not think it is a big problem in a public place unless the person does it on purpose.", ""], ["Part 3", "喜歡拍照的人", "What are the downsides of constantly taking photos while traveling?", "The biggest downside is that people may stop enjoying the moment itself. Travel gives people a change of environment and direct 522 題目導向逐題校正", null, "People often take photos of family, friends, food, travel and special events.", ""], ["Part 3", "喜歡拍照的人", "Why are some people keen on taking photos?", "People like taking photos because pictures help them keep memories and share moments. The reason is that photos are useful because they keep memories, but taking too many can reduce attention. A traveller may remember the camera screen more than the place itself. A few meaningful photos are often enough.", "中文邏輯：先回答題目 → People like taking photos because pictures help them keep memories and share moments.｜理由：Photos are useful because they keep memories, but taking too many can reduce attention.｜例子：A traveller may remember the camera screen more than the place itself.｜結果：A few meaningful photos are often enough.", "Part 3｜522/522 題目導向逐題校正", null, "People like taking photos because pictures help them keep memories and share moments.", ""], ["Part 3", "有條理的人", "Do you think it is important for managers to be well organized?", "Yes. A manager needs to be organized because other people's work often depends on their decisions. Organization saves time because people know what to do and where things are. You can see this in daily life. A short task list can stop someone from forgetting an important step. Simple systems reduce stress.", "中文邏輯：先回答題目 → Yes. A manager needs to be organized because other people's work often depends on their decisions.｜理由：Organization saves time because people know what to do and where things are.｜例子：A short task list can stop someone from forgetting an important step.｜結果：Simple systems reduce stress.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. A manager needs to be organized because other people's work often depends on their decisions.", ""], ["Part 3", "有條理的人", "Should parents teach their children to be organized?", "Yes. Simple habits at home can teach children to plan and keep track of their things. Simple systems reduce stress. This is because organization saves time because people know what to do and where things are. For example, a short task list can stop someone from forgetting an important step.", "中文邏輯：先回答題目 → Yes. Simple habits at home can teach children to plan and keep track of their things.｜理由：Organization saves time because people know what to do and where things are.｜例子：A short task list can stop someone from forgetting an important step.｜結果：Simple systems reduce stress.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Simple habits at home can teach children to plan and keep track of their things.", ""], ["Part 3", "有條理的人", "What can people do to become more organized?", "People can become more organized by using simple lists, fixed places and clear priorities. A short task list can stop someone from forgetting an important step. So simple systems reduce stress. Organization saves time because people know what to do and where things are.", "中文邏輯：先回答題目 → People can become more organized by using simple lists, fixed places and clear priorities.｜理由：Organization saves time because people know what to do and where things are.｜例子：A short task list can stop someone from forgetting an important step.｜結果：Simple systems reduce stress.", "Part 3｜522/522 題目導向逐題校正", null, "People can become more organized by using simple lists, fixed places and clear priorities.", ""], ["Part 3", "有條理的人", "Are organized people more likely to be successful at work or in their studies?", "Often, yes. Organization reduces wasted time, although it cannot replace skill or effort. Organization saves time because people know what to do and where things are. In real life, a short task list can stop someone from forgetting an important step. Simple systems reduce stress.", "中文邏輯：先回答題目 → Often, yes. Organization reduces wasted time, although it cannot replace skill or effort.｜理由：Organization saves time because people know what to do and where things are.｜例子：A short task list can stop someone from forgetting an important step.｜結果：Simple systems reduce stress.", "Part 3｜522/522 題目導向逐題校正", null, "Often, yes. Organization reduces wasted time, although it cannot replace skill or effort.", ""], ["Part 3", "有條理的人", "Do you think children should learn to be organized from a young age?", "Yes. Small routines are easier to build when children start young. One reason is that organization saves time because people know what to do and where things are. A simple example is a short task list can stop someone from forgetting an important step. Simple systems reduce stress.", "中文邏輯：先回答題目 → Yes. Small routines are easier to build when children start young.｜理由：Organization saves time because people know what to do and where things are.｜例子：A short task list can stop someone from forgetting an important step.｜結果：Simple systems reduce stress.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Small routines are easier to build when children start young.", ""], ["Part 3", "有條理的人", "Why is it important for people to be organized?", "Because organization saves time and reduces mental stress. A short task list can stop someone from forgetting an important step. Simple systems reduce stress.", "中文邏輯：先回答題目 → Because organization saves time and reduces mental stress.｜理由：Organization saves time because people know what to do and where things are.｜例子：A short task list can stop someone from forgetting an important step.｜結果：Simple systems reduce stress.", "Part 3｜522/522 題目導向逐題校正", null, "Because organization saves time and reduces mental stress.", ""], ["Part 3", "快樂的人", "Do you think doing a job that you like is more important than other things?", "Liking a job matters, but salary, health and work-life balance matter too. The reason is that enjoying work helps motivation, but people also need fair pay and enough rest. A person can love the task but still burn out with very long hours. A good job needs balance.", "中文邏輯：先回答題目 → Liking a job matters, but salary, health and work-life balance matter too.｜理由：Enjoying work helps motivation, but people also need fair pay and enough rest.｜例子：A person can love the task but still burn out with very long hours.｜結果：A good job needs balance.", "Part 3｜522/522 題目導向逐題校正", null, "Liking a job matters, but salary, health and work-life balance matter too.", ""], ["Part 3", "快樂的人", "What would make a student happy at school?", "Students are happier when they feel safe, have friends and can see their own progress. A student may feel happier when they have friends and can see improvement. So constant excitement is not necessary for a good life. Happiness is usually connected with relationships, rest and a sense of progress.", "中文邏輯：先回答題目 → Students are happier when they feel safe, have friends and can see their own progress.｜理由：Happiness is usually connected with relationships, rest and a sense of progress.｜例子：A student may feel happier when they have friends and can see improvement.｜結果：Constant excitement is not necessary for a good life.", "Part 3｜522/522 題目導向逐題校正", null, "Students are happier when they feel safe, have friends and can see their own progress.", ""], ["Part 3", "快樂的人", "When do you think people are happiest?", "People are often happiest when they feel connected, useful and not under constant pressure. For example, a simple dinner with people they care about can feel better than an expensive event. Strong relationships and balance matter more than constant excitement.", "中文邏輯：先回答題目 → People are often happiest when they feel connected, useful and not under constant pressure.｜理由：People are often happiest when they feel connected, useful and not under constant pressure.｜例子：A simple dinner with people they care about can feel better than an expensive event.｜結果：Strong relationships and balance matter more than constant excitement.", "Part 3｜522/522 題目導向逐題校正", null, "People are often happiest when they feel connected, useful and not under constant pressure.", ""], ["Part 3", "快樂的人", "How can the arts spread positive emotions in society?", "Art can spread positive emotions by giving people a shared experience. A hopeful song can change the mood of a whole crowd. So shared emotion is one reason art matters socially. Art can spread positive feelings because people experience music, stories or images together.", "中文邏輯：先回答題目 → Art can spread positive emotions by giving people a shared experience.｜理由：Art can spread positive feelings because people experience music, stories or images together.｜例子：A hopeful song can change the mood of a whole crowd.｜結果：Shared emotion is one reason art matters socially.", "Part 3｜522/522 題目導向逐題校正", null, "Art can spread positive emotions by giving people a shared experience.", ""], ["Part 3", "快樂的人", "Do you think teachers are able to spot the unhappy children?", "Often, yes. A teacher may notice changes in behaviour, energy or participation. A patient teacher can help a shy student ask questions. That matters because good teachers explain clearly, notice students' needs and make mistakes feel safe. Respect and usefulness matter more than popularity.", "中文邏輯：先回答題目 → Often, yes. A teacher may notice changes in behaviour, energy or participation.｜理由：Good teachers explain clearly, notice students' needs and make mistakes feel safe.｜例子：A patient teacher can help a shy student ask questions.｜結果：Respect and usefulness matter more than popularity.", "Part 3｜522/522 題目導向逐題校正", null, "Often, yes. A teacher may notice changes in behaviour, energy or participation.", ""], ["Part 3", "快樂的人", "Should teachers know what children are doing all the time?", "No. Teachers should support children, but children also need privacy and independence. Good teachers explain clearly, notice students' needs and make mistakes feel safe. In real life, a patient teacher can help a shy student ask questions. Respect and usefulness matter more than popularity.", "中文邏輯：先回答題目 → No. Teachers should support children, but children also need privacy and independence.｜理由：Good teachers explain clearly, notice students' needs and make mistakes feel safe.｜例子：A patient teacher can help a shy student ask questions.｜結果：Respect and usefulness matter more than popularity.", "Part 3｜522/522 題目導向逐題校正", null, "No. Teachers should support children, but children also need privacy and independence.", ""], ["Part 3", "做困難事情並成功的人", "In which sectors are companies more likely to succeed in Taiwan?", "Technology, healthcare and service industries have strong opportunities in Taiwan. AI can save time and explain ideas, but it can also give confident wrong answers. In real life, users still need to check important information. AI is strongest as a helper, not a replacement for thinking.", "中文邏輯：先回答題目 → Technology, healthcare and service industries have strong opportunities in Taiwan.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "Technology, healthcare and service industries have strong opportunities in Taiwan.", ""], ["Part 3", "做困難事情並成功的人", "Is it easy to start up a company?", "No. Starting a company needs money, customers, a clear idea and a lot of patience. Companies survive when they solve real problems and build trust. For example, customers return when the product and service stay reliable. Long-term value matters more than short attention.", "中文邏輯：先回答題目 → No. Starting a company needs money, customers, a clear idea and a lot of patience.｜理由：Companies survive when they solve real problems and build trust.｜例子：Customers return when the product and service stay reliable.｜結果：Long-term value matters more than short attention.", "Part 3｜522/522 題目導向逐題校正", null, "No. Starting a company needs money, customers, a clear idea and a lot of patience.", ""], ["Part 3", "做困難事情並成功的人", "Other than making money, what is more important for a company?", "Trust, good products and responsible treatment of staff and customers are also important. Companies survive when they solve real problems and build trust. Long-term value matters more than short attention. For instance, customers return when the product and service stay reliable.", "中文邏輯：先回答題目 → Trust, good products and responsible treatment of staff and customers are also important.｜理由：Companies survive when they solve real problems and build trust.｜例子：Customers return when the product and service stay reliable.｜結果：Long-term value matters more than short attention.", "Part 3｜522/522 題目導向逐題校正", null, "Trust, good products and responsible treatment of staff and customers are also important.", ""], ["Part 3", "做困難事情並成功的人", "Does money equal success?", "No. Money is one part of success, but it does not measure freedom, meaning or happiness. Someone may earn a high salary but have no time to enjoy life. Success needs a wider definition.", "中文邏輯：先回答題目 → No. Money is one part of success, but it does not measure freedom, meaning or happiness.｜理由：Money can show financial success, but it does not measure freedom, relationships or meaning.｜例子：Someone may earn a high salary but have no time to enjoy life.｜結果：Success needs a wider definition.", "Part 3｜522/522 題目導向逐題校正", null, "No. Money is one part of success, but it does not measure freedom, meaning or happiness.", ""], ["Part 3", "做困難事情並成功的人", "How can companies help protect the environment?", "Companies can cut waste, use energy more carefully and make cleaner products. A simple example is a factory that cuts unnecessary packaging can reduce a large amount of waste. Business choices can affect many people at once.", "中文邏輯：先回答題目 → Companies can cut waste, use energy more carefully and make cleaner products.｜理由：Companies can reduce waste, use energy more carefully and design cleaner products.｜例子：A factory that cuts unnecessary packaging can reduce a large amount of waste.｜結果：Business choices can affect many people at once.", "Part 3｜522/522 題目導向逐題校正", null, "Companies can cut waste, use energy more carefully and make cleaner products.", ""], ["Part 3", "做困難事情並成功的人", "Is it difficult to do business in today’s world?", "Yes, in some ways. Competition is strong and customer needs change quickly. A good product can still fail if people do not need it or cannot find it. That matters because business is difficult because competition, money and customer needs all change. Success needs both value and good management.", "中文邏輯：先回答題目 → Yes, in some ways. Competition is strong and customer needs change quickly.｜理由：Business is difficult because competition, money and customer needs all change.｜例子：A good product can still fail if people do not need it or cannot find it.｜結果：Success needs both value and good management.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, in some ways. Competition is strong and customer needs change quickly.", ""], ["Part 3", "受歡迎的人", "Why do people want to be popular?", "Many people want to be popular because attention can make them feel accepted or important. Popularity often comes from visibility, confidence and connection with other people. For example, a friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Many people want to be popular because attention can make them feel accepted or important.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Many people want to be popular because attention can make them feel accepted or important.", ""], ["Part 3", "受歡迎的人", "Is it easier to become popular nowadays?", "Yes. Social media makes it easier to become known quickly, although staying popular is harder. A friendly student who includes others may become popular without trying to show off. So being liked is not the same as being respected. Popularity often comes from visibility, confidence and connection with other people.", "中文邏輯：先回答題目 → Yes. Social media makes it easier to become known quickly, although staying popular is harder.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Social media makes it easier to become known quickly, although staying popular is harder.", ""], ["Part 3", "受歡迎的人", "What are the qualities of being a good teacher?", "A good teacher needs patience, clear communication and the ability to make students feel safe asking questions. Good teachers explain clearly, notice students' needs and make mistakes feel safe. For example, a patient teacher can help a shy student ask questions. Respect and usefulness matter more than popularity.", "中文邏輯：先回答題目 → A good teacher needs patience, clear communication and the ability to make students feel safe asking questions.｜理由：Good teachers explain clearly, notice students' needs and make mistakes feel safe.｜例子：A patient teacher can help a shy student ask questions.｜結果：Respect and usefulness matter more than popularity.", "Part 3｜522/522 題目導向逐題校正", null, "A good teacher needs patience, clear communication and the ability to make students feel safe asking questions.", ""], ["Part 3", "受歡迎的人", "Do you think good teachers are always popular among students?", "No. A good teacher may be strict, but students can still respect them. Popularity often comes from visibility, confidence and connection with other people. For example, a friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → No. A good teacher may be strict, but students can still respect them.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "No. A good teacher may be strict, but students can still respect them.", ""], ["Part 3", "受歡迎的人", "Is it important for a teacher to be popular?", "Being respected and helpful is more important than being popular. A friendly student who includes others may become popular without trying to show off. That matters because popularity often comes from visibility, confidence and connection with other people. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Being respected and helpful is more important than being popular.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Being respected and helpful is more important than being popular.", ""], ["Part 3", "受歡迎的人", "Why are some students popular in school?", "Students are often popular because they are friendly, confident or good at including others. One reason is that popularity often comes from visibility, confidence and connection with other people. A simple example is a friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Students are often popular because they are friendly, confident or good at including others.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Students are often popular because they are friendly, confident or good at including others.", ""], ["Part 3", "欽佩的運動員", "Why are there so few top athletes?", "There are few top athletes because reaching that level needs talent, years of training and strong mental control. Top athletes need years of training, focus and recovery. In real life, one talented player still has to perform under pressure again and again. Discipline makes talent reliable.", "中文邏輯：先回答題目 → There are few top athletes because reaching that level needs talent, years of training and strong mental control.｜理由：Top athletes need years of training, focus and recovery.｜例子：One talented player still has to perform under pressure again and again.｜結果：Discipline makes talent reliable.", "Part 3｜522/522 題目導向逐題校正", null, "There are few top athletes because reaching that level needs talent, years of training and strong mental control.", ""], ["Part 3", "欽佩的運動員", "What is the most popular sport in your country?", "Baseball is one of the most popular sports in Taiwan. Popularity often comes from visibility, confidence and connection with other people. Being liked is not the same as being respected. For instance, a friendly student who includes others may become popular without trying to show off.", "中文邏輯：先回答題目 → Baseball is one of the most popular sports in Taiwan.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Baseball is one of the most popular sports in Taiwan.", ""], ["Part 3", "欽佩的運動員", "Is it easy to identify children’s talents?", "Not always. Children can change a lot as they grow, so one early result may not show their real talent. Early labels can miss abilities that appear later. This is because talent is easier to see after people have had enough time and chances to try different things. For example, a child who is quiet in class may still be excellent at art or sport.", "中文邏輯：先回答題目 → Not always. Children can change a lot as they grow, so one early result may not show their real talent.｜理由：Talent is easier to see after people have had enough time and chances to try different things.｜例子：A child who is quiet in class may still be excellent at art or sport.｜結果：Early labels can miss abilities that appear later.", "Part 3｜522/522 題目導向逐題校正", null, "Not always. Children can change a lot as they grow, so one early result may not show their real talent.", ""], ["Part 3", "欽佩的運動員", "Is talent important in sports?", "Yes, but talent is only the starting point. Training and discipline matter more over time. Talent is easier to see after people have had enough time and chances to try different things. You can see this in daily life. A child who is quiet in class may still be excellent at art or sport. Early labels can miss abilities that appear later.", "中文邏輯：先回答題目 → Yes, but talent is only the starting point. Training and discipline matter more over time.｜理由：Talent is easier to see after people have had enough time and chances to try different things.｜例子：A child who is quiet in class may still be excellent at art or sport.｜結果：Early labels can miss abilities that appear later.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, but talent is only the starting point. Training and discipline matter more over time.", ""], ["Part 3", "欽佩的運動員", "What qualities should an athlete have?", "A strong athlete needs discipline, focus and the ability to recover from failure. Top athletes need years of training, focus and recovery. You can see this in daily life. One talented player still has to perform under pressure again and again. Discipline makes talent reliable.", "中文邏輯：先回答題目 → A strong athlete needs discipline, focus and the ability to recover from failure.｜理由：Top athletes need years of training, focus and recovery.｜例子：One talented player still has to perform under pressure again and again.｜結果：Discipline makes talent reliable.", "Part 3｜522/522 題目導向逐題校正", null, "A strong athlete needs discipline, focus and the ability to recover from failure.", ""], ["Part 3", "欽佩的運動員", "Should students have physical education and do sports at school?", "Yes. Physical education helps children build health, teamwork and basic movement skills. Sport is exciting because the result is uncertain and people share the same moment. The crowd adds emotion that a replay cannot fully copy. For instance, one play can change a whole game.", "中文邏輯：先回答題目 → Yes. Physical education helps children build health, teamwork and basic movement skills.｜理由：Sport is exciting because the result is uncertain and people share the same moment.｜例子：One play can change a whole game.｜結果：The crowd adds emotion that a replay cannot fully copy.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Physical education helps children build health, teamwork and basic movement skills.", ""], ["Part 3", "尊敬的比你年⾧的人", "Why is there a generation gap between the young and the old?", "The generation gap mainly comes from growing up in different social and technological environments. Older people may prefer face-to-face talk while younger people use messages more. Understanding the background can reduce conflict.", "中文邏輯：先回答題目 → The generation gap mainly comes from growing up in different social and technological environments.｜理由：The generation gap comes from growing up with different technology, work patterns and social rules.｜例子：Older people may prefer face-to-face talk while younger people use messages more.｜結果：Understanding the background can reduce conflict.", "Part 3｜522/522 題目導向逐題校正", null, "The generation gap mainly comes from growing up in different social and technological environments.", ""], ["Part 3", "尊敬的比你年⾧的人", "Has old people's life quality improved when compared to the past?", "In many ways, yes. Healthcare, transport and technology have made daily life easier for many older people. For example, online services and better medicine can make people more independent. The improvement is real, although not everyone benefits equally.", "中文邏輯：先回答題目 → In many ways, yes. Healthcare, transport and technology have made daily life easier for many older people.｜理由：Healthcare, transport and technology have improved daily life for many older people.｜例子：Online services and better medicine can make people more independent.｜結果：The improvement is real, although not everyone benefits equally.", "Part 3｜522/522 題目導向逐題校正", null, "In many ways, yes. Healthcare, transport and technology have made daily life easier for many older people.", ""], ["Part 3", "尊敬的比你年⾧的人", "What can young and old people learn from each other?", "Older people can share experience, while younger people can share new skills and technology. A simple example is a young person can explain a phone app, while an older person may give better advice about patience. Both sides have something useful to offer.", "中文邏輯：先回答題目 → Older people can share experience, while younger people can share new skills and technology.｜理由：Older people can share life experience, while younger people can share new tools and ideas.｜例子：A young person can explain a phone app, while an older person may give better advice about patience.｜結果：Both sides have something useful to offer.", "Part 3｜522/522 題目導向逐題校正", null, "Older people can share experience, while younger people can share new skills and technology.", ""], ["Part 3", "擅⾧學習和講新語言的人", "What is the most important thing for learning a language well?", "The most important thing is using the language often, even before it feels perfect. Speaking before every sentence feels perfect gives real feedback. So regular practice builds confidence. Language improves through use, not only study.", "中文邏輯：先回答題目 → The most important thing is using the language often, even before it feels perfect.｜理由：Language improves through use, not only study.｜例子：Speaking before every sentence feels perfect gives real feedback.｜結果：Regular practice builds confidence.", "Part 3｜522/522 題目導向逐題校正", null, "The most important thing is using the language often, even before it feels perfect.", ""], ["Part 3", "擅⾧學習和講新語言的人", "How do people learn new things?", "People learn best by getting basic information and then using it in practice. People learn best when they understand the idea and then use it. In real life, reading one explanation is not enough if the skill needs practice. Active use helps information stay in memory.", "中文邏輯：先回答題目 → People learn best by getting basic information and then using it in practice.｜理由：People learn best when they understand the idea and then use it.｜例子：Reading one explanation is not enough if the skill needs practice.｜結果：Active use helps information stay in memory.", "Part 3｜522/522 題目導向逐題校正", null, "People learn best by getting basic information and then using it in practice.", ""], ["Part 3", "擅⾧學習和講新語言的人", "Why is it easier for children to learn new things than for adults?", "Children are often less afraid of mistakes, so they practise more naturally. People learn best when they understand the idea and then use it. For example, reading one explanation is not enough if the skill needs practice. Active use helps information stay in memory.", "中文邏輯：先回答題目 → Children are often less afraid of mistakes, so they practise more naturally.｜理由：People learn best when they understand the idea and then use it.｜例子：Reading one explanation is not enough if the skill needs practice.｜結果：Active use helps information stay in memory.", "Part 3｜522/522 題目導向逐題校正", null, "Children are often less afraid of mistakes, so they practise more naturally.", ""], ["Part 3", "擅⾧學習和講新語言的人", "Do people learn any languages other than English?", "Yes. People also learn languages such as Japanese, Korean, Spanish and others for work or interest. Language improves through use, not only study. For example, speaking before every sentence feels perfect gives real feedback. Regular practice builds confidence.", "中文邏輯：先回答題目 → Yes. People also learn languages such as Japanese, Korean, Spanish and others for work or interest.｜理由：Language improves through use, not only study.｜例子：Speaking before every sentence feels perfect g  one good experience can turn a first-time buyer into a regular customer.", "中文邏輯：先回答題目 → Yes. Customer satisfaction is important because companies need people to come back.｜理由：Happy customers are more likely to return and recommend the company.｜例子：One good experience can turn a first-time buyer into a regular customer.｜結果：Trust supports long-term business.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Customer satisfaction is important because companies need people to come back.", ""], ["Part 3", "在成功公司工作的人", "Do you think companies should donate money to help society?", "It can be good, but companies should first make sure their own business is responsible. Real social responsibility starts with how the company operates. This is because companies can support society, but charity should not hide irresponsible business behaviour. For example, a company should treat workers and customers fairly before using donations for image.", "中文邏輯：先回答題目 → It can be good, but companies should first make sure their own business is responsible.｜理由：Companies can support society, but charity should not hide irresponsible business behaviour.｜例子：A company should treat workers and customers fairly before using donations for image.｜結果：Real social responsibility starts with how the company operates.", "Part 3｜522/522 題目導向逐題校正", null, "It can be good, but companies should first make sure their own business is responsible.", ""], ["Part 3", "在成功公司工作的人", "Do you think governments should provide financial support to companies?", "Sometimes. Support makes sense when a company creates clear public value or jobs. One reason is that public support should have a clear goal and clear rules. A simple example is helping a useful start-up may create jobs, but weak oversight can waste money. Support works best when results can be checked.", "中文邏輯：先回答題目 → Sometimes. Support makes sense when a company creates clear public value or jobs.｜理由：Public support should have a clear goal and clear rules.｜例子：Helping a
