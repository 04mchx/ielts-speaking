but too much stress hurts health and focus.", ""], ["Part 3", "浪費時間的活動", "Why do some people refuse to abide by rules?", "Some people think a rule is unfair, inconvenient or unlikely to be enforced. For example, if there is no clear reason or consequence, people may take the rule less seriously. Trust in the rule matters.", "中文邏輯：先回答題目 → Some people think a rule is unfair, inconvenient or unlikely to be enforced.｜理由：Some people ignore rules because they think the rule is unfair, inconvenient or unlikely to be enforced.｜例子：If there is no clear reason or consequence, people may take the rule less seriously.｜結果：Trust in the rule matters.", "Part 3｜522/522 題目導向逐題校正", null, "Some people think a rule is unfair, inconvenient or unlikely to be enforced.", ""], ["Part 3", "浪費時間的活動", "What kinds of things make people feel pressured?", "Work, money, exams, family problems and lack of time can all create pressure. The reason is that pressure often comes from too many demands and too little time or control. Work, exams, money and family problems can all build up together. Reducing one source can make the whole situation easier.", "中文邏輯：先回答題目 → Work, money, exams, family problems and lack of time can all create pressure.｜理由：Pressure often comes from too many demands and too little time or control.｜例子：Work, exams, money and family problems can all build up together.｜結果：Reducing one source can make the whole situation easier.", "Part 3｜522/522 題目導向逐題校正", null, "Work, money, exams, family problems and lack of time can all create pressure.", ""], ["Part 3", "浪費時間的活動", "Will you continue doing something when you are aware that it’s a waste of time?", "No. Once I clearly know something has no value, I would rather change what I am doing. The reason is that once people clearly know an activity has no value, changing course is usually better than continuing automatically. Endless scrolling is a common example because people can continue without choosing to. Awareness should lead to a different action.", "中文邏輯：先回答題目 → No. Once I clearly know something has no value, I would rather change what I am doing.｜理由：Once people clearly know an activity has no value, changing course is usually better than continuing automatically.｜例子：Endless scrolling is a common example because people can continue without choosing to.｜結果：Awareness should lead to a different action.", "Part 3｜522/522 題目導向逐題校正", null, "No. Once I clearly know something has no value, I would rather change what I am doing.", ""], ["Part 3", "浪費時間的活動", "How do you balance life and work?", "People need clear work limits and protected time for rest, family and sleep. Balance needs habits, not only good intentions. For example, turning off work messages at a certain time can help.", "中文邏輯：先回答題目 → People need clear work limits and protected time for rest, family and sleep.｜理由：People need clear limits around work and protected time for sleep, family and rest.｜例子：Turning off work messages at a certain time can help.｜結果：Balance needs habits, not only good intentions.", "Part 3｜522/522 題目導向逐題校正", null, "People need clear work limits and protected time for rest, family and sleep.", ""], ["Part 3", "不喜歡的短途旅行", "Which is better for knowing more about a country? Travelling or reading books about it?", "Travel gives direct experience, while books give more background and detail. Using local transport or seeing daily life can teach more than a photo alone. That matters because travel gives people a change of environment and direct experience. The value comes from seeing another way of living.", "中文邏輯：先回答題目 → Travel gives direct experience, while books give more background and detail.｜理由：Travel gives people a change of environment and direct experience.｜例子：Using local transport or seeing daily life can teach more than a photo alone.｜結果：The value comes from seeing another way of living.", "Part 3｜522/522 題目導向逐題校正", null, "Travel gives direct experience, while books give more background and detail.", ""], ["Part 3", "不喜歡的短途旅行", "How much time do you think people should spend on a trip abroad?", "About one or two weeks is enough for many trips, but it depends on distance and purpose. One reason is that travel gives direct experience that books cannot fully provide. A simple example is using local transport or speaking with people shows everyday culture. The length should match cost, distance and purpose.", "中文邏輯：先回答題目 → About one or two weeks is enough for many trips, but it depends on distance and purpose.｜理由：Travel gives direct experience that books cannot fully provide.｜例子：Using local transport or speaking with people shows everyday culture.｜結果：The length should match cost, distance and purpose.", "Part 3｜522/522 題目導向逐題校正", null, "About one or two weeks is enough for many trips, but it depends on distance and purpose.", ""], ["Part 3", "不喜歡的短途旅行", "Who prefers travelling abroad? The young or the old?", "Young people may travel more often because they usually have more energy and fewer family duties. Using local transport or seeing daily life can teach more than a photo alone. That matters because travel gives people a change of environment and direct experience. The value comes from seeing another way of living.", "中文邏輯：先回答題目 → Young people may travel more often because they usually have more energy and fewer family duties.｜理由：Travel gives people a change of environment and direct experience.｜例子：Using local transport or seeing daily life can teach more than a photo alone.｜結果：The value comes from seeing another way of living.", "Part 3｜522/522 題目導向逐題校正", null, "Young people may travel more often because they usually have more energy and fewer family duties.", ""], ["Part 3", "不喜歡的短途旅行", "Do Taiwanese people like travelling abroad?", "Yes. Nearby countries such as Japan and Korea are especially popular. Travel gives people a change of environment and direct experience. You can see this in daily life. Using local transport or seeing daily life can teach more than a photo alone. The value comes from seeing another way of living.", "中文邏輯：先回答題目 → Yes. Nearby countries such as Japan and Korea are especially popular.｜理由：Travel gives people a change of environment and direct experience.｜例子：Using local transport or seeing daily life can teach more than a photo alone.｜結果：The value comes from seeing another way of living.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Nearby countries such as Japan and Korea are especially popular.", ""], ["Part 3", "近期改變", "Who tend to change their daily routine more, young people or old people?", "Young people usually change routines more because study, work and social life change faster. One reason is that a routine reduces small decisions and gives daily life more structure. A simple example is preparing things at night can make the morning easier. Routine is useful when it still leaves some flexibility.", "中文邏輯：先回答題目 → Young people usually change routines more because study, work and social life change faster.｜理由：A routine reduces small decisions and gives daily life more structure.｜例子：Preparing things at night can make the morning easier.｜結果：Routine is useful when it still leaves some flexibility.", "Part 3｜522/522 題目導向逐題校正", null, "Young people usually change routines more because study, work and social life change faster.", ""], ["Part 3", "近期改變", "Do people often make plans around their regular routines?", "Yes. People usually plan exercise, shopping or appointments around work and family schedules. Preparing things at night can make the morning easier. So routine is useful when it still leaves some flexibility. A routine reduces small decisions and gives daily life more structure.", "中文邏輯：先回答題目 → Yes. People usually plan exercise, shopping or appointments around work and family schedules.｜理由：A routine reduces small decisions and gives daily life more structure.｜例子：Preparing things at night can make the morning easier.｜結果：Routine is useful when it still leaves some flexibility.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. People usually plan exercise, shopping or appointments around work and family schedules.", ""], ["Part 3", "近期改變", "Is it good for people to get a job promotion?", "A promotion is good when it brings fair pay, useful growth and manageable responsibility. The whole package matters. For example, a new title alone may not improve life if stress becomes too high.", "中文邏輯：先回答題目 → A promotion is good when it brings fair pay, useful growth and manageable responsibility.｜理由：A promotion is useful when the extra responsibility comes with fair pay and growth.｜例子：A new title alone may not improve life if stress becomes too high.｜結果：The whole package matters.", "Part 3｜522/522 題目導向逐題校正", null, "A promotion is good when it brings fair pay, useful growth and manageable responsibility.", ""], ["Part 3", "近期改變", "Do you think it is good to change jobs?", "It can be good when the new job offers better growth or conditions, but changing too often can reduce stability. A simple example is changing too often without a clear reason can reduce stability. The reason for moving matters more than the number of changes.", "中文邏輯：先回答題目 → It can be good when the new job offers better growth or conditions, but changing too often can reduce stability.｜理由：Changing jobs can be good when the new role offers better growth, pay or conditions.｜例子：Changing too often without a clear reason can reduce stability.｜結果：The reason for moving matters more than the number of changes.", "Part 3｜522/522 題目導向逐題校正", null, "It can be good when the new job offers better growth or conditions, but changing too often can reduce stability.", ""], ["Part 3", "近期改變", "Do you think it is good to change one’s daily routine?", "Yes, if the old routine is not working. Change should solve a real problem. A routine reduces small decisions and gives daily life more structure. For example, preparing things at night can make the morning easier. Routine is useful when it still leaves some flexibility.", "中文邏輯：先回答題目 → Yes, if the old routine is not working. Change should solve a real problem.｜理由：A routine reduces small decisions and gives daily life more structure.｜例子：Preparing things at night can make the morning easier.｜結果：Routine is useful when it still leaves some flexibility.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, if the old routine is not working. Change should solve a real problem.", ""], ["Part 3", "當地新聞", "How can people develop their national identity?", "People build national identity through shared history, culture, language and public experiences. Language, food, public events and common memories all contribute. So identity is strongest when it creates connection without rejecting outsiders. Shared culture and history can give people a sense of belonging.", "中文邏輯：先回答題目 → People build national identity through shared history, culture, language and public experiences.｜理由：Shared culture and history can give people a sense of belonging.｜例子：Language, food, public events and common memories all contribute.｜結果：Identity is strongest when it creates connection without rejecting outsiders.", "Part 3｜522/522 題目導向逐題校正", null, "People build national identity through shared history, culture, language and public experiences.", ""], ["Part 3", "當地新聞", "Do you think it's important to have a national identity?", "It can give people a sense of belonging, as long as it does not become hostility toward others. The reason is that identity can give people a sense of belonging and shared memory. Public events, language and culture help people feel part of the same society. It is healthiest when it does not become hostility to outsiders.", "中文邏輯：先回答題目 → It can give people a sense of belonging, as long as it does not become hostility toward others.｜理由：Identity can give people a sense of belonging and shared memory.｜例子：Public events, language and culture help people feel part of the same society.｜結果：It is healthiest when it does not become hostility to outsiders.", "Part 3｜522/522 題目導向逐題校正", null, "It can give people a sense of belonging, as long as it does not become hostility toward others.", ""], ["Part 3", "當地新聞", "Do people prefer local or international news?", "People often follow both: local news affects daily life, while international news gives a wider view. The value depends on the topic. For example, a transport change matters locally, while a global crisis can affect prices or travel.", "中文邏輯：先回答題目 → People often follow both: local news affects daily life, while international news gives a wider view.｜理由：People often need both: local news affects daily life, while international news gives a wider view.｜例子：A transport change matters locally, while a global crisis can affect prices or travel.｜結果：The value depends on the topic.", "Part 3｜522/522 題目導向逐題校正", null, "People often follow both: local news affects daily life, while international news gives a wider view.", ""], ["Part 3", "當地新聞", "Do people read the newspaper where you live?", "Some do, but many people now read news on phones and websites. For example, digital news is faster and easier to update. The main issue is reliability, not paper versus screen.", "中文邏輯：先回答題目 → Some do, but many people now read news on phones and websites.｜理由：Some people still read newspapers, but many now get news from phones and websites.｜例子：Digital news is faster and easier to update.｜結果：The main issue is reliability, not paper versus screen.", "Part 3｜522/522 題目導向逐題校正", null, "Some do, but many people now read news on phones and websites.", ""], ["Part 3", "改變重要决定", "When do most children begin to make their own decisions?", "Children can make small choices quite early, while bigger decisions should grow with age. The reason is that important decisions need clear priorities because every choice has a cost. Choosing a university may involve money, location and future work. Good decisions compare the main trade-offs.", "中文邏輯：先回答題目 → Children can make small choices quite early, while bigger decisions should grow with age.｜理由：Important decisions need clear priorities because every choice has a cost.｜例子：Choosing a university may involve money, location and future work.｜結果：Good decisions compare the main trade-offs.", "Part 3｜522/522 題目導向逐題校正", null, "Children can make small choices quite early, while bigger decisions should grow with age.", ""], ["Part 3", "改變重要想法", "Who do young people like to share opinions with?", "Young people often share opinions with close friends because they feel less judged. The topic decides who feels safest. For example, parents or teachers may be chosen for bigger decisions.", "中文邏輯：先回答題目 → Young people often share opinions with close friends because they feel less judged.｜理由：Young people often share opinions with close friends because they feel understood and less judged.｜例子：Parents or teachers may be chosen for bigger decisions.｜結果：The topic decides who feels safest.", "Part 3｜522/522 題目導向逐題校正", null, "Young people often share opinions with close friends because they feel less judged.", ""], ["Part 3", "改變重要想法", "Do children communicate more with teachers or with parents?", "Usually with parents in daily life, while teachers are more important for school and study matters. One reason is that parents usually shape daily values, while teachers strongly influence school and learning. A simple example is a child may ask parents about life choices and a teacher about study problems. Both roles matter in different areas.", "中文邏輯：先回答題目 → Usually with parents in daily life, while teachers are more important for school and study matters.｜理由：Parents usually shape daily values, while teachers strongly influence school and learning.｜例子：A child may ask parents about life choices and a teacher about study problems.｜結果：Both roles matter in different areas.", "Part 3｜522/522 題目導向逐題校正", null, "Usually with parents in daily life, while teachers are more important for school and study matters.", ""], ["Part 3", "改變重要想法", "Whose opinions are more important to children, their parents' or teachers'?", "Parents usually shape basic values, while teachers can strongly influence learning and school choices. For example, a child may ask parents about life choices and a teacher about study problems. Both roles matter in different areas.", "中文邏輯：先回答題目 → Parents usually shape basic values, while teachers can strongly influence learning and school choices.｜理由：Parents usually shape daily values, while teachers strongly influence school and learning.｜例子：A child may ask parents about life choices and a teacher about study problems.｜結果：Both roles matter in different areas.", "Part 3｜522/522 題目導向逐題校正", null, "Parents usually shape basic values, while teachers can strongly influence learning and school choices.", ""], ["Part 3", "改變重要想法", "When do most children begin to have their own opinions?", "Children start forming opinions early, but their views become more independent during the teenage years. School, friends and new experiences give them more information. Independent thinking grows gradually.", "中文邏輯：先回答題目 → Children start forming opinions early, but their views become more independent during the teenage years.｜理由：Children start forming opinions early, but their views become more independent during the teenage years.｜例子：School, friends and new experiences give them more information.｜結果：Independent thinking grows gradually.", "Part 3｜522/522 題目導向逐題校正", null, "Children start forming opinions early, but their views become more independent during the teenage years.", ""], ["Part 3", "發出很久都沒收到回覆的訊息/郵件", "Why do some people feel angry when others don’t reply to their message?", "People may feel ignored because messaging creates an expectation of quick replies. For example, but the other person may simply be busy or need time to answer. Silence online is easy to misunderstand.", "中文邏輯：先回答題目 → People may feel ignored because messaging creates an expectation of quick replies.｜理由：People may feel ignored because messaging creates an expectation of quick replies.｜例子：But the other person may simply be busy or need time to answer.｜結果：Silence online is easy to misunderstand.", "Part 3｜522/522 題目導向逐題校正", null, "People may feel ignored because messaging creates an expectation of quick replies.", ""], ["Part 3", "發出很久都沒收到回覆的訊息/郵件", "How do you show your respect in your messages?", "I use clear language, greet the person when needed and avoid demanding an instant answer. A simple example is a short greeting or saying 'when you have time' can change the tone. Good online manners are still basic human respect.", "中文邏輯：先回答題目 → I use clear language, greet the person when needed and avoid demanding an instant answer.｜理由：I use clear and polite language, and I avoid demanding an instant reply.｜例子：A short greeting or saying 'when you have time' can change the tone.｜結果：Good online manners are still basic human respect.", "Part 3｜522/522 題目導向逐題校正", null, "I use clear language, greet the person when needed and avoid demanding an instant answer.", ""], ["Part 3", "發出很久都沒收到回覆的訊息/郵件", "Why do some people prefer sending a message instead of making a call?", "Messages are less intrusive because the other person can reply when they are free. A simple example is they also leave a written record for details. Calls are better when something is urgent or emotional.", "中文邏輯：先回答題目 → Messages are less intrusive because the other person can reply when they are free.｜理由：Messages are less intrusive because the other person can reply when they are free.｜例子：They also leave a written record for details.｜結果：Calls are better when something is urgent or emotional.", "Part 3｜522/522 題目導向逐題校正", null, "Messages are less intrusive because the other person can reply when they are free.", ""], ["Part 3", "發出很久都沒收到回覆的訊息/郵件", "What would you do if you did not receive a reply after sending out a message?", "I would wait first, then send one polite follow-up if the matter is important. A simple example is calling may be better only when the matter is urgent. One clear follow-up is better than sending many messages.", "中文邏輯：先回答題目 → I would wait first, then send one polite follow-up if the matter is important.｜理由：If the message is important, waiting first and then sending one polite follow-up is reasonable.｜例子：Calling may be better only when the matter is urgent.｜結果：One clear follow-up is better than sending many messages.", "Part 3｜522/522 題目導向逐題校正", null, "I would wait first, then send one polite follow-up if the matter is important.", ""], ["Part 3", "發出很久都沒收到回覆的訊息/郵件", "In what situations do people not respond to messages at all?", "People may not reply to spam, rude messages or messages from unknown people. Sometimes silence is also a way to set a boundary. Context matters before assuming bad manners.", "中文邏輯：先回答題目 → People may not reply to spam, rude messages or messages from unknown people.｜理由：People may ignore spam, rude messages or messages from strangers.｜例子：Sometimes silence is also a way to set a boundary.｜結果：Context matters before assuming bad manners.", "Part 3｜522/522 題目導向逐題校正", null, "People may not reply to spam, rude messages or messages from unknown people.", ""], ["Part 3", "發出很久都沒收到回覆的訊息/郵件", "In what situations do people spend a long time responding to others’ messages?", "People may reply slowly when they are busy, the topic is sensitive, or they need more information first. A slow reply is not always rude. You can see this in daily life. People may be working, thinking about a sensitive answer or checking information first. The urgency of the message matters.", "中文邏輯：先回答題目 → People may reply slowly when they are busy, the topic is sensitive, or they need more information first.｜理由：A slow reply is not always rude.｜例子：People may be working, thinking about a sensitive answer or checking information first.｜結果：The urgency of the message matters.", "Part 3｜522/522 題目導向逐題校正", null, "People may reply slowly when they are busy, the topic is sensitive, or they need more information first.", ""], ["Part 3", "遇到的科技問題", "What can teachers do to stop students from relying too much on AI?", "Teachers can ask students to explain their thinking and show how they checked the information. The danger is not using AI; it is accepting the answer without thinking. You can see this in daily life. A student can ask AI for ideas and then explain the final answer in their own words. Understanding should still belong to the student.", "中文邏輯：先回答題目 → Teachers can ask students to explain their thinking and show how they checked the information.｜理由：The danger is not using AI; it is accepting the answer without thinking.｜例子：A student can ask AI for ideas and then explain the final answer in their own words.｜結果：Understanding should still belong to the student.", "Part 3｜522/522 題目導向逐題校正", null, "Teachers can ask students to explain their thinking and show how they checked the information.", ""], ["Part 3", "遇到的科技問題", "Do you think students are overly reliant on AI?", "Some students are. The problem starts when they use AI for the final answer without understanding the work. AI is strongest as a helper, not a replacement for thinking. This is because aI can save time and explain ideas, but it can also give confident wrong answers. For example, users still need to check important information.", "中文邏輯：先回答題目 → Some students are. The problem starts when they use AI for the final answer without understanding the work.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "Some students are. The problem starts when they use AI for the final answer without understanding the work.", ""], ["Part 3", "遇到的科技問題", "How can AI help in our lives?", "AI can explain ideas, organize information and save time on simple tasks. AI can save time and explain ideas, but it can also give confident wrong answers. For example, users still need to check important information. AI is strongest as a helper, not a replacement for thinking.", "中文邏輯：先回答題目 → AI can explain ideas, organize information and save time on simple tasks.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "AI can explain ideas, organize information and save time on simple tasks.", ""], ["Part 3", "遇到的科技問題", "Should children learn to use AI?", "Yes, but they should also learn how to check answers and protect private information. AI is strongest as a helper, not a replacement for thinking. This is because aI can save time and explain ideas, but it can also give confident wrong answers. For example, users still need to check important information.", "中文邏輯：先回答題目 → Yes, but they should also learn how to check answers and protect private information.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, but they should also learn how to check answers and protect private information.", ""], ["Part 3", "遇到的科技問題", "Do you think people today should learn about AI technology?", "Yes. AI is becoming part of work and study, so basic understanding is useful. Technology is useful when it saves time or removes distance without taking away human judgement. One clear example is a map app can suggest a route, but the user still chooses what works best. The tool should support the person.", "中文邏輯：先回答題目 → Yes. AI is becoming part of work and study, so basic understanding is useful.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. AI is becoming part of work and study, so basic understanding is useful.", ""], ["Part 3", "遇到的科技問題", "What are the advantages and disadvantages of AI?", "AI is fast and useful, but it can be wrong and can make people too dependent on it. AI is strongest as a helper, not a replacement for thinking. This is because aI can save time and explain ideas, but it can also give confident wrong answers. For example, users still need to check important information.", "中文邏輯：先回答題目 → AI is fast and useful, but it can be wrong and can make people too dependent on it.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "AI is fast and useful, but it can be wrong and can make people too dependent on it.", ""], ["Part 3", "交通壅塞", "Would you rather be in a car or a bus in a traffic jam?", "I would rather be on a bus because I can rest instead of driving and watching traffic. Reliable buses and trains can make driving less necessary. That matters because traffic improves when cities move more people efficiently, not only more cars. Good transport gives people a real alternative.", "中文邏輯：先回答題目 → I would rather be on a bus because I can rest instead of driving and watching traffic.｜理由：Traffic improves when cities move more people efficiently, not only more cars.｜例子：Reliable buses and trains can make driving less necessary.｜結果：Good transport gives people a real alternative.", "Part 3｜522/522 題目導向逐題校正", null, "I would rather be on a bus because I can rest instead of driving and watching traffic.", ""], ["Part 3", "交通壅塞", "Do you like to use public transport?", "Yes. It is convenient in the Taipei area and I do not need to worry about parking. One reason is that transport choices depend on time, cost, distance and available options. A simple example is a city with frequent trains gives people less reason to drive. Good systems change behaviour by making the better option easy.", "中文邏輯：先回答題目 → Yes. It is convenient in the Taipei area and I do not need to worry about parking.｜理由：Transport choices depend on time, cost, distance and available options.｜例子：A city with frequent trains gives people less reason to drive.｜結果：Good systems change behaviour by making the better option easy.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. It is convenient in the Taipei area and I do not need to worry about parking.", ""], ["Part 3", "交通壅塞", "What are good ways to manage traffic?", "Better public transport, smart traffic lights and limits on unnecessary car use can help. Traffic improves when cities move more people efficiently, not only more cars. One clear example is reliable buses and trains can make driving less necessary. Good transport gives people a real alternative.", "中文邏輯：先回答題目 → Better public transport, smart traffic lights and limits on unnecessary car use can help.｜理由：Traffic improves when cities move more people efficiently, not only more cars.｜例子：Reliable buses and trains can make driving less necessary.｜結果：Good transport gives people a real alternative.", "Part 3｜522/522 題目導向逐題校正", null, "Better public transport, smart traffic lights and limits on unnecessary car use can help.", ""], ["Part 3", "交通壅塞", "Do you think the high ways will help reduce traffic jams?", "They can help in some areas, but more road space can also attract more cars. The reason is that traffic improves when cities move more people efficiently, not only more cars. Reliable buses and trains can make driving less necessary. Good transport gives people a real alternative.", "中文邏輯：先回答題目 → They can help in some areas, but more road space can also attract more cars.｜理由：Traffic improves when cities move more people efficiently, not only more cars.｜例子：Reliable buses and trains can make driving less necessary.｜結果：Good transport gives people a real alternative.", "Part 3｜522/522 題目導向逐題校正", null, "They can help in some areas, but more road space can also attract more cars.", ""], ["Part 3", "交通壅塞", "Do you think developing public transport can solve traffic jam problems?", "Yes, if the service is frequent and convenient enough to make people leave cars at home. The reason is that transport choices depend on time, cost, distance and available options. A city with frequent trains gives people less reason to drive. Good systems change behaviour by making the better option easy.", "中文邏輯：先回答題目 → Yes, if the service is frequent and convenient enough to make people leave cars at home.｜理由：Transport choices depend on time, cost, distance and available options.｜例子：A city with frequent trains gives people less reason to drive.｜結果：Good systems change behaviour by making the better option easy.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, if the service is frequent and convenient enough to make people leave cars at home.", ""], ["Part 3", "交通壅塞", "How can we solve the traffic jam problem?", "Cities need better public transport and smarter road management, not only more roads. The reason is that traffic improves when cities move more people efficiently, not only more cars. Reliable buses and trains can make driving less necessary. Good transport gives people a real alternative.", "中文邏輯：先回答題目 → Cities need better public transport and smarter road management, not only more roads.｜理由：Traffic improves when cities move more people efficiently, not only more cars.｜例子：Reliable buses and trains can make driving less necessary.｜結果：Good transport gives people a real alternative.", "Part 3｜522/522 題目導向逐題校正", null, "Cities need better public transport and smarter road management, not only more roads.", ""], ["Part 3", "花費少的外出日", "Going out to have holidays is tiring. Why do people still want to do it?", "People still travel because a change of place can feel refreshing and create strong memories. A short trip or even a quiet day can reduce stress. That matters because time off helps people recover from work and change their routine. Rest is useful because people return with more energy.", "中文邏輯：先回答題目 → People still travel because a change of place can feel refreshing and create strong memories.｜理由：Time off helps people recover from work and change their routine.｜例子：A short trip or even a quiet day can reduce stress.｜結果：Rest is useful because people return with more energy.", "Part 3｜522/522 題目導向逐題校正", null, "People still travel because a change of place can feel refreshing and create strong memories.", ""], ["Part 3", "花費少的外出日", "Why do people like to have days off?", "People need time to rest, see family and do things that are not connected to work. One reason is that people need days off because the body and mind need recovery. A simple example is a quiet day can lower stress and make work feel easier afterward. Rest is part of staying productive.", "中文邏輯：先回答題目 → People need time to rest, see family and do things that are not connected to work.｜理由：People need days off because the body and mind need recovery.｜例子：A quiet day can lower stress and make work feel easier afterward.｜結果：Rest is part of staying productive.", "Part 3｜522/522 題目導向逐題校正", null, "People need time to rest, see family and do things that are not connected to work.", ""], ["Part 3", "花費少的外出日", "Do you think only old people have time for leisure?", "No. Everyone needs leisure, although the amount and activities change with age. Rest is not only for one age group. For example, a student may relax through games while an older person walks or meets family.", "中文邏輯：先回答題目 → No. Everyone needs leisure, although the amount and activities change with age.｜理由：No. Everyone needs leisure, although the amount and activity change with age.｜例子：A student may relax through games while an older person walks or meets family.｜結果：Rest is not only for one age group.", "Part 3｜522/522 題目導向逐題校正", null, "No. Everyone needs leisure, although the amount and activities change with age.", ""], ["Part 3", "花費少的外出日", "How does technology affect the way people spend their leisure time?", "Technology makes entertainment available anywhere, but it can also increase screen time. People can watch videos or play games during a short break. That matters because phones and streaming make entertainment available at any time. This gives more choice but can also increase screen time.", "中文邏輯：先回答題目 → Technology makes entertainment available anywhere, but it can also increase screen time.｜理由：Phones and streaming make entertainment available at any time.｜例子：People can watch videos or play games during a short break.｜結果：This gives more choice but can also increase screen time.", "Part 3｜522/522 題目導向逐題校正", null, "Technology makes entertainment available anywhere, but it can also increase screen time.", ""], ["Part 3", "花費少的外出日", "How do people spend their leisure time in your country?", "People watch videos, meet friends, shop, exercise, travel or simply rest at home. Work schedules and weather affect the choice. This is because leisure in Taiwan mixes home activities and going out. For example, people may watch shows at home, meet friends, shop, exercise or take short trips.", "中文邏輯：先回答題目 → People watch videos, meet friends, shop, exercise, travel or simply rest at home.｜理由：Leisure in Taiwan mixes home activities and going out.｜例子：People may watch shows at home, meet friends, shop, exercise or take short trips.｜結果：Work schedules and weather affect the choice.", "Part 3｜522/522 題目導向逐題校正", null, "People watch videos, meet friends, shop, exercise, travel or simply rest at home.", ""], ["Part 3", "花費少的外出日", "Do people like to spend their leisure time out in your country?", "Many do, especially on weekends, but staying home is also very common after a busy week. Leisure in Taiwan mixes home activities and going out. You can see this in daily life. People may watch shows at home, meet friends, shop, exercise or take short trips. Work schedules and weather affect the choice.", "中文邏輯：先回答題目 → Many do, especially on weekends, but staying home is also very common after a busy week.｜理由：Leisure in Taiwan mixes home activities and going out.｜例子：People may watch shows at home, meet friends, shop, exercise or take short trips.｜結果：Work schedules and weather affect the choice.", "Part 3｜522/522 題目導向逐題校正", null, "Many do, especially on weekends, but staying home is also very common after a busy week.", ""], ["Part 3", "語言學習", "Some people think that technology has made it unnecessary to learn languages. What do you think?", "No. Translation tools help, but direct communication still needs real language ability. One reason is that technology is useful when it saves time or removes distance without taking away human judgement. A simple example is a map app can suggest a route, but the user still chooses what works best. The tool should support the person.", "中文邏輯：先回答題目 → No. Translation tools help, but direct communication still needs real language ability.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "No. Translation tools help, but direct communication still needs real language ability.", ""], ["Part 3", "語言學習", "What are the advantages and disadvantages of learning a language?", "A language opens communication and opportunities, but it takes a lot of time and practice. Language improves through use, not only study. You can see this in daily life. Speaking before every sentence feels perfect gives real feedback. Regular practice builds confidence.", "中文邏輯：先回答題目 → A language opens communication and opportunities, but it takes a lot of time and practice.｜理由：Language improves through use, not only study.｜例子：Speaking before every sentence feels perfect gives real feedback.｜結果：Regular practice builds confidence.", "Part 3｜522/522 題目導向逐題校正", null, "A language opens communication and opportunities, but it takes a lot of time and practice.", ""], ["Part 3", "語言學習", "What's the best way to learn a language?", "The best way is to use it often through listening, speaking, reading and real conversation. Speaking before every sentence feels perfect gives real feedback. So regular practice builds confidence. Language improves through use, not only study.", "中文邏輯：先回答題目 → The best way is to use it often through listening, speaking, reading and real conversation.｜理由：Language improves through use, not only study.｜例子：Speaking before every sentence feels perfect gives real feedback.｜結果：Regular practice builds confidence.", "Part 3｜522/522 題目導向逐題校正", null, "The best way is to use it often through listening, speaking, reading and real conversation.", ""], ["Part 3", "語言學習", "Which is better, to study a language alone or to study it in a group?", "Studying alone gives more control, while a group gives real speaking practice. I would combine both. One reason is that each method helps a different part of language learning. A simple example is studying alone is good for review, while a group gives real speaking practice. Using both gives a better balance.", "中文邏輯：先回答題目 → Studying alone gives more control, while a group gives real speaking practice. I would combine both.｜理由：Each method helps a different part of language learning.｜例子：Studying alone is good for review, while a group gives real speaking practice.｜結果：Using both gives a better balance.", "Part 3｜522/522 題目導向逐題校正", null, "Studying alone gives more control, while a group gives real speaking practice. I would combine both.", ""], ["Part 3", "語言學習", "Do you think language learning is important?", "Yes. It helps communication, study, work and understanding other cultures. Language improves through use, not only study. In real life, speaking before every sentence feels perfect gives real feedback. Regular practice builds confidence.", "中文邏輯：先回答題目 → Yes. It helps communication, study, work and understanding other cultures.｜理由：Language improves through use, not only study.｜例子：Speaking before every sentence feels perfect gives real feedback.｜結果：Regular practice builds confidence.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. It helps communication, study, work and understanding other cultures.", ""], ["Part 3", "語言學習", "What difficulties do people face when learning a language?", "People struggle with vocabulary, listening speed, confidence and finding enough real practice. Language improves through use, not only study. You can see this in daily life. Speaking before every sentence feels perfect gives real feedback. Regular practice builds confidence.", "中文邏輯：先回答題目 → People struggle with vocabulary, listening speed, confidence and finding enough real practice.｜理由：Language improves through use, not only study.｜例子：Speaking before every sentence feels perfect gives real feedback.｜結果：Regular practice builds confidence.", "Part 3｜522/522 題目導向逐題校正", null, "People struggle with vocabulary, listening speed, confidence and finding enough real practice.", ""], ["Part 3", "喜歡看的現場體育賽事", "What sports matches are suitable for children to attend?", "Family-friendly games with safe seating and a good atmosphere are suitable for children. Children need a safe and comfortable environment more than the biggest event. For example, a daytime baseball game with family seating is easier than a very late, crowded match. A good first experience can build interest in sport.", "中文邏輯：先回答題目 → Family-friendly games with safe seating and a good atmosphere are suitable for children.｜理由：Children need a safe and comfortable environment more than the biggest event.｜例子：A daytime baseball game with family seating is easier than a very late, crowded match.｜結果：A good first experience can build interest in sport.", "Part 3｜522/522 題目導向逐題校正", null, "Family-friendly games with safe seating and a good atmosphere are suitable for children.", ""], ["Part 3", "喜歡看的現場體育賽事", "What are ange a whole game.｜結果：The crowd adds emotion that a replay cannot fully copy.", "Part 3｜522/522 題目導向逐題校正", null, "Competition, uncertainty and shared emotion make sports exciting.", ""], ["Part 3", "喜歡看的現場體育賽事", "What sports games are popular in your country?", "Baseball and basketball are both popular in Taiwan. Popularity often comes from visibility, confidence and connection with other people. In real life, a friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Baseball and basketball are both popular in Taiwan.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Baseball and basketball are both popular in Taiwan.", ""], ["Part 3", "喜歡看的現場體育賽事", "Why do some people spend a lot going to other countries to watch sports events?", "For serious fans, seeing a major game live can feel like a once-in-a-lifetime experience. Sport is exciting because the result is uncertain and people share the same moment. In real life, one play can change a whole game. The crowd adds emotion that a replay cannot fully copy.", "中文邏輯：先回答題目 → For serious fans, seeing a major game live can feel like a once-in-a-lifetime experience.｜理由：Sport is exciting because the result is uncertain and people share the same moment.｜例子：One play can change a whole game.｜結果：The crowd adds emotion that a replay cannot fully copy.", "Part 3｜522/522 題目導向逐題校正", null, "For serious fans, seeing a major game live can feel like a once-in-a-lifetime experience.", ""], ["Part 3", "在團隊中工作", "What group tasks are there in schools?", "Schools often use group presentations, projects, experiments and sports activities. These tasks teach students to divide work and communicate. The learning is partly about the subject and k.", ""], ["Part 3", "在團隊中工作", "Why do some people prefer to work by themselves?", "Some people focus better alone and like having full control over their work. A task that needs deep concentration may be easier without constant discussion. Independent work suits some tasks and personalities.", "中文邏輯：先回答題目 → Some people focus better alone and like having full control over their work.｜理由：Some people focus better alone and like having full control over pace and decisions.｜例子：A task that needs deep concentration may be easier without constant discussion.｜結果：Independent work suits some tasks and personalities.", "Part 3｜522/522 題目導向逐題校正", null, "Some people focus better alone and like having full control over their work.", ""], ["Part 3", "在團隊中工作", "How can you tell if a person is a good leader?", "A good leader gives clear direction, listens, and takes responsibility when problems happen. Leadership is more than giving orders. For example, team members usually trust leaders who are fair and consistent.", "中文邏輯：先回答題目 → A good leader gives clear direction, listens, and takes responsibility when problems happen.｜理由：A good leader gives clear direction, listens and takes responsibility when problems happen.｜例子：Team members usually trust leaders who are fair and consistent.｜結果：Leadership is more than giving orders.", "Part 3｜522/522 題目導向逐題校正", null, "A good leader gives clear direction, listens, and takes responsibility when problems happen.", ""], ["Part 3", "在團隊中工作", "What advantages are there for students experiencing teamwork at school?", "Students learn communication, task sharing and how to solve disagreements. Teamwork needs clear roles and communication. One clear example is a group project works better when everyone knows their task. Trust grows when people do their part.", "中文邏輯：先回答題目 → Students learn communication, task sharing and how to solve disagreements.｜理由：Teamwork needs clear roles and communication.｜例子：A group project works better when everyone knows their task.｜結果：Trust grows when people do their part.", "Part 3｜522/522 題目導向逐題校正", null, "Students learn communication, task sharing and how to solve disagreements.", ""], ["Part 3", "早起", "Why do some people like to stay up late?", "Some people stay up because they want personal time, use their phones, or naturally feel more awake at night. A simple example is after a busy day, late night may feel like the only free time. The habit feels good at night but often makes the next morning harder.", "中文邏輯：先回答題目 → Some people stay up because they want personal time, use their phones, or naturally feel more awake at night.｜理由：People stay up late because they want more personal time, use their phones, or naturally feel more awake at night.｜例子：After a busy day, late night may feel like the only free time.｜結果：The habit feels good at night but often makes the next morning harder.", "Part 3｜522/522 題目導向逐題校正", null, "Some people stay up because they want personal time, use their phones, or naturally feel more awake at night.", ""], ["Part 3", "早起", "What kinds of occasions need people to arrive early?", "Interviews, exams, flights and important meetings are good times to arrive early. Arriving early reduces stress when timing really matters. One clear example is ten minutes early for an interview gives time for small problems. Too early can also waste time, so context matters.", "中文邏輯：先回答題目 → Interviews, exams, flights and important meetings are good times to arrive early.｜理由：Arriving early reduces stress when timing really matters.｜例子：Ten minutes early for an interview gives time for small problems.｜結果：Too early can also waste time, so context matters.", "Part 3｜522/522 題目導向逐題校正", null, "Interviews, exams, flights and important meetings are good times to arrive early.", ""], ["Part 3", "早起", "Why do people get up early?", "People get up early for work, school, travel or because they like a quiet start to the day. Ten minutes early for an interview gives time for small problems. So t  have a strong idea and good team.", ""], ["Part 3", "喜歡的電影", "Do Chinese people prefer to watch domestic movies or foreign movies?", "Both are popular. Domestic films feel culturally familiar, while foreign films offer different styles and stories. Movies work when story, characters and pacing keep people interested. One clear example is a famous actor can attract attention, but cannot fix a weak story. The experience matters more than the name on the poster.", "中文邏輯：先回答題目 → Both are popular. Domestic films feel culturally familiar, while foreign films offer different styles and stories.｜理由：Movies work when story, characters and pacing keep people interested.｜例子：A famous actor can attract attention, but cannot fix a weak story.｜結果：The experience matters more than the name on the poster.", "Part 3｜522/522 題目導向逐題校正", null, "Both are popular. Domestic films feel culturally familiar, while foreign films offer different styles and stories.", ""], ["Part 3", "喜歡的電影", "What are the factors that make a successful movie?", "A strong story, believable characters, good pacing and effective marketing all matter. Movies work when story, characters and pacing keep people interested. The experience matters more than the name on the poster. For instance, a famous actor can attract attention, but cannot fix a weak story.", "中文邏輯：先回答題目 → A strong story, believable characters, good pacing and effective marketing all matter.｜理由：Movies work when story, characters and pacing keep people interested.｜例子：A famous actor can attract attention, but cannot fix a weak story.｜結果：The experience matters more than the name on the poster.", "Part 3｜522/522 題目導向逐題校正", null, "A strong story, believable characters, good pacing and effective marketing all matter.", ""], ["Part 3", "喜歡的電影", "What kinds of movies do you think are successful in your country?", "Comedies, action films, animation and well-made local stories can all do well in Taiwan. Movies work when story, characters and pacing keep people
