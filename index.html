watched it when I was younger, so at that time I mainly enjoyed the animals, music and adventure.\n\nWhen I became older, I noticed a different message about responsibility. The main character tries to escape a difficult past, but eventually has to return and face what he has been avoiding.\n\nThat is why the story stayed with me.\n\nChildren can enjoy the simple plot, while adults can read more into the choices the characters make.\n\nFor me, a good animal story works because the animals make the story easy to enter, but the emotions and decisions are still very human.", "The Lion King｜animal story → human responsibility", "Part 2｜Cue Card 逐題檢查", ["What animals are in it", "What the story/book is about", "Why you read the story/book", "And explain what you think of this story/book"], "一個熟悉故事 → 題目角度 → WHY → impact", "我記得的一個有動物的故事是《獅子王》。\n\n我小時候第一次看時，主要只是喜歡動物、音樂和冒險。\n\n長大後，我才注意到另一個關於責任的訊息。主角一開始想逃避困難的過去，但最後還是必須回去面對一直躲著的事情。\n\n這就是為什麼這個故事會一直留在我腦中。\n\n小孩可以喜歡簡單的劇情，大人則能從角色的選擇裡看到更多東西。\n\n對我來說，好的動物故事很有效，是因為動物讓人很容易進入故事，但裡面的情緒和選擇其實還是非常像人。"], ["Part 2", "名人出演的廣告", "Describe an advertisement with a famous person in it", "An advertisement with a famous person that I remember was an online fashion ad featuring a well-known K-pop singer.\n\nI saw it on social media. The ad was very short, but the singer's face immediately caught my attention because I already knew her.\n\nThe clothes were simple, and the ad focused more on the singer's style and attitude than on a long explanation of the product.\n\nI understood why the company used a celebrity. People may stop scrolling because they recognize the person first.\n\nAt the same time, I do not think a famous face can make a bad product good. The celebrity gets attention, but the product still needs real value.", "中文重點：K-pop celebrity ad → recognition catches attention → celebrity helps attention, not product quality", "Part 2｜Cue Card 逐題檢查", ["Who the person is", "Where you can see it", "What the advertisement is about", "And explain how you feel about the advertisement"], "K-pop celebrity ad → recognition catches attention → celebrity helps attention, not product quality", "我記得的一支名人廣告，是一位很有名的 K-pop 歌手出演的網路服飾廣告。\n\n我是在社群媒體上看到的。廣告很短，但因為我本來就認識那位歌手，所以她的臉立刻吸引我的注意。\n\n衣服本身很簡單，廣告比較強調歌手的風格和態度，而不是花很久解釋產品。\n\n我可以理解公司為什麼要找名人。大家可能先因為認得這個人而停下來，不繼續滑。\n\n不過我也不覺得一張名人的臉就能把不好用的產品變好。名人可以帶來注意力，但產品本身還是需要真正的價值。"], ["Part 2", "特別場合吃的⾷物", "Describe a food that people eat on special occasions/events", "A food I associate with a special occasion is hot pot during a family gathering.\n\nThe meal is simple in structure: a large pot in the middle of the table, vegetables, meat, mushrooms and other ingredients that everyone adds gradually.\n\nWhat makes it special is not one particular ingredient. It is the way the meal forces people to stay at the table together.\n\nNobody finishes in five minutes and leaves. We keep adding food, talking and waiting for the next thing to cook.\n\nThat makes the meal feel warmer and more social than eating individual dishes.\n\nFor me, special food becomes meaningful when it is connected with the people and the situation. The taste matters, but the shared time is what I remember later.", "火鍋＋家人｜food = shared time", "Part 2｜Cue Card 逐題檢查", ["What it is", "What the special event/occasion is", "How it is cooked/made", "And explain why people eat it on that special occasion/event", "When it comes to festive traditions in my culture, a remarkable dish that is"], "一個熟悉故事 → 題目角度 → WHY → impact", "我會跟特殊場合連在一起的食物，是家庭聚會時吃火鍋。\n\n它的形式很簡單：桌子中間一大鍋，旁邊有蔬菜、肉、菇類和其他食材，大家慢慢放進去煮。\n\n它特別的地方不是某一個食材，而是這種吃法會讓大家一直留在桌邊。\n\n沒有人五分鐘吃完就離開，我們會一直加食物、聊天，再等下一樣東西煮熟。\n\n所以它比每個人各吃一盤菜更有溫暖和互動的感覺。\n\n對我來說，特殊食物會有意義，是因為它跟一起吃的人和當時的情境連在一起。味道重要，但之後真正記得的是一起度過的時間。"], ["Part 2", "有趣的影片", "Describe an interesting video", "An interesting video I watched was a short video about AI mistakes.\n\nI watched it on YouTube at home because I use AI quite often and wanted to understand its limits.\n\nThe video showed a simple example. AI gave an answer that sounded very sure, but the answer was wrong.\n\nI found it interesting because it was easy to understand and useful in real life.\n\nAfter that, I became more careful. Now I check important information instead of trusting an answer only because it sounds professional.\n\nThat is why I remember the video. It changed the way I use AI in daily life.", "固定故事：AI mistakes video → sounds sure but can be wrong → check important information", "Part 2｜Cue Card 逐題檢查", ["When and where you watched it", "What it is about", "Why you watched it", "And explain how you feel about it"], "AI mistakes video → sounds sure but can be wrong → check important information", "我看過一支很有趣的影片，是在講 AI 會犯錯。\n\n我在家用 YouTube 看的，因為我很常用 AI，也想了解它的限制。\n\n影片用了一個很簡單的例子：AI 給了一個聽起來非常有把握的答案，但其實是錯的。\n\n我覺得很有趣，因為很好懂，而且跟真實生活很有關。\n\n看完之後，我變得更小心。現在重要資訊我會再確認，而不是只因為答案聽起來很專業就直接相信。\n\n所以我會記得那支影片。它真的改變了我日常使用 AI 的方式。"], ["Part 2", "近期改變的計畫", "Describe a plan that you had to change recently", "A plan I had to change recently was my IELTS study plan.\n\nAt first, I planned to do almost all my practice after dinner. The problem was that I was often too tired at night, so I could not focus well.\n\nI changed the plan and moved reading and listening to earlier parts of the day when possible. I kept speaking and writing for times when I could focus more actively.\n\nThe new plan was much more realistic.\n\nThis experience taught me that changing a plan is not the same as giving up. A good plan should fit real life, not just look good on paper.", "中文重點：IELTS plan → night study too tiring → move tasks to better times → realistic plan", "Part 2｜Cue Card 逐題檢查", ["When this happened", "What made you change the plan", "What the new plan was", "And how you felt about the change"], "IELTS plan → night study too tiring → move tasks to better times → realistic plan", "我最近不得不改的一個計畫，是 IELTS 的讀書計畫。\n\n一開始我想把幾乎所有練習都放在晚餐後，但問題是晚上常常太累，所以很難真正專心。\n\n後來我改了安排，可以的話把閱讀和聽力移到一天比較早的時間，口說和寫作則留在我比較能主動專心的時候。\n\n新的計畫實際多了。\n\n這個經驗讓我明白，改變計畫不等於放棄。一個好計畫應該符合真實生活，不是只要在紙上看起來很好。"], ["Part 2", "重要決定", "Describe an important decision that you made", "An important decision I made was choosing to prepare for graduate study abroad.\n\nThe decision came after I started thinking more seriously about what kind of future I wanted. Staying with a familiar path would have been easier, but I wanted stronger technical knowledge and international experience.\n\nThe difficult part was that studying abroad involves English tests, applications, money and uncertainty.\n\nEventually, I decided that not trying would bother me more than failing.\n\nAfter making the decision, I actually felt calmer because the uncertainty finally had a direction.\n\nThe choice taught me that an important decision does not remove risk. It simply tells you which risk you are willing to accept for something you value.\n\nThe part I would focus on most is and explain why it was important, because that is what makes this story fit the question.", "申請海外研究所｜not trying would bother me more｜這題重點：And explain why it was important", "Part 2｜Cue Card 逐題檢查", ["What the decision was", "How you made your decision", "What the results of the decision were", "And explain why it was important"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "對結果開心的重要決定", "Describe a time you made an important decision and were happy with the result", "A decision I was happy with was choosing to spend time abroad on an exchange experience.\n\nBefore going, I worried about using English every day and dealing with unfamiliar routines.\n\nOnce I arrived, the first few days were uncomfortable, but I gradually became more independent. I learned to ask for help, use English before it felt perfect and adapt to small cultural differences.\n\nThe result was much more valuable than I expected because the experience changed my confidence, not just my travel memories.\n\nI was happy with the decision because it proved that discomfort does not always mean a choice is wrong.\n\nSometimes it is simply the stage before something unfamiliar becomes normal.", "Rhode Island exchange｜discomfort → adaptation → confidence", "Part 2｜Cue Card 逐題檢查", ["What the decision was", "Why you made the decision", "How easy it was for you to make the decision", "And explain why you were happy with the result"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "收到特殊蛋糕", "Describe a special cake you received from others", "A special cake I received was a small graduation cake from my family.\n\nIt was not huge or expensive. It had simple cream, some fruit and a short graduation message on top.\n\nWhat made it special was the timing. Graduation felt like the end of one stage of my life, so even a simple cake carried more meaning than usual.\n\nWe took photos, shared the cake and talked about what I might do next.\n\nI remember the feeling more than the taste. The cake disappeared that day, but the memory stayed.", "中文重點：family gave graduation cake → simple cake → timing made it special", "Part 2｜Cue Card 逐題檢查", ["When it happened", "Where it happened", "Who you got the cake from", "And explain why it’s a special cake"], "family gave graduation cake → simple cake → timing made it special", ""], ["Part 2", "喜歡的電視節目/網路節目", "Describe a TV or online program you like to watch", "A programme I enjoy is a mystery series on a streaming platform.\n\nI like this type of show because each episode gives small clues and makes me keep changing my mind about what really happened.\n\nI usually watch it at home at weekends because I can pause when I want and I do not need to plan around a TV schedule.\n\nWhat I enjoy most is the mental involvement. I am not watching only to relax. I am also trying to connect the details.\n\nThat makes the programme more memorable for me than a show where I can predict everything after the first few minutes.\n\nFor me, good entertainment should give the audience something to think about, not only something to look at.", "mystery streaming series｜mental involvement", "Part 2｜Cue Card 逐題檢查", ["What it is", "What it is about", "Who you watch it with", "And explain why you like to watch it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "想從事的短期海外工作", "Describe a short-term job you want to have in a foreign country", "A short-term overseas job I want to try is working on a technology-related project in the United States.\n\nMy exchange experience in Rhode Island made me curious about how people communicate and work in a different environment.\n\nI would prefer a short project rather than moving permanently at first because it would let me test whether I actually enjoy that working culture.\n\nI would want a role where I can use technology but also communicate with people, because I do not want to spend every day doing only one narrow task.\n\nThe main benefit would be perspective. Working abroad would force me to compare different ways of solving the same problem.\n\nEven if I returned to Taiwan afterward, that comparison would still influence how I work.", "US short-term tech project｜test the environment before permanent move", "Part 2｜Cue Card 逐題檢查", ["Where it is", "How you know of it", "What the job is", "And explain why you want to do it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "完美工作", "Describe a perfect job you would like to have in the future", "My ideal job would combine technology with communication and problem-solving.\n\nI do not need a job that sounds impressive. I want work where I can understand a problem, organise information and help turn a technical idea into something people can actually use.\n\nI would also like some variety because doing exactly the same task every day would make me lose interest.\n\nA supportive manager and room to keep learning would matter more to me than a fancy title.\n\nThe reason is simple: skills can help someone enter a job, but growth depends heavily on the environment and attitude.\n\nSo my perfect job is not one with zero stress. It is one where the difficult parts help me become more capable instead of simply exhausting me.", "technology + communication + growth", "Part 2｜Cue Card 逐題檢查", ["What it is", "How you knew it", "What you need to learn to get this job", "And explain why you think it is a perfect job for you"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "想擁有的科技產品", "Describe a piece of technology (not a phone) that you would like to own", "A technology product I want to own is a lighter laptop with a long battery life.\n\nI already use a computer for many parts of my life, including work, English practice, research and planning, so portability would make a real difference.\n\nI would not choose it because the newest model looks impressive. I would care about a comfortable keyboard, reliable battery and enough performance for serious work.\n\nThe reason I want it is efficiency. If one device works well in different places, I do not need to reorganise my workflow every time I move.\n\nFor me, useful technology should remove friction from daily life. A feature matters only when it solves a problem I actually have.", "輕薄筆電｜function > newest model", "Part 2｜Cue Card 逐題檢查", ["What it is", "How much it costs", "How you knew it", "And explain why you would like to own it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "朋友自學", "Describe one of your friends who learned something without a teacher", "I'd like to talk about a friend who taught herself Korean.\n\nShe never had a private teacher. She started because she liked Korean music and dramas, so she learned the alphabet online and watched short YouTube lessons.\n\nLater, she began writing down useful phrases she heard in songs and shows. She also used language apps to review basic vocabulary.\n\nWhat impressed me was that she did not wait until she had a perfect study plan. She kept learning a little at a time because she was genuinely interested.\n\nHer progress showed me that self-learning works well when a person has a clear reason to continue.", "中文重點：friend learns Korean alone → YouTube + dramas + apps → real interest keeps her going", "Part 2｜Cue Card 逐題檢查", ["Who he/she is", "What he/she learned", "Why he/she learned this", "And explain whether it would be easier to learn from a teacher"], "friend learns Korean alone → YouTube + dramas + apps → real interest keeps her going", ""], ["Part 2", "不享受的音樂活動", "Describe an event you attended in which you didn’t enjoy the music played", "A music event I did not enjoy was a school activity where very loud music was played in a large indoor hall.\n\nI went with classmates, so I expected it to be fun. But the speakers were extremely loud, and the music style was not really my taste.\n\nAfter a while, it became difficult to talk to the people next to me, and I started to feel tired rather than excited.\n\nI stayed until the end because I was with my classmates, but I was happy when we finally left.\n\nThe experience taught me that I do enjoy music, but the setting matters. Loud music is not automatically more exciting for me.", "中文重點：school music event → too loud + not my style → tired → setting matters", "Part 2｜Cue Card 逐題檢查", ["What it was", "Who you went with", "Why you decided to go there", "And explain why you didn’t enjoy it"], "school music event → too loud + not my style → tired → setting matters", ""], ["Part 2", "應用程式", "Describe a program or app on your computer or phone", "An app I find genuinely useful is Google Maps.\n\nI use it when I need to check public transport, walking routes or how long a trip may take.\n\nWhat I like is that it reduces uncertainty. Instead of memorising every route, I can compare options and adjust if something changes.\n\nI especially appreciate it in an unfamiliar place because being lost is much less stressful when I can see where I am and what the next step is.\n\nAt the same time, I still pay attention to signs around me because an app is not always perfect.\n\nThat is how I prefer to use technology: let it provide information and speed, but keep enough awareness to make the final judgement myself.", "Google Maps｜reduce uncertainty, not replace awareness", "Part 2｜Cue Card 逐題檢查", ["What it is", "How often you use it", "When/how you use it", "When/how you found it", "And explain how you feel about it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "喜歡的建築", "Describe a building you enjoy visiting (e.g. a library, a shopping mall, etc.)", "A building I like is Taipei 101. It is visually easy to recognise, but the part I find most interesting is that the design also responds to real engineering problems.\n\nInside the building, a huge tuned mass damper helps reduce movement caused by strong wind and earthquakes.\n\nThat makes the building more than a tall object designed to look impressive.\n\nIt also contains offices, shops and tourist areas, so the space has to work for many different people every day.\n\nI like it because it represents the kind of design I respect: appearance and function support each other.\n\nA beautiful building catches attention, but a well-designed building continues to make sense after the first impression disappears.", "Taipei 101｜appearance + function", "Part 2｜Cue Card 逐題檢查", ["Where it is", "How you knew it", "What it looks like", "And explain why you enjoy visiting it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "喜歡或不喜歡的高聳建築", "Describe a tall building you like or dislike", "A tall building I like is Taipei 101.\n\nI like it partly because its shape is simple to recognise, but I also appreciate the practical engineering behind it.\n\nTall buildings can sometimes feel like they are designed only to show wealth or power. Taipei 101 is more interesting to me because its structure has to deal with strong wind and earthquakes.\n\nThe building also serves many functions, including offices, shops and tourism.\n\nI would not necessarily want to live in a very tall building myself, because elevators and emergency situations would make me slightly uncomfortable.\n\nBut as a public building, I like Taipei 101 because the height has both symbolic and practical meaning.", "Taipei 101｜喜歡建築，不一定想住高樓", "Part 2｜Cue Card 逐題檢查", ["What it is used for", "Where it is", "What it looks like", "And explain why you like/dislike it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "有趣的建築", "Describe an interesting building", "I'd like to talk about Taipei 101.\n\nFrom the outside, the stacked shape makes it easy to recognise, but I became more interested when I learned about the engineering inside.\n\nThe building uses a huge tuned mass damper to reduce movement during strong winds and earthquakes. That is especially meaningful in Taiwan because the design responds to the local environment.\n\nIt is also used for offices, shopping and tourism.\n\nFor me, that combination makes it interesting. The building is not only something people photograph.\n\nIts appearance gives it identity, while the engineering solves a real problem.\n\nThat is why I think good design should serve people, not just look impressive.", "Taipei 101｜same story, different angle: interesting engineering", "Part 2｜Cue Card 逐題檢查", ["Where it is", "What it looks like", "What function it has", "And explain why you think it is interesting"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "花費超過預期的物品", "Describe an item on which you spent more than expected", "Something that cost more than I expected was a pair of wireless headphones.\n\nAt first, I wanted a basic pair for commuting, but after comparing cheaper models, I realised that battery life, comfort and noise control mattered because I would use them almost every day.\n\nI ended up paying more than my original budget.\n\nI hesitated for a while, but the buy made sense because the headphones became part of my daily routine on buses and when I wanted to focus.\n\nThe experience taught me that a higher price is not automatically bad, but it needs a reason.\n\nIf the extra cost solves a problem repeatedly for years, it can be worth it. Paying more only for a logo would not feel the same.", "無線耳機｜higher price needs repeated value", "Part 2｜Cue Card 逐題檢查", ["What it is", "How much you spent on it", "Why you bought it", "And explain why you think you spent more than expected"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "對家庭重要的東西", "Describe something important that has been kept in your family for a long time", "An object that is important to my family is an old bicycle connected with my childhood.\n\nMy father used to teach me and sometimes ride with me at weekends. The bicycle itself is not expensive now and is much less advanced than modern bikes.\n\nbut, when I see it, I immediately remember those weekend mornings and the feeling of slowly becoming independent.\n\nThat is why the object matters.\n\nIts value has almost nothing to do with the current market price. It carries a period of family life that cannot be bought again.\n\nFor me, old family objects are worth keeping when they act like physical reminders of a shared experience.", "舊腳踏車｜memory > price", "Part 2｜Cue Card 逐題檢查", ["What it is", "When your family had it", "How your family got it", "And explain why it is important to your family"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "公共場所弄丢物品", "Describe an occasion that you lost something in public", "A time I lost something in public was when I could not find my phone after getting off a bus.\n\nFor a few minutes, I thought I had left it on the seat, so I felt very nervous because the phone contained messages, photos and practical information.\n\nI checked my bag again slowly and realised it had slipped into a small inner pocket that I rarely used.\n\nNothing was actually lost, but the experience still changed my habit.\n\nNow I keep important things in fixed places instead of putting them wherever there is space.\n\nThe lesson was simple: many small problems come from disorganisation, not bad luck. A simple system can prevent a surprising amount of stress.", "以為手機掉在公車｜fixed place prevents stress", "Part 2｜Cue Card 逐題檢查", ["What you lost", "When and where you lost it", "What you did to find it", "And explain how you felt about it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "印象深刻的聚會", "Describe a party for a special event that impressed you a lot", "A party that impressed me was a small graduation gathering with university friends.\n\nWe met after graduation, had dinner, took photos and talked about what everyone planned to do next.\n\nThe party was not expensive or very formal. What made it special was that we all knew one stage of our lives was ending.\n\nThere was a happy feeling, but also a little uncertainty because everyone was moving in a different direction.\n\nI remember it clearly because the gathering was not only a celebration. It also felt like saying goodbye to a part of our student life.", "中文重點：graduation gathering → friends + photos + future plans → happy and emotional", "Part 2｜Cue Card 逐題檢查", ["When and where it was held", "What the party was held for", "How many people attended it", "And explain why it impressed you a lot"], "graduation gathering → friends + photos + future plans → happy and emotional", ""], ["Part 2", "聽不感興趣的話", "Describe a time when someone talked about something you were not interested in but you kept listening", "A time I had to listen to something I was not interested in was a long presentation where the speaker read almost every word from the slides.\n\nThe topic itself was not terrible, but the delivery made it difficult to stay focused.\n\nAfter a while, I realised I was looking at the clock more than listening to the content.\n\nWhat I learned from that experience is that information alone does not create communication.\n\nA speaker needs to decide what the audience actually needs and give them a reason to follow the idea.\n\nThat is also something I try to remember when I present. If every detail feels equally important, the audience usually cannot tell what the main point is.", "long slide-reading talk｜communication needs a clear point", "Part 2｜Cue Card 逐題檢查", ["Who the person was", "What he/she talked about", "Why you kept listening", "And explain how you felt about the experience"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "賺錢買特别物品", "Describe a time when you saved money to buy something special", "A time I saved money for something special was when I wanted to buy a new laptop.\n\nMy old laptop was slow, and I needed a better one for studying, writing documents and preparing for IELTS.\n\nI did not buy one right away. I set a budget and saved some money every month. I also compared several models because I did not want to pay for features I did not need.\n\nAfter a few months, I bought one that matched my needs.\n\nI felt happy because I had planned for it instead of buying it suddenly.\n\nThis experience taught me that saving money is easier when the goal is clear.", "固定故事：new laptop → clear need → save every month → compare → buy without impulse", "Part 2｜Cue Card 逐題檢查", ["What the special thing was", "Why you wanted to buy it", "How you saved money for it", "And explain how you felt after buying it"], "new laptop → clear need → save every month → compare → buy without impulse", ""], ["Part 2", "看過的名人採訪", "Describe a time you watched a famous person being interviewed", "A famous-person interview I remember watching was an interview with Ashin from Mayday.\n\nI watched it online because I was interested in how he writes songs.\n\nWhat I liked was that he did not only talk about being famous. He talked about the work behind the songs and how simple feelings can become lyrics.\n\nThat interested me because Mayday's songs often use simple words but still feel emotional.\n\nThe interview made me respect the creative process more. It reminded me that something that sounds simple may still take a lot of thought.", "中文重點：Ashin interview → songwriting process → simple words can take deep thought", "Part 2｜Cue Card 逐題檢查", ["Who the famous person was", "What the interview was about", "When and where you watched the interview", "And explain how you felt about the interview"], "Ashin interview → songwriting process → simple words can take deep thought", ""], ["Part 2", "好的購物服務", "Describe a time when you received good service in a shop/store", "A time I received very good service was in a shoe shop.\n\nI liked a pair of shoes but was unsure about the size. Instead of pushing me to buy them quickly, the staff member asked how I planned to use them and brought another size for comparison.\n\nShe also told me honestly that the material might feel tight at first.\n\nI appreciated that because her goal seemed to be reducing my uncertainty, not simply making a sale.\n\nI eventually bought the shoes and felt confident about the choice.\n\nFor me, good service is not about smiling constantly. It is about giving useful information without pressure so the customer can make a better decision.", "鞋店｜good service = reduce uncertainty, not pressure", "Part 2｜Cue Card 逐題檢查", ["Where the shop is", "When you went to the shop", "What service you received from the staff", "And explain how you felt about the service"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "浪費時間的活動", "Describe an activity you do regularly that you think is a waste of time", "An activity that can waste a lot of my time is scrolling on social media before bed.\n\nThe problem is that I normally open my phone to check one message, but short videos make it very easy to continue for another twenty or thirty minutes.\n\nThe activity is not completely useless because I do relax and sometimes find interesting information.\n\nbut, it becomes a waste of time when I continue automatically even though I am already tired.\n\nThe worst consequence is that I go to sleep later and feel worse the next morning.\n\nThat is why I try to use a simple rule: if I am no longer choosing what to watch, I should probably put the phone down.", "睡前滑手機｜when choice becomes automatic, stop", "Part 2｜Cue Card 逐題檢查", ["What it is", "When you usually do it", "Why you do it", "And explain why you think it is a waste of time"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "不喜歡的短途旅行", "Describe a short trip you often take but do not like", "A short trip I often take but do not really enjoy is going home during rush hour.\n\nThe distance is not very long, but I usually take a bus when many people are leaving work at the same time.\n\nThe bus can be crowded, and traffic sometimes moves very slowly. After a long day, standing in a full bus makes the trip feel much longer.\n\nI still take the trip because public transport is convenient and I need to get home.\n\nWhat I dislike is not the destination. It is the crowded bus and the time I lose in traffic.\n\nIf I can choose, I travel a little earlier or later.", "固定故事：going home at rush hour → short distance → crowded bus + slow traffic", "Part 2｜Cue Card 逐題檢查", ["Where you go", "When you go there", "Why you go there", "And explain why you do not like the trip"], "going home at rush hour → short distance → crowded bus + slow traffic", ""], ["Part 2", "近期改變", "Describe a change that you made recently", "A recent change I made was changing the way I study English.\n\nI used to think a long study session was always better, so I sometimes tried to do too much at once.\n\nLater, I noticed that I became tired and stopped paying attention. Now I use shorter sessions and focus on one skill at a time.\n\nFor example, I may practise speaking for a short period and then review a few mistakes instead of doing everything in one sitting.\n\nThe change is small, but it makes my practice easier to continue.", "中文重點：English study change → long sessions too tiring → shorter focused practice", "Part 2｜Cue Card 逐題檢查", ["What the change was", "What caused the change", "What you did for the change", "And explain how you feel about the change"], "English study change → long sessions too tiring → shorter focused practice", ""], ["Part 2", "當地新聞", "Describe a piece of local news that people are interested in", "A piece of local news that caught my attention was a report about transport changes in the Taipei area.\n\nI paid attention because public transport is part of my daily routine, so even a small route or service change can affect many people.\n\nWhat interested me was not the announcement itself but the public reaction. Some people cared about speed, while others cared about cost or whether the change would make transfers easier.\n\nThat reminded me that local news often feels more relevant than a distant headline because the consequences are visible in everyday life.\n\nFor me, useful local news should explain not only what changed, but who will actually feel the difference.", "Taipei transport news｜local news = visible daily consequence", "Part 2｜Cue Card 逐題檢查", ["What it was about", "Where you saw/heard it", "Who was involved", "And explain why people were interested in it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "改變重要决定", "Describe a time when you changed an important decision of yours", "An important decision I changed was what I wanted to do after university.\n\nAt first, I thought I should simply choose the most familiar path and start working without thinking too much about further study.\n\nAfter learning more about graduate programs abroad, I changed my mind. I realised I wanted stronger technical knowledge and international experience.\n\nThat decision created more work because I had to prepare English tests and applications.\n\nStill, I am glad I changed it. Sometimes changing a decision means you understand yourself better than before.", "中文重點：post-university plan → first choose familiar path → change to graduate study abroad", "Part 2｜Cue Card 逐題檢查", ["When you changed the decision", "What the original decision was", "Why you changed it", "And explain how you felt about the experience"], "post-university plan → first choose familiar path → change to graduate study abroad", ""], ["Part 2", "改變重要想法", "Describe a time when you changed an important opinion of yours", "An important opinion I changed was my view of AI.\n\nAt first, I saw AI mainly as a fast way to get an answer. If the answer sounded clear, I was more likely to trust it.\n\nAfter using it more, I noticed that AI can sound very confident even when part of the information is wrong.\n\nNow I see it as a tool for ideas, explanations and checking different possibilities, but not as the final judge.\n\nThis change was important because it made me more careful. A useful tool should help me think, not replace my thinking.", "中文重點：AI opinion → fast answer → notice confident mistakes → tool, not final judge", "Part 2｜Cue Card 逐題檢查", ["When you changed your opinion", "What the original opinion was", "Why you changed it", "And explain how you felt about the experience"], "AI opinion → fast answer → notice confident mistakes → tool, not final judge", ""], ["Part 2", "發出很久都沒收到回覆的訊息/郵件", "Describe a time when you sent a message or an email to someone but received no reply for a long time", "A time I waited a long time for a reply was when I sent a message to a friend about an important plan.\n\nAt first, I assumed the person had seen it and was ignoring me, so I started overthinking the situation.\n\nLater, I found out that my friend had been busy and had simply forgotten to reply.\n\nNothing serious happened, but the experience reminded me how easily silence can be misinterpreted online.\n\nA message gives us speed, but it removes tone and context.\n\nNow, if something is genuinely important, I prefer to follow up clearly instead of creating a story in my head about why someone has not replied.", "friend message｜silence online creates false assumptions", "Part 2｜Cue Card 逐題檢查", ["Who you sent it to", "What the message/email was about", "Whether you finally received the reply", "And explain how you felt about the experience"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "遇到的科技問題", "Describe a challenging technological problem you faced", "A technology problem I faced happened when my laptop suddenly could not connect to Wi-Fi while I was preparing an application.\n\nAt first, I thought the internet service was down. I restarted the laptop, but nothing changed.\n\nThen I checked my phone and saw that the Wi-Fi itself was working. That told me the problem was probably on my laptop.\n\nI forgot the network, connected again, and the problem was fixed.\n\nIt was a small problem, but it reminded me to check the cause step by step instead of guessing.", "中文重點：laptop Wi-Fi problem → compare with phone → find device issue → reconnect", "Part 2｜Cue Card 逐題檢查", ["What the problem was", "When and where you faced it", "How challenging it was", "And explain how you solved it"], "laptop Wi-Fi problem → compare with phone → find device issue → reconnect", ""], ["Part 2", "交通壅塞", "Describe a time when you were stuck in a traffic jam for a very long time", "A traffic jam I remember happened when I was taking a bus after work in the Taipei area.\n\nThe traffic barely moved for almost an hour because it was rush hour and there had also been an accident further ahead.\n\nAt first I felt frustrated because I was tired and wanted to get home. After a while, I put on my headphones and stopped checking the time.\n\nWhat stood out was the number of private cars around the bus. Everyone was trying to move individually, but almost nobody was moving.\n\nThe experience made me think that traffic cannot be solved simply by giving cars more space.\n\nA city needs transport that can move more people efficiently, not just more vehicles.", "下班公車塞車｜move more people, not more cars", "Part 2｜Cue Card 逐題檢查", ["When it happened", "Where you were stuck", "What you did while waiting", "And explain how you felt in the traffic jam"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "花費少的外出日", "Describe a special day out that cost you little money/didn’t cost you much", "A low-cost day out I enjoyed was spending an afternoon at a riverside park with a friend.\n\nWe took public transport, walked along the river and bought only simple drinks, so the whole day cost very little.\n\nWhat made it enjoyable was that there was no pressure to keep buying things or moving from one attraction to another.\n\nWe had time to talk, watch people cycling and simply sit for a while.\n\nThe experience reminded me that spending more money does not automatically improve free time.\n\nIf the place is comfortable and the company is good, a very simple outing can be more relaxing than an expensive plan.", "河濱公園｜low cost, low pressure", "Part 2｜Cue Card 逐題檢查", ["When the day was", "Where you went", "How much you spent", "And explain how you feel about the day"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "語言學習", "Describe a thing you did to learn another language", "One language-learning experience I remember is preparing my English for IELTS and using English during my exchange in Rhode Island.\n\nThe biggest change in my learning came when I stopped waiting for every sentence to be perfect.\n\nWhen I was abroad, I had to ask questions, order food and solve small problems even when my grammar was not perfect.\n\nThat gave me much more confidence than silently memorising vocabulary.\n\nNow I still study words and grammar, but I try to use them in speaking as soon as possible.\n\nThe lesson is simple: language gives connection, not just correct answers.\n\nYou improve faster when you use the language before you feel completely ready.", "IELTS + Rhode Island｜use before ready", "Part 2｜Cue Card 逐題檢查", ["What language you learned", "What you did", "How it helped you learn the language", "And how you felt about it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "喜歡看的現場體育賽事", "Describe a live sports event you watched and liked", "A live sports event I watched and really enjoyed was an international baseball game involving Taiwan.\n\nI watched it live on TV with my family. I do not remember every play, but I remember how tense the game felt because the score was close.\n\nWhenever Taiwan made a good play, everyone reacted immediately. That shared feeling made the game much more exciting than watching a replay later.\n\nI liked it because live sport has real uncertainty. Nobody knows the result yet.\n\nThat is what makes an important baseball game so easy to remember.", "中文重點：Taiwan baseball live on TV → close game → family reacts together → real uncertainty", "Part 2｜Cue Card 逐題檢查", ["What it was", "When and where you watched it", "Who you watched it with", "And explain why you liked it"], "Taiwan baseball live on TV → close game → family reacts together → real uncertainty", ""], ["Part 2", "在團隊中工作", "Describe a time when you worked in a group", "One team experience I remember is working on a university project.\n\nAt first, the difficult part was not the technical task. It was that everyone had a different idea of what should be done first.\n\nWe improved when we stopped dividing work randomly and made responsibilities clearer. Each person took one part, and we checked progress together at simple points instead of constantly messaging each other.\n\nThe project became much smoother because people knew what they owned.\n\nThat experience taught me that teamwork is not just being friendly.\n\nA good team needs clear roles, useful communication and enough trust to let each person do their part without being controlled every minute.", "大學專題｜clear roles + trust", "Part 2｜Cue Card 逐題檢查", ["What you did", "Who you worked with", "What problems you faced", "And explain why you worked in the group"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "早起", "Describe a time when you got up early", "A time I had to get up very early was for an important exam day.\n\nI am not naturally an early bird, so I prepared everything the night before—documents, clothes and the route—because I did not want to make many decisions while half awake.\n\nWhen the alarm rang, I was tired, but the preparation made the morning much calmer.\n\nI ate something simple, checked my things once and left with extra time.\n\nThe experience showed me that waking up early is much easier when the morning itself is simple.\n\nI still do not love early mornings, but a good system can reduce the stress. Preparation cannot give me more energy, but it can stop me wasting the energy I already have.", "重要考試早起｜prepare the night before", "Part 2｜Cue Card 逐題檢查", ["When it was", "What you did", "Why you got up early", "And how you felt about it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "給別人建議", "Describe a time when you gave advice to others", "One time I gave advice was when my niece was struggling with maths.\n\nShe understood some formulas, but whenever she saw a longer question, she became nervous and wanted the answer immediately.\n\nInstead of solving it for her, I told her to underline the information she already had and break the question into smaller steps.\n\nI asked simple questions like, 'What do we know?' and 'What should we find first?'\n\nAt first she was impatient, but after a while she solved the next problem by herself.\n\nThat was exactly why I gave the advice. I did not only want her to finish one homework question.\n\nGood advice should help someone think more clearly, not think for them.", "姪女數學｜advice gives method, not answer", "Part 2｜Cue Card 逐題檢查", ["When it was", "What the advice was", "And explain why you gave the advice"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "喜歡的電影", "Describe a movie you watched and enjoyed recently", "A movie I watched recently and enjoyed was Knives Out.\n\nI watched it at home because I like thrillers and mystery films much more than pure romance.\n\nThe story begins with a suspicious death in a wealthy family, and almost everyone seems to be hiding something.\n\nI liked the way the film gave small clues and kept changing who I trusted.\n\nIt also had some humour, so it did not feel too heavy.\n\nI enjoyed it because I had to keep thinking while I watched. A good mystery makes me feel involved in the story.", "中文重點：Knives Out recently → mystery + clues + humour → active viewer", "Part 2｜Cue Card 逐題檢查", ["When and where you watched it", "Who you watched it with", "What it was about", "And explain why you watched this movie"], "Knives Out recently → mystery + clues + humour → active viewer", ""], ["Part 2", "腳踏車/摩托車/汽車旅行", "Describe a bicycle/motorcycle/car trip you would like to go", "A bicycle trip I would like to take is a long ride along a riverside path in northern Taiwan.\n\nI would like to go with my father because cycling is something I connect with my childhood.\n\nI would choose a route with a river view, fewer cars and places where we could stop and rest.\n\nI am not looking for an extreme challenge. I just want a relaxed ride where we can talk and enjoy the scenery.\n\nFor me, the best part would not be the distance. It would be doing an old childhood activity together again as an adult.", "中文重點：future riverside bike trip with father → safe route + scenery → childhood activity again", "Part 2｜Cue Card 逐題檢查", ["Who you would like to go with", "Where you would like to go", "When you would like to go", "And explain why you would like to go by bicycle/motorcycle/car"], "future riverside bike trip with father → safe route + scenery → childhood activity again", ""], ["Part 2", "組織快樂活動", "Describe a time when you organized a happy event successfully", "A happy event I organized was a small birthday dinner for a close friend.\n\nI chose the restaurant, checked everyone's schedule and made a simple reservation.\n\nI did not plan anything huge because I knew my friend preferred a relaxed evening. I only asked a few close friends to come, and we brought a small cake.\n\nThe dinner went smoothly, and my friend looked genuinely happy and surprised.\n\nI was happy too because the event felt personal rather than expensive. It showed me that good planning is mainly about understanding the people involved.", "中文重點：friend birthday dinner → restaurant + schedule + small cake → personal and successful", "Part 2｜Cue Card 逐題檢查", ["What the event was", "How you prepared for it", "Who helped you to organize it", "And explain why you think it was a successful event"], "friend birthday dinner → restaurant + schedule + small cake → personal and successful", ""], ["Part 2", "微笑的場合", "Describe an occasion when many people were smiling", "An occasion when many people were smiling was my university graduation.\n\nEveryone was wearing graduation gowns, taking photos and giving flowers to friends and family.\n\nPeople were smiling because they had finally finished an important stage of life. At the same time, there was also a little sadness because classmates knew they might not see each other as often.\n\nI remember the atmosphere very clearly. Every few minutes, someone was calling a friend over for another photo.\n\nThe smiles felt natural because people were proud, relieved and excited about what came next.", "中文重點：graduation → gowns + photos + flowers → proud, relieved, excited", "Part 2｜Cue Card 逐題檢查", ["When it happened", "Who you were with", "What happened", "And explain why most people were smiling"], "graduation → gowns + photos + flowers → proud, relieved, excited", ""], ["Part 2", "鼓勵別人做他不願意做的事", "Describe a time when you encouraged someone to do something that he/she didn't want to do", "One time I gave advice was when my niece was struggling with maths.\n\nShe understood some formulas, but whenever she saw a longer question, she became nervous and wanted the answer immediately.\n\nInstead of solving it for her, I told her to underline the information she already had and break the question into smaller steps.\n\nI asked simple questions like, 'What do we know?' and 'What should we find first?'\n\nAt first she was impatient, but after a while she solved the next problem by herself.\n\nThat was exactly why I gave the advice. I did not only want her to finish one homework question.\n\nGood advice should help someone think more clearly, not think for them.\n\nThe part I would focus on most is and explain why you encouraged him/her to do it, because that is what makes this story fit the question.", "姪女數學｜advice gives method, not answer｜這題重點：And explain why you encouraged him/her to do it", "Part 2｜Cue Card 逐題檢查", ["Who he or she is", "What you encouraged him/her to do", "How he/she reacted", "And explain why you encouraged him/her to do it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "發揮想像力", "Describe a time you needed to use your imagination", "A time I used my imagination was when I had to think of a clearer way to present a complicated idea.\n\nInstead of adding more text, I imagined how the topic would look to someone seeing it for the first time.\n\nThat led me to turn the information into a simple sequence with one example at each step.\n\nThe result was easier to explain and easier for other people to follow.\n\nThe experience changed my idea of imagination.\n\nIt is not only about art or fantasy. Imagination can also mean seeing a problem from another person's point of view and creating a better way to communicate it.\n\nFor me, creativity is useful when it makes something difficult easier to understand.", "presentation design｜imagination = seeing from another perspective", "Part 2｜Cue Card 逐題檢查", ["When it was", "Why you needed to use imagination", "How difficult or easy it was", "And explain how you felt about it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "禁用手機的場合", "Describe an occasion when you were not allowed to use your mobile phone", "A situation where phones should be restricted is an important exam.\n\nThe reason is not only cheating. A phone can interrupt concentration even when nobody touches it because people are waiting for messages or thinking about notifications.\n\nDuring an exam, everyone should have the same quiet environment and the same access to information.\n\nI would not support banning phones everywhere because they are useful tools in normal life.\n\nBut in a situation that depends on independent concentration, temporary restrictions make sense.\n\nFor me, the key is purpose. Technology should support a task when it helps, but it should be removed when it changes the fairness or attention the task needs.", "exam｜purpose decides whether phone helps or harms", "Part 2｜Cue Card 逐題檢查", ["When it was", "Where it was", "Why you were not allowed to use your mobile phone", "And how you felt about it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "為家人感到驕傲", "Describe a time when you felt proud of a family member", "A time I felt proud of a family member was when my niece finally solved a difficult maths problem by herself.\n\nShe had been frustrated because longer questions made her nervous.\n\nInstead of giving her the answer, I helped her break the problem into smaller steps. After a few tries, she completed the next question without my help.\n\nShe looked very happy, and I felt proud because I could see her confidence change.\n\nIt was only a small homework problem, but the important part was that she stopped thinking, 'I can't do this.'", "中文重點：niece solves maths alone → confidence changes → proud of her progress", "Part 2｜Cue Card 逐題檢查", ["When it happened", "Who the person is", "What the person did", "And explain why you felt proud of him/her"], "niece solves maths alone → confidence changes → proud of her progress", ""], ["Part 2", "去過的靠近自然的地方", "Describe somewhere near a natural place that you have been to", "One natural place I remember is Alishan in Taiwan.\n\nWhat I like about it is not one single attraction but the overall change of pace. There are forests, mountain views and cooler air, which feel very different from busy urban areas.\n\nI spend a lot of time around screens, so being somewhere with trees and open space feels like a reset.\n\nI do not need a difficult hiking route. I prefer walking slowly, looking at the scenery and having time without rushing.\n\nThat is why natural places matter to me.\n\nThey do not need to entertain me every minute. Their value is that they give my mind a different rhythm.", "Alishan｜change of pace", "Part 2｜Cue Card 逐題檢查", ["Where this place is", "Who you went there with", "Why you went there", "And explain how you feel about the place"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "喜歡的自然之地", "Describe a natural place in your city that you enjoy visiting", "A natural place in my city that I enjoy is a riverside park in New Taipei City.\n\nI like it because it gives me open space without requiring a long trip. There are walking and cycling paths, trees, and a wide view of the river.\n\nWhen I spend too much time around buildings and screens, even a short walk there helps me slow down.\n\nI usually prefer going in the late afternoon when it is not too hot.\n\nFor me, a good natural place does not need to be far away. It just needs to give my mind a break from normal city life.", "中文重點：New Taipei riverside park → easy to reach → open view + walking → mental break", "Part 2｜Cue Card 逐題檢查", ["Where it is", "What it is like", "How often you go there", "Who you often go there with", "And explain why you enjoy visiting there"], "New Taipei riverside park → easy to reach → open view + walking → mental break", ""], ["Part 2", "擁擠的地方", "Describe a crowded place you went to", "A crowded place I remember is a busy night market on a weekend.\n\nThe street was full of people, food stalls and noise, so moving even a short distance took a long time.\n\nAt first the atmosphere was exciting because there was so much happening around me. After about an hour, though, I started feeling tired because I had to keep watching where I was walking and could barely hear my friends.\n\nThe experience made me realise that I enjoy lively places only for a limited time.\n\nCrowds can create energy, but they also consume attention.\n\nThat is why I usually prefer going earlier or choosing a quieter day when I actually want to enjoy the place rather than just survive the crowd.", "夜市｜energy vs attention", "Part 2｜Cue Card 逐題檢查", ["Where it was", "When you went there", "Who you went there with", "What you did there", "And how you felt about it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "嘈雜的地方", "Describe a noisy place you have been to", "A noisy place I remember is a crowded food court in a department store during a weekend.\n\nThere were many families, background music, people talking and constant announcements.\n\nThe noise was not dangerous, but after sitting there for a while I noticed that everyone at our table had to speak louder.\n\nThat made normal conversation surprisingly tiring.\n\nI do not need complete silence, and I actually like some background sound, but there is a point where sound stops creating atmosphere and starts demanding attention.\n\nThat is why I prefer places with a moderate noise level.\n\nA good social place should make conversation easier, not force people to compete with the environment.", "百貨 food court｜some sound okay, constant noise drains attention", "Part 2｜Cue Card 逐題檢查", ["Where it is", "When you went there", "What you did there", "And explain why you feel it’s a noisy place"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "重要河流/湖泊", "Describe an important river/lake in your country", "One important river I know is the Tamsui River in northern Taiwan.\n\nI know it mainly because it is closely connected with the Taipei area and with riverside spaces used for walking, cycling and transport.\n\nFor me, its importance is not only geographical. A river shapes how a city develops and also gives people open space in a dense urban environment.\n\nI especially like riverside areas because they offer a simple way to get away from traffic without travelling far.\n\nThe river also reminds people that natural systems continue through the city rather than existing only in remote mountains.\n\nThat is why protecting water quality matters. A river is both part of nature and part of everyday urban life.", "Tamsui River｜nature inside the city", "Part 2｜Cue Card 逐題檢查", ["Where it is located", "How big/long it is", "What it looks like", "And explain why it is important"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "推薦旅遊過的地方", "Describe a place you have travelled to that you would like to recommend to others", "A place in Taiwan I would recommend is Alishan.\n\nMany visitors first experience Taiwan through cities and food, which are important, but Alishan shows a very different side of the island.\n\nThere are forests, mountain views and the famous railway, and the cooler environment makes the whole pace feel slower.\n\nI would recommend it especially to someone who has already spent time in Taipei.\n\nThe main reason is not that Alishan has one 'must-see' attraction. It offers contrast.\n\nTravel becomes more memorable when a place changes how you feel and move, not only when it gives you another photo.\n\nAlishan makes it natural to slow down, and that is why I think it is worth visiting.", "Alishan｜show another side of Taiwan", "Part 2｜Cue Card 逐題檢查", ["What it is", "Where it is", "What you saw and did there", "And explain why you would like to recommend it to others"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "想有空時去旅遊的地方", "Describe a place you would like to visit in your free time", "A place I want to visit when I have enough time is Japan.\n\nThe reason is simple: it would give me a change of environment without requiring an very complicated journey.\n\nI want to spend time in both a large city and a quieter area so I could compare the pace of daily life.\n\nI am also interested in the food, public transport and small details of how people use shared spaces.\n\nI would not try to visit ten attractions every day. I would rather leave enough time to walk, eat and notice ordinary life.\n\nFor me, travel is most valuable when it changes perspective. If every minute is planned only for photos, I miss the part of travel that I actually enjoy.", "Japan｜slow travel, ordinary life", "Part 2｜Cue Card 逐題檢查", ["Where it is", "What you will do there", "How long you will stay there"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "想拜訪但不想住的家", "Describe a home that you like to visit but do not want to live in", "A home I want to visit but would not want to live in is a very large traditional house in a quiet rural area.\n\nI would enjoy visiting because the architecture, wooden details and open courtyard would feel completely different from my normal apartment.\n\nIt would be interesting for a day or two, especially for taking photos and experiencing a slower lifestyle.\n\nbut, I would not want to live there permanently because I depend on convenient transport, shops and daily services.\n\nA beautiful home is not automatically a practical home.\n\nFor me, the best place to visit and the best place to live can be completely different because daily life depends much more on convenience than novelty.", "traditional rural house｜beautiful to visit, inconvenient to live", "Part 2｜Cue Card 逐題檢查", ["Where it is", "What it is like", "Why you like to visit it", "And explain why you would not like to live there"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "去過的無聊地方", "Describe a boring place", "A boring place I remember is Cambodia, which I visited with my family when I was very young.\n\nI was still a child, so I do not remember every detail. But I clearly remember that it was very hot, and we had to spend a long time in the car to get from one place to another.\n\nAt that age, I was not interested in temples or history. I just felt hot, tired and bored. I also remember that some roads and buildings looked much less developed than what I was used to in Taiwan, so everything felt very unfamiliar to me.\n\nAt the time, I honestly just wanted to go back to the hotel.\n\nLooking back now, I do not think Cambodia itself was boring. I was probably too young to understand what I was seeing. If I went there again as an adult, I might enjoy it in a completely different way.", "柬埔寨｜小時候跟家人去 → 很熱＋坐很久的車 → 當時不懂歷史、覺得環境比台灣不發達 → 小時候只覺得累和無聊 → 現在回頭看，可能是因為年紀太小，不一定是地方真的無聊。", "Part 2｜Cue Card 逐題檢查", ["Where it is", "Who you went there with", "What you did there", "And explain why you think it is a boring place"], "Cambodia as a child → hot + long car rides + unfamiliar → bored then, different view now", ""], ["Part 2", "想再去一次的城市", "Describe a city that you have been to and would like to visit again", "A city I want to return to is Providence in Rhode Island.\n\nI first experienced the area during an exchange, so my memory of it is connected with studying abroad and using English every day.\n\nThe first time, I spent a lot of mental energy understanding transport, schedules and unfamiliar routines.\n\nIf I returned now, I think I would notice the city differently because I would not be as nervous about those basic things.\n\nThat is the main reason I want to go again.\n\nThe first visit taught me how to function in a new environment. a second visit would let me enjoy it with more confidence.\n\nSometimes returning is interesting because the place is the same, but the person visiting it has changed.", "Providence / Rhode Island｜same place, different self", "Part 2｜Cue Card 逐題檢查", ["When you visited it", "What you did there", "What it was like", "And explain why you would like to visit it again"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "去過且喜歡的城市", "Describe a city you enjoyed visiting", "A city I enjoyed spending time in was Providence in Rhode Island.\n\nI liked it because the experience was tied to living and studying rather than only sightseeing.\n\nI had to use English in ordinary situations, understand local transport and communicate with people from different backgrounds.\n\nThose small challenges made the city memorable.\n\nWhat I appreciated most was the feeling that I was slowly becoming more comfortable in a place that was unfamiliar at first.\n\nThat is why I liked it.\n\nA city does not need to have the biggest landmarks to leave a strong impression. Sometimes the place matters because of what you learned about yourself while living there.", "Providence｜city becomes meaningful through adaptation", "Part 2｜Cue Card 逐題檢查", ["Where it is", "When you visited it", "How long you stayed there", "What you did there", "And explain why you enjoyed visiting it"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 2", "商店", "Describe a shop/store you enjoy visiting", "A shop I enjoy visiting is a bookstore inside a department store.\n\nI like it because I can look at novels, magazines and stationery without feeling that I have to buy something immediately.\n\nThe shop is usually quieter than the rest of the department store, so I can slow down and look around.\n\nI also like seeing new book covers and checking whether a novel interests me before buying it.\n\nFor me, a good shop is not only a place to spend money. It can also be a place where I enjoy the time itself.", "中文重點：bookstore in department store → novels + quiet space → browsing itself is enjoyable", "Part 2｜Cue Card 逐題檢查", ["What the shop’s name is", "Where it is", "How often you visit it", "And explain why you like to visit it"], "bookstore in department store → novels + quiet space → browsing itself is enjoyable", ""], ["Part 2", "安靜的地方", "Describe a quiet place you like to go", "A quiet place I like is my own bedroom.\n\nIt is not a tourist attraction. It simply has my bed, desk, laptop and familiar furniture.\n\nWhat makes it quiet for me is more psychological than physical. I do not need complete silence. I actually like a little background sound.\n\nThe important thing is that I can close the door and stop responding to other people for a while.\n\nAfter work or study, I may listen to music, watch something or simply lie down.\n\nEven a short time there helps me reset.\n\nThat is why I value the room. A good quiet place is somewhere that reduces demands on your attention, not somewhere with absolutely no sound.", "自己的房間｜quiet = fewer demands on attention", "Part 2｜Cue Card 逐題檢查", ["Where it is", "How you knew it", "How often you go there", "What you do there", "And explain how you feel about the place"], "一個熟悉故事 → 題目角度 → WHY → impact", ""], ["Part 3", "只見過一次且想繼續了解的人", "What should we not talk about when we meet a person for the first time?", "Very private topics, such as salary or family problems, are better avoided at first. First meetings have little trust, so people usually need safe and simple topics. You can see this in daily life. Asking about hobbies or work is easier than asking about money or family problems. Comfort should come before deep personal questions.", "中文邏輯：先回答題目 → Very private topics, such as salary or family problems, are better avoided at first.｜理由：First meetings have little trust, so people usually need safe and simple topics.｜例子：Asking about hobbies or work is easier than asking about money or family problems.｜結果：Comfort should come before deep personal questions.", "Part 3｜522/522 題目導向逐題校正", null, "Very private topics, such as salary or family problems, are better avoided at first.", ""], ["Part 3", "只見過一次且想繼續了解的人", "What can we do to leave a good impression on people we meet for the first time?", "Listening well and showing real interest usually leaves the best first impression. Comfort should come before deep personal questions. This is because first meetings have little trust, so people usually need safe and simple topics. For example, asking about hobbies or work is easier than asking about money or family problems.", "中文邏輯：先回答題目 → Listening well and showing real interest usually leaves the best first impression.｜理由：First meetings have little trust, so people usually need safe and simple topics.｜例子：Asking about hobbies or work is easier than asking about money or family problems.｜結果：Comfort should come before deep personal questions.", "Part 3｜522/522 題目導向逐題校正", null, "Listening well and showing real interest usually leaves the best first impression.", ""], ["Part 3", "只見過一次且想繼續了解的人", "What qualities make true friends?", "Trust, honesty and reliability are the most important qualities in a true friend. Strong friendship needs trust, honesty and reliability. Trust matters more than having exactly the same hobbies. For instance, a real friend may tell the truth even when it is uncomfortable.", "中文邏輯：先回答題目 → Trust, honesty and reliability are the most important qualities in a true friend.｜理由：Strong friendship needs trust, honesty and reliability.｜例子：A real friend may tell the truth even when it is uncomfortable.｜結果：Trust matters more than having exactly the same hobbies.", "Part 3｜522/522 題目導向逐題校正", null, "Trust, honesty and reliability are the most important qualities in a true friend.", ""], ["Part 3", "只見過一次且想繼續了解的人", "Is it important to have the same hobbies and interests when making friends?", "No. Shared hobbies can help people connect, but they are not necessary for a strong friendship. Shared hobbies help people start talking, but values and trust matter more later. Similarity helps connection, but it is not the whole friendship. For instance, two friends can enjoy different music and still support each other well.", "中文邏輯：先回答題目 → No. Shared hobbies can help people connect, but they are not necessary for a strong friendship.｜理由：Shared hobbies help people start talking, but values and trust matter more later.｜例子：Two friends can enjoy different music and still support each other well.｜結果：Similarity helps connection, but it is not the whole friendship.", "Part 3｜522/522 題目導向逐題校正", null, "No. Shared hobbies can help people connect, but they are not necessary for a strong friendship.", ""], ["Part 3", "只見過一次且想繼續了解的人", "On what occasions do people like to make friends?", "People often make friends at school, work, clubs or social events where they meet regularly. Regular contact makes trust easier to build. This is because friendship usually grows when people meet repeatedly and feel comfortable together. For example, school, work and shared activities give people natural reasons to talk.", "中文邏輯：先回答題目 → People often make friends at school, work, clubs or social events where they meet regularly.｜理由：Friendship usually grows when people meet repeatedly and feel comfortable together.｜例子：School, work and shared activities give people natural reasons to talk.｜結果：Regular contact makes trust easier to build.", "Part 3｜522/522 題目導向逐題校正", null, "People often make friends at school, work, clubs or social events where they meet regularly.", ""], ["Part 3", "只見過一次且想繼續了解的人", "How do people make friends in Taiwan?", "In Taiwan, people often make friends through school, work, mutual friends or shared activities. Friendship usually grows when people meet repeatedly and feel comfortable together. Regular contact makes trust easier to build. For instance, school, work and shared activities give people natural reasons to talk.", "中文邏輯：先回答題目 → In Taiwan, people often make friends through school, work, mutual friends or shared activities.｜理由：Friendship usually grows when people meet repeatedly and feel comfortable together.｜例子：School, work and shared activities give people natural reasons to talk.｜結果：Regular contact makes trust easier to build.", "Part 3｜522/522 題目導向逐題校正", null, "In Taiwan, people often make friends through school, work, mutual friends or shared activities.", ""], ["Part 3", "幫人提升健康狀態", "What effect does stress have on health?", "Too much stress can damage sleep, energy and concentration. Stress can be useful in small amounts but harmful when it never stops. In real life, a deadline may help someone focus, while constant pressure can damage sleep. The level and length of stress matter.", "中文邏輯：先回答題目 → Too much stress can damage sleep, energy and concentration.｜理由：Stress can be useful in small amounts but harmful when it never stops.｜例子：A deadline may help someone focus, while constant pressure can damage sleep.｜結果：The level and length of stress matter.", "Part 3｜522/522 題目導向逐題校正", null, "Too much stress can damage sleep, energy and concentration.", ""], ["Part 3", "幫人提升健康狀態", "Which group pays more attention to health, young people or old people?", "Older people usually pay more attention to health because health problems become more common with age. They may care more about check-ups, diet and exercise. Young people care too, but they often feel they have more time.", "中文邏輯：先回答題目 → Older people usually pay more attention to health because health problems become more common with age.｜理由：Older people usually pay more attention to health because health problems become more common with age.｜例子：They may care more about check-ups, diet and exercise.｜結果：Young people care too, but they often feel they have more time.", "Part 3｜522/522 題目導向逐題校正", null, "Older people usually pay more attention to health because health problems become more common with age.", ""], ["Part 3", "教你新技能的人", "Why is self-discipline important when learning a new skill?", "Self-discipline matters because a new skill only improves with regular practice. An adult can watch a short lesson and then practise the same action several times. So understanding grows faster when people actually use the skill. Skills improve through practice, feedback and repetition.", "中文邏輯：先回答題目 → Self-discipline matters because a new skill only improves with regular practice.｜理由：Skills improve through practice, feedback and repetition.｜例子：An adult can watch a short lesson and then practise the same action several times.｜結果：Understanding grows faster when people actually use the skill.", "Part 3｜522/522 題目導向逐題校正", null, "Self-discipline matters because a new skill only improves with regular practice.", ""], ["Part 3", "教你新技能的人", "What are the differences between learning from a teacher and learning by oneself?", "Learning from a teacher gives faster feedback, while learning alone gives more freedom. A patient teacher can help a shy student ask questions. So respect and usefulness matter more than popularity. Good teachers explain clearly, notice students' needs and make mistakes feel safe.", "中文邏輯：先回答題目 → Learning from a teacher gives faster feedback, while learning alone gives more freedom.｜理由：Good teachers explain clearly, notice students' needs and make mistakes feel safe.｜例子：A patient teacher can help a shy student ask questions.｜結果：Respect and usefulness matter more than popularity.", "Part 3｜522/522 題目導向逐題校正", null, "Learning from a teacher gives faster feedback, while learning alone gives more freedom.", ""], ["Part 3", "教你新技能的人", "How do adults learn a new skill?", "Adults usually learn new skills through a mix of lessons, online resources and practice. Skills improve through practice, feedback and repetition. In real life, an adult can watch a short lesson and then practise the same action several times. Understanding grows faster when people actually use the skill.", "中文邏輯：先回答題目 → Adults usually learn new skills through a mix of lessons, online resources and practice.｜理由：Skills improve through practice, feedback and repetition.｜例子：An adult can watch a short lesson and then practise the same action several times.｜結果：Understanding grows faster when people actually use the skill.", "Part 3｜522/522 題目導向逐題校正", null, "Adults usually learn new skills through a mix of lessons, online resources and practice.", ""], ["Part 3", "教你新技能的人", "How can parents and teachers teach children new skills?", "Parents and teachers should first show the skill, then let children try it by themselves. Parents usually shape daily values, while teachers strongly influence school and learning. One clear example is a child may ask parents about life choices and a teacher about study problems. Both roles matter in different areas.", "中文邏輯：先回答題目 → Parents and teachers should first show the skill, then let children try it by themselves.｜理由：Parents usually shape daily values, while teachers strongly influence school and learning.｜例子：A child may ask parents about life choices and a teacher about study problems.｜結果：Both roles matter in different areas.", "Part 3｜522/522 題目導向逐題校正", null, "Parents and teachers should first show the skill, then let children try it by themselves.", ""], ["Part 3", "教你新技能的人", "Where can children learn new skills?", "Children can learn new skills at home, at school, in clubs and online. Understanding grows faster when people actually use the skill. This is because skills improve through practice, feedback and repetition. For example, an adult can watch a short lesson and then practise the same action several times.", "中文邏輯：先回答題目 → Children can learn new skills at home, at school, in clubs and online.｜理由：Skills improve through practice, feedback and repetition.｜例子：An adult can watch a short lesson and then practise the same action several times.｜結果：Understanding grows faster when people actually use the skill.", "Part 3｜522/522 題目導向逐題校正", null, "Children can learn new skills at home, at school, in clubs and online.", ""], ["Part 3", "教你新技能的人", "Why should children learn new skills?", "Children should learn new skills because it builds confidence and independence. An adult can watch a short lesson and then practise the same action several times. So understanding grows faster when people actually use the skill. Skills improve through practice, feedback and repetition.", "中文邏輯：先回答題目 → Children should learn new skills because it builds confidence and independence.｜理由：Skills improve through practice, feedback and repetition.｜例子：An adult can watch a short lesson and then practise the same action several times.｜結果：Understanding grows faster when people actually use the skill.", "Part 3｜522/522 題目導向逐題校正", null, "Children should learn new skills because it builds confidence and independence.", ""], ["Part 3", "學習並喜歡歷史的人", "Besides big historical events, what else is important when learning history?", "Daily life is also important in history because it shows how ordinary people were affected. A story about how a family lived can be easier to remember than a list of dates. That matters because history becomes easier when people connect facts with real lives and clear causes. Understanding the connection matters more than memorising everything.", "中文邏輯：先回答題目 → Daily life is also important in history because it shows how ordinary people were affected.｜理由：History becomes easier when people connect facts with real lives and clear causes.｜例子：A story about how a family lived can be easier to remember than a list of dates.｜結果：Understanding the connection matters more than memorising everything.", "Part 3｜522/522 題目導向逐題校正", null, "Daily life is also important in history because it shows how ordinary people were affected.", ""], ["Part 3", "學習並喜歡歷史的人", "Do you think people should learn ancient history before learning modern history?", "Not necessarily. Modern history can be a good starting point because it is closer to our lives. A story about how a family lived can be easier to remember than a list of dates. So understanding the connection matters more than memorising everything. History becomes easier when people connect facts with real lives and clear causes.", "中文邏輯：先回答題目 → Not necessarily. Modern history can be a good starting point because it is closer to our lives.｜理由：History becomes easier when people connect facts with real lives and clear causes.｜例子：A story about how a family lived can be easier to remember than a list of dates.｜結果：Understanding the connection matters more than memorising everything.", "Part 3｜522/522 題目導向逐題校正", null, "Not necessarily. Modern history can be a good starting point because it is closer to our lives.", ""], ["Part 3", "學習並喜歡歷史的人", "Is it important to learn how people in the past lived their lives?", "Yes. Learning about daily life makes history feel more real and human. Daily life shows how history affected normal people. This makes history feel more human. For instance, food, clothes and work can make an old period easier to imagine.", "中文邏輯：先回答題目 → Yes. Learning about daily life makes history feel more real and human.｜理由：Daily life shows how history affected normal people.｜例子：Food, clothes and work can make an old period easier to imagine.｜結果：This makes history feel more human.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Learning about daily life makes history feel more real and human.", ""], ["Part 3", "學習並喜歡歷史的人", "How do children learn history before they attend school?", "Before school, children often learn history from family stories, books, cartoons and museums. History becomes easier when people connect facts with real lives and clear causes. For example, a story about how a family lived can be easier to remember than a list of dates. Understanding the connection matters more than memorising everything.", "中文邏輯：先回答題目 → Before school, children often learn history from family stories, books, cartoons and museums.｜理由：History becomes easier when people connect facts with real lives and clear causes.｜例子：A story about how a family lived can be easier to remember than a list of dates.｜結果：Understanding the connection matters more than memorising everything.", "Part 3｜522/522 題目導向逐題校正", null, "Before school, children often learn history from family stories, books, cartoons and museums.", ""], ["Part 3", "學習並喜歡歷史的人", "At what age do you think people should begin to learn history?", "Children can start learning simple history in primary school, as long as it is told through stories. History becomes easier when people connect facts with real lives and clear causes. In real life, a story about how a family lived can be easier to remember than a list of dates. Understanding the connection matters more than memorising everything.", "中文邏輯：先回答題目 → Children can start learning simple history in primary school, as long as it is told through stories.｜理由：History becomes easier when
