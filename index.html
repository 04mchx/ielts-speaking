asy for children to remember.", ""], ["Part 3", "包含動物的故事或書籍", "What are the advantages of keeping a pet?", "Pets can give company, teach responsibility and add routine to daily life. The benefit comes with a real duty to care for the pet. For example, feeding and caring for an animal every day teaches commitment.", "中文邏輯：先回答題目 → Pets can give company, teach responsibility and add routine to daily life.｜理由：Pets can give company, routine and a sense of responsibility.｜例子：Feeding and caring for an animal every day teaches commitment.｜結果：The benefit comes with a real duty to care for the pet.", "Part 3｜522/522 題目導向逐題校正", null, "Pets can give company, teach responsibility and add routine to daily life.", ""], ["Part 3", "包含動物的故事或書籍", "Do many people keep pets in your country?", "Yes. Dogs and cats are common, especially as more people treat pets as family members. Many people keep pets for company and emotional connection. In real life, dogs and cats can become part of daily family routines. Pet ownership also requires time, money and responsibility.", "中文邏輯：先回答題目 → Yes. Dogs and cats are common, especially as more people treat pets as family members.｜理由：Many people keep pets for company and emotional connection.｜例子：Dogs and cats can become part of daily family routines.｜結果：Pet ownership also requires time, money and responsibility.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Dogs and cats are common, especially as more people treat pets as family members.", ""], ["Part 3", "包含動物的故事或書籍", "Many people regard pets as members of their family. What do you think?", "That makes sense to me because people can build a very strong bond with an animal they care for every day. People can form strong emotional bonds with animals over many years. One clear example is a dog or cat may be part of daily routines and family memories. That is why many owners treat pets as family members.", "中文邏輯：先回答題目 → That makes sense to me because people can build a very strong bond with an animal they care for every day.｜理由：People can form strong emotional bonds with animals over many years.｜例子：A dog or cat may be part of daily routines and family memories.｜結果：That is why many owners treat pets as family members.", "Part 3｜522/522 題目導向逐題校正", null, "That makes sense to me because people can build a very strong bond with an animal they care for every day.", ""], ["Part 3", "包含動物的故事或書籍", "Some people think pets should not be kept in cities. What do you think?", "I do not agree completely. Pets can live well in cities if owners give them enough care and space. City living can work for pets when owners provide enough exercise, space and care. In real life, the problem is poor care, not the city itself. Different animals have different needs.", "中文邏輯：先回答題目 → I do not agree completely. Pets can live well in cities if owners give them enough care and space.｜理由：City living can work for pets when owners provide enough exercise, space and care.｜例子：The problem is poor care, not the city itself.｜結果：Different animals have different needs.", "Part 3｜522/522 題目導向逐題校正", null, "I do not agree completely. Pets can live well in cities if owners give them enough care and space.", ""], ["Part 3", "包含動物的故事或書籍", "Should schools teach children about animals?", "Yes. It can teach respect for animals, nature and responsible pet care. This can shape better behaviour later. For example, children also learn that animals are living things, not toys.", "中文邏輯：先回答題目 → Yes. It can teach respect for animals, nature and responsible pet care.｜理由：Learning about animals can teach respect for nature and responsible pet care.｜例子：Children also learn that animals are living things, not toys.｜結果：This can shape better behaviour later.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. It can teach respect for animals, nature and responsible pet care.", ""], ["Part 3", "名人出演的廣告", "Which is more effective, online advertising or offline advertising?", "Online advertising is usually more flexible because it can reach specific groups and is easy to measure. A company can show an ad to people who already searched for a similar product. Offline ads can still work for local or broad audiences.", "中文邏輯：先回答題目 → Online advertising is usually more flexible because it can reach specific groups and is easy to measure.｜理由：Online ads are usually more flexible because they can target specific groups and are easy to measure.｜例子：A company can show an ad to people who already searched for a similar product.｜結果：Offline ads can still work for local or broad audiences.", "Part 3｜522/522 題目導向逐題校正", null, "Online advertising is usually more flexible because it can reach specific groups and is easy to measure.", ""], ["Part 3", "名人出演的廣告", "Is advertising important for a company?", "Yes. People cannot buy a product if they never know it exists, but advertising cannot fix a bad product. Long-term value matters more than short attention. This is because companies survive when they solve real problems and build trust. For example, customers return when the product and service stay reliable.", "中文邏輯：先回答題目 → Yes. People cannot buy a product if they never know it exists, but advertising cannot fix a bad product.｜理由：Companies survive when they solve real problems and build trust.｜例子：Customers return when the product and service stay reliable.｜結果：Long-term value matters more than short attention.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. People cannot buy a product if they never know it exists, but advertising cannot fix a bad product.", ""], ["Part 3", "名人出演的廣告", "Why are some advertisements boring?", "Ads feel boring when they repeat the same message or have nothing useful or emotional to say. A clear message can help people understand a product quickly. That matters because ads work by getting attention and making a product easy to remember. The problem begins when the ad creates a need that was not really there.", "中文邏輯：先回答題目 → Ads feel boring when they repeat the same message or have nothing useful or emotional not want to leave family or deal with language and cultural stress.", ""], ["Part 3", "想從事的短期海外工作", "What kind of work can young people do in foreign countries?", "Young people may do internships, service jobs, office work or short seasonal jobs. The best option depends on language level, skills and visa rules. Overseas work can build both experience and confidence.", "中文邏輯：先回答題目 → Young people may do internships, service jobs, office work or short seasonal jobs.｜理由：Young people may do internships, office work, service jobs or short seasonal jobs abroad.｜例子：The best option depends on language level, skills and visa rules.｜結果：Overseas work can build both experience and confidence.", "Part 3｜522/522 題目導向逐題校正", null, "Young people may do internships, service jobs, office work or short seasonal jobs.", ""], ["Part 3", "想從事的短期海外工作", "What personal skills are required to work in an international company?", "Clear communication, flexibility and problem-solving are especially important. The reason is that companies survive when they solve real problems and build trust. Customers return when the product and service stay reliable. Long-term value matters more than short attention.", "中文邏輯：先回答題目 → Clear communication, flexibility and problem-solving are especially important.｜理由：Companies survive when they solve real problems and build trust.｜例子：Customers return when the product and service stay reliable.｜結果：Long-term value matters more than short attention.", "Part 3｜522/522 題目導向逐題校正", null, "Clear communication, flexibility and problem-solving are especially important.", ""], ["Part 3", "想從事的短期海外工作", "What are the benefits of working for an international company?", "It can improve language skills, cultural understanding and future career options. Customers return when the product and service stay reliable. So long-term value matters more than short attention. Companies survive when they solve real problems and build trust.", "中文邏輯：先回答題目 → It can improve language skills, cultural understanding and future career options.｜理由：Companies survive when they solve real problems and build trust.｜例子：Customers return when the product and service stay reliable.｜結果：Long-term value matters more than short attention.", "Part 3｜522/522 題目導向逐題校正", null, "It can improve language skills, cultural understanding and future career options.", ""], ["Part 3", "想從事的短期海外工作", "What challenges do young people face when working abroad?", "Language, homesickness, new work styles and daily practical problems can all be difficult. Even simple tasks may take more energy at first. Adjustment is part of the experience.", "中文邏輯：先回答題目 → Language, homesickness, new work styles and daily practical problems can all be difficult.｜理由：Language, homesickness, different work styles and unfamiliar daily routines can all be difficult.｜例子：Even simple tasks may take more energy at first.｜結果：Adjustment is part of the experience.", "Part 3｜522/522 題目導向逐題校正", null, "Language, homesickness, new work styles and daily practical problems can all be difficult.", ""], ["Part 3", "想從事的短期海外工作", "What short-term jobs do young people do in other countries?", "Internships, hotel work, restaurant jobs, farm work and summer jobs are common examples. These jobs give experience without a permanent move. The value depends on working conditions and what the person learns.", "中文邏輯：先回答題目 → Internships, hotel work, restaurant jobs, farm work and summer jobs are common examples.｜理由：Internships, hotel work, restaurant jobs, farm work and summer jobs are common examples.｜例子：These jobs give experience without a permanent move.｜結果：The value depends on working conditions and what the person learns.", "Part 3｜522/522 題目導向逐題校正", null, "Internships, hotel work, restaurant jobs, farm work and summer jobs are common examples.", ""], ["Part 3", "完美工作", "What kind of jobs are the most popular in your country?", "Technology, healthcare, finance and service jobs are common choices. Popularity often comes from visibility, confidence and connection with other people. For example, a friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Technology, healthcare, finance and service jobs are common choices.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Technology, healthcare, finance and service jobs are common choices.", ""], ["Part 3", "完美工作", "Is salary the main reason why people choose a certain job?", "Salary matters, but people also care about growth, work hours and the work environment. AI can save time and explain ideas, but it can also give confident wrong answers. AI is strongest as a helper, not a replacement for thinking. For instance, users still need to check important information.", "中文邏輯：先回答題目 → Salary matters, but people also care about growth, work hours and the work environment.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "Salary matters, but people also care about growth, work hours and the work environment.", ""], ["Part 3", "完美工作", "What should people consider when choosing jobs?", "People should consider pay, learning, work-life balance, location and whether the job fits their strengths. A simple example is a higher salary may not be worth it if the job gives no time to rest. The whole life around the job matters.", "中文邏輯：先回答題目 → People should consider pay, learning, work-life balance, location and whether the job fits their strengths.｜理由：People should consider pay, learning, work-life balance, location and whether the role fits their strengths.｜例子：A higher salary may not be worth it if the job gives no time to rest.｜結果：The whole life around the job matters.", "Part 3｜522/522 題目導向逐題校正", null, "People should consider pay, learning, work-life balance, location and whether the job fits their strengths.", ""], ["Part 3", "完美工作", "Do people’s ideal jobs change as they grow up?", "Yes. Experience changes what people value, so an ideal job can change with age. People usually want a mix of fair pay, growth, useful work and a healthy life. The best job fits the person's priorities. For instance, a high salary may lose its value if the job leaves no time to rest.", "中文邏輯：先回答題目 → Yes. Experience changes what people value, so an ideal job can change with age.｜理由：People usually want a mix of fair pay, growth, useful work and a healthy life.｜例子：A high salary may lose its value if the job leaves no time to rest.｜結果：The best job fits the person's priorities.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Experience changes what people value, so an ideal job can change with age.", ""], ["Part 3", "完美工作", "What jobs do children want to do when they grow up?", "Children often choose visible jobs such as doctors, teachers, athletes or online creators. For example, they usually know the exciting part of the job first. Their ideas often change as they learn more.", "中文邏輯：先回答題目 → Children often choose visible jobs such as doctors, teachers, athletes or online creators.｜理由：Children often choose visible jobs such as doctors, teachers, athletes or online creators.｜例子：They usually know the exciting part of the job first.｜結果：Their ideas often change as they learn more.", "Part 3｜522/522 題目導向逐題校正", null, "Children often choose visible jobs such as doctors, teachers, athletes or online creators.", ""], ["Part 3", "完美工作", "What kind of job can be called a ‘dream job’?", "A dream job should fit the person's strengths, values and lifestyle, not just have a high salary. High pay alone is not enough if the work causes constant stress. The best job is one a person can sustain and grow in.", "中文邏輯：先回答題目 → A dream job should fit the person's strengths, values and lifestyle, not just have a high salary.｜理由：A dream job should fit the person's strengths, values and lifestyle.｜例子：High pay alone is not enough if the work causes constant stress.｜結果：The best job is one a person can sustain and grow in.", "Part 3｜522/522 題目導向逐題校正", null, "A dream job should fit the person's strengths, values and lifestyle, not just have a high salary.", ""], ["Part 3", "想擁有的科技產品", "What are the differences between making friends in real life and online?", "Online friendship is easy to start, while real-life friendship gives more body language and shared experience. A simple example is online contact is great across distance. Face-to-face time usually builds deeper social understanding.", "中文邏輯：先回答題目 → Online friendship is easy to start, while real-life friendship gives more body language and shared experience.｜理由：Online friendship is easy to start, while real-life friendship gives more body language and shared experience.｜例子：Online contact is great across distance.｜結果：Face-to-face time usually builds deeper social understanding.", "Part 3｜522/522 題目導向逐題校正", null, "Online friendship is easy to start, while real-life friendship gives more body language and shared experience.", ""], ["Part 3", "想擁有的科技產品", "What negative effects does technology have on people’s relationships?", "Technology can reduce attention when people keep checking phones during real conversations. Technology is useful when it saves time or removes distance without taking away human judgement. In real life, a map app can suggest a route, but the user still chooses what works best. The tool should support the person.", "中文邏輯：先回答題目 → Technology can reduce attention when people keep checking phones during real conversations.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Technology can reduce attention when people keep checking phones during real conversations.", ""], ["Part 3", "想擁有的科技產品", "Do you think technology has changed the way people communicate?", "Yes. Communication is much faster and easier across distance now, but sometimes less personal. Technology removes distance and makes contact almost instant. You can see this in daily life. People in different countries can message or video-call every day. The trade-off is that online messages show less tone and body language.", "中文邏輯：先回答題目 → Yes. Communication is much faster and easier across distance now, but sometimes less personal.｜理由：Technology removes distance and makes contact almost instant.｜例子：People in different countries can message or video-call every day.｜結果：The trade-off is that online messages show less tone and body language.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Communication is much faster and easier across distance now, but sometimes less personal.", ""], ["Part 3", "想擁有的科技產品", "What are the differences between online and face-to-face communication?", "Online talk is fast and convenient, while face-to-face talk shows emotion more clearly. Different situations need different forms. For example, in person, people can notice tone, pauses and body language.", "中文邏輯：先回答題目 → Online talk is fast and convenient, while face-to-face talk shows emotion more clearly.｜理由：Online communication is quick and easy across distance, while face-to-face talk shows emotion more clearly.｜例子：In person, people can notice tone, pauses and body language.｜結果：Different situations need different forms.", "Part 3｜522/522 題目導向逐題校正", null, "Online talk is fast and convenient, while face-to-face talk shows emotion more clearly.", ""], ["Part 3", "想擁有的科技產品", "What technology do young people like to use?", "Smartphones, wireless earbuds, AI tools and social media apps are very popular. The tool should support the person. This is because technology is useful when it saves time or removes distance without taking away human judgement. For example, a map app can suggest a route, but the user still chooses what works best.", "中文邏輯：先回答題目 → Smartphones, wireless earbuds, AI tools and social media apps are very popular.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Smartphones, wireless earbuds, AI tools and social media apps are very popular.", ""], ["Part 3", "想擁有的科技產品", "What are the differences between the technology of the past and that of today?", "Technology today is smaller, faster and more connected, while older technology usually did one main job. A map app can suggest a route, but the user still chooses what works best. That matters because technology is useful when it saves time or removes distance without taking away human judgement. The tool should support the person.", "中文邏輯：先回答題目 → Technology today is smaller, faster and more connected, while older technology usually did one main job.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Technology today is smaller, faster and more connected, while older technology usually did one main job.", ""], ["Part 3", "朋友自學", "Do you think it is good for older adults to continue learning?", "Yes. Learning keeps the mind active and helps people adapt to new tools and changes. Learning does not end at graduation. This is because learning helps older adults stay independent and connected with change. For example, knowing how to use online banking or messaging can make daily life easier.", "中文邏輯：先回答題目 → Yes. Learning keeps the mind active and helps people adapt to new tools and changes.｜理由：Learning helps older adults stay independent and connected with change.｜例子：Knowing how to use online banking or messaging can make daily life easier.｜結果：Learning does not end at graduation.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Learning keeps the mind active and helps people adapt to new tools and changes.", ""], ["Part 3", "朋友自學", "Do you think enterprises should provide training for their employees?", "Yes, when the training helps employees do real work better. Useful training saves time and helps workers feel more confident. This is because training is useful when it connects directly with real work. For example, a short lesson on a new system can prevent repeated mistakes later.", "中文邏輯：先回答題目 → Yes, when the training helps employees do real work better.｜理由：Training is useful when it connects directly with real work.｜例子：A short lesson on a new system can prevent repeated mistakes later.｜結果：Useful training saves time and helps workers feel more confident.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, when the training helps employees do real work better.", ""], ["Part 3", "朋友自學", "Is it better to focus on a few subjects or to learn many subjects?", "A broad base is useful early, but deeper focus becomes more important later. A student needs enough time to understand important ideas instead of only preparing for tests. So balance matters more than the number of subjects. A broad range of subjects helps students discover interests, but too many can reduce depth.", "中文邏輯：先回答題目 → A broad base is useful early, but deeper focus becomes more important later.｜理由：A broad range of subjects helps students discover interests, but too many can reduce depth.｜例子：A student needs enough time to understand important ideas instead of only preparing for tests.｜結果：Balance matters more than the number of subjects.", "Part 3｜522/522 題目導向逐題校正", null, "A broad base is useful early, but deeper focus becomes more important later.", ""], ["Part 3", "朋友自學", "Do you think there are too many subjects for students to learn?", "Sometimes. Too many subjects can reduce time for deep learning and rest. A broad range of subjects helps students discover interests, but too many can reduce depth. In real life, a student needs enough time to understand important ideas instead of only preparing for tests. Balance matters more than the number of subjects.", "中文邏輯：先回答題目 → Sometimes. Too many subjects can reduce time for deep learning and rest.｜理由：A broad range of subjects helps students discover interests, but too many can reduce depth.｜例子：A student needs enough time to understand important ideas instead of only preparing for tests.｜結果：Balance matters more than the number of subjects.", "Part 3｜522/522 題目導向逐題校正", null, "Sometimes. Too many subjects can reduce time for deep learning and rest.", ""], ["Part 3", "朋友自學", "Should teachers make learning in their classes fun?", "Yes, as long as the activity still supports the learning goal. Enjoyment helps attention, but fun should support the lesson rather than replace it. You can see this in daily life. A simple game can make vocabulary practice easier to remember. Students learn more when they are active and still understand the goal.", "中文邏輯：先回答題目 → Yes, as long as the activity still supports the learning goal.｜理由：Enjoyment helps attention, but fun should support the lesson rather than replace it.｜例子：A simple game can make vocabulary practice easier to remember.｜結果：Students learn more when they are active and still understand the goal.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, as long as the activity still supports the learning goal.", ""], ["Part 3", "朋友自學", "Is it necessary to keep learning after graduating from school?", "Yes. Technology and jobs change, so one set of skills may not last a whole career. A worker may need a new digital skill years after school. That matters because learning should continue because jobs and technology keep changing. One set of skills may pular because they put many daily tasks on one device.｜例子：People can message, pay and find directions with a phone.｜結果：Convenience explains both the benefit and the dependence.", "Part 3｜522/522 題目導向逐題校正", null, "Some people find apps confusing, worry about privacy or simply prefer doing things directly.", ""], ["Part 3", "應用程式", "What are the differences between old and young people when using apps?", "Young people usually use more apps and learn new features faster, while older users may prefer simpler tools. People can message, pay and find directions with a phone. That matters because apps are popular because they put many daily tasks on one device. Convenience explains both the benefit and the dependence.", "中文邏輯：先回答題目 → Young people usually use more apps and learn new features faster, while older users may prefer simpler tools.｜理由：Apps are popular because they put many daily tasks on one device.｜例子：People can message, pay and find directions with a phone.｜結果：Convenience explains both the benefit and the dependence.", "Part 3｜522/522 題目導向逐題校正", null, "Young people usually use more apps and learn new features faster, while older users may prefer simpler tools.", ""], ["Part 3", "應用程式", "What do you think about some countries banning children from using social media?", "Age limits can protect children, but rules also need education because children can find ways around bans. Social media is useful for staying in touch, but it can make communication shallow if people rely on it too much. In real life, a short message is easy, but difficult topics are usually better in person. Online contact works best as a support, not a full replacement.", "中文邏輯：先回答題目 → Age limits can protect children, but rules also need education because children can find ways around bans.｜理由：Social media is useful for staying in touch, but it can make communication shallow if people rely on it too much.｜例子：A short message is easy, but difficult topics are usually better in person.｜結果：Online contact works best as a support, not a full replacement.", "Part 3｜522/522 題目導向逐題校正", null, "Age limits can protect children, but rules also need education because children can find ways around bans.", ""], ["Part 3", "喜歡的建築", "Do you think all old buildings should be demolished?", "No. Old buildings with history or useful design should be protected when possible. Old buildings can carry history and local identity. Preservation makes sense when the building still has value and can be safe. For instance, an old station can show how a city used to look and work.", "中文邏輯：先回答題目 → No. Old buildings with history or useful design should be protected when possible.｜理由：Old buildings can carry history and local identity.｜例子：An old station can show how a city used to look and work.｜結果：Preservation makes sense when the building still has value and can be safe.", "Part 3｜522/522 題目導向逐題校正", null, "No. Old buildings with history or useful design should be protected when possible.", ""], ["Part 3", "喜歡的建築", "Do you think old buildings are valuable?", "Yes. They can carry history, culture and a sense of local identity. Preservation makes sense when the building still has value and can be safe. For example, an old station can show how a city used to look and work.", "中文邏輯：先回答題目 → Yes. They can carry history, culture and a sense of local identity.｜理由：Old buildings can carry history and local identity.｜例子：An old station can show how a city used to look and work.｜結果：Preservation makes sense when the building still has value and can be safe.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. They can carry history, culture and a sense of local identity.", ""], ["Part 3", "喜歡或不喜歡的高聳建築", "Why are different places laid out and designed differently?", "Climate, land, culture and local needs all affect how places are designed. AI can save time and explain ideas, but it can also give confident wrong answers. AI is strongest as a helper, not a replacement for thinking. For instance, users still need to check important information.", "中文邏輯：先回答題目 → Climate, land, culture and local needs all affect how places are designed.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "Climate, land, culture and local needs all affect how places are designed.", ""], ["Part 3", "喜歡或不喜歡的高聳建築", "What are the differences between those tall buildings in your country?", "Tall buildings differ in age, use, design and safety features. One building can hold many homes or offices close to transport. So they are useful in dense areas, but design and safety still matter. Tall buildings use limited city land efficiently.", "中文邏輯：先回答題目 → Tall buildings differ in age, use, design and safety features.｜理由：Tall buildings use limited city land efficiently.｜例子：One building can hold many homes or offices close to transport.｜結果：They are useful in dense areas, but design and safety still matter.", "Part 3｜522/522 題目導向逐題校正", null, "Tall buildings differ in age, use, design and safety features.", ""], ["Part 3", "喜歡或不喜歡的高聳建築", "Are there many tall buildings in your country?", "Yes, especially in major Taiwanese cities where land is limited. One reason is that tall buildings use limited city land efficiently. A simple example is one building can hold many homes or offices close to transport. They are useful in dense areas, but design and safety still matter.", "中文邏輯：先回答題目 → Yes, especially in major Taiwanese cities where land is limited.｜理由：Tall buildings use limited city land efficiently.｜例子：One building can hold many homes or offices close to transport.｜結果：They are useful in dense areas, but design and safety still matter.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, especially in major Taiwanese cities where land is limited.", ""], ["Part 3", "喜歡或不喜歡的高聳建築", "What kind of interior design style do most people like?", "Many people prefer simple, bright and practical interiors. Good storage and natural light often matter more than expensive decoration. Comfort and function usually come first.", "中文邏輯：先回答題目 → Many people prefer simple, bright and practical interiors.｜理由：Many people prefer simple, bright and practical interiors because they are easy to live in.｜例子：Good storage and natural light often matter more than expensive decoration.｜結果：Comfort and function usually come first.", "Part 3｜522/522 題目導向逐題校正", null, "Many people prefer simple, bright and practical interiors.", ""], ["Part 3", "喜歡或不喜歡的高聳建築", "Why do some people like to remodel and decorate their homes themselves?", "Some people enjoy control, save money and want the home to feel more personal. Homes reflect different needs for space, convenience and cost. For example, a city apartment may be small but close to work, while a rural home offers more room. Lifestyle decides which trade-off feels better.", "中文邏輯：先回答題目 → Some people enjoy control, save money and want the home to feel more personal.｜理由：Homes reflect different needs for space, convenience and cost.｜例子：A city apartment may be small but close to work, while a rural home offers more room.｜結果：Lifestyle decides which trade-off feels better.", "Part 3｜522/522 題目導向逐題校正", null, "Some people enjoy control, save money and want the home to feel more personal.", ""], ["Part 3", "喜歡或不喜歡的高聳建築", "What are the advantages of living in tall buildings?", "Tall buildings can offer views, security and convenient use of limited city land. For example, one building can hold many homes or offices close to transport. They are useful in dense areas, but design and safety still matter.", "中文邏輯：先回答題目 → Tall buildings can offer views, security and convenient use of limited city land.｜理由：Tall buildings use limited city land efficiently.｜例子：One building can hold many homes or offices close to transport.｜結果：They are useful in dense areas, but design and safety still matter.", "Part 3｜522/522 題目導向逐題校正", null, "Tall buildings can offer views, security and convenient use of limited city land.", ""], ["Part 3", "有趣的建築", "Why do people like to visit historical sites?", "People visit historical sites because real places make the past easier to imagine. Real places help people imagine the past more clearly. In real life, standing in an old building gives a sense of size and space that a photo cannot fully show. Physical experience makes history more direct.", "中文邏輯：先回答題目 → People visit historical sites because real places make the past easier to imagine.｜理由：Real places help people imagine the past more clearly.｜例子：Standing in an old building gives a sense of size and space that a photo cannot fully show.｜結果：Physical experience makes history more direct.", "Part 3｜522/522 題目導向逐題校正", null, "People visit historical sites because real places make the past easier to imagine.", ""], ["Part 3", "有趣的建築", "Is it more important for a building to look good on the outside or on the inside?", "The inside is more important for daily use, although the outside still affects the city around it. People use the inside every day, so comfort, safety and function should come first. The outside matters, but function affects daily life more. For instance, a beautiful building is still difficult to use if the rooms are badly planned.", "中文邏輯：先回答題目 → The inside is more important for daily use, although the outside still affects the city around it.｜理由：People use the inside every day, so comfort, safety and function should come first.｜例子：A beautiful building is still difficult to use if the rooms are badly planned.｜結果：The outside matters, but function affects daily life more.", "Part 3｜522/522 題目導向逐題校正", null, "The inside is more important for daily use, although the outside still affects the city around it.", ""], ["Part 3", "有趣的建築", "Is it worth spending a lot of money on the exterior appearance of a building?", "Only when the design has a clear public or cultural value. Function should come first. Appearance matters for public identity, but spending should not reduce safety or function. One clear example is a beautiful station is useful only if people can move through it easily. Design should serve people first.", "中文邏輯：先回答題目 → Only when the design has a clear public or cultural value. Function should come first.｜理由：Appearance matters for public identity, but spending should not reduce safety or function.｜例子：A beautiful station is useful only if people can move through it easily.｜結果：Design should serve people first.", "Part 3｜522/522 題目導向逐題校正", null, "Only when the design has a clear public or cultural value. Function should come first.", ""], ["Part 3", "有趣的建築", "What types of buildings are popular in your country?", "Modern apartments and mixed-use buildings are common in Taiwanese cities. A friendly student who includes others may become popular without trying to show off. So being liked is not the same as being respected. Popularity often comes from visibility, confidence and connection with other people.", "中文邏輯：先回答題目 → Modern apartments and mixed-use buildings are common in Taiwanese cities.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Modern apartments and mixed-use buildings are common in Taiwanese cities.", ""], ["Part 3", "有趣的建築", "Is it better to live in a new building or an old one?", "A new building is usually easier for safety and maintenance, but old buildings can have more character. A simple example is the better choice depends on the building’s condition and the person’s needs. Age alone does not decide quality.", "中文邏輯：先回答題目 → A new building is usually easier for safety and maintenance, but old buildings can have more character.｜理由：New buildings are usually easier for safety and maintenance, while old buildings can have more character and history.｜例子：The better choice depends on the building’s condition and the person’s needs.｜結果：Age alone does not decide quality.", "Part 3｜522/522 題目導向逐題校正", null, "A new building is usually easier for safety and maintenance, but old buildings can have more character.", ""], ["Part 3", "有趣的建築", "Do you think it’s reasonable to charge an entry fee for visiting interesting building?", "A small fee is reasonable if the money supports maintenance and the price is affordable. Historic or special buildings cost money to protect. Public access should still be considered.", "中文邏輯：先回答題目 → A small fee is reasonable if the money supports maintenance and the price is affordable.｜理由：A small fee can be reasonable if it pays for maintenance and stays affordable.｜例子：Historic or special buildings cost money to protect.｜結果：Public access should still be considered.", "Part 3｜522/522 題目導向逐題校正", null, "A small fee is reasonable if the money supports maintenance and the price is affordable.", ""], ["Part 3", "花費超過預期的物品", "Do people buy things they don’t need?", "Yes. Sales, advertising and impulse can make people buy more than they planned. A large discount can make an item feel like a good deal even when it was not needed. That matters because buying is easy when people see sales and ads all day. Waiting before buying can reduce impulse shopping.", "中文邏輯：先回答題目 → Yes. Sales, advertising and impulse can make people buy more than they planned.｜理由：Buying is easy when people see sales and ads all day.｜例子：A large discount can make an item feel like a good deal even when it was not needed.｜結果：Waiting before buying can reduce impulse shopping.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Sales, advertising and impulse can make people buy more than they planned.", ""], ["Part 3", "花費超過預期的物品", "Do you think it is important to save money?", "Yes. Savings give people more safety and more choices when something unexpected happens. For example, an emergency fund can cover a broken phone or medical cost without debt. Financial safety reduces stress.", "中文邏輯：先回答題目 → Yes. Savings give people more safety and more choices when something unexpected happens.｜理由：Savings give people more choices when something unexpected happens.｜例子：An emergency fund can cover a broken phone or medical cost without debt.｜結果：Financial safety reduces stress.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Savings give people more safety and more choices when something unexpected happens.", ""], ["Part 3", "花費超過預期的物品", "What do you think young people spend most of their money on?", "Young people often spend on food, transport, entertainment, technology and travel. Online shopping also makes small spending easier. The pattern changes with income and lifestyle.", "中文邏輯：先回答題目 → Young people often spend on food, transport, entertainment, technology and travel.｜理由：Young people often spend on food, transport, entertainment, technology and travel.｜例子：Online shopping also makes small spending easier.｜結果：The pattern changes with income and lifestyle.", "Part 3｜522/522 題目導向逐題校正", null, "Young people often spend on food, transport, entertainment, technology and travel.", ""], ["Part 3", "花費超過預期的物品", "Do you often buy more than you expected?", "Sometimes, especially online, but a list helps me avoid buying too much. It can happen when people shop without a clear list or see discounts. Setting a budget helps control impulse buying. For instance, a sale can make an extra item feel harmless even when it was not planned.", "中文邏輯：先回答題目 → Sometimes, especially online, but a list helps me avoid buying too much.｜理由：It can happen when people shop without a clear list or see discounts.｜例子：A sale can make an extra item feel harmless even when it was not planned.｜結果：Setting a budget helps control impulse buying.", "Part 3｜522/522 題目導向逐題校正", null, "Sometimes, especially online, but a list helps me avoid buying too much.", ""], ["Part 3", "花費超過預期的物品", "What kind of things are people happy to pay a high price for?", "People pay more for things they use often, trust strongly or care about personally. Price makes sense when it brings repeated value. This is because people pay more when quality, safety or long-term use matters. For example, a laptop used every day may justify a higher price than a trendy item used once.", "中文邏輯：先回答題目 → People pay more for things they use often, trust strongly or care about personally.｜理由：People pay more when quality, safety or long-term use matters.｜例子：A laptop used every day may justify a higher price than a trendy item used once.｜結果：Price makes sense when it brings repeated value.", "Part 3｜522/522 題目導向逐題校正", null, "People pay more for things they use often, trust strongly or care about personally.", ""], ["Part 3", "花費超過預期的物品", "Do you think it is the rich people’s responsibility to donate money to people in need?", "They can help a lot, but charity should not be treated as the only duty of wealthy people. Wealthy people can make a large difference, but society should not depend only on private charity. You can see this in daily life. Taxes and public systems are also needed to support people fairly. Donation is valuable, but it should not replace public responsibility.", "中文邏輯：先回答題目 → They can help a lot, but charity should not be treated as the only duty of wealthy people.｜理由：Wealthy people can make a large difference, but society should not depend only on private charity.｜例子：Taxes and public systems are also needed to support people fairly.｜結果：Donation is valuable, but it should not replace public responsibility.", "Part 3｜522/522 題目導向逐題校正", null, "They can help a lot, but charity should not be treated as the only duty of wealthy people.", ""], ["Part 3", "對家庭重要的東西", "Why do people visit museums?", "People visit museums to see real objects, learn history or art, and enjoy a cultural experience. Museums make learning physical and visual. In real life, seeing a real object can make history or art feel more real than a photo on a phone. Direct experience can improve memory.", "中文邏輯：先回答題目 → People visit museums to see real objects, learn history or art, and enjoy a cultural experience.｜理由：Museums make learning physical and visual.｜例子：Seeing a real object can make history or art feel more real than a photo on a phone.｜結果：Direct experience can improve memory.", "Part 3｜522/522 題目導向逐題校正", null, "People visit museums to see real objects, learn history or art, and enjoy a cultural experience.", ""], ["Part 3", "對家庭重要的東西", "What are the benefits of technology for learning history?", "Technology can make history more visual through videos, maps and virtual tours. The reason is that technology is useful when it saves time or removes distance without taking away human judgement. A map app can suggest a route, but the user still chooses what works best. The tool should support the person.", "中文邏輯：先回答題目 → Technology can make history more visual through videos, maps and virtual tours.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Technology can make history more visual through videos, maps and virtual tours.", ""], ["Part 3", "對家庭重要的東西", "What’s the influence of technology on museums?", "Technology can make museums more interactive and give visitors more information. Technology is useful when it saves time or removes distance without taking away human judgement. For example, a map app can suggest a route, but the user still chooses what works best. The tool should support the person.", "中文邏輯：先回答題目 → Technology can make museums more interactive and give visitors more information.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Technology can make museums more interactive and give visitors more information.", ""], ["Part 3", "對家庭重要的東西", "What kinds of things are kept in museums?", "Museums keep art, old tools, documents, clothes and other objects with cultural or historical value. Museums make learning physical and visual. In real life, seeing a real object can make history or art feel more real than a photo on a phone. Direct experience can improve memory.", "中文邏輯：先回答題目 → Museums keep art, old tools, documents, clothes and other objects with cultural or historical value.｜理由：Museums make learning physical and visual.｜例子：Seeing a real object can make history or art feel more real than a photo on a phone.｜結果：Direct experience can improve memory.", "Part 3｜522/522 題目導向逐題校正", null, "Museums keep art, old tools, documents, clothes and other objects with cultural or historical value.", ""], ["Part 3", "對家庭重要的東西", "What’s the difference between things valued by people in the past and today?", "People in the past often valued durability and practical use, while today convenience and technology matter more. For example, a modern phone replaces many separate tools that people once owned. What people value changes with daily life.", "中文邏輯：先回答題目 → People in the past often valued durability and practical use, while today convenience and technology matter more.｜理由：People in the past often valued durability and practical use, while today convenience and technology matter more.｜例子：A modern phone replaces many separate tools that people once owned.｜結果：What people value changes with daily life.", "Part 3｜522/522 題目導向逐題校正", null, "People in the past often valued durability and practical use, while today convenience and technology matter more.", ""], ["Part 3", "對家庭重要的東西", "What things do families keep for a long time?", "Families often keep photos, letters, jewellery and small gifts with strong memories. Families keep objects because memories can matter more than market value. One clear example is an old photo may be cheap but remind someone of a person they love. Emotional value grows over time.", "中文邏輯：先回答題目 → Families often keep photos, letters, jewellery and small gifts with strong memories.｜理由：Families keep objects because memories can matter more than market value.｜例子：An old photo may be cheap but remind someone of a person they love.｜結果：Emotional value grows over time.", "Part 3｜522/522 題目導向逐題校正", null, "Families often keep photos, letters, jewellery and small gifts with strong memories.", ""], ["Part 3", "公共場所弄丢物品", "What do people often feel after losing things?", "People usually feel stressed, frustrated or worried, especially if the item is important. Losing small important items creates stress because the practical effect can be large. For example, a lost phone can affect messages, photos and payment. Fixed habits can reduce the risk.", "中文邏輯：先回答題目 → People usually feel stressed, frustrated or worried, especially if the item is important.｜理由：Losing small important items creates stress because the practical effect can be large.｜例子：A lost phone can affect messages, photos and payment.｜結果：Fixed habits can reduce the risk.", "Part 3｜522/522 題目導向逐題校正", null, "People usually feel stressed, frustrated or worried, especially if the item is important.", ""], ["Part 3", "公共場所弄丢物品", "What can we do to reduce the possibility of losing things?", "Keeping important things in fixed places and checking before leaving can help a lot. Losing small important items creates stress because the practical effect can be large. One clear example is a lost phone can affect messages, photos and payment. Fixed habits can reduce the risk.", "中文邏輯：先回答題目 → Keeping important things in fixed places and checking before leaving can help a lot.｜理由：Losing small important items creates stress because the practical effect can be large.｜例子：A lost phone can affect messages, photos and payment.｜結果：Fixed habits can reduce the risk.", "Part 3｜522/522 題目導向逐題校正", null, "Keeping important things in fixed places and checking before leaving can help a lot.", ""], ["Part 3", "公共場所弄丢物品", "What kinds of people may lose things often?", "Busy, distracted or disorganized people may lose things more often. For example, someone rushing between places may leave a card or phone behind. Fixed habits can reduce the problem.", "中文邏輯：先回答題目 → Busy, distracted or disorganized people may lose things more often.｜理由：Busy or distracted people may lose things more often because they do not notice where they put them.｜例子：Someone rushing between places may leave a card or phone behind.｜結果：Fixed habits can reduce the problem.", "Part 3｜522/522 題目導向逐題校正", null, "Busy, distracted or disorganized people may lose things more often.", ""], ["Part 3", "公共場所弄丢物品", "Is it effective to offer rewards to find lost things?", "It can help when the item is valuable, but honest people may return it without a reward. Rewards can motivate a child for a short time, but too many can replace inner motivation. For example, praise for real effort helps children notice progress. Rewards work best when they are occasional.", "中文邏輯：先回答題目 → It can help when the item is valuable, but honest people may return it without a reward.｜理由：Rewards can motivate a child for a short time, but too many can replace inner motivation.｜例子：Praise for real effort helps children notice progress.｜結果：Rewards work best when they are occasional.", "Part 3｜522/522 題目導向逐題校正", null, "It can help when the item is valuable, but honest people may return it without a reward.", ""], ["Part 3", "公共場所弄丢物品", "What will people do when losing things?", "They usually search the last place, contact staff and use tracking tools if possible. Losing small important items creates stress because the practical effect can be large. In real life, a lost phone can affect messages, photos and payment. Fixed habits can reduce the risk.", "中文邏輯：先回答題目 → They usually search the last place, contact staff and use tracking tools if possible.｜理由：Losi ation dinner.｜結果：Atmosphere matters more than making the event expensive.", "Part 3｜522/522 題目導向逐題校正", null, "People usually hold parties for birthdays, weddings, graduation and other important moments.", ""], ["Part 3", "聽不感興趣的話", "How can we tell if a listener is listening carefully?", "Good listeners make eye contact, respond naturally and remember details. Listening affects both understanding and respect. One clear example is missing one important detail can cause a mistake and also make the speaker feel ignored. Good listening saves problems later.", "中文邏輯：先回答題目 → Good listeners make eye contact, respond naturally and remember details.｜理由：Listening affects both understanding and respect.｜例子：Missing one important detail can cause a mistake and also make the speaker feel ignored.｜結果：Good listening saves problems later.", "Part 3｜522/522 題目導向逐題校正", null, "Good listeners make eye contact, respond naturally and remember details.", ""], ["Part 3", "聽不感興趣的話", "What would happen if the listener didn’t listen carefully?", "They may miss important information and make the speaker feel ignored. Missing one important detail can cause a mistake and also make the speaker feel ignored. So good listening saves problems later. Listening affects both understanding and respect.", "中文邏輯：先回答題目 → They may miss important information and make the speaker feel ignored.｜理由：Listening affects both understanding and respect.｜例子：Missing one important detail can cause a mistake and also make the speaker feel ignored.｜結果：Good listening saves problems later.", "Part 3｜522/522 題目導向逐題校正", null, "They may miss important information and make the speaker feel ignored.", ""], ["Part 3", "聽不感興趣的話", "What kind of topics do young people like to talk about today?", "Young people often talk about work, relationships, entertainment, technology and future plans. These topics connect directly with daily life. Shared interests make conversation easier.", "中文邏輯：先回答題目 → Young people often talk about work, rela , the employer checks skills while the applicant learns about the role.", "中文邏輯：先回答題目 → Interviews help both sides see whether the person and the job fit each other.｜理由：Interviews help both sides see whether the person and the job fit each other.｜例子：The employer checks skills while the applicant learns about the role.｜結果：It is a two-way process.", "Part 3｜522/522 題目導向逐題校正", null, "Interviews help both sides see whether the person and the job fit each other.", ""], ["Part 3", "看過的名人採訪", "What should people do to prepare for a job interview?", "People should learn about the company, practise common questions and prepare real examples. Interviews help both sides judge fit, not only test the applicant. You can see this in daily life. A clear example from past experience is often more convincing than a general claim. Preparation makes answers more specific.", "中文邏輯：先回答題目 → People should learn about the company, practise common questions and prepare real examples.｜理由：Interviews help both sides judge fit, not only test the applicant.｜例子：A clear example from past experience is often more convincing than a general claim.｜結果：Preparation makes answers more specific.", "Part 3｜522/522 題目導向逐題校正", null, "People should learn about the company, practise common questions and prepare real examples.", ""], ["Part 3", "看過的名人採訪", "What can we do to get a job interview?", "A clear CV, relevant skills and a strong application can help. Interviews help both sides judge fit, not only test the applicant. In real life, a clear example from past experience is often more convincing than a general claim. Preparation makes answers more specific.", "中文邏輯：先回答題目 → A clear CV, relevant skills and a strong application can help.｜理由：Interviews help both sides judge fit, not only test the applicant.｜例子：A clear example from past experience is often more convincing than a general claim.｜結果：Preparation makes answers more specific.", "Part 3｜522/522 題目導向逐題校正", null, "A clear CV, relevant skills and a strong
