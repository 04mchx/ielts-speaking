, but it should be practical and gradual so people have real alternatives.｜理由：People will change transport more easily when cleaner options are convenient.｜例子：Asking people to stop driving without good buses or trains is unrealistic.｜結果：A gradual change gives people a real alternative.", "Part 3｜522/522 題目導向逐題校正", null, "Change is needed, but it should be practical and gradual so people have real alternatives.", ""], ["Part 3", "腳踏車/摩托車/汽車旅行", "Do you think air pollution comes mostly from mobile vehicles?", "Vehicles are an important source, but factories, power generation and other sources also matter. Users still need to check important information. That matters because aI can save time and explain ideas, but it can also give confident wrong answers. AI is strongest as a helper, not a replacement for thinking.", "中文邏輯：先回答題目 → Vehicles are an important source, but factories, power generation and other sources also matter.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "Vehicles are an important source, but factories, power generation and other sources also matter.", ""], ["Part 3", "腳踏車/摩托車/汽車旅行", "Which form of vehicle is more popular in your country, bikes, cars or motorcycles?", "Scooters are especially common in Taiwan, although cars are also widely used. Popularity often comes from visibility, confidence and connection with other people. You can see this in daily life. A friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Scooters are especially common in Taiwan, although cars are also widely used.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Scooters are especially common in Taiwan, although cars are also widely used.", ""], ["Part 3", "腳踏車/摩托車/汽車旅行", "What do you think of the future of electric cars?", "Electric cars will probably grow, but charging, battery cost and electricity sources still matter. A simple example is they reduce exhaust on the street, but they do not solve every transport problem. They are one part of a wider change.", "中文邏輯：先回答題目 → Electric cars will probably grow, but charging, battery cost and electricity sources still matter.｜理由：Electric cars will probably become more common, but charging, battery cost and electricity sources still matter.｜例子：They reduce exhaust on the street, but they do not solve every transport problem.｜結果：They are one part of a wider change.", "Part 3｜522/522 題目導向逐題校正", null, "Electric cars will probably grow, but charging, battery cost and electricity sources still matter.", ""], ["Part 3", "腳踏車/摩托車/汽車旅行", "Why do more people own and drive private cars now?", "Cars give comfort, privacy and flexibility, especially when public transport is limited. People drive private cars for comfort, privacy and flexibility. One clear example is cars are especially useful when public transport is weak or a family has children. Convenience explains the growth, but it also adds traffic.", "中文邏輯：先回答題目 → Cars give comfort, privacy and flexibility, especially when public transport is limited.｜理由：People drive private cars for comfort, privacy and flexibility.｜例子：Cars are especially useful when public transport is weak or a family has children.｜結果：Convenience explains the growth, but it also adds traffic.", "Part 3｜522/522 題目導向逐題校正", null, "Cars give comfort, privacy and flexibility, especially when public transport is limited.", ""], ["Part 3", "組織快樂活動", "Do you prefer to prepare and organize an activity or just take part in an activity?", "I prefer taking part unless I know the event well, because organizing needs more attention and responsibility. Good organization makes responsibilities and next steps clear. Preparation reduces stress. For instance, a simple checklist can prevent last-minute mistakes.", "中文邏輯：先回答題目 → I prefer taking part unless I know the event well, because organizing needs more attention and responsibility.｜理由：Good organization makes responsibilities and next steps clear.｜例子：A simple checklist can prevent last-minute mistakes.｜結果：Preparation reduces stress.", "Part 3｜522/522 題目導向逐題校正", null, "I prefer taking part unless I know the event well, because organizing needs more attention and responsibility.", ""], ["Part 3", "組織快樂活動", "How would you feel when you were not well prepared for something?", "I would feel nervous because I would not know whether I had missed something important. Poor preparation usually makes people nervous because they are unsure what they forgot. For example, before an exam or trip, even one missing document can create stress. A short checklist can reduce that feeling.", "中文邏輯：先回答題目 → I would feel nervous because I would not know whether I had missed something important.｜理由：Poor preparation usually makes people nervous because they are unsure what they forgot.｜例子：Before an exam or trip, even one missing document can create stress.｜結果：A short checklist can reduce that feeling.", "Part 3｜522/522 題目導向逐題校正", null, "I would feel nervous because I would not know whether I had missed something important.", ""], ["Part 3", "組織快樂活動", "Do people need others’ help when organizing things?", "Yes, especially for large events because one person cannot manage every detail well. Large activities are easier when people share the work. You can see this in daily life. One person can handle the place while another manages food or communication. Clear roles reduce pressure.", "中文邏輯：先回答題目 → Yes, especially for large events because one person cannot manage every detail well.｜理由：Large activities are easier when people share the work.｜例子：One person can handle the place while another manages food or communication.｜結果：Clear roles reduce pressure.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, especially for large events because one person cannot manage every detail well.", ""], ["Part 3", "組織快樂活動", "Does everything need to be well prepared?", "No. Important parts need preparation, but small details can stay flexible. Overplanning every minute can create more stress than it removes. Preparation should protect the main goal.", "中文邏輯：先回答題目 → No. Important parts need preparation, but small details can stay flexible.｜理由：No. Important parts need preparation, but small details can stay flexible.｜例子：Overplanning every minute can create more stress than it removes.｜結果：Preparation should protect the main goal.", "Part 3｜522/522 題目導向逐題校正", null, "No. Important parts need preparation, but small details can stay flexible.", ""], ["Part 3", "組織快樂活動", "On what occasions do people need to be organized?", "Travel, exams, events, work projects and moving house all need organization. The reason is that organization saves time because people know what to do and where things are. A short task list can stop someone from forgetting an important step. Simple systems reduce stress.", "中文邏輯：先回答題目 → Travel, exams, events, work projects and moving house all need organization.｜理由：Organization saves time because people know what to do and where things are.｜例子：A short task list can stop someone from forgetting an important step.｜結果：Simple systems reduce stress.", "Part 3｜522/522 題目導向逐題校正", null, "Travel, exams, events, work projects and moving house all need organization.", ""], ["Part 3", "組織快樂活動", "How can parents help children to be organized?", "Parents can give children simple routines and let them manage small responsibilities themselves. Organization saves time because people know what to do and where things are. One clear example is a short task list can stop someone from forgetting an important step. Simple systems reduce stress.", "中文邏輯：先回答題目 → Parents can give children simple routines and let them manage small responsibilities themselves.｜理由：Organization saves time because people know what to do and where things are.｜例子：A short task list can stop someone from forgetting an important step.｜結果：Simple systems reduce stress.", "Part 3｜522/522 題目導向逐題校正", null, "Parents can give children simple routines and let them manage small responsibilities themselves.", ""], ["Part 3", "微笑的場合", "Do people smile more when they are younger or older?", "Children may smile more freely, while adults often control their expressions more in public. The reason is that children usually show feelings more directly, while adults learn more social control. A child may smile immediately when excited, while an adult may hide the same feeling in a formal setting. Age changes how openly people show emotion.", "中文邏輯：先回答題目 → Children may smile more freely, while adults often control their expressions more in public.｜理由：Children usually show feelings more directly, while adults learn more social control.｜例子：A child may smile immediately when excited, while an adult may hide the same feeling in a formal setting.｜結果：Age changes how openly people show emotion.", "Part 3｜522/522 題目導向逐題校正", null, "Children may smile more freely, while adults often control their expressions more in public.", ""], ["Part 3", "微笑的場合", "Do women smile more than men?", "Sometimes social expectations affect this, but personality matters more than gender. Sometimes social expectations may encourage women to smile more in public. In real life, however, personality matters much more than gender. It is risky to treat this as a fixed rule.", "中文邏輯：先回答題目 → Sometimes social expectations affect this, but personality matters more than gender.｜理由：Sometimes social expectations may encourage women to smile more in public.｜例子：However, personality matters much more than gender.｜結果：It is risky to treat this as a fixed rule.", "Part 3｜522/522 題目導向逐題校正", null, "Sometimes social expectations affect this, but personality matters more than gender.", ""], ["Part 3", "微笑的場合", "Why do most people smile in photographs?", "People smile because they want the photo to show a happy and friendly moment. The reason is that photos are useful because they keep memories, but taking too many can reduce attention. A traveller may remember the camera screen more than the place itself. A few meaningful photos are often enough.", "中文邏輯：先回答題目 → People smile because they want the photo to show a happy and friendly moment.｜理由：Photos are useful because they keep memories, but taking too many can reduce attention.｜例子：A traveller may remember the camera screen more than the place itself.｜結果：A few meaningful photos are often enough.", "Part 3｜522/522 題目導向逐題校正", null, "People smile because they want the photo to show a happy and friendly moment.", ""], ["Part 3", "微笑的場合", "Do you think people who like to smile are more friendly?", "They may look friendlier, but a smile alone cannot tell us a person’s character. A smile can make someone look open and easy to approach. Friendliness is clearer through long-term behaviour. For instance, however, people also smile out of politeness or habit.", "中文邏輯：先回答題目 → They may look friendlier, but a smile alone cannot tell us a person’s character.｜理由：A smile can make someone look open and easy to approach.｜例子：However, people also smile out of politeness or habit.｜結果：Friendliness is clearer through long-term behaviour.", "Part 3｜522/522 題目導向逐題校正", null, "They may look friendlier, but a smile alone cannot tell us a person’s character.", ""], ["Part 3", "微笑的場合", "Are there any occasions when people need to pretend to smile?", "People sometimes smile politely at work or during formal social situations. A simple example is the smile helps keep the interaction smooth even when the feeling is not strong. Social manners and real emotion are not always the same.", "中文邏輯：先回答題目 → People sometimes smile politely at work or during formal social situations.｜理由：People sometimes smile politely at work, in customer service or during formal social situations.｜例子：The smile helps keep the interaction smooth even when the feeling is not strong.｜結果：Social manners and real emotion are not always the same.", "Part 3｜522/522 題目導向逐題校正", null, "People sometimes smile politely at work or during formal social situations.", ""], ["Part 3", "微笑的場合", "Is smiling important in your culture?", "Yes. A smile is a simple way to show friendliness and reduce social distance. One reason is that smiling is a small signal that can make a social situation feel warmer. A simple example is people often smile in photos or greetings because they want to show friendliness. The expression helps, but behaviour matters more.", "中文邏輯：先回答題目 → Yes. A smile is a simple way to show friendliness and reduce social distance.｜理由：Smiling is a small signal that can make a social situation feel warmer.｜例子：People often smile in photos or greetings because they want to show friendliness.｜結果：The expression helps, but behaviour matters more.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. A smile is a simple way to show friendliness and reduce social distance.", ""], ["Part 3", "鼓勵別人做他不願意做的事", "Do you think some people are better than others at persuading?", "Yes. Good persuaders understand the other person’s needs and explain benefits clearly. Persuasion depends on understanding the other person, not only speaking well. For example, someone who knows what the listener cares about can choose a better reason. Good persuasion feels relevant rather than forceful.", "中文邏輯：先回答題目 → Yes. Good persuaders understand the other person’s needs and explain benefits clearly.｜理由：Persuasion depends on understanding the other person, not only speaking well.｜例子：Someone who knows what the listener cares about can choose a better reason.｜結果：Good persuasion feels relevant rather than forceful.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Good persuaders understand the other person’s needs and explain benefits clearly.", ""], ["Part 3", "鼓勵別人做他不願意做的事", "What kind of encouragement should parents give?", "Parents should notice effort, give clear support and avoid comparing children with others. Encouragement works better when people understand the reason and feel respected. One clear example is clear feedback and recognition make effort feel meaningful. Pressure without explanation often creates resistance.", "中文邏輯：先回答題目 → Parents should notice effort, give clear support and avoid comparing children with others.｜理由：Encouragement works better when people understand the reason and feel respected.｜例子：Clear feedback and recognition make effort feel meaningful.｜結果：Pressure without explanation often creates resistance.", "Part 3｜522/522 題目導向逐題校正", null, "Parents should notice effort, give clear support and avoid comparing children with others.", ""], ["Part 3", "鼓勵別人做他不願意做的事", "When should parents encourage their children?", "Parents should encourage children when they are trying, afraid of failure or facing something new. Encouragement works better when people understand the reason and feel respected. One clear example is clear feedback and recognition make effort feel meaningful. Pressure without explanation often creates resistance.", "中文邏輯：先回答題目 → Parents should encourage children when they are trying, afraid of failure or facing something new.｜理由：Encouragement works better when people understand the reason and feel respected.｜例子：Clear feedback and recognition make effort feel meaningful.｜結果：Pressure without explanation often creates resistance.", "Part 3｜522/522 題目導向逐題校正", null, "Parents should encourage children when they are trying, afraid of failure or facing something new.", ""], ["Part 3", "鼓勵別人做他不願意做的事", "How can leaders encourage their employees?", "Leaders can give clear goals, useful feedback and real recognition for good work. Clear feedback and real recognition are stronger than empty praise. That matters because people are more motivated when they know the goal and feel their effort is noticed. Respect makes encouragement more believable.", "中文邏輯：先回答題目 → Leaders can give clear goals, useful feedback and real recognition for good work.｜理由：People are more motivated when they know the goal and feel their effort is noticed.｜例子：Clear feedback and real recognition are stronger than empty praise.｜結果：Respect makes encouragement more believable.", "Part 3｜522/522 題目導向逐題校正", null, "Leaders can give clear goals, useful feedback and real recognition for good work.", ""], ["Part 3", "鼓勵別人做他不願意做的事", "How can employers encourage their staff?", "Fair pay, useful feedback and chances to grow are stronger than empty praise. Clear feedback and recognition make effort feel meaningful. So pressure without explanation often creates resistance. Encouragement works better when people understand the reason and feel respected.", "中文邏輯：先回答題目 → Fair pay, useful feedback and chances to grow are stronger than empty praise.｜理由：Encouragement works better when people understand the reason and feel respected.｜例子：Clear feedback and recognition make effort feel meaningful.｜結果：Pressure without explanation often creates resistance.", "Part 3｜522/522 題目導向逐題校正", null, "Fair pay, useful feedback and chances to grow are stronger than empty praise.", ""], ["Part 3", "鼓勵別人做他不願意做的事", "Should children do everything their parents ask them to do?", "No. Children need rules, but they also need to learn how to think and make choices. For example, blind obedience does not build judgement. Good parenting explains reasons.", "中文邏輯：先回答題目 → No. Children need rules, but they also need to learn how to think and make choices.｜理由：No. Children need rules, but they also need to learn how to think and make age-appropriate choices.｜例子：Blind obedience does not build judgement.｜結果：Good parenting explains reasons.", "Part 3｜522/522 題目導向逐題校正", null, "No. Children need rules, but they also need to learn how to think and make choices.", ""], ["Part 3", "發揮想像力", "How important is imagination to children?", "Imagination is very important because it helps children create, solve problems and see different possibilities. Imagination helps people see options that are not obvious yet. Creativity supports problem-solving. For instance, a child building with blocks or a scientist testing a new idea both use this skill.", "中文邏輯：先回答題目 → Imagination is very important because it helps children create, solve problems and see different possibilities.｜理由：Imagination helps people see options that are not obvious yet.｜例子：A child building with blocks or a scientist testing a new idea both use this skill.｜結果：Creativity supports problem-solving.", "Part 3｜522/522 題目導向逐題校正", null, "Imagination is very important because it helps children create, solve problems and see different possibilities.", ""], ["Part 3", "發揮想像力", "What games help develop children's imagination?", "Building blocks, role-play and open-ended drawing are good for imagination. A child building with blocks or a scientist testing a new idea both use this skill. So creativity supports problem-solving. Imagination helps people see options that are not obvious yet.", "中文邏輯：先回答題目 → Building blocks, role-play and open-ended drawing are good for imagination.｜理由：Imagination helps people see options that are not obvious yet.｜例子：A child building with blocks or a scientist testing a new idea both use this skill.｜結果：Creativity supports problem-solving.", "Part 3｜522/522 題目導向逐題校正", null, "Building blocks, role-play and open-ended drawing are good for imagination.", ""], ["Part 3", "發揮想像力", "What subjects are helpful for children's imagination?", "Art, writing, science projects and drama can all develop imagination in different ways. Imagination helps people see options that are not obvious yet. For example, a child building with blocks or a scientist testing a new idea both use this skill. Creativity supports problem-solving.", "中文邏輯：先回答題目 → Art, writing, science projects and drama can all develop imagination in different ways.｜理由：Imagination helps people see options that are not obvious yet.｜例子：A child building with blocks or a scientist testing a new idea both use this skill.｜結果：Creativity supports problem-solving.", "Part 3｜522/522 題目導向逐題校正", null, "Art, writing, science projects and drama can all develop imagination in different ways.", ""], ["Part 3", "發揮想像力", "What kinds of jobs need imagination?", "Design, engineering, writing, advertising, research and many other jobs need imagination. A child building with blocks or a scientist testing a new idea both use this skill. So creativity supports problem-solving. Imagination helps people see options that are not obvious yet.", "中文邏輯：先回答題目 → Design, engineering, writing, advertising, research and many other jobs need imagination.｜理由：Imagination helps people see options that are not obvious yet.｜例子：A child building with blocks or a scientist testing a new idea both use this skill.｜結果：Creativity supports problem-solving.", "Part 3｜522/522 題目導向逐題校正", null, "Design, engineering, writing, advertising, research and many other jobs need imagination.", ""], ["Part 3", "發揮想像力", "Do you think imagination is essential for scientists?", "Yes. Scientists need imagination to ask new questions and think of possible explanations. Science needs facts, but new research often begins with a question no one has answered yet. Creativity and evidence work together. For instance, a scientist has to imagine a possible explanation before testing it.", "中文邏輯：先回答題目 → Yes. Scientists need imagination to ask new questions and think of possible explanations.｜理由：Science needs facts, but new research often begins with a question no one has answered yet.｜例子：A scientist has to imagine a possible explanation before testing it.｜結果：Creativity and evidence work together.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Scientists need imagination to ask new questions and think of possible explanations.", ""], ["Part 3", "發揮想像力", "Do you think adults can have lots of imagination?", "Yes. Adults use imagination in work, problem-solving, planning and creative hobbies. Imagination helps people see options that are not obvious yet. You can see this in daily life. A child building with blocks or a scientist testing a new idea both use this skill. Creativity supports problem-solving.", "中文邏輯：先回答題目 → Yes. Adults use imagination in work, problem-solving, planning and creative hobbies.｜理由：Imagination helps people see options that are not obvious yet.｜例子：A child building with blocks or a scientist testing a new idea both use this skill.｜結果：Creativity supports problem-solving.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Adults use imagination in work, problem-solving, planning and creative hobbies.", ""], ["Part 3", "禁用手機的場合", "Do you think it is necessary to have laws on the use of mobile phones?", "Some rules are useful for driving, exams and other situations where phones create danger or unfairness. Good phone use depends on timing. This is because phones are useful because they connect people and services, but they also compete for attention. For example, checking messages during a conversation can make the other person feel ignored.", "中文邏輯：先回答題目 → Some rules are useful for driving, exams and other situations where phones create danger or unfairness.｜理由：Phones are useful because they connect people and services, but they also compete for attention.｜例子：Checking messages during a conversation can make the other person feel ignored.｜結果：Good phone use depends on timing.", "Part 3｜522/522 題目導向逐題校正", null, "Some rules are useful for driving, exams and other situations where phones create danger or unfairness.", ""], ["Part 3", "禁用手機的場合", "Is it a waste of time to take pictures with mobile phones?", "No. Photos can keep memories, but taking too many can become a distraction. Once people clearly know an activity has no value, changing course is usually better than continuing automatically. One clear example is endless scrolling is a common example because people can continue without choosing to. Awareness should lead to a different action.", "中文邏輯：先回答題目 → No. Photos can keep memories, but taking too many can become a distraction.｜理由：Once people clearly know an activity has no value, changing course is usually better than continuing automatically.｜例子：Endless scrolling is a common example because people can continue without choosing to.｜結果：Awareness should lead to a different action.", "Part 3｜522/522 題目導向逐題校正", null, "No. Photos can keep memories, but taking too many can become a distraction.", ""], ["Part 3", "禁用手機的場合", "What positive and negative impact do mobile phones have on friendship?", "Phones make contact easy, but they can also reduce real attention during face-to-face time. Phones are useful because they connect people and services, but they also compete for attention. Good phone use depends on timing. For instance, checking messages during a conversation can make the other person feel ignored.", "中文邏輯：先回答題目 → Phones make contact easy, but they can also reduce real attention during face-to-face time.｜理由：Phones are useful because they connect people and services, but they also compete for attention.｜例子：Checking messages during a conversation can make the other person feel ignored.｜結果：Good phone use depends on timing.", "Part 3｜522/522 題目導向逐題校正", null, "Phones make contact easy, but they can also reduce real attention during face-to-face time.", ""], ["Part 3", "禁用手機的場合", "How do young and old people use mobile phones differently?", "Young people often use more social and entertainment apps, while older people may focus on calls and practical tools. One reason is that phones are useful because they connect people and services, but they also compete for attention. A simple example is checking messages during a conversation can make the other person feel ignored. Good phone use depends on timing.", "中文邏輯：先回答題目 → Young people often use more social and entertainment apps, while older people may focus on calls and practical tools.｜理由：Phones are useful because they connect people and services, but they also compete for attention.｜例子：Checking messages during a conversation can make the other person feel ignored.｜結果：Good phone use depends on timing.", "Part 3｜522/522 題目導向逐題校正", null, "Young people often use more social and entertainment apps, while older people may focus on calls and practical tools.", ""], ["Part 3", "禁用手機的場合", "What are examples of good and poor phone manners?", "Good manners mean keeping the phone quiet and giving people attention. Poor manners include loud videos or checking messages constantly. The reason is that good phone manners mean giving people attention and controlling noise. Putting the phone away during a conversation is respectful, while playing loud videos in public is not. The same device can be polite or rude depending on timing.", "中文邏輯：先回答題目 → Good manners mean keeping the phone quiet and giving people attention. Poor manners include loud videos or checking messages constantly.｜理由：Good phone manners mean giving people attention and controlling noise.｜例子：Putting the phone away during a conversation is respectful, while playing loud videos in public is not.｜結果：The same device can be polite or rude depending on timing.", "Part 3｜522/522 題目導向逐題校正", null, "Good manners mean keeping the phone quiet and giving people attention. Poor manners include loud videos or checking messages constantly.", ""], ["Part 3", "禁用手機的場合", "How does the internet benefit people?", "The internet gives fast access to information, communication, services and learning. People can study, pay bills or talk to family from almost anywhere. The main benefit is access, although users still need to judge information carefully.", "中文邏輯：先回答題目 → The internet gives fast access to information, communication, services and learning.｜理由：The internet gives fast access to information, communication, services and learning.｜例子：People can study, pay bills or talk to family from almost anywhere.｜結果：The main benefit is access, although users still need to judge information carefully.", "Part 3｜522/522 題目導向逐題校正", null, "The internet gives fast access to information, communication, services and learning.", ""], ["Part 3", "為家人感到驕傲", "What do you think about children working hard just for grades?", "Grades can motivate effort, but learning only for scores can create stress and shallow learning. For example, a student may memorise information and forget it immediately after the exam. Understanding should matter too.", "中文邏輯：先回答題目 → Grades can motivate effort, but learning only for scores can create stress and shallow learning.｜理由：Grades can motivate effort, but learning only for scores can create stress and shallow learning.｜例子：A student may memorise information and forget it immediately after the exam.｜結果：Understanding should matter too.", "Part 3｜522/522 題目導向逐題校正", null, "Grades can motivate effort, but learning only for scores can create stress and shallow learning.", ""], ["Part 3", "為家人感到驕傲", "Do rewards help a child become better?", "They can help sometimes, but praise for effort and progress is usually more useful than constant prizes. Rewards can motivate a child for a short time, but too many can replace inner motivation. One clear example is praise for real effort helps children notice progress. Rewards work best when they are occasional.", "中文邏輯：先回答題目 → They can help sometimes, but praise for effort and progress is usually more useful than constant prizes.｜理由：Rewards can motivate a child for a short time, but too many can replace inner motivation.｜例子：Praise for real effort helps children notice progress.｜結果：Rewards work best when they are occasional.", "Part 3｜522/522 題目導向逐題校正", null, "They can help sometimes, but praise for effort and progress is usually more useful than constant prizes.", ""], ["Part 3", "為家人感到驕傲", "On what occasions would adults be proud of themselves?", "Adults may feel proud after reaching a goal, helping family, solving a hard problem or improving a skill. Finishing something that required real effort can feel more meaningful than simple praise. Pride is strongest when it reflects growth.", "中文邏輯：先回答題目 → Adults may feel proud after reaching a goal, helping family, solving a hard problem or improving a skill.｜理由：Adults often feel proud after reaching a hard goal, helping family or improving a skill.｜例子：Finishing something that required real effort can feel more meaningful than simple praise.｜結果：Pride is strongest when it reflects growth.", "Part 3｜522/522 題目導向逐題校正", null, "Adults may feel proud after reaching a goal, helping family, solving a hard problem or improving a skill.", ""], ["Part 3", "為家人感到驕傲", "Is it good to reward children too often?", "No. Too many rewards can make children focus only on the prize. Rewards can motivate a child for a short time, but too many can replace inner motivation. You can see this in daily life. Praise for real effort helps children notice progress. Rewards work best when they are occasional.", "中文邏輯：先回答題目 → No. Too many rewards can make children focus only on the prize.｜理由：Rewards can motivate a child for a short time, but too many can replace inner motivation.｜例子：Praise for real effort helps children notice progress.｜結果：Rewards work best when they are occasional.", "Part 3｜522/522 題目導向逐題校正", null, "No. Too many rewards can make children focus only on the prize.", ""], ["Part 3", "為家人感到驕傲", "Should parents reward children?", "Sometimes, but rewards should be occasional and connected to real effort. Praise for real effort helps children notice progress. So rewards work best when they are occasional. Rewards can motivate a child for a short time, but too many can replace inner motivation.", "中文邏輯：先回答題目 → Sometimes, but rewards should be occasional and connected to real effort.｜理由：Rewards can motivate a child for a short time, but too many can replace inner motivation.｜例子：Praise for real effort helps children notice progress.｜結果：Rewards work best when they are occasional.", "Part 3｜522/522 題目導向逐題校正", null, "Sometimes, but rewards should be occasional and connected to real effort.", ""], ["Part 3", "為家人感到驕傲", "When would parents feel proud of their children?", "Parents often feel proud when children work hard, become independent or show kindness. For example, the feeling does not need to come only from high grades. Growth and character can matter more.", "中文邏輯：先回答題目 → Parents often feel proud when children work hard, become independent or show kindness.｜理由：Parents often feel proud when children work hard, become more independent or show kindness.｜例子：The feeling does not need to come only from high grades.｜結果：Growth and character can matter more.", "Part 3｜522/522 題目導向逐題校正", null, "Parents often feel proud when children work hard, become independent or show kindness.", ""], ["Part 3", "去過的靠近自然的地方", "Do you think people who live in natural places are more likely to protect it?", "Often, yes. Daily contact with nature can make environmental damage feel more personal. Natural spaces support both mood and health. This is because nature gives people space away from traffic, screens and constant information. For example, a quiet walk among trees can help the mind slow down.", "中文邏輯：先回答題目 → Often, yes. Daily contact with nature can make environmental damage feel more personal.｜理由：Nature gives people space away from traffic, screens and constant information.｜例子：A quiet walk among trees can help the mind slow down.｜結果：Natural spaces support both mood and health.", "Part 3｜522/522 題目導向逐題校正", null, "Often, yes. Daily contact with nature can make environmental damage feel more personal.", ""], ["Part 3", "去過的靠近自然的地方", "Do you think it is necessary to include natural spaces in a city?", "Yes. Parks and green areas support health, cooling and places to rest. Nature gives people space away from traffic, screens and constant information. In real life, a quiet walk among trees can help the mind slow down. Natural spaces support both mood and health.", "中文邏輯：先回答題目 → Yes. Parks and green areas support health, cooling and places to rest.｜理由：Nature gives people space away from traffic, screens and constant information.｜例子：A quiet walk among trees can help the mind slow down.｜結果：Natural spaces support both mood and health.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Parks and green areas support health, cooling and places to rest.", ""], ["Part 3", "去過的靠近自然的地方", "Are there any natural attractions that are great to visit?", "Taiwan has mountains, coastlines, forests and national parks that are great for nature trips. Nature gives people space away from traffic, screens and constant information. You can see this in daily life. A quiet walk among trees can help the mind slow down. Natural spaces support both mood and health.", "中文邏輯：先回答題目 → Taiwan has mountains, coastlines, forests and national parks that are great for nature trips.｜理由：Nature gives people space away from traffic, screens and constant information.｜例子：A quiet walk among trees can help the mind slow down.｜結果：Natural spaces support both mood and health.", "Part 3｜522/522 題目導向逐題校正", null, "Taiwan has mountains, coastlines, forests and national parks that are great for nature trips.", ""], ["Part 3", "喜歡的自然之地", "Which is more important, protecting the environment or developing the economy?", "Both matter, but economic growth should not destroy resources that people will need in the future. The reason is that short-term growth is not useful if it destroys resources people need later. Clean nature can also support tourism, health and long-term jobs. Good development should protect both present and future needs.", "中文邏輯：先回答題目 → Both matter, but economic growth should not destroy resources that people will need in the future.｜理由：Short-term growth is not useful if it destroys resources people need later.｜例子：Clean nature can also support tourism, health and long-term jobs.｜結果：Good development should protect both present and future needs.", "Part 3｜522/522 題目導向逐題校正", null, "Both matter, but economic growth should not destroy resources that people will need in the future.", ""], ["Part 3", "喜歡的自然之地", "Do you think staying in a natural place would help change people’s mood?", "Yes. A quieter, greener environment can reduce mental pressure and help people reset. Natural places reduce noise and visual pressure. One clear example is a quiet walk among trees can give the brain a break from screens and traffic. Even a short change of environment can help people feel calmer.", "中文邏輯：先回答題目 → Yes. A quieter, greener environment can reduce mental pressure and help people reset.｜理由：Natural places reduce noise and visual pressure.｜例子：A quiet walk among trees can give the brain a break from screens and traffic.｜結果：Even a short change of environment can help people feel calmer.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. A quieter, greener environment can reduce mental pressure and help people reset.", ""], ["Part 3", "喜歡的自然之地", "Do you think there should be many natural places in cities?", "Yes. Green spaces improve daily life, especially in dense urban areas. The reason is that nature gives people space away from traffic, screens and constant information. A quiet walk among trees can help the mind slow down. Natural spaces support both mood and health.", "中文邏輯：先回答題目 → Yes. Green spaces improve daily life, especially in dense urban areas.｜理由：Nature gives people space away from traffic, screens and constant information.｜例子：A quiet walk among trees can help the mind slow down.｜結果：Natural spaces support both mood and health.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Green spaces improve daily life, especially in dense urban areas.", ""], ["Part 3", "擁擠的地方", "Do you think it is a good trend to have more big cities?", "Big cities create opportunities, but growth becomes a problem if housing, transport and green space cannot keep up. For example, bigger is not automatically better. Planning decides whether growth improves life.", "中文邏輯：先回答題目 → Big cities create opportunities, but growth becomes a problem if housing, transport and green space cannot keep up.｜理由：Large cities create jobs and services, but growth becomes a problem if housing, transport and green space cannot keep up.｜例子：Bigger is not automatically better.｜結果：Planning decides whether growth improves life.", "Part 3｜522/522 題目導向逐題校正", null, "Big cities create opportunities, but growth becomes a problem if housing, transport and green space cannot keep up.", ""], ["Part 3", "擁擠的地方", "Do you think there are some people who enjoy crowded places?", "Yes. Some people enjoy the energy, events and social feeling of busy places. Crowds bring energy and access to popular activities, but they also use attention and space. One clear example is a night market can feel exciting for one hour and tiring after that. People accept crowds when the experience feels worth it.", "中文邏輯：先回答題目 → Yes. Some people enjoy the energy, events and social feeling of busy places.｜理由：Crowds bring energy and access to popular activities, but they also use attention and space.｜例子：A night market can feel exciting for one hour and tiring after that.｜結果：People accept crowds when the experience feels worth it.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Some people enjoy the energy, events and social feeling of busy places.", ""], ["Part 3", "擁擠的地方", "Why do people go to crowded places?", "Popular food, shopping, festivals and entertainment often attract large crowds. A night market can feel exciting for one hour and tiring after that. So people accept crowds when the experience feels worth it. Crowds bring energy and access to popular activities, but they also use attention and space.", "中文邏輯：先回答題目 → Popular food, shopping, festivals and entertainment often attract large crowds.｜理由：Crowds bring energy and access to popular activities, but they also use attention and space.｜例子：A night market can feel exciting for one hour and tiring after that.｜結果：People accept crowds when the experience feels worth it.", "Part 3｜522/522 題目導向逐題校正", null, "Popular food, shopping, festivals and entertainment often attract large crowds.", ""], ["Part 3", "擁擠的地方", "Will people use bikes more or less in cities in the future?", "Probably more if cities build safe bike lanes and make short trips easier by bike. People will not choose bikes if traffic feels dangerous. Infrastructure changes behaviour.", "中文邏輯：先回答題目 → Probably more if cities build safe bike lanes and make short trips easier by bike.｜理由：Bike use can grow if cities build safe lanes and make short trips easy.｜例子：People will not choose bikes if traffic feels dangerous.｜結果：Infrastructure changes behaviour.", "Part 3｜522/522 題目導向逐題校正", null, "Probably more if cities build safe bike lanes and make short trips easier by bike.", ""], ["Part 3", "擁擠的地方", "Will there be more or less green space in cities in the future?", "It depends on planning. Dense cities can lose green space, but good policy can protect and add parks. A simple example is dense cities need green areas even more. The future depends on policy choices.", "中文邏輯：先回答題目 → It depends on planning. Dense cities can lose green space, but good policy can protect and add parks.｜理由：Green space may fall if cities only focus on building, but good planning can protect and add parks.｜例子：Dense cities need green areas even more.｜結果：The future depends on policy choices.", "Part 3｜522/522 題目導向逐題校正", null, "It depends on planning. Dense cities can lose green space, but good policy can protect and add parks.", ""], ["Part 3", "擁擠的地方", "Which cities are overcrowded in your country?", "Taipei and parts of the greater Taipei area can feel very crowded during busy times. Crowds bring energy and access to popular activities, but they also use attention and space. For example, a night market can feel exciting for one hour and tiring after that. People accept crowds when the experience feels worth it.", "中文邏輯：先回答題目 → Taipei and parts of ", "Which area is exposed to noise more, the city or the countryside?", "Cities are usually noisier because traffic, construction and people are closer together. The reason is that cities put traffic, construction and many people close together. The countryside has noise too, but it is usually less constant. Density is the main reason for the difference.", "中文邏輯：先回答題目 → Cities are usually noisier because traffic, construction and people are closer together.｜理由：Cities put traffic, construction and many people close together.｜例子：The countryside has noise too, but it is usually less constant.｜結果：Density is the main reason for the difference.", "Part 3｜522/522 題目導向逐題校正", null, "Cities are usually noisier because traffic, construction and people are closer together.", ""], ["Part 3", "嘈雜的地方", "What kinds of noises are there in our life?", "Traffic, construction, machines, music and people talking are common daily noises. One reason is that noise affects comfort because people cannot easily switch it off. A simple example is traffic or construction can make rest and conversation harder. The acceptable level depends on the place and time.", "中文邏輯：先回答題目 → Traffic, construction, machines, music and people talking are common daily noises.｜理由：Noise affects comfort because people cannot easily switch it off.｜例子：Traffic or construction can make rest and conversation harder.｜結果：The acceptable level depends on the place and time.", "Part 3｜522/522 題目導向逐題校正", null, "Traffic, construction, machines, music and people talking are common daily noises.", ""], ["Part 3", "嘈雜的地方", "Should children not be allowed to make noise under any circumstances?", "No. Children need to play and express themselves, although they should learn when quiet is necessary. Children still need to learn that hospitals, libraries or late-night homes require more quiet. That matters because noise is a normal part of play and development. The goal is learning context, not forcing silence all the time.", "中文邏輯：先回答  business.｜結果：Waterways can serve both people and the environment.", "Part 3｜522/522 題目導向逐題校正", null, "They can provide recreation, scenery, water resources and business opportunities.", ""], ["Part 3", "推薦旅遊過的地方", "Is it important to plan a holiday?", "Yes. A basic plan reduces avoidable problems, although every hour does not need to be fixed. A short trip or even a quiet day can reduce stress. So rest is useful because people return with more energy. Time off helps people recover from work and change their routine.", "中文邏輯：先回答題目 → Yes. A basic plan reduces avoidable problems, although every hour does not need to be fixed.｜理由：Time off helps people recover from work and change their routine.｜例子：A short trip or even a quiet day can reduce stress.｜結果：Rest is useful because people return with more energy.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. A basic plan reduces avoidable problems, although every hour does not need to be fixed.", ""], ["Part 3", "推薦旅遊過的地方", "How do people usually plan holidays?", "People usually choose dates, set a budget, book transport and then decide the main activities. The reason is that time off helps people recover from work and change their routine. A short trip or even a quiet day can reduce stress. Rest is useful because people return with more energy.", "中文邏輯：先回答題目 → People usually choose dates, set a budget, book transport and then decide the main activities.｜理由：Time off helps people recover from work and change their routine.｜例子：A short trip or even a quiet day can reduce stress.｜結果：Rest is useful because people return with more energy.", "Part 3｜522/522 題目導向逐題校正", null, "People usually choose dates, set a budget, book transport and then decide the main activities.", ""], ["Part 3", "推薦旅遊過的地方", "What is the ideal length for a holiday?", "For many people, about one week is enough to rest without creating too much cost or work pressure. Rest is useful because people return with more energy. This is because time off helps people recover from work and change their routine. For example, a short trip or even a quiet day can reduce stress.", "中文邏輯：先回答題目 → For many people, about one week is enough to rest without creating too much cost or work pressure.｜理由：Time off helps people recover from work and change their routine.｜例子：A short trip or even a quiet day can reduce stress.｜結果：Rest is useful because people return with more energy.", "Part 3｜522/522 題目導向逐題校正", null, "For many people, about one week is enough to rest without creating too much cost or work pressure.", ""], ["Part 3", "推薦旅遊過的地方", "Where do people in your country often go for holidays?", "People in Taiwan often travel around Taiwan or visit nearby places such as Japan and Korea. Time off helps people recover from work and change their routine. One clear example is a short trip or even a quiet day can reduce stress. Rest is useful because people return with more energy.", "中文邏輯：先回答題目 → People in Taiwan often travel around Taiwan or visit nearby places such as Japan and Korea.｜理由：Time off helps people recover from work and change their routine.｜例子：A short trip or even a quiet day can reduce stress.｜結果：Rest is useful because people return with more energy.", "Part 3｜522/522 題目導向逐題校正", null, "People in Taiwan often travel around Taiwan or visit nearby places such as Japan and Korea.", ""], ["Part 3", "推薦旅遊過的地方", "How do people decide when to travel?", "They usually consider work schedules, school holidays, weather, cost and family time. The value comes from seeing another way of living. This is because travel gives people a change of environment and direct experience. For example, using local transport or seeing daily life can teach more than a photo alone.", "中文邏輯：先回答題目 → They usually consider work schedules, school holidays, weather, cost and family time.｜理由：Travel gives people a change of environment and direct experience.｜例子：Using local transport or seeing daily life can teach more than a photo alone.｜結果：The value comes from seeing another way of living.", "Part 3｜522/522 題目導向逐題校正", null, "They usually consider work schedules, school holidays, weather, cost and family time.", ""], ["Part 3", "推薦旅遊過的地方", "Why do many countries try to attract people to visit?", "Tourists spend money on hotels, food, transport and attractions, which supports local jobs. The benefit is strongest when tourism is managed well. This is because tourism brings money to hotels, restaurants, transport and local attractions. For example, visitors also create jobs and help local culture become better known.", "中文邏輯：先回答題目 → Tourists spend money on hotels, food, transport and attractions, which supports local jobs.｜理由：Tourism brings money to hotels, restaurants, transport and local attractions.｜例子：Visitors also create jobs and help local culture become better known.｜結果：The benefit is strongest when tourism is managed well.", "Part 3｜522/522 題目導向逐題校正", null, "Tourists spend money on hotels, food, transport and attractions, which supports local jobs.", ""], ["Part 3", "想有空時去旅遊的地方", "Do you think a gap period in life is important?", "It can be useful when the person has a clear purpose, such as travel, work or learning. A break can be useful when it has a clear purpose. In real life, travel, work or learning can help someone understand what they want next. A gap with no plan can also become expensive or unproductive.", "中文邏輯：先回答題目 → It can be useful when the person has a clear purpose, such as travel, work or learning.｜理由：A break can be useful when it has a clear purpose.｜例子：Travel, work or learning can help someone understand what they want next.｜結果：A gap with no plan can also become expensive or unproductive.", "Part 3｜522/522 題目導向逐題校正", null, "It can be useful when the person has a clear purpose, such as travel, work or learning.", ""], ["Part 3", "想有空時去旅遊的地方", "Why do you think some people choose not to travel abroad?", "Cost, family duties, language worries or simply preferring familiar places can all be reasons. Travel gives people a change of environment and direct experience. You can see this in daily life. Using local transport or seeing daily life can teach more than a photo alone. The value comes from seeing another way of living.", "中文邏輯：先回答題目 → Cost, family duties, language worries or simply preferring familiar places can all be reasons.｜理由：Travel gives people a change of environment and direct experience.｜例子：Using local transport or seeing daily life can teach more than a photo alone.｜結果：The value comes from seeing another way of living.", "Part 3｜522/522 題目導向逐題校正", null, "Cost, family duties, language worries or simply preferring familiar places can all be reasons.", ""], ["Part 3", "想拜訪但不想住的家", "What's the difference between homes in cities and those in the countryside?", "City homes are usually smaller but closer to services, while countryside homes often have more space and quiet. City homes trade space for convenience. Lifestyle decides which advantage matters more. For instance, a small apartment may be close to transport and work, while a country home may offer more room and quiet.", "中文邏輯：先回答題目 → City homes are usually smaller but closer to services, while countryside homes often have more space and quiet.｜理由：City homes trade space for convenience.｜例子：A small apartment may be close to transport and work, while a country home may offer more room and quiet.｜結果：Lifestyle decides which advantage matters more.", "Part 3｜522/522 題目導向逐題校正", null, "City homes are usually smaller but closer to services, while countryside homes often have more space and quiet.", ""], ["Part 3", "想拜訪但不想住的家", "What kind of place do people in your country like to live in?", "Many people prefer convenient urban areas, but some want quieter suburbs with more space. Many people prefer places that are safe, convenient and close to transport or work. You can see this in daily life. Others value more space and quiet. Lifestyle decides which feature matters most.", "中文邏輯：先回答題目 → Many people prefer convenient urban areas, but some want quieter suburbs with more space.｜理由：Many people prefer places that are safe, convenient and close to transport or work.｜例子：Others value more space and quiet.｜結果：Lifestyle decides which feature matters most.", "Part 3｜522/522 題目導向逐題校正", null, "Many people prefer convenient urban areas, but some want quieter suburbs with more space.", ""], ["Part 3", "想拜訪但不想住的家", "What do Taiwanese people do when they visit others?", "People usually chat, eat together and often bring a small gift such as fruit or snacks. AI can save time and explain ideas, but it can also give confident wrong answers. For example, users still need to check important information. AI is strongest as a helper, not a replacement for thinking.", "中文邏輯：先回答題目 → People usually chat, eat together and often bring a small gift such as fruit or snacks.｜理由：AI can save time and explain ideas, but it can also give confident wrong answers.｜例子：Users still need to check important information.｜結果：AI is strongest as a helper, not a replacement for thinking.", "Part 3｜522/522 題目導向逐題校正", null, "People usually chat, eat together and often bring a small gift such as fruit or snacks.", ""], ["Part 3", "想拜訪但不想住的家", "Do Taiwanese people like to visit others’ homes?", "Yes, especially family and close friends, although meeting outside is also very common. The reason is that homes reflect different needs for space, convenience and cost. A city apartment may be small but close to work, while a rural home offers more room. Lifestyle decides which trade-off feels better.", "中文邏輯：先回答題目 → Yes, especially family and close friends, although meeting outside is also very common.｜理由：Homes reflect different needs for space, convenience and cost.｜例子：A city apartment may be small but close to work, while a rural home offers more room.｜結果：Lifestyle decides which trade-off feels better.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, especially family and close friends, although meeting outside is also very common.", ""], ["Part 3", "想拜訪但不想住的家", "What kind of gifts do people usually bring when they visit others?", "Fruit, snacks, tea or another small gift is common when visiting someone. A simple example is the gift is mainly a polite way to thank the host. It does not need to be expensive.", "中文邏輯：先回答題目 → Fruit, snacks, tea or another small gift is common when visiting someone.｜理由：Fruit, snacks, tea or another small item is common when visiting someone.｜例子：The gift is mainly a polite way to thank the host.｜結果：It does not need to be expensive.", "Part 3｜522/522 題目導向逐題校正", null, "Fruit, snacks, tea or another small gift is common when visiting someone.", ""], ["Part 3", "想拜訪但不想住的家", "How often do you visit your relatives or friends?", "It depends on distance and schedules, but holidays and family events are common times to visit. A simple example is people who live nearby may meet more often. Modern schedules can make visits less frequent.", "中文邏輯：先回答題目 → It depends on distance and schedules, but holidays and family events are common times to visit.｜理由：It depends on distance and work schedules, but holidays and family events are common times to visit.｜例子：People who live nearby may meet more often.｜結果：Modern schedules can make visits less frequent.", "Part 3｜522/522 題目導向逐題校正", null, "It depends on distance and schedules, but holidays and family events are common times to visit.", ""], ["Part 3", "去過的無聊地方", "Why are some teachers’ classes boring?", "Classes become boring when students only listen and never get a chance to think or take part. The reason is that people lose attention when they only listen and never take part. A teacher who reads every word from slides gives students little reason to think. Questions, stories and examples usually make a class feel more alive.", "中文邏輯：先回答題目 → Classes become boring when students only listen and never get a chance to think or take part.｜理由：People lose attention when they only listen and never take part.｜例子：A teacher who reads every word from slides gives students little reason to think.｜結果：Questions, stories and examples usually make a class feel more alive.", "Part 3｜522/522 題目導向逐題校正", null, "Classes become boring when students only listen and never get a chance to think or take part.", ""], ["Part 3", "去過的無聊地方", "What can people do when they feel bored?", "They can change activities, take a short walk, talk to someone or do something more active. One reason is that they can change activities, move their body or do something that needs more attention. A simple example is a short walk or a different task can reset the mind. Boredom often improves when people regain some choice.", "中文邏輯：先回答題目 → They can change activities, take a short walk, talk to someone or do something more active.｜理由：They can change activities, move their body or do something that needs more attention.｜例子：A short walk or a different task can reset the mind.｜結果：Boredom often improves when people regain some choice.", "Part 3｜522/522 題目導向逐題校正", null, "They can change activities, take a short walk, talk to someone or do something more active.", ""], ["Part 3", "去過的無聊地方", "Why aren’t young people willing to listen to the experiences of older people?", "Young people may feel the advice belongs to a different time, especially when technology and work have changed. Technology, work and social life can change quickly, so old examples may seem less relevant. The advice becomes more useful when the older person explains the principle, not only the old situation.", "中文邏輯：先回答題目 → Young people may feel the advice belongs to a different time, especially when technology and work have changed.｜理由：Some young people feel that older advice belongs to a different time.｜例子：Technology, work and social life can change quickly, so old examples may seem less relevant.｜結果：The advice becomes more useful when the older person explains the principle, not only the old situation.", "Part 3｜522/522 題目導向逐題校正", null, "Young people may feel the advice belongs to a different time, especially when technology and work have changed.", ""], ["Part 3", "去過的無聊地方", "Why do most children think education is boring?", "Some lessons feel unrelated to their lives or involve too much passive memorising. One reason is that children lose interest when learning feels passive or unrelated to real life. A simple example is a lesson with only memorising can feel much slower than one with examples or activities. Interest grows when students can see a reason for learning.", "中文邏輯：先回答題目 → Some lessons feel unrelated to their lives or involve too much passive memorising.｜理由：Children lose interest when learning feels passive or unrelated to real life.｜例子：A lesson with only memorising can feel much slower than one with examples or activities.｜結果：Interest grows when students can see a reason for learning.", "Part 3｜522/522 題目導向逐題校正", null, "Some lessons feel unrelated to their lives or involve too much passive memorising.", ""], ["Part 3", "去過的無聊地方", "Do most people think news about celebrities is boring?", "No, I do not think most people find celebrity news boring. If they did, these stories would not get so many clicks online. People are naturally curious about famous people's relationships, clothes or scandals. They may say this news is unimportant, but many still read it.", "中文：不，我不覺得大部分人覺得名人新聞很無聊。如果真的無聊，就不會有這麼多點閱。人們本來就會好奇名人的感情、穿著或八卦。大家可能說這類新聞不重要，但還是會看。", "Part 3｜522/522 題目導向逐題校正", null, "No → lots of clicks show interest → people are curious → unimportant does not mean boring", ""], ["Part 3", "去過的無聊地方", "Why do some young people feel bored when talking with old people?", "Different interests and life experiences can make conversation harder, but good questions can bridge the gap. Good questions can bridge the gap. This is because the two groups may have different interests, references and communication styles. For example, a young person may not understand why an old work story matters to them.", "中文邏輯：先回答題目 → Different interests and life experiences can make conversation harder, but good questions can bridge the gap.｜理由：The two groups may have different interests, references and communication styles.｜例子：A young person may not understand why an old work story matters to them.｜結果：Good questions can bridge the gap.", "Part 3｜522/522 題目導向逐題校正", null, "Different interests and life experiences can make conversation harder, but good questions can bridge the gap.", ""], ["Part 3", "想再去一次的城市", "What should the government do to improve citizens’ safety?", "Good lighting, reliable transport, clear policing and safe public design can all help. A well-lit station can make late travel feel safer. So safety depends on both rules and public design. Government can improve safety through good lighting, reliable transport, safe street design and effective emergency services.", "中文邏輯：先回答題目 → Good lighting, reliable transport, clear policing and safe public design can all help.｜理由：Government can improve safety through good lighting, reliable transport, safe street design and effective emergency services.｜例子：A well-lit station can make late travel feel safer.｜結果：Safety depends on both rules and public design.", "Part 3｜522/522 題目導向逐題校正", null, "Good lighting, reliable transport, clear policing and safe public design can all help.", ""], ["Part 3", "想再去一次的城市", "Are there any changes in your city?", "Transport, buildings and services have changed a lot, and many areas are more connected now. New stations or shops can change how people move through a neighbourhood. Cities keep changing with population and technology.", "中文邏輯：先回答題目 → Transport, buildings and services have changed a lot, and many areas are more connected now.｜理由：Yes. Transport, buildings and services have changed a lot, and many areas are more connected now.｜例子：New stations or shops can change how people move through a neighbourhood.｜結果：Cities keep changing with population and technology.", "Part 3｜522/522 題目導向逐題校正", null, "Transport, buildings and services have changed a lot, and many areas are more connected now.", ""], ["Part 3", "想再去一次的城市", "Do you think people in the countryside are friendlier than people in the city?", "Not always. People in smaller places may know each other better, but friendliness still depends on the person. That can create familiarity, but it does not make every person friendlier. That matters because people in small communities may interact more often because they see the same people regularly. Personality still matters.", "中文邏輯：先回答題目 → Not always. People in smaller places may know each other better, but friendliness still depends on the person.｜理由：People in small communities may interact more often because they see the same people regularly.｜例子：That can create familiarity, but it does not make every person friendlier.｜結果：Personality still matters.", "Part 3｜522/522 題目導向逐題校正", null, "Not always. People in smaller places may know each other better, but friendliness still depends on the person.", ""], ["Part 3", "想再去一次的城市", "Do you think it is possible that all of the population move to cities?", "No. Cities need rural areas for food, nature and many kinds of work, so not everyone can or should move to a city. Cities cannot function without land, food production and different kinds of work outside them. You can see this in daily life. Also, not everyone wants dense city life. A country needs different types of places.", "中文邏輯：先回答題目 → No. Cities need rural areas for food, nature and many kinds of work, so not everyone can or should move to a city.｜理由：Cities cannot function without land, food production and different kinds of work outside them.｜例子：Also, not everyone wants dense city life.｜結果：A country needs different types of places.", "Part 3｜522/522 題目導向逐題校正", null, "No. Cities need rural areas for food, nature and many kinds of work, so not everyone can or should move to a city.", ""], ["Part 3", "想再去一次的城市", "Some people say large cities are suitable for old people. What do you think?", "They can be, if healthcare and transport are good, but noise, crowds and high costs can be difficult. Cities can give older people good hospitals and transport. One clear example is at the same time, stairs, crowds and noise can make life harder. A city is suitable only when its design supports older residents.", "中文邏輯：先回答題目 → They can be, if healthcare and transport are good, but noise, crowds and high costs can be difficult.｜理由：Cities can give older people good hospitals and transport.｜例子：At the same time, stairs, crowds and noise can make life harder.｜結果：A city is suitable only when its design supports older residents.", "Part 3｜522/522 題目導向逐題校正", null, "They can be, if healthcare and transport are good, but noise, crowds and high costs can be difficult.", ""], ["Part 3", "想再去一次的城市", "What's the difference between the city and the countryside?", "Cities offer more jobs and services, while the countryside usually offers more space, quiet and nature. Cities concentrate jobs and services, while the countryside offers a slower environment. So the better choice depends on lifestyle. The biggest trade-off is convenience versus space and quiet.", "中文邏輯：先回答題目 → Cities offer more jobs and services, while the countryside usually offers more space, quiet and nature.｜理由：The biggest trade-off is convenience versus space and quiet.｜例子：Cities concentrate jobs and services, while the countryside offers a slower environment.｜結果：The better choice depends on lifestyle.", "Part 3｜522/522 題目導向逐題校正", null, "Cities offer more jobs and services, while the countryside usually offers more space, quiet and nature.", ""], ["Part 3", "去過且喜歡的城市", "For those who live in cities, is it because they want to or have to?", "It is often both. People may enjoy city life but also need to be there for work or study. It is often both. People may enjoy city life, but jobs, schools and services can also make city living necessary. One clear example is someone may prefer more space but stay near Taipei for work. Choice and need often overlap.", "中文邏輯：先回答題目 → It is often both. People may enjoy city life but also need to be there for work or study.｜理由：It is often both. People may enjoy city life, but jobs, schools and services can also make city living necessary.｜例子：Someone may prefer more space but stay near Taipei for work.｜結果：Choice and need often overlap.", "Part 3｜522/522 題目導向逐題校正", null, "It is often both. People may enjoy city life but also need to be there for work or study.", ""], ["Part 3", "去過且喜歡的城市", "Do you prefer to visit well-developed cities or cities with a long history?", "I prefer a mix: good transport and services, but also enough history to give the city character. One reason is that history becomes easier when people connect facts with real lives and clear causes. A simple example is a story about how a family lived can be easier to remember than a list of dates. Understanding the connection matters more than memorising everything.", "中文邏輯：先回答題目 → I prefer a mix: good transport and services, but also enough history to give the city character.｜理由：History becomes easier when people connect facts with real lives and clear causes.｜例子：A story about how a family lived can be easier to remember than a list of dates.｜結果：Understanding the connection matters more than memorising everything.", "Part 3｜522/522 題目導向逐題校正", null, "I prefer a mix: good transport and services, but also enough history to give the city character.", ""], ["Part 3", "去過且喜歡的城市", "What are the disadvantages of living in a very famous city?", "Famous cities can be expensive, crowded and full of tourists. Housing and daily services may cost more because demand is high. Popularity can make normal life less comfortable.", "中文邏輯：先回答題目 → Famous cities can be expensive, crowded and full of tourists.｜理由：Famous cities can be expensive, crowded and full of tourists.｜例子：Housing and daily services may cost more because demand is high.｜結果：Popularity can make normal life less comfortable.", "Part 3｜522/522 題目導向逐題校正", null, "Famous cities can be expensive, crowded and full of tourists.", ""], ["Part 3", "去過且喜歡的城市", "Before you travel to a city, what factors would you consider?", "I would check cost, transport, safety, weather and what I actually want to do there. One reason is that travel gives people a change of environment and direct experience. A simple example is using local transport or seeing daily life can teach more than a photo alone. The value comes from seeing another way of living.", "中文邏輯：先回答題目 → I would check cost, transport, safety, weather and what I actually want to do there.｜理由：Travel gives people a change of environment and direct experience.｜例子：Using local transport or seeing daily life can teach more than a photo alone.｜結果：The value comes from seeing another way of living.", "Part 3｜522/522 題目導向逐題校正", null, "I would check cost, transport, safety, weather and what I actually want to do there.", ""], ["Part 3", "去過且喜歡的城市", "Do you think modern cities are suitable for young people or old people?", "Modern cities often suit young people better because jobs and social activities are concentrated there, although good services can also help older people. Young people often benefit more from concentrated jobs, study and social activities. In real life, older people can also benefit from healthcare and transport if the city is easy to use. Good design can serve both groups.", "中文邏輯：先回答題目 → Modern cities often suit young people better because jobs and social activities are concentrated there, although good services can also help older people.｜理由：Young people often benefit more from concentrated jobs, study and social activities.｜例子：Older people can also benefit from healthcare and transport if the city is easy to use.｜結果：Good design can serve both groups.", "Part 3｜522/522 題目導向逐題校正", null, "Modern cities often suit young people better because jobs and social activities are concentrated there, although good services can also help older people.", ""], ["Part 3", "去過且喜歡的城市", "What kinds of facilities do big cities have?", "Big cities usually have hospitals, schools, public transport, shops, parks and entertainment. For example, these services are concentrated because many people live nearby. Convenience is one of the main advantages of city life.", "中文邏輯：先回答題目 → Big cities usually have hospitals, schools, public transport, shops, parks and entertainment.｜理由：Big cities usually have hospitals, schools, public transport, shops, parks and entertainment.｜例子：These services are concentrated because many people live nearby.｜結果：Convenience is one of the main advantages of city life.", "Part 3｜522/522 題目導向逐題校正", null, "Big cities usually have hospitals, schools, public transport, shops, parks and entertainment.", ""], ["Part 3", "商店", "What are the differences between shopping online and in-store?", "Online shopping is faster and gives more choice, while stores let people see, touch and try products. The biggest trade-off is speed versus direct experience. You can see this in daily life. Online shopping makes comparison easy, while stores let people check size, quality and comfort. The product decides which method is better.", "中文邏輯：先回答題目 → Online shopping is faster and gives more choice, while stores let people see, touch and try products.｜理由：The biggest trade-off is speed versus direct experience.｜例子：Online shopping makes comparison easy, while stores let people check size, quality and comfort.｜結果：The product decides which method is better.", "Part 3｜522/522 題目導向逐題校正", null, "Online shopping is faster and gives more choice, while stores let people see, touch and try products.", ""], ["Part 3", "商店", "What are the differences in the shopping habits of different age groups?", "Younger people often shop online more, while older people may prefer stores they know and trust. Someone may buy online for speed but visit a store for shoes or clothes. So different products need different methods. Shopping choices depend on price, convenience, quality and trust.", "中文邏輯：先回答題目 → Younger people often shop online more, while older people may prefer stores they know and trust.｜理由：Shopping choices depend on price, convenience, quality and trust.｜例子：Someone may buy online for speed but visit a store for shoes or clothes.｜結果：Different products need different methods.", "Part 3｜522/522 題目導向逐題校正", null, "Younger people often shop online more, while older people may prefer stores they know and trust.", ""], ["Part 3", "商店", "What are the differences between shopping in street markets and big shopping malls?", "Street markets feel local and informal, while malls are cleaner, more controlled and have more brands. People can compare products, eat and meet friends without moving far. So that convenience keeps physical shopping relevant. Malls combine shopping, food and social space in one place.", "中文邏輯：先回答題目 → Street markets feel local and informal, while malls are cleaner, more controlled and have more brands.｜理由：Malls combine shopping, food and social space in one place.｜例子：People can compare products, eat and meet friends without moving far.｜結果：That convenience keeps physical shopping relevant.", "Part 3｜522/522 題目導向逐題校正", null, "Street markets feel local and informal, while malls are cleaner, more controlled and have more brands.", ""], ["Part 3", "商店", "Do you think shops and shopping malls will disappear in the future?", "No. Online shopping will grow, but people still need physical places for trying products, food and social activities. The reason is that physical shops still offer things the internet cannot fully replace. People want to try clothes, eat, meet friends and solve problems face to face. Their role may change, but they are unlikely to vanish.", "中文邏輯：先回答題目 → No. Online shopping will grow, but people still need physical places for trying products, food and social activities.｜理由：Physical shops still offer things the internet cannot fully replace.｜例子：People want to try clothes, eat, meet friends and solve problems face to face.｜結果：Their role may change, but they are unlikely to vanish.", "Part 3｜522/522 題目導向逐題校正", null, "No. Online shopping will grow, but people still need physical places for trying products, food and social activities.", ""], ["Part 3", "商店", "How have people’s shopping habits changed in recent decades?", "People compare prices online, buy through phones and expect faster delivery now. Someone may buy online for speed but visit a store for shoes or clothes. So different products need different methods. Shopping choices depend on price, convenience, quality and trust.", "中文邏輯：先回答題目 → People compare prices online, buy through phones and expect faster delivery now.｜理由：Shopping choices depend on price, convenience, quality and trust.｜例子：Someone may buy online for speed but visit a store for shoes or clothes.｜結果：Different products need different methods.", "Part 3｜522/522 題目導向逐題校正", null, "People compare prices online, buy through phones and expect faster delivery now.", ""], ["Part 3", "商店", "Do people in your country go to the shopping mall frequently?", "Yes, especially on weekends because malls combine shopping, food and entertainment. One reason is that malls combine shopping, food and social space in one place. A simple example is people can compare products, eat and meet friends without moving far. That convenience keeps physical shopping relevant.", "中文邏輯：先回答題目 → Yes, especially on weekends because malls combine shopping, food and entertainment.｜理由：Malls combine shopping, food and social space in one place.｜例子：People can compare products, eat and meet friends without moving far.｜結果：That convenience keeps physical shopping relevant.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, especially on weekends because malls combine shopping, food and entertainment.", ""], ["Part 3", "安靜的地方", "Is it easy to find quiet places in your country?", "In busy cities it can be difficult, but libraries, parks and private rooms can still be quiet. One reason is that quiet helps people rest, focus and talk more comfortably. A simple example is after a noisy day, even a simple quiet room can feel valuable. People often need less stimulation as they try to recover.", "中文邏輯：先回答題目 → In busy cities it can be difficult, but libraries, parks and private rooms can still be quiet.｜理由：Quiet helps people rest, focus and talk more comfortably.｜例子：After a noisy day, even a simple quiet room can feel valuable.｜結果：People often need less stimulation as they try to recover.", "Part 3｜522/522 題目導向逐題校正", null, "In busy cities it can be difficult, but libraries, parks and private rooms can still be quiet.", ""], ["Part 3", "安靜的地方", "Why do old people prefer to live in quiet places?", "Quiet places can reduce stress and make rest, sleep and conversation easier. One reason is that many older people value rest and easy conversation more than constant activity. A simple example is traffic and loud entertainment can make sleep or relaxation harder. A calm area can make daily life more comfortable.", "中文邏輯：先回答題目 → Quiet places can reduce stress and make rest, sleep and conversation easier.｜理由：Many older people value rest and easy conversation more than constant activity.｜例子：Traffic and loud entertainment can make sleep or relaxation harder.｜結果：A calm area can make daily life more comfortable.", "Part 3｜522/522 題目導向逐題校正", null, "Quiet places can reduce stress and make rest, sleep and conversation easier.", ""], ["Part 3", "安靜的地方", "Why are there more noises made at home now than in the past?", "Homes have more devices, online entertainment and people using speakers or video calls. One reason is that noise affects comfort because people cannot easily switch it off. A simple example is traffic or construction can make rest and conversation harder. The acceptable level depends on the place and time.", "中文邏輯：先回答題目 → Homes have more devices, online entertainment and people using speakers or video calls.｜理由：Noise affects comfort because people cannot easily switch it off.｜例子：Traffic or construction can make rest and conversation harder.｜結果：The acceptable level depends on the place and time.", "Part 3｜522/522 題目導向逐題校正", null, "Homes have more devices, online entertainment and people using speakers or video calls.", ""]];
