<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Speaking｜中英對照互動版</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#20242c;--muted:#6b7280;--line:#dfe4ea;--accent:#3157d5;--soft:#eef2ff;--warm:#fff8e8;--green:#18794e}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:20px 14px 54px}
.hero{background:linear-gradient(135deg,#fff,#eef2ff);border:1px solid var(--line);border-radius:22px;padding:21px}
h1{margin:0 0 7px;font-size:27px}
.sub{color:var(--muted);line-height:1.65}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.badge{background:var(--soft);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}
.note{margin-top:12px;background:var(--warm);border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.65}
.tabs{display:flex;gap:8px;margin:17px 0}
button,select{font:inherit}
button{border:1px solid var(--line);background:white;border-radius:11px;padding:9px 12px;cursor:pointer}
button:hover{border-color:#aeb8c6}
button.primary,.tab.active,.catBtn.active{background:var(--accent);color:white;border-color:var(--accent)}
.filters{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}
.catRow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.selectRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}
select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white}
.study{margin-top:14px}
.progressRow{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;color:var(--muted);font-size:13px}
.progressBar{height:6px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin-bottom:12px}
.progressFill{height:100%;background:var(--accent);width:0}
.card{background:white;border:1px solid var(--line);border-radius:19px;padding:19px}
.part{font-size:12px;font-weight:900;color:var(--accent);letter-spacing:.05em}
.topicName{font-size:13px;color:var(--muted);margin-top:3px}
.question{font-size:21px;font-weight:850;line-height:1.48;margin:13px 0}
.cue{background:#f8fafc;border-radius:12px;padding:12px 14px;line-height:1.6}
.cue ul{margin:7px 0 0;padding-left:20px}
.timerBox{margin-top:15px;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fbfcff}
.timerTop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timerLabel{font-size:12px;font-weight:850;color:var(--muted)}
.time{font-size:30px;font-weight:900;letter-spacing:.05em}
.timerHint{font-size:12px;color:var(--muted);margin-top:4px}
.timerBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.answerActions{margin-top:13px;display:flex;gap:8px;flex-wrap:wrap}
.answer{display:none;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;line-height:1.75}
.answer.open{display:block}
.en{white-space:pre-line;font-size:16px}
.zh{margin-top:13px;background:#fafbfc;border-radius:10px;padding:11px 12px;font-size:14px;color:#424b5a;line-height:1.75;white-space:pre-line}
.zhTitle{font-weight:900;color:#20242c;margin-bottom:6px}
.zhStatus{font-size:11px;color:#8a94a3;margin-top:7px}
.zh.loading{opacity:.75}
.core{margin-top:9px;background:var(--soft);border-radius:10px;padding:9px 10px;font-size:13px;line-height:1.55}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.nav button{padding:12px;font-weight:800}
.nav button:disabled{opacity:.4;cursor:not-allowed}
.p2tag{display:inline-block;background:#fff2cc;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:850;margin-top:8px}
.p3hint{display:inline-block;background:#eef9f2;color:var(--green);padding:5px 8px;border-radius:999px;font-size:12px;font-weight:850;margin-top:8px}
@media(max-width:650px){.selectRow{grid-template-columns:1fr}.question{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>IELTS Speaking｜Part × 主題｜中英對照</h1>
<div class="sub">重新設計成「一次只看一題」。Part 1 單獨練；Part 2 和 Part 3 綁在同一主題，按上一題／下一題移動，不會自動跳題，也不會有計時器卡在畫面上。</div>
<div class="badges">
<span class="badge">Part 1：328 題</span>
<span class="badge">Part 2：97 題</span>
<span class="badge">Part 3：522 題</span>
<span class="badge">P2 → P3 同主題</span><span class="badge">947 題逐題語意校正</span>
</div>
<div class="note"><b>中英對照版：</b>按「看答案」後會同時顯示英文答案與中文翻譯。Part 1 已內建完整中文；Part 2／Part 3 第一次開啟時會自動翻譯並快取在瀏覽器，之後再次開啟會直接顯示。</div>
</section>

<div class="tabs">
<button id="tabP1" class="tab active">Part 1</button>
<button id="tabP23" class="tab">Part 2 + Part 3</button>
</div>

<section class="filters">
<div id="catRow" class="catRow"></div>
<div class="selectRow">
<select id="topic"></select>
<button id="random">🎲 隨機主題</button>
</div>
</section>

<section class="study">
<div class="progressRow"><span id="position"></span><span id="seqLabel"></span></div>
<div class="progressBar"><div id="progressFill" class="progressFill"></div></div>

<article class="card">
<div id="part" class="part"></div>
<div id="topicName" class="topicName"></div>
<div id="question" class="question"></div>
<div id="cue"></div>
<div id="specialTag"></div>

<div class="timerBox">
  <div class="timerTop">
    <div>
      <div id="timerLabel" class="timerLabel"></div>
      <div id="time" class="time">00:20</div>
      <div id="timerHint" class="timerHint"></div>
    </div>
  </div>
  <div class="timerBtns">
    <button id="timerStart">開始</button>
    <button id="timerReset">重設</button>
  </div>
</div>

<div class="answerActions">
<button id="reveal" class="primary">看答案</button>
</div>

<div id="answer" class="answer">
<div id="en" class="en"></div>
<div id="zh" class="zh"><div class="zhTitle">中文翻譯</div><div id="zhText"></div><div id="zhStatus" class="zhStatus"></div></div>
<div id="core" class="core"></div>
</div>
</article>

<div class="nav">
<button id="prev">← 上一題</button>
<button id="next">下一題 →</button>
</div>
</section>
</div>

<script>
const rows=[["Part 1", "Politeness", "What did you do to show your politeness as a child?", "I usually said please and thank you, greeted adults, and tried not to interrupt them. My parents taught me these small habits quite early.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually said please and thank you, greeted adults, and tried not to interrupt them.", "我小時候通常會說請、謝謝，看到大人會打招呼，也會盡量不打斷別人說話。這些小習慣是爸媽很早就教我的。"], ["Part 1", "Politeness", "On what occasions should we be polite?", "Almost all the time, especially when we meet new people or speak to older people. Basic politeness makes communication much easier.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Almost all the time, especially when we meet new people or speak to older people.", "幾乎任何時候都應該有禮貌，尤其是遇到新朋友或和長輩說話時。基本的禮貌會讓溝通順利很多。"], ["Part 1", "Politeness", "Do you think being polite is very important?", "Yes. Being polite shows respect, and it can prevent small conflicts. I do not mean being overly formal; simple manners are enough.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "很重要。有禮貌代表尊重，也能避免很多小衝突。我不是說要非常正式，基本的禮貌就夠了。"], ["Part 1", "Politeness", "How did you learn to be polite as a child?", "Mostly from my parents. They corrected me when I forgot to greet people or say thank you, so those habits slowly became natural.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Mostly from my parents.", "主要是跟爸媽學的。小時候如果我忘了打招呼或說謝謝，他們會提醒我，所以這些習慣慢慢就變得很自然。"], ["Part 1", "Friends", "Why are some places suitable for meeting while others are not?", "A good meeting place should be easy to reach and not too noisy. If we can sit down and talk comfortably, I enjoy the time much more.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A good meeting place should be easy to reach and not too noisy.", "適合見面的地方應該交通方便，而且不要太吵。如果可以舒服地坐下來聊天，我會更享受那段時間。"], ["Part 1", "Friends", "Is there a difference between where you meet friends now and where you used to meet them in the past?", "Yes. When I was younger, I often met friends at school. Now we usually meet at a restaurant, a café, or a department store because everyone has different schedules.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。以前比較小的時候，我常在學校跟朋友見面。現在大家時間都不同，所以通常會約在餐廳、咖啡廳或百貨公司。"], ["Part 1", "Friends", "Would you invite friends to your home?", "Yes, but only close friends. Home feels more private, so I would invite people I already know well rather than someone I just met.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but only close friends.", "會，但只會邀請比較熟的朋友。家裡比較私人，所以我會邀請已經很熟的人，而不是剛認識的人。"], ["Part 1", "Friends", "Do you prefer to spend time with one friend or with a group of friends?", "I prefer one or two close friends. It is easier to have a real conversation, and I do not need to compete with a big group for attention.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I prefer one or two close friends.", "我比較喜歡跟一兩個好朋友相處。這樣比較容易真正聊天，也不用在一大群人裡搶著說話。"], ["Part 1", "Friends", "Do you have a friend you have known for a long time?", "Yes. I still have friends from my school and university years. We do not meet all the time now, but the relationship still feels comfortable.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有，我還是有一些從學生時期和大學認識到現在的朋友。現在不會一直見面，但相處起來還是很自在。"], ["Part 1", "Friends", "Where do you often meet each other?", "We usually meet at a restaurant or a department store. They are easy to get to, and we can eat, walk around and talk.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "We usually meet at a restaurant or a department store.", "我們通常會在餐廳或百貨公司見面。這些地方交通方便，也可以一起吃東西、逛逛和聊天。"], ["Part 1", "Friends", "How important are friends to you?", "They are very important. Good friends give me a place to talk honestly, especially when I am stressed or thinking too much.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "They are very important.", "很重要。好朋友讓我可以很坦白地聊天，尤其是我有壓力或想太多的時候。"], ["Part 1", "Teachers", "Do you want to be a teacher in the future?", "Probably not as a full-time job. I enjoy explaining things, but I do not think classroom teaching suits my personality for every day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Probably not as a full-time job.", "大概不會當全職老師。我喜歡解釋事情，但我不覺得每天在教室裡教課很適合我的個性。"], ["Part 1", "Teachers", "Do you have a teacher from your past that you still remember?", "Yes. I remember teachers who were patient and explained things clearly. I usually remember the way they treated students more than the exact lessons.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我會記得那些很有耐心、又能把事情說清楚的老師。比起課堂內容本身，我更容易記得他們怎麼對待學生。"], ["Part 1", "Teachers", "Are you still in touch with your primary school teachers?", "No, not really. It has been many years, so we lost contact, but I still remember a few of them.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No, not really.", "沒有，現在幾乎沒有聯絡。已經過很多年了，所以慢慢失去聯繫，不過我還是記得其中幾位。"], ["Part 1", "Teachers", "In what way has your favorite teacher helped you?", "My favorite teacher made me less afraid of asking questions. She explained things again without making students feel stupid.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "My favorite teacher made me less afraid of asking questions.", "我最喜歡的老師讓我比較不怕問問題。就算我不懂，她也會再解釋一次，不會讓學生覺得自己很笨。"], ["Part 1", "Teachers", "Do you have a favorite teacher?", "Yes. I usually like teachers who are patient, clear, and fair. I learn better when I feel safe making mistakes.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我通常喜歡有耐心、表達清楚又公平的老師。當我不怕犯錯時，我會學得比較好。"], ["Part 1", "Teachers", "Do you like your primary school teachers more than your high school teachers?", "I would not say one group was better. Primary school teachers felt warmer, while high school teachers gave me more academic guidance.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I would not say one group was better.", "我不會說哪一個階段的老師比較好。小學老師給我的感覺比較溫暖，高中老師則給我比較多學業上的指導。"], ["Part 1", "Work/ Study", "What subjects are you studying?", "I recently graduated in Information Management, so my main subjects were related to information systems, management and technology. Now I am focusing on English and graduate-school preparation.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I recently graduated in Information Management, so my main subjects were related to information systems, management and technology.", "我剛從資訊管理系畢業，所以以前主要學資訊系統、管理和科技相關科目。現在我比較專注在英文和研究所申請準備。"], ["Part 1", "Work/ Study", "Do you like your subject?", "Yes. I like Information Management because it connects technology with real problems instead of focusing only on theory.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "喜歡。我喜歡資訊管理，因為它會把科技跟真實問題連在一起，不會只停留在理論。"], ["Part 1", "Work/ Study", "Why did you choose to study this subject?", "I wanted a subject that included both technology and business. Information Management gave me a mix of both, which suited me better than a very narrow field.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I wanted a subject that included both technology and business.", "因為我想讀一個同時包含科技和商業的科系。資訊管理剛好兩者都有，比很單一的領域更適合我。"], ["Part 1", "Work/ Study", "Do you think that your subject is popular in your country?", "Yes, quite popular. Many companies need people who understand both technology and business, so the subject has practical career value.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, quite popular.", "算滿熱門的。很多公司都需要同時懂科技和商業的人，所以這個科系在職涯上很實用。"], ["Part 1", "Work/ Study", "What are the benefits of being your age?", "I have more freedom to make my own choices now, but I am still young enough to change direction. That gives me room to try new things.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I have more freedom to make my own choices now, but I am still young enough to change direction.", "我現在有更多自由可以自己做決定，但又還年輕到可以改變方向。這讓我有空間去嘗試新的事情。"], ["Part 1", "Work/ Study", "Do you want to change your major?", "Not really. I am interested in moving deeper into computer science, but I see that as building on my Information Management background rather than completely changing it.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not really.", "不太會。我對更深入學電腦科學有興趣，但我覺得這是建立在資管背景上的延伸，不是完全換一個領域。"], ["Part 1", "Work/ Study", "Do you prefer to study in the mornings or in the afternoons?", "I prefer the afternoon. I usually need some time to fully wake up, and I can focus better after I have settled into the day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I prefer the afternoon.", "我比較喜歡下午讀書。我通常需要一點時間完全清醒，進入一天的節奏後會比較容易專心。"], ["Part 1", "Work/ Study", "How much time do you spend on your studies each week?", "It changes from week to week. When I am preparing for English tests or applications, I may study a few hours almost every day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It changes from week to week.", "每週不一定。如果正在準備英文考試或申請，我可能幾乎每天都會讀幾個小時。"], ["Part 1", "Work/ Study", "Are you looking forward to working?", "Yes, because I want to use what I learned in real situations. At the same time, I also want to keep studying and improving my skills.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, because I want to use what I learned in real situations.", "會期待，因為我想把學到的東西用在真實情況裡。同時我也想繼續學習，讓自己的能力變得更好。"], ["Part 1", "Work/ Study", "What technology do you use when you study?", "Mostly my laptop, online learning websites and AI tools. I use them for research and practice, but I still check important information myself.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Mostly my laptop, online learning websites and AI tools.", "主要是筆電、線上學習網站和 AI 工具。我會用它們做研究和練習，但重要資訊還是會自己確認。"], ["Part 1", "Work/ Study", "What changes would you like to see in your school?", "I would like more practical courses and more chances to work on real problems. That would help students understand how classroom knowledge is used outside school.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I would like more practical courses and more chances to work on real problems.", "我希望有更多實作課程，也有更多機會處理真實問題。這樣學生會更了解課堂知識在校外怎麼使用。"], ["Part 1", "Work/ Study", "What work do you do?", "I recently graduated, so I am in a transition stage. Right now, I am mainly preparing for graduate study and improving my English.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I recently graduated, so I am in a transition stage.", "我剛畢業，目前算是在過渡階段。現在主要是在準備研究所和提升英文能力。"], ["Part 1", "Work/ Study", "Why did you choose to do this type of work?", "What attracts me is solving practical problems with technology. I like work where I can understand a problem and turn information into a useful solution.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "What attracts me is solving practical problems with technology.", "我喜歡用科技處理實際問題。我喜歡先理解問題，再把資訊整理成真正有用的解決方法。"], ["Part 1", "Work/ Study", "Do you like your job?", "I am still at the beginning of my career, so I care most about learning. I enjoy work more when I can solve problems and see a clear result.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I am still at the beginning of my career, so I care most about learning.", "我現在還在職涯的起點，所以最重視的是學習。如果工作能讓我解決問題，而且看得到明確成果，我會比較有成就感。"], ["Part 1", "Work/ Study", "What requirements did you need to meet to get your current job?", "The main requirements were a relevant university background, basic technical skills and the ability to communicate clearly. Being willing to learn was also important.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "The main requirements were a relevant university background, basic technical skills and the ability to communicate clearly.", "主要需要相關的大學背景、基本技術能力，以及清楚溝通的能力。願意學習也很重要。"], ["Part 1", "Work/ Study", "Do you want to change to another job?", "I am open to change in the future if another role gives me better learning and growth. I do not want to change just for the sake of changing.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I am open to change in the future if another role gives me better learning and growth.", "如果未來有一個工作能給我更好的學習和成長，我願意改變。但我不想只是為了換工作而換工作。"], ["Part 1", "Work/ Study", "Do you miss being a student?", "Sometimes. I miss having more time to focus on learning one thing, but I also like having more control over my future now.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Sometimes.", "有時候會。我懷念可以花比較多時間專心學一件事，但我也喜歡現在對未來有更多自己做決定的空間。"], ["Part 1", "Work/ Study", "What technology do you use at work?", "I mainly use a computer and common digital tools for communication, documents and problem-solving. The exact tool matters less than using it correctly.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I mainly use a computer and common digital tools for communication, documents and problem-solving.", "我主要會用電腦和一些常見的數位工具做溝通、文件處理和解決問題。用哪個工具沒有正確使用它那麼重要。"], ["Part 1", "Work/ Study", "Who helps you the most?", "My family and close friends help me the most. They may not solve the problem for me, but they help me calm down and see it more clearly.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "My family and close friends help me the most.", "家人和好朋友幫我最多。他們不一定會直接幫我解決問題，但會讓我冷靜下來，重新把事情看清楚。"], ["Part 1", "Computers/tablets", "Would you like to use a computer or tablet?", "I would choose a computer. A laptop is much easier for typing, research and serious study than a tablet.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I would choose a computer.", "我會選電腦。比起平板，筆電更適合打字、查資料和長時間認真讀書。"], ["Part 1", "Computers/tablets", "In what conditions would you use a computer or tablet?", "I use a computer when I need to write, research or study for a long time. I would use a tablet more for light reading or watching videos.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I use a computer when I need to write, research or study for a long time.", "需要寫東西、查資料或長時間讀書時，我會用電腦。平板則比較適合輕鬆閱讀或看影片。"], ["Part 1", "Computers/tablets", "When was the first time you used a computer or tablet?", "I first used a computer when I was quite young, probably at school or at home. At that time, I mainly used it for simple games and schoolwork.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I first used a computer when I was quite young, probably at school or at home.", "我很小的時候就用過電腦，應該是在學校或家裡。那時候主要拿來玩簡單遊戲和做作業。"], ["Part 1", "Computers/tablets", "What would your life be like without computers or tablets?", "It would be much less convenient. I use my laptop for study, applications, information and communication, so many tasks would take much longer.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It would be much less convenient.", "生活會不方便很多。我用筆電讀書、準備申請、查資料和聯絡，所以很多事情都會花更久。"], ["Part 1", "Computers/tablets", "In what conditions would it be difficult for you to use a computer or tablet?", "It is difficult when I am standing, travelling in a crowded place, or do not have a stable internet connection. In those cases, a phone is easier.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It is difficult when I am standing, travelling in a crowded place, or do not have a stable internet connection.", "站著、在很擁擠的地方移動，或沒有穩定網路時比較難用電腦或平板。這種時候手機比較方便。"], ["Part 1", "Secondary school", "Is there anything you miss about your secondary school?", "I miss seeing the same friends every day. Now everyone has different schedules, so meeting people takes much more planning.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I miss seeing the same friends every day.", "我懷念每天都能見到同一群朋友。現在大家時間都不同，所以見面需要安排更多。"], ["Part 1", "Secondary school", "What was your favorite subject at secondary school?", "I liked subjects that involved logic and practical problem-solving. I enjoyed them more than subjects that were mostly memorisation.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I liked subjects that involved logic and practical problem-solving.", "我喜歡需要邏輯和實際解決問題的科目，比起主要靠死背的科目，我更喜歡這一類。"], ["Part 1", "Secondary school", "Were there any subjects that you found difficult at secondary school?", "Yes. Some subjects with a lot of memorisation were difficult for me because I understood ideas better when I could see how they worked.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。有些需要大量記憶的科目對我比較難，因為我看得到原理和運作方式時會理解得比較好。"], ["Part 1", "Secondary school", "Do you remember your first day at secondary school?", "Only a little. I remember feeling nervous because the school was bigger and I did not know many people yet.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only a little.", "只記得一點。我記得那時候有點緊張，因為學校變大了，而且還不認識很多人。"], ["Part 1", "Paper", "Do you carry paper and pens with you when you go out?", "Not usually. I normally use my phone for notes, but I still carry a pen when I know I may need to fill in a form.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not usually.", "通常不會。我多半用手機記筆記，不過如果知道可能需要填表，我還是會帶一支筆。"], ["Part 1", "Paper", "Do people still keep handwritten letters today?", "Yes, especially letters with emotional value. People may not write them often, but an old handwritten letter can feel more personal than a message.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially letters with emotional value.", "會，尤其是有感情價值的手寫信。現在大家不常寫，但一封舊的手寫信會比一般訊息更有私人感。"], ["Part 1", "Paper", "Do you still write physical letters?", "No, almost never. I usually send messages because they are faster, but I understand why handwritten letters feel more special.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No, almost never.", "幾乎不會。我通常傳訊息，因為比較快，但我能理解為什麼手寫信會讓人覺得更特別。"], ["Part 1", "Paper", "What did you like to do with paper as a child?", "I used paper for drawing, schoolwork and simple crafts. It was a very normal part of childhood before I used digital devices so much.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I used paper for drawing, schoolwork and simple crafts.", "小時候會用紙畫畫、做功課和做簡單手作。在還沒那麼常用數位裝置以前，紙是童年很普通的一部分。"], ["Part 1", "Paper", "Have you made any crafts with paper?", "Yes, when I was younger. I made simple things at school, such as cards or folded paper decorations.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, when I was younger.", "有，小時候在學校做過一些簡單紙藝，例如卡片或摺紙裝飾。"], ["Part 1", "Fruit and vegetables", "Do people in your country like planting vegetables?", "Some people do, especially if they have a garden or balcony. In cities, space is limited, so many people just buy vegetables instead.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Some people do, especially if they have a garden or balcony.", "有些人喜歡，尤其是有花園或陽台的人。城市空間比較有限，所以很多人還是直接買菜。"], ["Part 1", "Fruit and vegetables", "Were there any kind of fruits and vegetables you disliked as a child?", "Yes. I was much pickier about vegetables when I was young. I preferred fruit because it was sweeter and easier to eat.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我小時候對蔬菜比較挑，反而比較喜歡水果，因為水果比較甜也比較好吃。"], ["Part 1", "Fruit and vegetables", "What kind of fruits and vegetables do you dislike?", "I do not have a strong dislike now, but I am less interested in vegetables with a very bitter taste.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I do not have a strong dislike now, but I am less interested in vegetables with a very bitter taste.", "現在沒有很強烈討厭哪一種，不過我比較不喜歡味道很苦的蔬菜。"], ["Part 1", "Fruit and vegetables", "Where do you usually buy fruit and vegetables?", "I usually buy them at a supermarket near my home. It is convenient, and I can buy everything else I need at the same time.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually buy them at a supermarket near my home.", "我通常在家附近的超市買。很方便，也可以同時把其他需要的東西一起買完。"], ["Part 1", "Fruit and vegetables", "How often do you eat fruit and vegetables?", "Almost every day. I do not follow a strict diet, but I try to include some fruit or vegetables in normal meals.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Almost every day.", "幾乎每天。我沒有很嚴格的飲食規定，但一般吃飯時會盡量有一些水果或蔬菜。"], ["Part 1", "Rubbish and recycling", "Did you recycle when you were a kid?", "Yes, at least basic things like paper and cans. I learned it mostly from school and family habits.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, at least basic things like paper and cans.", "有，至少會回收紙和鋁罐這些基本的東西。主要是從學校和家裡的習慣學到的。"], ["Part 1", "Rubbish and recycling", "Is waste sorting common in your country?", "Yes, it is quite common in Taiwan. People usually separate general waste, recycling and food waste.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, it is quite common in Taiwan.", "很普遍。台灣通常會分一般垃圾、資源回收和廚餘。"], ["Part 1", "Rubbish and recycling", "How do you recycle things like paper and plastic?", "I separate them from general waste and put them in the recycling collection. I also try to keep them reasonably clean.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I separate them from general waste and put them in the recycling collection.", "我會把紙類和塑膠跟一般垃圾分開，再交給資源回收，也會盡量保持乾淨。"], ["Part 1", "Rubbish and recycling", "What do you do when you see rubbish on the street?", "If there is a bin nearby and it is safe to pick up, I may throw it away. I would not touch something dirty or dangerous with my bare hands.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "If there is a bin nearby and it is safe to pick up, I may throw it away.", "如果附近有垃圾桶，而且安全可以撿，我可能會把它丟掉。但如果很髒或危險，我不會直接用手碰。"], ["Part 1", "Advertisement", "Do you often see advertisements when you are on your phone or computer?", "Yes, all the time. I see ads on social media, video platforms and websites, although I usually scroll past them quickly.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, all the time.", "很常看到。我在社群媒體、影音平台和網站上都會看到廣告，不過通常很快就滑過去。"], ["Part 1", "Advertisement", "What kind of advertising do you like?", "I like ads that are short, clear and a little creative. I lose interest when an ad takes too long to explain a simple product.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I like ads that are short, clear and a little creative.", "我喜歡短、清楚又有一點創意的廣告。如果一個很簡單的產品要解釋很久，我很快就會失去興趣。"], ["Part 1", "Advertisement", "Do you see a lot of advertising on trains or other transport?", "Yes. There are often ads inside stations, buses and trains, especially for shops, apps and new products.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "會。車站、公車和捷運裡常常都有廣告，尤其是商店、App 和新產品的廣告。"], ["Part 1", "Advertisement", "Is there an advertisement that made an impression on you when you were a child?", "I remember colourful TV commercials more than any single ad. As a child, music and funny characters caught my attention easily.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I remember colourful TV commercials more than any single ad.", "比起某一支特定廣告，我比較記得小時候那些色彩鮮豔的電視廣告。音樂和有趣角色很容易吸引小孩注意。"], ["Part 1", "Shoes", "Which do you prefer, fashionable shoes or comfortable shoes?", "Comfortable shoes, definitely. I walk quite a lot, so I would rather wear simple shoes all day than fashionable ones that hurt.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Comfortable shoes, definitely.", "一定是舒服的鞋。我走路不少，所以寧願穿簡單但能走一整天的鞋，也不要好看但會痛的鞋。"], ["Part 1", "Shoes", "How much money do you usually spend on shoes?", "I usually spend a moderate amount. I care about comfort and quality, but I do not need expensive brands.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually spend a moderate amount.", "通常花中等的金額。我在意舒適和品質，但不需要很貴的品牌。"], ["Part 1", "Shoes", "Have you ever bought shoes online?", "Yes, but I am careful because size can be difficult online. If I already know the brand and size, I feel more confident.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but I am careful because size can be difficult online.", "有，不過我會很小心，因為網購鞋子的尺寸比較難判斷。如果已經知道品牌和尺寸，我會比較放心。"], ["Part 1", "Shoes", "Do you like buying shoes? How often?", "Not especially. I usually buy shoes only when I need a new pair, so maybe a few times a year.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not especially.", "沒有特別喜歡。我通常真的需要新鞋才會買，所以大概一年幾次。"], ["Part 1", "Name", "Do you often forget people's names?", "Sometimes, especially if I meet several new people at once. I remember better when I connect the name with a face or situation.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Sometimes, especially if I meet several new people at once.", "有時候，尤其一次遇到很多新朋友時。我把名字跟臉或當時的情境連在一起會比較好記。"], ["Part 1", "Name", "How do you feel when people can't remember your name?", "I do not mind if we have only met once or twice. I would only feel a little awkward if we had known each other for a long time.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I do not mind if we have only met once or twice.", "如果只見過一兩次，我不太在意。如果已經認識很久還記不得，我才會覺得有點尷尬。"], ["Part 1", "Name", "How do you remember people's names?", "I repeat the name once and connect it with the person's face or where we met. That small link helps me remember.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I repeat the name once and connect it with the person's face or where we met.", "我會把對方的名字重複一次，再把名字跟他的臉或我們在哪裡認識連在一起。這個小連結會幫助我記住。"], ["Part 1", "Name", "Is it easy for you to remember people's names?", "Not always. Faces are easier for me than names, so I need to make a small mental connection.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not always.", "不一定。對我來說臉比名字好記，所以我需要做一個小小的聯想。"], ["Part 1", "Films/cinemas", "Do you prefer to watch films at home or in the cinema?", "Usually at home because it is more comfortable and I can pause whenever I want. I go to the cinema when the film really benefits from a big screen.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Usually at home because it is more comfortable and I can pause whenever I want.", "通常在家看，因為比較舒服，也可以隨時暫停。如果一部電影真的很適合大螢幕，我才會去電影院。"], ["Part 1", "Films/cinemas", "How often do you watch films?", "Probably once or twice a week, depending on how busy I am. I watch more on weekends.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Probably once or twice a week, depending on how busy I am.", "大概一週一到兩次，看忙不忙而定。週末會看得比較多。"], ["Part 1", "Films/cinemas", "Do you think going to the cinema is a good way to spend time with friends?", "Yes, especially if everyone wants to see the same film. I like talking about the story afterward.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially if everyone wants to see the same film.", "是，尤其大家都想看同一部片的時候。看完之後一起聊劇情也很好玩。"], ["Part 1", "Films/cinemas", "Do you often go to the cinema with your friends?", "Not very often. We usually meet for food or shopping, and I watch many films at home.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not very often.", "沒有很常。我們比較常約吃飯或逛街，而很多電影我會直接在家看。"], ["Part 1", "Films/cinemas", "Did you ever go to the cinema alone as a child?", "No. When I was a child, I usually went with family because going alone did not really feel natural.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No.", "沒有。小時候通常會跟家人一起去，一個人去電影院對我來說不太自然。"], ["Part 1", "Films/cinemas", "Did you often watch films when you were a child?", "Yes, but mostly at home with my family. I watched whatever was easy to find rather than choosing very carefully.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but mostly at home with my family.", "有，但主要是在家跟家人看。那時候通常有什麼就看什麼，不會挑得很仔細。"], ["Part 1", "Films/cinemas", "What films do you like?", "I like thrillers and mystery films because I enjoy guessing what happened. I am less interested in pure romance films.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I like thrillers and mystery films because I enjoy guessing what happened.", "我喜歡驚悚和懸疑片，因為我喜歡一邊看一邊猜發生了什麼。我對純愛情片比較沒興趣。"], ["Part 1", "Sports programs", "Have you ever watched a sports game in a stadium?", "Yes, but not very often. The best part is the crowd because everyone reacts at the same moment.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but not very often.", "有，但不算常。現場最棒的是觀眾，因為大家會在同一個瞬間一起反應。"], ["Part 1", "Sports programs", "Do you prefer to watch sports games alone or with a group of friends?", "With other people. A close game is more exciting when I can react and talk with someone.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "With other people.", "我喜歡跟其他人一起看。比賽很接近時，可以跟別人一起反應和討論會更刺激。"], ["Part 1", "Sports programs", "What kinds of games do you expect to watch in the future?", "I would like to watch more international baseball games, especially when Taiwan is playing.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I would like to watch more international baseball games, especially when Taiwan is playing.", "我想看更多國際棒球賽，尤其是台灣隊出賽的時候。"], ["Part 1", "Sports programs", "Who do you like to watch sports games with?", "Usually family or friends who understand the game. It is more fun when the other person is also interested.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Usually family or friends who understand the game.", "通常會跟懂比賽的家人或朋友一起看。對方也有興趣時會更好玩。"], ["Part 1", "Sports programs", "Do you like to watch live sports games?", "Yes. I like the uncertainty because the result is happening in real time and cannot be changed.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "喜歡。我喜歡那種不確定感，因為結果正在當下發生，誰都還不知道。"], ["Part 1", "Sports programs", "Do you like watching sports programs on TV?", "Sometimes, especially baseball. I am more interested in real games than long discussion programs.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Sometimes, especially baseball.", "有時會，尤其是棒球。不過比起很長的談話節目，我更喜歡直接看比賽。"], ["Part 1", "History", "Did you like history when you were young?", "Not very much. It often felt like memorising names and dates, so I did not find it very alive.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not very much.", "小時候沒有很喜歡。那時候常覺得只是在背人名和年代，所以歷史對我來說不太有生命力。"], ["Part 1", "History", "When was the last time you read about history?", "Quite recently, probably through an article or video online. I enjoy history more now when it is connected to a real place or person.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Quite recently, probably through an article or video online.", "滿最近的，可能是看網路文章或影片。現在如果歷史可以連到一個真實地方或人物，我會比較有興趣。"], ["Part 1", "History", "Do you like history?", "More than I did as a child. I like it when I can understand why people made certain choices instead of only learning dates.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "More than I did as a child.", "比小時候更喜歡。我喜歡理解人們為什麼做出某些選擇，而不只是背日期。"], ["Part 1", "History", "Have you ever been to historical museums?", "Yes. I find museums more interesting when they have real objects and clear stories rather than only long text panels.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我覺得博物館有真實物件和清楚故事時比較有趣，比只有一大段文字更容易看下去。"], ["Part 1", "Views", "Have you seen an unforgettable and beautiful view or scenery?", "Yes. Mountain scenery is especially memorable to me because the open view feels completely different from city life.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。山景對我特別難忘，因為那種開闊的視野跟城市生活完全不同。"], ["Part 1", "Views", "Do you prefer views in your own country or in other countries?", "I do not really choose by country. A beautiful view can be anywhere, but familiar places in Taiwan sometimes feel more personal.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I do not really choose by country.", "我不太會用國家來分。美景哪裡都有，不過台灣熟悉的地方有時會讓我更有感情。"], ["Part 1", "Views", "Do you prefer views in urban areas or rural areas?", "Rural areas. I like mountains, open space and fewer buildings because they help me relax.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Rural areas.", "鄉村或自然地區。我喜歡山、開闊空間和比較少的建築，會讓我更放鬆。"], ["Part 1", "Views", "Do you like taking pictures of different views?", "Yes, but only a few pictures. I want a memory of the place, but I do not want to spend the whole time looking through my phone.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but only a few pictures.", "喜歡，但只拍幾張。我想留下回憶，但不想整段時間都透過手機看風景。"], ["Part 1", "Childhood activities", "Are there any differences between the activities you liked when you were a child and those you like now?", "Yes. I used to do more outdoor activities like cycling. Now I spend more free time listening to music, watching films or reading.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。小時候我比較常做騎腳踏車這種戶外活動。現在空閒時間比較常聽音樂、看電影或閱讀。"], ["Part 1", "Childhood activities", "Did you prefer to do activities alone or with a group of people when you were a child?", "I liked both, but outdoor activities were more fun with family or friends. I did not enjoy being alone for too long.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I liked both, but outdoor activities were more fun with family or friends.", "兩種都喜歡，不過戶外活動跟家人或朋友一起會更好玩。我小時候不太喜歡一個人待太久。"], ["Part 1", "Childhood activities", "What were your favorite activities when you were a child?", "Cycling was one of my favourites. I sometimes rode with my father, so I connect it with freedom and family time.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Cycling was one of my favourites.", "騎腳踏車是其中一個。我有時會跟爸爸一起騎，所以我會把它跟自由感和家庭時間連在一起。"], ["Part 1", "Childhood activities", "What are your favorite activities?", "Now I prefer music, mystery films and reading. They are easy ways to relax after a busy day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Now I prefer music, mystery films and reading.", "現在比較喜歡音樂、懸疑電影和閱讀。忙完一天後，這些都是很容易讓我放鬆的方式。"], ["Part 1", "Watch", "Do you think it is important to wear a watch? Why?", "Not really, because phones can show the time. A watch is useful when someone wants a quick look without taking out a phone.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not really, because phones can show the time.", "沒有很重要，因為手機也能看時間。不過如果只是想快速看一眼，不拿手機出來的話，手錶就很方便。"], ["Part 1", "Watch", "Why do some people wear expensive watches?", "Some people see them as jewellery or a sign of status. Others may simply appreciate the design or craftsmanship.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Some people see them as jewellery or a sign of status.", "有些人把昂貴手錶當成飾品或身分象徵，也有人真的欣賞它的設計和工藝。"], ["Part 1", "Watch", "Have you ever got a watch as a gift?", "Yes, I have received practical accessories as gifts, although a watch is not the most memorable gift for me.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, I have received practical accessories as gifts, although a watch is not the most memorable gift for me.", "有收過實用配件當禮物，不過手錶不是我最難忘的禮物。"], ["Part 1", "Watch", "Do you wear a watch?", "Not every day. I normally check the time on my phone, so a watch is optional for me.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not every day.", "不是每天戴。我通常用手機看時間，所以手錶對我來說不是必需品。"], ["Part 1", "Cars", "Do you think car colors are important?", "Only a little. I prefer simple colours because they are easy to live with, but safety and price matter much more than colour.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only a little.", "只有一點點。我喜歡簡單的顏色，因為比較耐看，但安全和價格比車子的顏色重要多了。"], ["Part 1", "Cars", "What do you usually do when there is a traffic jam?", "If I am on a bus, I usually listen to music and try not to keep checking the time. Getting frustrated does not make the traffic move faster.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "If I am on a bus, I usually listen to music and try not to keep checking the time.", "如果坐公車，我通常會聽音樂，也盡量不要一直看時間。再怎麼煩躁也不會讓車流變快。"], ["Part 1", "Cars", "Do you prefer to be a driver or a passenger?", "A passenger. I can relax, look outside or use my phone, and I do not need to worry about parking.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A passenger.", "乘客。我可以休息、看窗外或用手機，也不用煩惱停車。"], ["Part 1", "Cars", "What types of cars do you like?", "I like practical, comfortable cars rather than sports cars. I care more about safety and easy use than a powerful engine.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I like practical, comfortable cars rather than sports cars.", "我喜歡實用、舒服的車，不太在意跑車。我更重視安全和好不好使用，而不是強大的引擎。"], ["Part 1", "Cars", "Did you enjoy traveling by car when you were a kid?", "Usually yes, especially on family trips. Long rides could become boring, but I liked the feeling of going somewhere new.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Usually yes, especially on family trips.", "通常喜歡，尤其是家庭旅行。坐太久會無聊，但我喜歡要去新地方的感覺。"], ["Part 1", "Cars", "Will you buy an expensive car in the future?", "Probably not. I would rather buy a reliable car and use the extra money for study, travel or savings.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Probably not.", "大概不會。我寧願買可靠的車，把多出來的錢用在讀書、旅行或存起來。"], ["Part 1", "Websites", "What kinds of websites are popular in your country?", "News, shopping, social media, video and search websites are all popular in Taiwan. People use them for very different parts of daily life.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "News, shopping, social media, video and search websites are all popular in Taiwan.", "新聞、購物、社群媒體、影音和搜尋網站在台灣都很熱門，大家會把它們用在日常生活不同的事情上。"], ["Part 1", "Websites", "Are there any changes to the websites you often visit?", "Yes. I use more study, research and application websites now because my goals have changed.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。因為我的目標變了，現在比較常看學習、研究和申請相關網站。"], ["Part 1", "Websites", "What is your favorite website?", "I use YouTube a lot because I can find music, explanations and useful tutorials in one place.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I use YouTube a lot because I can find music, explanations and useful tutorials in one place.", "我很常用 YouTube，因為音樂、說明影片和實用教學都可以在同一個地方找到。"], ["Part 1", "Websites", "Would you like to have your own website?", "Maybe. I would like a simple personal site for projects or study notes, but I would not want to maintain something complicated.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Maybe.", "也許會。我想要一個簡單的個人網站放作品或讀書筆記，但不想維護太複雜的網站。"], ["Part 1", "Websites", "Do you prefer getting information from websites or books?", "Websites for quick information and books for deeper reading. I use both depending on what I need.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Websites for quick information and books for deeper reading.", "需要快速資訊時用網站，想深入閱讀時用書。看我當下需要什麼，兩種都會用。"], ["Part 1", "Mirrors", "Would you use mirrors to decorate your room?", "Maybe one simple mirror, but not many. I prefer mirrors to be useful rather than purely decorative.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Maybe one simple mirror, but not many.", "可能放一面簡單的鏡子就好，不會很多。我希望鏡子主要是實用，不只是裝飾。"], ["Part 1", "Mirrors", "Do you usually take a mirror with you？", "No. I can use my phone camera or find a mirror if I really need one.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No.", "不會。如果真的需要，我可以用手機相機，或到附近找鏡子。"], ["Part 1", "Mirrors", "Have you ever bought mirrors?", "Yes, but only practical ones for home. I do not spend much time choosing decorative mirrors.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but only practical ones for home.", "有，但只是買家裡實用的鏡子。我不太會花很多時間挑裝飾性的鏡子。"], ["Part 1", "Mirrors", "Do you like looking at yourself in the mirror? How often?", "Only when I am getting ready or checking my appearance. I do not look at a mirror just for fun.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only when I am getting ready or checking my appearance.", "只有準備出門或檢查外表時會看。我不會只是為了好玩一直照鏡子。"], ["Part 1", "Music", "Does happy music make you feel more excited?", "Yes. Upbeat music can change my mood very quickly, especially when I am tired.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "會。節奏比較快、比較開心的音樂可以很快改變我的心情，尤其是累的時候。"], ["Part 1", "Music", "Do you prefer sad or happy music?", "It depends on my mood, but I listen to more upbeat or hopeful songs in daily life.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It depends on my mood, but I listen to more upbeat or hopeful songs in daily life.", "看心情，不過日常生活裡我比較常聽節奏較快或有希望感的歌。"], ["Part 1", "Music", "Do you listen to music while doing other things?", "Yes, especially while commuting or doing simple tasks. I turn it off if I need deep concentration.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially while commuting or doing simple tasks.", "會，尤其是通勤或做簡單事情時。如果需要深度專心，我就會把音樂關掉。"], ["Part 1", "Music", "Have you taken any music classes?", "Only basic music classes at school. I enjoy listening to music much more than performing it.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only basic music classes at school.", "只有學校基本的音樂課。我比起表演，更喜歡單純聽音樂。"], ["Part 1", "Social media", "Have you ever posted anything on social media?", "Yes, but not constantly. I usually post travel, food or small life moments rather than very personal things.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but not constantly.", "有，但不會一直發。我通常分享旅行、食物或生活小事，不太會放很私人的內容。"], ["Part 1", "Social media", "What do people often do on social media?", "They share photos, watch short videos, follow news, and keep in touch with friends.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "They share photos, watch short videos, follow news, and keep in touch with friends.", "大家會分享照片、看短影片、追新聞，也會跟朋友保持聯絡。"], ["Part 1", "Social media", "Do your friends use social media?", "Yes, most of them do. It is one of the easiest ways to keep contact when everyone is busy.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, most of them do.", "會，大部分都有。大家都很忙的時候，社群媒體是很方便的聯絡方式。"], ["Part 1", "Social media", "Do you think you spend too much time on social media?", "Sometimes, especially when I am tired and start scrolling without thinking. I try to notice when I am no longer enjoying it.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Sometimes, especially when I am tired and start scrolling without thinking.", "有時候，尤其累的時候會不知不覺一直滑。我會提醒自己是不是其實已經沒有在享受了。"], ["Part 1", "Social media", "When did you start using social media?", "I started when I was a teenager. At first it was mainly for friends, and later it became part of everyday communication.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I started when I was a teenager.", "大概青少年時開始用。最早主要是跟朋友聯絡，後來慢慢變成日常溝通的一部分。"], ["Part 1", "Dream and ambition", "Do you think you are an ambitious person?", "Yes, but not in a very competitive way. I like having a clear goal, such as graduate study abroad, and working toward it step by step.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but not in a very competitive way.", "算是，但不是那種很愛跟別人競爭的類型。我喜歡有清楚目標，例如出國讀研究所，再一步一步往前。"], ["Part 1", "Dream and ambition", "What is your dream job?", "A job that combines technology, problem-solving and communication. I want work where I keep learning instead of doing the same thing forever.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A job that combines technology, problem-solving and communication.", "我理想的工作會結合科技、解決問題和溝通。我希望工作可以讓我一直學新東西，而不是永遠做同一件事。"], ["Part 1", "Dream and ambition", "Are you the kind of person who sticks to dreams?", "If the goal still matters to me, yes. I may change the plan, but I do not want to give up only because progress is slow.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "If the goal still matters to me, yes.", "如果那個目標對我還是重要，我會堅持。我可能會改變方法，但不想只是因為進度慢就放棄。"], ["Part 1", "Dream and ambition", "What was your childhood dream?", "It changed many times. Like many children, I chose jobs based on what looked interesting at the time rather than a clear long-term plan.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It changed many times.", "小時候的夢想換過很多次。像很多小孩一樣，我通常只是看到什麼工作有趣就想做，沒有很清楚的長期計畫。"], ["Part 1", "Outer space and stars", "Do you want to go into outer space in the future?", "Probably not. I am curious about space, but the journey feels too risky for me.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Probably not.", "大概不會。我對太空很好奇，但真的要去太空旅行，我覺得風險太高。"], ["Part 1", "Outer space and stars", "Do you want to know more about outer space?", "Yes. I find it interesting because it shows how small our everyday world is compared with the universe.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "想。太空讓我覺得很有趣，因為它會提醒我，跟整個宇宙比起來，我們日常生活的世界其實很小。"], ["Part 1", "Outer space and stars", "Do you like science fiction movies?", "Sometimes. I like them more when the story is about people and choices, not only special effects.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Sometimes.", "有時會。我比較喜歡把重點放在人和選擇上的科幻片，不只是一直看特效。"], ["Part 1", "Outer space and stars", "Have you ever learnt about outer space and stars?", "Yes, mostly at school and through videos or articles. I know the basics, but I am not an expert.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, mostly at school and through videos or articles.", "有，主要是在學校，還有看影片或文章。我知道基本概念，但不是專家。"], ["Part 1", "Science", "Do you like science?", "Yes, especially technology and AI. I like science most when I can see how it changes real life.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially technology and AI.", "喜歡，尤其是科技和 AI。我最喜歡可以直接看到科學怎麼改變真實生活的部分。"], ["Part 1", "Science", "When did you start to learn about science?", "At school when I was a child. Simple experiments made it much easier to understand than only reading a textbook.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "At school when I was a child.", "小時候在學校開始學。比起只讀課本，簡單實驗會讓我更容易理解。"], ["Part 1", "Science", "Which science subject is interesting to you?", "Computer science interests me most because it connects logic with tools people use every day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Computer science interests me most because it connects logic with tools people use every day.", "我最有興趣的是電腦科學，因為它把邏輯跟人們每天真的會用的工具連在一起。"], ["Part 1", "Science", "What kinds of interesting things have you done with science?", "I enjoy testing technology and seeing why something works or fails. Even a small experiment feels satisfying when the result becomes clear.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I enjoy testing technology and seeing why something works or fails.", "我喜歡測試科技，看看一個東西為什麼能運作或為什麼失敗。即使只是小實驗，找到清楚結果也會很有成就感。"], ["Part 1", "Science", "Do you like watching science TV programs?", "Yes, if they explain ideas clearly and use real examples. I lose interest when the program becomes too technical.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, if they explain ideas clearly and use real examples.", "喜歡，只要節目能把概念講清楚，也有真實例子。如果太技術化，我很快就會失去興趣。"], ["Part 1", "Science", "Do Taiwanese people often visit science museums?", "Families and students do, especially for school trips or exhibitions. I would not say everyone goes often, though.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Families and students do, especially for school trips or exhibitions.", "家庭和學生滿常去，尤其是校外教學或展覽。不過我不會說每個台灣人都很常去。"], ["Part 1", "Clothing", "Do you spend a lot of time choosing clothes?", "No. I prefer simple clothes that are easy to match, so choosing an outfit usually does not take long.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No.", "不會。我喜歡簡單、好搭配的衣服，所以通常不用花很多時間挑。"], ["Part 1", "Clothing", "Do you like wearing T-shirts?", "Yes. T-shirts are comfortable and easy to wear, especially in warm weather.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "喜歡。T 恤很舒服也很好穿，尤其天氣熱的時候。"], ["Part 1", "Clothing", "Do you prefer to wear comfortable and casual clothes or smart clothes?", "Comfortable and casual clothes. I only dress formally when the situation really needs it.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Comfortable and casual clothes.", "舒服休閒的衣服。只有真的需要時我才會穿得比較正式。"], ["Part 1", "Clothing", "What kind of clothes do you like to wear?", "Simple clothes such as T-shirts, hoodies and comfortable trousers. I do not like outfits that need too much attention.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Simple clothes such as T-shirts, hoodies and comfortable trousers.", "簡單的衣服，例如 T 恤、帽 T 和舒服的褲子。我不喜歡需要一直顧著的穿搭。"], ["Part 1", "Clothing", "What color clothes do you like?", "I usually choose dark or neutral colours because they are easy to match.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually choose dark or neutral colours because they are easy to match.", "通常會選深色或中性色，因為比較好搭。"], ["Part 1", "Clothing", "Do you wear different styles of clothes on weekdays and weekends?", "A little. On weekends I dress more casually, while weekdays depend on what I need to do.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A little.", "有一點。週末會穿得更休閒，平日則看當天要做什麼。"], ["Part 1", "Headphones", "In what conditions would you not use headphones?", "I would not use them when crossing busy roads or when someone is talking to me. I want to stay aware of my surroundings.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I would not use them when crossing busy roads or when someone is talking to me.", "過很忙的馬路，或有人正在跟我說話時不會用耳機。我希望自己注意得到周遭環境。"], ["Part 1", "Headphones", "When would you use headphones?", "Mostly when commuting, listening to music or watching something in a public place.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Mostly when commuting, listening to music or watching something in a public place.", "主要是在通勤、聽音樂，或在公共場所看影片時用。"], ["Part 1", "Headphones", "What type of headphones do you use?", "Wireless earbuds. They are small, easy to carry and convenient on buses.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Wireless earbuds.", "無線耳塞。體積小、好攜帶，搭公車也很方便。"], ["Part 1", "Headphones", "Do you use headphones?", "Yes, almost every day. I use them mainly for music and videos.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, almost every day.", "會，幾乎每天。主要用來聽音樂和看影片。"], ["Part 1", "Headphones", "Is wearing headphones comfortable?", "Usually yes, as long as I do not wear them for too many hours. After a long time, my ears can get tired.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Usually yes, as long as I do not wear them for too many hours.", "通常舒服，只要不要戴太久。戴好幾個小時後，耳朵還是會累。"], ["Part 1", "Jokes & Comedies", "Have you ever watched a live show?", "Yes, but not often. Live shows feel different because the audience reacts together.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, but not often.", "有，但不常。現場表演不一樣，因為觀眾會一起反應。"], ["Part 1", "Jokes & Comedies", "Do you like to watch comedies?", "Yes, especially when I want something light after a stressful day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially when I want something light after a stressful day.", "喜歡，尤其壓力很大的一天之後，我會想看一些輕鬆的東西。"], ["Part 1", "Jokes & Comedies", "Do your friends like to tell jokes?", "Some do. I have a few friends who are naturally funny and can make ordinary situations sound entertaining.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Some do.", "有些朋友很愛。他們天生很有幽默感，連普通的事情都可以講得很好笑。"], ["Part 1", "Jokes & Comedies", "Are you good at telling jokes?", "Not really. I am better at laughing at jokes than telling them.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not really.", "不太會。我比較會笑別人的笑話，不太會自己講笑話。"], ["Part 1", "Jokes & Comedies", "Are comedy shows popular in your country?", "Yes. Variety shows, funny videos and comedy clips are popular because they are easy to watch and share.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "很熱門。綜藝、搞笑影片和喜劇短片都很受歡迎，因為容易看也容易分享。"], ["Part 1", "Art", "Do you like art?", "Yes, although I am not an expert. I like art when it gives me a clear feeling or makes me notice something differently.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, although I am not an expert.", "喜歡，雖然我不是專家。我喜歡那種會讓我有明確感受，或讓我用不同方式看事情的藝術。"], ["Part 1", "Art", "Do you want to be an artist?", "No. I enjoy art, but I do not think I have the patience or skill to make it my career.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No.", "不會。我喜歡藝術，但我不覺得自己有足夠耐心或技巧把它當成職業。"], ["Part 1", "Art", "Do you like visiting art galleries?", "Sometimes. I enjoy them more when there is enough space and information to understand the work.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Sometimes.", "有時會。如果空間舒服，而且有足夠資訊讓我理解作品，我會更喜歡逛美術館。"], ["Part 1", "Art", "Do you like modern art or traditional art?", "I probably prefer traditional art because it is easier for me to understand, but some modern art is interesting when the idea is clear.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I probably prefer traditional art because it is easier for me to understand, but some modern art is interesting when the idea is clear.", "我大概比較喜歡傳統藝術，因為比較容易理解。不過如果概念很清楚，有些現代藝術也很有趣。"], ["Part 1", "Building", "Do you want to live in a tall building?", "Not very high. A higher floor can have a nice view, but I would worry about elevators and emergencies.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not very high.", "不想住太高。高樓層可能景色很好，但我會擔心電梯和緊急狀況。"], ["Part 1", "Building", "Is there a building that you would like to visit?", "Yes, Taipei 101 is always interesting because it combines design, engineering and a great city view.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, Taipei 101 is always interesting because it combines design, engineering and a great city view.", "有，台北 101 一直都很有趣，因為它同時有設計、工程和很棒的城市景觀。"], ["Part 1", "Building", "Do you take photos of buildings?", "Sometimes, especially if the shape or lighting is unusual. I do not photograph every building I see.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Sometimes, especially if the shape or lighting is unusual.", "有時會，尤其建築的形狀或光線很特別時。不過我不會看到每棟建築都拍照。"], ["Part 1", "Building", "Are there tall buildings near your home?", "Yes, because I live in an urban area. There are many apartment and office buildings around the greater Taipei area.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, because I live in an urban area.", "有，因為我住在都市區。大台北附近有很多住宅和辦公大樓。"], ["Part 1", "Old buildings", "Are there any old buildings you want to see in the future? Why?", "Yes. I would like to visit old buildings that still show how people lived in the past because real places make history easier to imagine.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我想看那些還能讓人感受到以前生活方式的老建築，因為真的站在那個地方會比只讀歷史更容易想像。"], ["Part 1", "Old buildings", "Do you prefer living in an old building or a modern house？", "A modern home. I like the character of old buildings, but I care more about safety, plumbing and maintenance for daily life.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A modern home.", "我會選現代的房子。我喜歡老建築的特色，但真正生活時，我更在意安全、管線和維修。"], ["Part 1", "Old buildings", "Do you think we should preserve old buildings in cities？", "Yes, if they have real historical or cultural value. We should not keep every old building, but important ones give a city memory.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, if they have real historical or cultural value.", "如果真的有歷史或文化價值，我覺得應該保存。不是每棟老建築都要留下，但重要的建築會保留一座城市的記憶。"], ["Part 1", "Old buildings", "Have you ever seen old buildings in the city？", "Yes. Older temples, houses and public buildings can still be found in many parts of Taiwan.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。台灣很多地方還看得到老寺廟、老房子和舊公共建築。"], ["Part 1", "Scenery", "Do you like to take scenery pictures?", "Yes, especially mountains or open views. I usually take a few pictures and then put my phone away.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially mountains or open views.", "喜歡，尤其是山景或很開闊的景色。我通常拍幾張之後就會把手機收起來。"], ["Part 1", "Scenery", "Do you prefer the mountains or the sea?", "The mountains. I like cooler air and the feeling of being away from busy city streets.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "The mountains.", "我比較喜歡山。空氣通常比較涼，而且會有離開繁忙城市街道的感覺。"], ["Part 1", "Scenery", "Do you look out the window at the scenery when travelling by bus or car?", "Yes, especially on longer trips. Looking outside makes the journey feel less boring.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially on longer trips.", "會，尤其是比較長的旅程。看窗外風景會讓路程沒那麼無聊。"], ["Part 1", "Scenery", "What are the most beautiful sights you have seen while travelling?", "Mountain views are some of the most memorable for me, especially when there is a wide open view and fewer buildings.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Mountain views are some of the most memorable for me, especially when there is a wide open view and fewer buildings.", "山景是我最難忘的風景之一，尤其是視野很開闊、周圍建築又比較少的地方。"], ["Part 1", "Sports Team", "What are the differences between team sports and individual sports?", "Team sports need communication and shared responsibility, while individual sports depend more directly on one person's performance.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Team sports need communication and shared responsibility, while individual sports depend more directly on one person's performance.", "團隊運動需要溝通和共同負責；個人運動則更直接取決於一個人的表現。"], ["Part 1", "Sports Team", "Do you like watching team games?", "Yes, especially baseball. I enjoy the way one small play can change the whole game.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially baseball.", "喜歡，尤其是棒球。我很喜歡一個小小的play就可能改變整場比賽的感覺。"], ["Part 1", "Sports Team", "Are team sports popular in your culture?", "Yes. Baseball and basketball are both popular in Taiwan, especially big professional or international games.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "很熱門。棒球和籃球在台灣都很受歡迎，尤其大型職業賽或國際賽。"], ["Part 1", "Sports Team", "Have you ever been part of a sports team?", "Not seriously. I have taken part in school activities, but I have never been a committed competitive team athlete.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not seriously.", "沒有很正式參加過。我參加過學校的一些活動，但從來沒有認真當過競技型球隊的隊員。"], ["Part 1", "Food", "Has your favorite food changed since you were a child?", "Yes. I used to prefer sweeter and simpler food. Now I enjoy a wider range of flavours and different kinds of cuisine.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我以前比較喜歡甜一點、簡單一點的食物。現在能接受更多味道和不同料理。"], ["Part 1", "Food", "What kind of food did you like when you were young?", "I liked simple, familiar food and sweeter snacks. I was much less adventurous with food than I am now.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I liked simple, familiar food and sweeter snacks.", "我小時候喜歡簡單、熟悉的食物和比較甜的零食。那時候比現在更不敢嘗試新食物。"], ["Part 1", "Food", "What is your favorite food?", "I really enjoy Korean barbecue because I like both the food and the social feeling of cooking and sharing at the table.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I really enjoy Korean barbecue because I like both the food and the social feeling of cooking and sharing at the table.", "我很喜歡韓式烤肉，因為我不只喜歡食物，也喜歡大家一起烤、一起分享的感覺。"], ["Part 1", "Food", "Do you eat different foods at different times of the year?", "A little. Hot pot feels especially good in cooler weather, while lighter food is easier in a hot summer.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A little.", "會一點。天氣冷時火鍋特別適合，夏天很熱時則比較想吃清爽的東西。"], ["Part 1", "Morning time", "Do you like getting up early in the morning?", "Not really. I can do it when I need to, but I am not naturally very energetic early in the morning.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not really.", "不太喜歡。需要的時候我可以早起，但我天生不是一大早就很有精神的人。"], ["Part 1", "Morning time", "What did you do in the morning when you were little?", "I usually followed a simple school routine: wake up, eat breakfast, get ready and leave home.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually followed a simple school routine: wake up, eat breakfast, get ready and leave home.", "小時候早上通常就是固定上學流程：起床、吃早餐、準備好，然後出門。"], ["Part 1", "Morning time", "Are there any differences between what you do in the morning now and what you did in the past?", "Yes. Now I need to manage my own schedule, while as a child my family and school routine decided most things for me.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。現在我要自己安排時間，小時候則大多是家人和學校的作息幫我決定好。"], ["Part 1", "Morning time", "Do you spend your mornings doing the same things on both weekends and weekdays?", "No. Weekdays are more structured, while weekends are slower and I usually get up later.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No.", "不一樣。平日比較有固定節奏，週末比較慢，我通常也會晚一點起床。"], ["Part 1", "Evening time", "What do you hate doing in the evening?", "I dislike dealing with stressful work or complicated decisions late at night. By then, my concentration is much lower.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I dislike dealing with stressful work or complicated decisions late at night.", "我不喜歡晚上很晚還處理壓力大的工作或複雜決定。到了那個時間，我的專注力已經比較差了。"], ["Part 1", "Evening time", "Do you like the morning or evening?", "The evening. I feel more relaxed because the main tasks of the day are usually finished.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "The evening.", "我比較喜歡晚上。一天主要的事情通常都做完了，所以我會比較放鬆。"], ["Part 1", "Evening time", "What did you do in the evening when you were little? Why?", "I usually did homework, watched TV and spent time with family because school took up most of the day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually did homework, watched TV and spent time with family because school took up most of the day.", "小時候晚上通常寫作業、看電視、跟家人相處，因為白天大部分時間都在學校。"], ["Part 1", "Evening time", "Are there any differences between what you do in the evening now and what you did in the past?", "Yes. I use my phone and laptop much more now, and I also have more responsibility for planning my own time.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。現在晚上會用手機和筆電更多，而且也要自己負責安排時間。"], ["Part 1", "Evening time", "Do you spend your evenings doing the same things on both weekends and weekdays? Why?", "No. Weekday evenings are for rest and necessary tasks, while weekend evenings are more flexible.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No.", "不一樣。平日晚上主要是休息和做必要的事，週末晚上就比較自由。"], ["Part 1", "Pets and Animals", "What's your favorite animal?", "I like dogs because they are expressive and easy to interact with. I also like that they can build a strong bond with people.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I like dogs because they are expressive and easy to interact with.", "我喜歡狗，因為牠們的情緒很容易看出來，也很容易跟人互動。我也喜歡狗可以跟人建立很深的關係。"], ["Part 1", "Pets and Animals", "Where do you prefer to keep your pet, indoors or outdoors?", "Indoors, especially in a city. I would still make sure the pet gets enough exercise outside.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Indoors, especially in a city.", "我會放在室內，尤其住在城市的話。不過我還是會確保寵物有足夠戶外活動。"], ["Part 1", "Pets and Animals", "Have you ever had a pet before?", "No, I have not kept a pet for a long time. I like animals, but I know they need daily care and responsibility.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No, I have not kept a pet for a long time.", "沒有長期養過寵物。我喜歡動物，但也知道養寵物需要每天照顧和負責。"], ["Part 1", "Pets and Animals", "What is the most popular animal in Taiwan?", "Dogs and cats are probably the most common pets. Many people treat them like family members.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Dogs and cats are probably the most common pets.", "狗和貓應該是最常見的寵物。很多人會把牠們當成家人。"], ["Part 1", "Memory", "How do you remember important things?", "I use phone reminders and short notes. I would rather write important things down than keep everything in my head.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I use phone reminders and short notes.", "我會用手機提醒和簡短筆記。重要的事情我寧願寫下來，不想全部放在腦袋裡。"], ["Part 1", "Memory", "What do you need to remember in your daily life?", "Appointments, deadlines, passwords, tasks and things I need to bring with me.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Appointments, deadlines, passwords, tasks and things I need to bring with me.", "約會、截止日期、密碼、待辦事項，還有每天出門需要帶的東西。"], ["Part 1", "Memory", "Are you good at memorizing things?", "I am better at remembering ideas than exact details. I remember more when I understand the reason or connect it with an example.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I am better at remembering ideas than exact details.", "我比較會記概念，不太會記很精確的細節。如果我理解原因或能連到一個例子，就會記得比較久。"], ["Part 1", "Gifts", "Have you ever sent handmade gifts to others?", "Not many. I usually choose a personal gift rather than making one because I am not very good at crafts.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not many.", "沒有送過很多手作禮物。我比較常挑一個有個人意義的禮物，因為我不是很會做手作。"], ["Part 1", "Gifts", "Have you ever received a great gift?", "Yes. The gifts I remember most are usually connected with a special moment, not necessarily the most expensive ones.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我最記得的通常是跟某個重要時刻有關的禮物，不一定是最貴的。"], ["Part 1", "Gifts", "What do you consider when choosing a gift?", "I think about the person's interests, the occasion and whether the gift feels personal.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I think about the person's interests, the occasion and whether the gift feels personal.", "我會考慮對方的興趣、場合，以及這個禮物有沒有讓人感覺是特別為他挑的。"], ["Part 1", "Gifts", "Do you think you are good at choosing gifts?", "I am better when I know the person well. I prefer choosing one meaningful thing instead of something expensive but random.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I am better when I know the person well.", "如果很了解對方，我就比較會挑。我寧願選一個有意義的東西，也不要只是貴但很隨便。"], ["Part 1", "Gifts", "What gift have you received recently?", "A memorable gift for me was flowers around graduation. The timing made them feel more special than the price.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A memorable gift for me was flowers around graduation.", "對我來說很難忘的是畢業時收到的花。特別的是那個時機，不是價格。"], ["Part 1", "Hobby", "Do you have any hobbies?", "Yes. I like listening to music, watching thriller or mystery films, and reading novels.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我喜歡聽音樂、看驚悚或懸疑電影，也會看小說。"], ["Part 1", "Hobby", "Did you have any hobbies when you were a child?", "Yes. I liked cycling and simple outdoor activities more than I do now.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。小時候我比現在更喜歡騎腳踏車和簡單戶外活動。"], ["Part 1", "Hobby", "Do you have a hobby that you've had since childhood?", "Music has stayed with me for a long time, although the artists and styles I listen to have changed.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Music has stayed with me for a long time, although the artists and styles I listen to have changed.", "音樂是一直保留下來的興趣，只是我聽的歌手和曲風變過。"], ["Part 1", "Hobby", "Do you have the same hobbies as your family members?", "Some overlap, but not exactly. We may watch things together, but my music and film choices are more personal.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Some overlap, but not exactly.", "有些有重疊，但不完全一樣。我們可能會一起看東西，不過我的音樂和電影喜好比較個人。"], ["Part 1", "Feeling bored", "Do you think childhood is boring or adulthood is boring?", "Adulthood can feel more repetitive because of responsibilities, but childhood can also be boring when children have little control. It depends on the situation.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Adulthood can feel more repetitive because of responsibilities, but childhood can also be boring when children have little control.", "成人生活因為責任比較多，有時會比較重複；但小孩如果沒什麼選擇，也可能覺得無聊，所以還是看情況。"], ["Part 1", "Feeling bored", "What do you do when you feel bored?", "I usually change activities, listen to music or watch something short. If I keep scrolling my phone, I often feel even more bored.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually change activities, listen to music or watch something short.", "我通常會換一件事情做、聽音樂，或看短一點的內容。如果一直滑手機，我反而常常會更無聊。"], ["Part 1", "Feeling bored", "When would you feel bored?", "I feel bored when something is repetitive and I cannot take part, such as listening to a long talk with no interaction.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I feel bored when something is repetitive and I cannot take part, such as listening
