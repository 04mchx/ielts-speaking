 to a long talk with no interaction.", "當事情一直重複，而且我又不能參與時會覺得無聊，例如一直聽沒有互動的長篇講話。"], ["Part 1", "Feeling bored", "Do you often feel bored?", "Not very often. I usually have something to do, but I can feel bored when I am tired and do not want to start anything.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not very often.", "沒有很常。我通常都有事情可以做，但很累又不想開始任何事時，就容易覺得無聊。"], ["Part 1", "Collecting things", "Where do you usually keep things you need?", "I keep important things in fixed places in my room, especially my desk or drawers. It saves time when I know exactly where everything is.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I keep important things in fixed places in my room, especially my desk or drawers.", "重要的東西我會固定放在房間裡某些位置，尤其是書桌或抽屜。知道每樣東西在哪裡會省很多時間。"], ["Part 1", "Collecting things", "Would you keep old things for a long time? Why?", "Only if they are useful or carry a strong memory. I do not want to keep things just because they are old.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only if they are useful or carry a strong memory.", "只有東西還有用，或有很強的回憶時，我才會留很久。我不想只是因為它舊就一直留著。"], ["Part 1", "Collecting things", "Are there any things you have kept from your childhood?", "Yes, a few photos and small personal items. I prefer keeping a small number of meaningful things.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, a few photos and small personal items.", "有，一些照片和小型個人物品。我比較喜歡只留下少數真的有意義的東西。"], ["Part 1", "Collecting things", "Do you collect things?", "Not seriously. I do not enjoy owning a lot of the same kind of object.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not seriously.", "沒有認真收藏。我不太喜歡擁有一大堆同類型的東西。"], ["Part 1", "Lost and found", "Have you ever lost your keys？", "I have misplaced them before, but not for very long. Now I try to keep my keys in the same place.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I have misplaced them before, but not for very long.", "有弄丟過一下，但沒有很久。現在我會盡量把鑰匙固定放在同一個地方。"], ["Part 1", "Lost and found", "Will you post on social media if you lose your item?", "Only if the item is important and I think people nearby may have seen it. I would first check the place and contact staff.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only if the item is important and I think people nearby may have seen it.", "只有東西很重要，而且我覺得附近的人可能看過時，我才會發社群。第一步還是先回原地找和問工作人員。"], ["Part 1", "Lost and found", "Have you ever lost things?", "Yes, small things from time to time. Usually it happens when I put something in an unusual place and forget.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, small things from time to time.", "有，偶爾會弄丟小東西。通常是我把東西放到不平常的位置，之後就忘了。"], ["Part 1", "Lost and found", "Do you report to the police when finding something lost by others? Why?", "For a valuable item or official document, yes, or I would give it to nearby staff. I want the owner to have a real chance to get it back.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "For a valuable item or official document, yes, or I would give it to nearby staff.", "如果是貴重物品或正式證件，我會報警，或至少交給附近工作人員。我要讓失主真的有機會拿回去。"], ["Part 1", "Lost and found", "What will you do if you find something lost by others?", "I would check whether there is an obvious owner, then give it to staff or a lost-and-found point.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I would check whether there is an obvious owner, then give it to staff or a lost-and-found point.", "我會先看看能不能找到明顯的失主，再交給工作人員或失物招領處。"], ["Part 1", "Tiredness", "When you feel tired, do you still go out with your friends?", "Usually no. If I am really tired, I would rather rest and meet them another day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Usually no.", "通常不會。如果真的很累，我寧願先休息，改天再跟朋友見。"], ["Part 1", "Tiredness", "What do you do when you feel tired?", "I rest, take a short nap if possible, or do something quiet like listening to music.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I rest, take a short nap if possible, or do something quiet like listening to music.", "我會休息，如果可以就小睡一下，或做一些安靜的事，例如聽音樂。"], ["Part 1", "Tiredness", "When would you feel tired?", "Usually after sleeping too little or concentrating for a long time. Busy days make it much worse.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Usually after sleeping too little or concentrating for a long time.", "通常是睡太少，或長時間專心後會累。行程很忙的日子會更明顯。"], ["Part 1", "Tiredness", "Do you often feel tired?", "On busy weekdays, yes. I sometimes sleep only around six hours, so I notice the difference.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "On busy weekdays, yes.", "忙的平日滿常會。我有時只睡六個小時左右，所以身體會很有感。"], ["Part 1", "Travelling", "Do you prefer to sit by the window when travelling?", "Yes. I like looking outside, especially on a long bus or train ride.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "喜歡。我喜歡看窗外，尤其是長途公車或火車旅程。"], ["Part 1", "Travelling", "Did you have a long journey with your family as a child?", "Yes. I remember family trips where I had to sit in a car for a long time. As a child, long rides felt much longer than they do now.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我記得小時候跟家人旅行，有些路程要坐很久的車。小時候會覺得長途車程比現在漫長很多。"], ["Part 1", "Morning routines", "Do you like to get up early in the morning?", "Not naturally, but I can do it when I have an important reason. I prefer not to rush.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not naturally, but I can do it when I have an important reason.", "我天生不喜歡早起，但有重要事情時可以。我比較不喜歡早上一路趕。"], ["Part 1", "Morning routines", "What is your morning routine?", "I get up, wash, get dressed, check what I need for the day and eat something simple.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I get up, wash, get dressed, check what I need for the day and eat something simple.", "我會起床、洗漱、換衣服、確認今天要帶什麼，再吃一點簡單的東西。"], ["Part 1", "Morning routines", "Is breakfast important?", "Yes, especially on a busy morning. I do not need a big breakfast, but eating something helps my energy.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially on a busy morning.", "重要，尤其是忙碌的早上。我不需要吃很大份，但有吃一點會比較有精神。"], ["Part 1", "Morning routines", "What do you do right after getting up in the morning?", "I usually check the time, wash my face and start getting ready. I try not to stay in bed scrolling too long.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually check the time, wash my face and start getting ready.", "我通常先看時間、洗臉、開始準備。我會盡量不要躺在床上滑手機太久。"], ["Part 1", "Shopping", "Have you ever returned anything you bought online?", "Yes. Online shopping is convenient, but sometimes the size or actual product is different from what I expected.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。網購很方便，但有時尺寸或實際商品跟我想的不一樣。"], ["Part 1", "Shopping", "Do you prefer online shopping or in-store shopping?", "Online for simple things I already know, and stores for clothes or shoes because I want to check them in person.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Online for simple things I already know, and stores for clothes or shoes because I want to check them in person.", "已經很熟的簡單商品會網購，衣服或鞋子我比較喜歡到店裡，因為想親自確認。"], ["Part 1", "Shopping", "How often do you go shopping?", "Only when I need something. I do not go shopping every week just for fun.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only when I need something.", "真的需要東西才會去買。我不會每週只是為了逛而買東西。"], ["Part 1", "Shopping", "Do you like shopping?", "A little. I enjoy looking around with friends, but I do not like buying things I 沒有一個完美年齡。當健康、人際關係和人生方向都比較穩定時，人會比較容易快樂。"], ["Part 1", "Life stages", "How do people remember each stage of their lives?", "Through photos, places, music and important events. Small things can bring back a whole period very quickly.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Through photos, places, music and important events.", "透過照片、地方、音樂和重要事件。很小的東西有時就能很快把整個人生階段帶回來。"], ["Part 1", "Life stages", "Do you have any plans for the next five years?", "Yes. I want to continue my education, build stronger technical skills and get more international experience.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。我想繼續進修、加強技術能力，也希望累積更多國際經驗。"], ["Part 1", "Life stages", "What do you think is the most important at the moment?", "My next step in education is very important to me right now, especially English and graduate-school preparation.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "My next step in education is very important to me right now, especially English and graduate-school preparation.", "目前最重要的是下一個教育階段，尤其是英文和研究所申請準備。"], ["Part 1", "Life stages", "What did you often do with your friends in your childhood?", "We talked at school, shared snacks and did simple activities together. Friendship was much easier because we saw each other every day.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "We talked at school, shared snacks and did simple activities together.", "以前會在學校聊天、分享零食，也一起做很簡單的活動。那時候每天都見面，所以交朋友容易很多。"], ["Part 1", "Reading", "Do you prefer scanning or detailed reading?", "Scanning first. I like to understand the structure before deciding which part needs careful reading.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Scanning first.", "我會先快速掃讀。我喜歡先知道文章結構，再決定哪一部分需要仔細讀。"], ["Part 1", "Reading", "When do you need to read carefully, and when not?", "I read carefully for instructions, contracts or important study material. I scan when out with family.", "有，尤其是跟家人出去時。小時候週末散步或騎腳踏車都很平常。"], ["Part 1", "Walking", "Do you walk a lot?", "A fair amount, mostly as part of daily transport rather than formal exercise.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A fair amount, mostly as part of daily transport rather than formal exercise.", "算不少，但主要是日常移動時走路，不是正式把它當成運動。"], ["Part 1", "Typing", "How do you improve your typing?", "Mostly through daily use. I also slow down when accuracy matters instead of trying to type as fast as possible.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Mostly through daily use.", "主要就是每天使用。我也會在重視準確度時刻意放慢，不會只追求打字速度。"], ["Part 1", "Typing", "When did you learn how to type on a keyboard?", "I started when I was young because schoolwork gradually required computers. Over time it became automatic.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I started when I was young because schoolwork gradually required computers.", "我很小的時候就開始學，因為學校作業慢慢需要用電腦。久了之後打字就變得很自然。"], ["Part 1", "Typing", "Do you type on a desktop or laptop keyboard every day?", "Yes, almost every day. A keyboard is still much easier than a phone for long writing.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, almost every day.", "會，幾乎每天。需要寫長內容時，鍵盤還是比手機容易很多。"], ["Part 1", "Typing", "Do you prefer typing or handwriting?", "Typing for most tasks because it is faster and easier to edit. I use handwriting for quick notes or memory.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Typing for most tasks because it is faster and easier to edit.", "大部分事情我比較喜歡打字，因為快又好修改。手寫則適合快速筆記或幫助記憶。"], ["Part 1", "Spare time", "Would you like to have more free time in the future?", "Yes, especially time when I do not feel guilty for resting. I would like a better balance between goals and recovery.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially time when I do not feel guilty for resting.", "想，尤其是那種休息時不會有罪惡感的自由時間。我希望未來能在目標和恢復之間更平衡。"], ["Part 1", "Spare time", "Which day do you have more free time on, Saturday or Sunday?", "Usually Sunday because Saturday is more likely to include errands or plans.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Usually Sunday because Saturday is more likely to include errands or plans.", "通常星期日，因為星期六比較容易有雜事或其他安排。"], ["Part 1", "Spare time", "What do you usually do in your spare time?", "I listen to music, watch thrillers or mystery films, read, or simply stay home and rest.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I listen to music, watch thrillers or mystery films, read, or simply stay home and rest.", "我會聽音樂、看驚悚或懸疑電影、閱讀，或乾脆待在家休息。"], ["Part 1", "Spare time", "Do you often have free time?", "Not a lot on busy weekdays, but I usually have more space on weekends.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not a lot on busy weekdays, but I usually have more space on weekends.", "忙的平日不多，但週末通常比較有空。"], ["Part 1", "Spare time", "Do you have more free time on weekdays or at weekends?", "Definitely at weekends. Weekdays are more structured and tiring.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Definitely at weekends.", "一定是週末。平日時間比較固定，也比較累。"], ["Part 1", "Singing", "Do you think singing can bring happiness to people?", "Yes. Singing can release stress and create a shared mood, even if someone is not a great singer.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "會。唱歌可以釋放壓力，也能讓大家一起進入同一種情緒，就算唱得不好也沒關係。"], ["Part 1", "Singing", "Who do you want to sing for?", "Honestly, no one in particular. I am more comfortable singing along to music when I am alone.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Honestly, no one in particular.", "老實說沒有特別想唱給誰聽。我一個人的時候跟著音樂唱會比較自在。"], ["Part 1", "Singing", "Have you ever learnt how to sing?", "Only in basic school music classes. I have never had serious vocal training.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only in basic school music classes.", "只有在學校上過基本音樂課，沒有接受過正式聲樂訓練。"], ["Part 1", "Singing", "Do you like singing?", "A little. I enjoy singing along privately, but I would not want to perform in front of people.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A little.", "有一點。我喜歡自己跟著音樂唱，但不想在很多人面前表演。"], ["Part 1", "Singing", "Have you ever taken a singing class?", "No, not a special singing class. My experience is mostly just normal school music.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "No, not a special singing class.", "沒有上過專門的唱歌課，主要就是一般學校音樂課。"], ["Part 1", "Singing", "Do you like listening to others singing?", "Yes, especially singers with emotion in their voice. I care more about feeling than showing off difficult technique.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially singers with emotion in their voice.", "喜歡，尤其是聲音裡很有感情的歌手。比起炫技，我更在意能不能讓人感受到情緒。"], ["Part 1", "Street market", "Are there many street markets in China?", "I am from Taiwan, so I cannot speak for China from personal experience. In Taiwan, night markets and street markets are very common.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I am from Taiwan, so I cannot speak for China from personal experience.", "我是台灣人，所以沒辦法用個人經驗回答中國。不過在台灣，夜市和街頭市場非常常見。"], ["Part 1", "Street market", "When was the last time you went to a street market?", "Not very long ago. I usually go for food rather than shopping for a specific item.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not very long ago.", "沒有很久。我去街頭市場通常是為了吃東西，不是特別去買某個商品。"], ["Part 1", "Street market", "Do you prefer to go shopping in the shopping mall or on the street market?", "A shopping mall for normal shopping because it is comfortable and organised. I prefer street markets when I want food and atmosphere.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A shopping mall for normal shopping because it is comfortable and organised.", "一般購物我比較喜歡百貨公司，因為舒服又有秩序。想吃東西、感受氣氛時，我比較喜歡街頭市場。"], ["Part 1", "Street market", "What do people usually buy on the street market？", "Food, drinks, clothes and small everyday items. In Taiwan, food is probably the biggest attraction.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Food, drinks, clothes and small everyday items.", "食物、飲料、衣服和一些日常小物。在台灣，食物大概是最大的吸引力。"], ["Part 1", "Public gardens and parks", "Would you like to play in a public garden or park？", "Yes, especially for walking or light outdoor activities. I like having open space without needing to spend money.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially for walking or light outdoor activities.", "會，尤其是散步或做一些輕鬆的戶外活動。我喜歡不用花錢就能有開放空間。"], ["Part 1", "Public gardens and parks", "What do you like to do when visiting a park？", "I like walking, sitting for a while and talking with someone. I do not need many activities.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I like walking, sitting for a while and talking with someone.", "我喜歡走走、坐一下，跟別人聊天。不需要安排很多活動。"], ["Part 1", "Public gardens and parks", "How are the parks today different from those you visited as a kid?", "Many parks today have better equipment, cleaner paths and more spaces for different age groups.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Many parks today have better equipment, cleaner paths and more spaces for different age groups.", "現在很多公園有更好的設備、更乾淨的步道，也有更多適合不同年齡層的空間。"], ["Part 1", "Public gardens and parks", "Would you prefer to play in a personal garden or public garden？", "A public garden. It has more space and I do not need to take care of it myself.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A public garden.", "公共花園。我可以有更多空間，也不用自己負責照顧。"], ["Part 1", "Public gardens and parks", "Are there any parks you want to go to in the future?", "Yes, I would like to visit larger parks with good walking paths and more natural scenery.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, I would like to visit larger parks with good walking paths and more natural scenery.", "有，我想去比較大的公園，有好走的步道和更多自然景色。"], ["Part 1", "Public gardens and parks", "Would you like to see more parks in your city?", "Definitely. Dense cities need free green spaces where people can walk, rest and cool down.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Definitely.", "非常想。人口密集的城市很需要免費綠地，讓大家可以走路、休息、降溫。"], ["Part 1", "Public gardens and parks", "Do you still like going to parks now?", "Yes, although I do not go every week. Parks are useful when I want a simple break from buildings and traffic.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, although I do not go every week.", "喜歡，雖然不是每週都去。當我想暫時離開建築和車流時，公園很有用。"], ["Part 1", "Public gardens and parks", "Did you like going to parks as a child?", "Yes. Parks felt more exciting then because even simple playground equipment was enough to keep me busy.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "喜歡。小時候公園更讓我興奮，光是簡單遊樂設施就可以玩很久。"], ["Part 1", "Crowded place", "When was the last time you were in a crowded place?", "Probably on public transport or in a shopping area during a busy weekend. Crowds are hard to avoid around Taipei.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Probably on public transport or in a shopping area during a busy weekend.", "大概就是最近在大眾運輸或週末購物區。台北附近很難完全避開人潮。"], ["Part 1", "Crowded place", "Do most people like crowded places?", "Probably not all the time. People may enjoy the energy of a market or concert, but constant crowding is tiring.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Probably not all the time.", "應該不是一直都喜歡。人們可能喜歡市場或演唱會的熱鬧感，但長時間都很擁擠會很累。"], ["Part 1", "Crowded place", "Do you like crowded places?", "Not for long. I can enjoy a lively place for a while, but too much noise and movement quickly makes me tired.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not for long.", "不能太久。熱鬧的地方我可以享受一下，但太多聲音和人流很快就會讓我疲累。"], ["Part 1", "Crowded place", "Is there a crowded place near where you live?", "Yes. Stations, shopping streets and busy roads in the greater Taipei area can get very crowded.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。大台北地區的車站、購物街和主要道路都可能非常擁擠。"], ["Part 1", "Crowded place", "Is the city where you live crowded?", "Yes, quite crowded. New Taipei is very urban, especially during commuting hours.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, quite crowded.", "是，算很擁擠。新北很都市化，尤其通勤時段更明顯。"], ["Part 1", "The city you live in", "Would you recommend your city to others?", "Yes, especially to people who care about convenience. New Taipei has good transport and easy access to Taipei.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, especially to people who care about convenience.", "會，尤其推薦給很重視便利性的人。新北交通方便，而且很容易到台北。"], ["Part 1", "The city you live in", "What's the weather like where you live?", "It is quite humid. Summers are hot, and winters are mild but can feel colder when it rains.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It is quite humid.", "滿潮濕的。夏天很熱，冬天算溫和，但下雨時體感會比較冷。"], ["Part 1", "The city you live in", "Do you often see your neighbors?", "Not very often. I recognise a few people nearby, but we usually just greet each other.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not very often.", "不太常。我認得附近一些人，但通常就是打個招呼。"], ["Part 1", "The city you live in", "Is the city friendly to children and old people?", "In many areas, yes, because transport and daily services are easy to reach. Busy traffic can still be difficult for older people.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "In many areas, yes, because transport and daily services are easy to reach.", "很多地方算友善，因為交通和生活服務容易取得。不過繁忙交通對長輩還是可能不方便。"], ["Part 1", "The city you live in", "Are the people friendly in the city?", "Generally, yes. People may look busy, but most will help if you ask a simple question.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Generally, yes.", "整體來說算友善。大家可能看起來很忙，但你真的問一個簡單問題時，多數人還是會幫忙。"], ["Part 1", "The city you live in", "Are there people of different ages living in this city?", "Yes. There are students, workers, families and older residents, so the population is very mixed.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。有學生、上班族、家庭和年長居民，所以年齡層很混合。"], ["Part 1", "The city you live in", "Is this city your permanent residence?", "For now, yes, but I may move in the future for graduate study or work.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "For now, yes, but I may move in the future for graduate study or work.", "目前算是，但未來可能因為研究所或工作搬家。"], ["Part 1", "The city you live in", "Are there big changes in this city?", "Yes. Transport and urban development have changed a lot, and many areas are more connected than before.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。交通和都市發展變化很大，很多區域比以前更連通。"], ["Part 1", "The city you live in", "How long have you lived in this city?", "For most of my life, so the area feels very familiar to me.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "For most of my life, so the area feels very familiar to me.", "我人生大部分時間都住在這裡，所以對這個地方非常熟悉。"], ["Part 1", "The city you live in", "Do you like this city?", "Yes. The biggest reason is convenience because I can reach Taipei easily and find most things close to home.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "喜歡。最大的原因是方便，因為我很容易到台北，而且住家附近大部分東西都有。"], ["Part 1", "The city you live in", "What city do you live in?", "I live in New Taipei City, in the Sanchong area. It is right next to Taipei.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I live in New Taipei City, in the Sanchong area.", "我住在新北市三重，就在台北旁邊。"], ["Part 1", "Home & Accommodation", "Who do you live with?", "I live with my family in an apartment in Sanchong.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I live with my family in an apartment in Sanchong.", "我跟家人住在三重的一間公寓。"], ["Part 1", "Home & Accommodation", "Do you live in an apartment or a house?", "I live in an apartment, which is very common in the greater Taipei area.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I live in an apartment, which is very common in the greater Taipei area.", "我住公寓，這在大台北非常常見。"], ["Part 1", "Home & Accommodation", "What part of your home do you like the most?", "My bedroom, especially my desk area. It is where I study, use my laptop and relax.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "My bedroom, especially my desk area.", "我的房間，尤其是書桌附近。那是我讀書、用筆電和放鬆的地方。"], ["Part 1", "Home & Accommodation", "What’s the difference between where you are living now and where you have lived in the past?", "The location has not changed much, but my needs have. Now I care much more about having a good desk and a quiet space to study.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "The location has not changed much, but my needs have.", "地點沒有變很多，但我的需求變了。現在我更在意有一張好用的書桌和安靜的讀書空間。"], ["Part 1", "Home & Accommodation", "What kind of house or apartment do you want to live in in the future?", "A modern apartment near public transport. I do not need a huge place, but I want a quiet room and a large desk.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A modern apartment near public transport.", "我想住靠近大眾運輸的現代公寓。不需要很大，但希望有安靜的房間和大書桌。"], ["Part 1", "Home & Accommodation", "What room does your family spend most of the time in?", "Probably the living room because that is where we can watch TV and sit together.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Probably the living room because that is where we can watch TV and sit together.", "應該是客廳，因為大家可以在那裡看電視、坐在一起。"], ["Part 1", "Home & Accommodation", "What do you usually do in your apartment?", "I study, use my laptop, rest, listen to music and sometimes watch things with my family.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I study, use my laptop, rest, listen to music and sometimes watch things with my family.", "我會讀書、用筆電、休息、聽音樂，有時跟家人一起看東西。"], ["Part 1", "Home & Accommodation", "What kinds of accommodation do you live in?", "An apartment in an urban area. It is not huge, but it is convenient.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "An apartment in an urban area.", "我住在都市區的公寓。空間不算很大，但很方便。"], ["Part 1", "Home & Accommodation", "Do you plan to live there for a long time?", "Not necessarily. I am comfortable there now, but I may move for study or work later.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not necessarily.", "不一定。現在住得很舒服，但以後可能因為讀書或工作搬走。"], ["Part 1", "Home & Accommodation", "Can you describe the place where you live?", "It is an apartment in Sanchong, New Taipei City. The area is busy and convenient, and my favorite place at home is my bedroom.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It is an apartment in Sanchong, New Taipei City.", "我住在新北市三重的公寓。附近很熱鬧也很方便，我最喜歡家裡的房間。"], ["Part 1", "Home & Accommodation", "Do you prefer living in a house or an apartment?", "An apartment because it fits city life better for me and is usually closer to transport and shops.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, " ryday life rather than formal lessons.", "有，主要是從日常生活學到，不是正式課程。食物、家庭習慣和地方活動讓家鄉文化很自然地融入生活。"], ["Part 1", "Hometown", "Have you learned anything about the history of your hometown?", "A little, but not in great depth. I know Sanchong grew as a busy urban area close to Taipei, and I would like to learn more.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A little, but not in great depth.", "有一點，但沒有很深入。我知道三重是靠近台北、發展很繁忙的都市區，也希望之後多了解一些。"], ["Part 1", "Hometown", "Where is your hometown?", "My hometown is Sanchong, in New Taipei City. It is right next to Taipei.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "My hometown is Sanchong, in New Taipei City.", "我的家鄉是新北市三重，就在台北旁邊。"], ["Part 1", "Hometown", "Is that a big city or a small place?", "It is definitely an urban area rather than a small town. It is densely populated and usually busy.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It is definitely an urban area rather than a small town.", "它明顯是都市區，不是小鎮。人口密集，平常也很繁忙。"], ["Part 1", "Hometown", "Do you like your hometown?", "Yes, mainly because it is extremely convenient. Transport, shops and food are all easy to find.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, mainly because it is extremely convenient.", "喜歡，主要因為真的很方便。交通、商店和食物都很好找。"], ["Part 1", "Hometown", "What do you like (most) about your hometown?", "The convenience. I can reach Taipei easily, and daily services are very close.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "The convenience.", "最喜歡便利性。我很容易到台北，而且日常生活需要的服務都在附近。"], ["Part 1", "Hometown", "Is there anything you dislike about it?", "Yes. It can be crowded and noisy, especially during busy hours, so I sometimes wish there were more open space.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。尖峰時間可能很擁擠、很吵，所以有時我希望有更多開放空間。"], ["Part 1", "Hometown", "How long have you been living there?", "For most of my life because I grew up there.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "For most of my life because I grew up there.", "我人生大部分時間都住在那裡，因為我是在三重長大的。"], ["Part 1", "Hometown", "Do you like living there?", "Yes. It is not the quietest place, but daily life is very practical.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "喜歡。它不是最安靜的地方，但日常生活非常實用方便。"], ["Part 1", "Hometown", "Do you think you will continue living there for a long time?", "Probably not forever. I may move in the future for graduate study or work.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Probably not forever.", "大概不會永遠住。未來可能因為研究所或工作搬家。"], ["Part 1", "Hometown", "Please describe your hometown a little.", "Sanchong is a busy urban area in New Taipei City. It is crowded, very convenient, and closely connected to Taipei.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Sanchong is a busy urban area in New Taipei City.", "三重是新北市很繁忙的都市區。人多、非常方便，而且跟台北連得很近。"], ["Part 1", "Hometown", "Did you learn about the history of your hometown at school?", "Only a little. School focused more on Taiwan in general than on Sanchong's local history.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Only a little.", "只有一點。學校比較著重台灣整體歷史，而不是三重的地方史。"], ["Part 1", "Hometown", "Are there many young people in your hometown?", "Yes. Because it is part of the greater Taipei area, there are many students, young workers and families.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes.", "有。因為屬於大台北生活圈，所以有很多學生、年輕上班族和家庭。"], ["Part 1", "Hometown", "Is your hometown a good place for young people to pursue their careers?", "Yes, mainly because it is close to Taipei. People can live in Sanchong and commute to many job opportunities.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, mainly because it is close to Taipei.", "算是，主要因為靠近台北。人可以住在三重，再通勤到很多工作機會。"], ["Part 1", "The area you live in", "Do you live in a noisy or a quiet area?", "It is more on the noisy side because it is urban and busy. My room is quiet enough for me to rest, though.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "It is more on the noisy side because it is urban and busy.", "比較偏吵，因為是都市區又很繁忙。不過我的房間夠安靜，可以好好休息。"], ["Part 1", "The area you live in", "Are the people in your neighborhood nice and friendly?", "Generally, yes. We are not very close, but people are polite and usually willing to help.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Generally, yes.", "整體來說算友善。我們沒有很熟，但大家通常有禮貌，也願意幫忙。"], ["Part 1", "The area you live in", "Do you like the area that you live in?", "Yes, mainly because transport, shops and food are all close.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Yes, mainly because transport, shops and food are all close.", "喜歡，主要因為交通、商店和吃的都很近。"], ["Part 1", "The area you live in", "Where do you like to go in that area?", "I usually go to nearby restaurants, shops or a café because I prefer places that are easy to reach.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "I usually go to nearby restaurants, shops or a café because I prefer places that are easy to reach.", "我通常會去附近餐廳、商店或咖啡廳，因為我喜歡容易到的地方。"], ["Part 1", "The area you live in", "Do you know any famous people in your area?", "Not personally. I know public figures from New Taipei, but I do not know any celebrity in my own neighborhood.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "Not personally.", "沒有親自認識。我知道一些來自新北的公眾人物，但自己社區裡沒有認識名人。"], ["Part 1", "The area you live in", "What are some changes in the area recently?", "There are more new shops and buildings, and transport has become more convenient over time.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "There are more new shops and buildings, and transport has become more convenient over time.", "最近多了一些新店家和建築，交通也比以前方便。"], ["Part 1", "The area you live in", "Do you know any of your neighbors?", "A few, but not very closely. We usually say hello when we meet.", "中文重點：這題已逐題對應問題；英文答案以直接回答＋一個理由／細節為主。", "Part 1｜328/328 逐題人工對應", null, "A few, but not very closely.", "認識幾個，但沒有很熟。碰到時通常會打招呼。"], ["Part 2", "只見過一次且想繼續了解的人", "Describe a person you only met once recently and want to know more about", "A person I only met once but want to know more about was a student I met during my exchange in Rhode Island. We talked at a small welcome event for international students. She was from a different cultural background, and our conversation started with something simple—food and university life—but quickly became more interesting because we compared how students communicate with teachers in our countries.\n\nWhat impressed me was how naturally she asked questions. She did not treat cultural differences as strange. she simply wanted to understand the reason behind them.\n\nWe only spoke for about twenty minutes and then joined different groups, so I never got to know her properly.\n\nI want to meet her again because that short conversation reminded me that a person can make a strong impression without doing anything dramatic. Curiosity and genuine listening can make even a brief meeting feel meaningful.", "Rhode Island welcome event｜curiosity + listening → strong first impression", "Part 2｜Cue Card 逐題檢查", ["Who he/she is", "When you met him/her", "Why you want to know more about him/her", "And explain how you feel about him/her"], "一個熟悉故事 → 題目角度 → WHY → impact", "我只見過一次、但還想更了解的人，是我去羅德島交換時認識的一位學生。我們是在一個小型的國際學生歡迎活動上聊天的。她來自不同文化背景，一開始只是聊食物和大學生活，但後來我們開始比較不同國家的學生怎麼跟老師溝通，話題就變得更有意思。\n\n讓我印象最深的是，她問問題的方式很自然。她不會把文化差異當成奇怪的事情，只是單純想知道背後的原因。\n\n我們大概只聊了二十分鐘，後來就各自去跟別的團體聊天，所以其實沒有真正認識很深。\n\n我想再見到她，是因為那次短短的談話讓我發現，一個人不需要做什麼很戲劇化的事情，也能留下很深印象。好奇心和真心聆聽，可以讓一次很短的相遇也變得有意義。"], ["Part 2", "幫人提升健康狀態", "Describe a person whose health and fitness you have helped to improve", "A person whose health I tried to improve was a close friend who had become very inactive because of work. She often stayed at her desk for long hours and said she felt tired even on weekends.\n\nI did not give her a strict diet or exercise plan. I suggested something much simpler: take a twenty-minute walk after dinner a few times a week and drink water before buying a sweet drink.\n\nAt first, the difficult part was consistency, not the exercise itself. So I sometimes walked with her and treated it as time to talk rather than a workout.\n\nAfter a few weeks, she told me she was sleeping better and felt less heavy after work.\n\nThe experience taught me that healthy habits work best when they are simple enough to repeat. A perfect plan is useless if a person cannot keep it.", "朋友｜20 分鐘散步＋少一點含糖飲料｜simple enough to repeat", "Part 2｜Cue Card 逐題檢查", ["Who this person was", "Why you helped him/her", "How you helped him/her", "And explain whether it was easy or difficult"], "一個熟悉故事 → 題目角度 → WHY → impact", "我曾經幫助一位很要好的朋友改善健康狀況。她因為工作變得很少活動，常常在桌前坐很久，甚至週末也覺得很累。\n\n我沒有叫她嚴格節食，也沒有排很難的運動計畫。我只建議一件很簡單的事：每週幾次，晚餐後走二十分鐘，而且買含糖飲料前先喝水。\n\n一開始最難的不是運動本身，而是持續。所以有時候我會陪她一起走，把它當成聊天時間，不把它當成正式運動。\n\n過了幾週，她跟我說睡得比較好，下班後身體也沒有那麼沉重。\n\n這件事讓我知道，健康習慣最好簡單到可以一直做。再完美的計畫，如果一個人做不下去，也沒有用。"], ["Part 2", "教你新技能的人", "Describe a person who taught you a new skill", "The person who taught me a new skill was my father, and the skill was riding a bicycle. At first, he held the back of the bike because I was afraid of losing balance.\n\nHe kept telling me to look forward instead of staring at the ground. I fell a few times, but nothing serious happened, so he encouraged me to keep trying.\n\nThen one day I suddenly realised he was no longer holding the bike and I was riding by myself.\n\nWhat I remember most is not the technique. It is the way he gave me enough support without doing the whole thing for me.\n\nThat experience taught me that confidence often comes after practice, not before it. I became less afraid because I repeated the skill until my body knew what to do.", "爸爸＋腳踏車｜support → practice → confidence", "Part 2｜Cue Card 逐題檢查", ["Who this person was", "What the skill was", "How you learned it", "And explain how you felt about this person"], "一個熟悉故事 → 題目角度 → WHY → impact", "教我一個新技能的人是我爸爸，那個技能是騎腳踏車。一開始我很怕失去平衡，所以他會扶著腳踏車後面。\n\n他一直告訴我要看前面，不要一直盯著地面。我跌倒過幾次，但都沒有很嚴重，所以他一直鼓勵我繼續試。\n\n有一天，我突然發現他已經沒有扶著車了，而我正在自己騎。\n\n我最記得的其實不是騎車技巧，而是他給我剛剛好的幫助，卻沒有把整件事替我做完。\n\n這個經驗讓我明白，自信通常是在練習之後才出現，不是在練習之前。我一直重複那個動作，直到身體自己知道怎麼做，我就沒那麼害怕了。"], ["Part 2", "學習並喜歡歷史的人", "Describe a person who learns history and loves history", "A person I know who really enjoys history is a former classmate. She never studied history just to memorise dates. She watched documentaries, visited museums and often connected historical events with ordinary people's lives.\n\nI noticed this because whenever we visited a place with an old building, she would explain one small story about who lived there or what the area used to be like.\n\nShe likes history because it helps her understand why modern society looks the way it does.\n\nI enjoy talking with her because she makes the subject feel human rather than academic.\n\nShe changed my view of history as well. A date by itself is easy to forget, but a story about a real person's choices is much easier to remember.", "大學同學｜history = people + choices, not dates", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "How he/she learns history", "Why he/she loves history", "And explain how you feel about him/her"], "一個熟悉故事 → 題目角度 → WHY → impact", "我認識一位以前的同學，她真的很喜歡歷史。她不是只為了背年代而讀歷史，而是會看紀錄片、逛博物館，也常把歷史事件跟一般人的生活連在一起。\n\n我會注意到這點，是因為每次我們去到有老建築的地方，她都會講一個小故事，例如以前誰住在那裡，或那個地區以前是什麼樣子。\n\n她喜歡歷史，是因為歷史能幫助她理解現在的社會為什麼會變成這個樣子。\n\n我很喜歡跟她聊歷史，因為她會讓這個科目變得像在講人，而不是只像學術知識。\n\n她也改變了我對歷史的看法。一個日期很容易忘，但一個真實人物做過什麼選擇，就比較容易記住。"], ["Part 2", "擅⾧做手工的人", "Describe a person who is good at making things by hand", "A person I know who is good at making things by hand is a university friend who likes crochet. She makes small key chains, coasters and simple bags using coloured yarn.\n\nI first noticed the hobby because she once brought a handmade key chain to class. The shape was simple, but every stitch looked very even and neat.\n\nShe mostly learns new patterns from short videos online, then changes the colours or size to make the item her own.\n\nWhat I admire is her patience. Handmade work is slow, and a small mistake can mean undoing several rows.\n\nThat is why I think she is good at it. Her skill does not come from speed. It comes from being willing to repeat small actions carefully until the final object looks right.", "朋友＋crochet｜patience + repetition", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What he/she makes", "What materials or technologies he/she uses", "And why you think this person is good at making things by hand"], "一個熟悉故事 → 題目角度 → WHY → impact", "我有一位大學朋友很會做手工，她喜歡鉤針。她會用不同顏色的毛線做小吊飾、杯墊和簡單的袋子。\n\n我第一次注意到這個興趣，是因為她有一次帶了一個自己做的吊飾來上課。形狀不複雜，但每一針都很整齊。\n\n她大多是看網路上的短影片學新花樣，之後再改顏色或尺寸，做成自己的版本。\n\n我最佩服的是她的耐心。手作很慢，而且一個小錯誤可能就要拆掉好幾排重來。\n\n所以我覺得她厲害，不是因為速度快，而是她願意很仔細地重複小動作，直到最後做出來的東西看起來對。"], ["Part 2", "喜歡拍照的人", "Describe a person you know who really likes taking photos", "A person I know who really likes taking photos is one of my university friends. She takes photos almost everywhere we go, especially when we travel, eat somewhere new or see an interesting street.\n\nWhat I like is that she does not only photograph obvious tourist spots. She notices small details, such as light on a building, food on the table or a funny expression on someone's face.\n\nAt first I sometimes thought she took too many photos. Later I understood that photography is how she notices and stores moments.\n\nI enjoy looking back at the pictures because they bring back details I would otherwise forget.\n\nFor me, her photos are valuable not because they look professional, but because they preserve the feeling of ordinary moments.", "大學朋友｜small details → preserve ordinary moments", "Part 2｜Cue Card 逐題檢查", ["Who the person is", "When and how you got to know him/her", "Where he/she takes photos", "And explain how you feel about him/her"], "一個熟悉故事 → 題目角度 → WHY → impact", "我有一位大學朋友非常喜歡拍照。我們幾乎每次出去，她都會拍很多照片，尤其是旅行、去新餐廳或看到有趣街景的時候。\n\n我喜歡的是，她不只拍很明顯的觀光景點。她也會注意一些小細節，例如建築上的光、桌上的食物，或某個人很好笑的表情。\n\n一開始我有時覺得她拍太多了，後來我才明白，拍照就是她觀察和保存生活片段的方式。\n\n之後再回頭看那些照片時，我會想起很多本來可能已經忘掉的細節。\n\n對我來說，她的照片有價值，不是因為看起來很專業，而是因為它們把普通時刻的感覺保存下來。"], ["Part 2", "有條理的人", "Describe a person you know who is very organized", "I'd like to talk about one of my university classmates.\n\nWe worked on a group project together, and she was the most organized person in the team. She kept a simple list of what we had finished, what still needed to be done, and who was responsible for each part.\n\nI noticed that she did not make complicated plans. She just made the next step clear.\n\nBecause of that, our group had fewer misunderstandings and we finished the project on time.\n\nI admire this habit because being organized is not about making everything perfect. It is about reducing confusion so people can focus on the real work.", "中文重點：university classmate → simple task list → less confusion → project finished on time", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What this person usually does to stay organized", "And explain why you think being organized is important to him/her"], "university classmate → simple task list → less confusion → project finished on time", "我想講的是我的一位大學同學。\n\n我們一起做過一個小組專題，而她是整組裡最有條理的人。她會用一個很簡單的清單，記錄哪些事情做完了、哪些還沒做，以及每一部分是誰負責。\n\n我注意到她不會做很複雜的計畫，她只是把下一步弄清楚。\n\n所以我們組裡比較少誤會，也能準時完成專題。\n\n我很欣賞這個習慣，因為有條理不是要把所有事情做到完美，而是減少混亂，讓大家可以把注意力放在真正重要的工作上。"], ["Part 2", "快樂的人", "Describe a happy person you know", "A happy person I know is a close university friend. She is not cheerful every second, but she has a very healthy way of dealing with small problems.\n\nWhen something goes wrong, she usually complains for a minute, laughs at the situation and then asks what she can actually do next. She also enjoys very ordinary things, such as trying a new restaurant or having a long conversation over coffee.\n\nThat is why I see her as a happy person. Her happiness does not depend on everything going perfectly.\n\nBeing around her is relaxing because she does not create extra drama around small mistakes.\n\nShe reminds me that happiness is often less about having a perfect life and more about recovering quickly when normal life is imperfect.", "大學朋友｜happy = recover quickly, not perfect life", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What he/she is like", "How he/she shows happiness", "And explain why you think he/she is a happy person"], "一個熟悉故事 → 題目角度 → WHY → impact", "我認識一位很快樂的大學朋友。她不是每一秒都很開心，但她處理小問題的方式很健康。\n\n事情出錯時，她通常抱怨一分鐘、笑一下，然後就會問：那我現在真正能做什麼？她也很享受很普通的小事，例如去試一家新餐廳，或坐著喝咖啡聊很久。\n\n所以我覺得她是一個快樂的人。她的快樂不需要所有事情都完美才存在。\n\n跟她相處很放鬆，因為她不會把小錯誤變成更多不必要的戲劇。\n\n她會提醒我，快樂不一定是生活完美，而是當一般生活不完美時，自己恢復得有多快。"], ["Part 2", "做困難事情並成功的人", "Describe a person you know who did something difficult and was successful", "I'd like to talk about a university friend who completed a very difficult group project.\n\nAt first, our team had too much information and did not know how to put everything together. My friend suggested that we divide the problem into smaller parts and finish them one by one.\n\nShe also kept checking whether each part matched the main goal instead of just doing more work.\n\nIn the end, the presentation went well and the project was finished on time.\n\nWhat impressed me was not one brilliant idea. It was her patience and the way she made a difficult task feel manageable.", "中文重點：difficult university project → break it into parts → stay focused → success", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What difficult thing this person did", "Why this person was successful", "And explain how you feel about this person"], "difficult university project → break it into parts → stay focused → success", "我想講一位大學朋友，她曾經完成一個很困難的小組專題。\n\n一開始，我們組有太多資訊，不知道怎麼全部整合起來。她建議把問題拆成幾個小部分，再一個一個完成。\n\n她也會一直確認每一部分有沒有符合主要目標，而不是只是一直增加工作量。\n\n最後簡報很順利，專題也有準時完成。\n\n讓我印象最深的不是某一個很天才的點子，而是她的耐心，以及她讓一個很困難的任務變得可以一步一步處理。"], ["Part 2", "受歡迎的人", "Describe a popular person", "A popular person I often use for this topic is Ashin, the lead singer of Mayday. I have listened to the band's music for years, and what interests me is not simply that he is famous.\n\nHis lyrics often take ordinary emotions—pressure, failure, hope or growing up—and express them in simple words that people remember.\n\nThat gives listeners a personal connection with the music. The same song can mean something different at different ages.\n\nI think that is why his popularity has lasted. It is not only about visibility or celebrity status.\n\nPeople stay interested because they feel that some of the songs grew up with them. For me, emotional connection is much stronger than short-term attention.", "Ashin｜ordinary feelings → emotional connection → lasting popularity", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What kind of person he or she is", "When you see him/her normally", "And explain why you think this person is popular"], "一個熟悉故事 → 題目角度 → WHY → impact", "我會想到的受歡迎人物是五月天的主唱阿信。我聽五月天的歌很多年了，而我感興趣的不只是他很有名。\n\n他的歌詞常把壓力、失敗、希望或成長這些很普通的情緒，用很簡單、大家容易記住的字表達出來。\n\n所以聽歌的人會跟音樂建立很個人的連結。同一首歌，在不同年紀可能有不同的意思。\n\n我覺得這也是他能紅這麼久的原因。不是只有曝光或明星身分而已。\n\n人們會一直有興趣，是因為會覺得有些歌跟自己一起長大。對我來說，情感連結比短期的注意力強很多。"], ["Part 2", "欽佩的運動員", "Describe a successful sportsperson you admire", "A successful sportsperson I admire is Tai Tzu-ying, a Taiwanese badminton player.\n\nI first knew about her through international competitions. She has played at a very high level for many years and is known for her skill and calm style on the court.\n\nWhat I admire most is not only her talent. Top athletes face pressure, injuries and bad days, but they still have to train and compete again.\n\nShe also made many people in Taiwan pay more attention to badminton.\n\nI admire her because she shows that talent is only the starting point. To stay at a high level, a person also needs hard work and a strong mind.", "固定故事：Tai Tzu-ying → talent is the start → hard work + strong mind", "Part 2｜Cue Card 逐題檢查", ["Who he/she is", "What you know about him/her", "What he/she is like in real life", "What achievement he/she has made", "And explain why you admire him/her"], "Tai Tzu-ying → talent is the start → hard work + strong mind", "我很欣賞的一位成功運動員是台灣羽球選手戴資穎。\n\n我是從國際比賽開始認識她的。她很多年都維持在很高的水準，而且球場上的技巧和冷靜風格很有名。\n\n我最欣賞的不只是她的天分。頂尖運動員也會面對壓力、受傷和狀態不好的日子，但還是要繼續訓練、繼續比賽。\n\n她也讓很多台灣人更注意羽球。\n\n我佩服她，因為她讓我看到天分只是起點。要長時間維持高水準，還需要努力和很強的心理素質。"], ["Part 2", "尊敬的比你年⾧的人", "Describe someone who is older than you that you admire", "Someone older than me whom I admire is my father. What I respect most is not one achievement but the way he deals with people.\n\nHe taught me to listen first, understand why another person thinks differently, and then explain my own view without needing to be aggressive.\n\nI understood the value of that lesson much more after I became older and had to work with different personalities.\n\nWe do not need to do anything special together. Even ordinary conversations can be useful because he often looks at a problem from a calmer angle than I do.\n\nI admire him because his advice gives me direction without trying to control my decision. That is the kind of maturity I hope to develop myself.", "爸爸｜listen first｜maturity = calm judgement", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "How you knew this person", "What kinds of things you like to do together", "and explain how you feel about this person", "What do old people usually do in their daily life?"], "一個熟悉故事 → 題目角度 → WHY → impact", "我很敬佩的一位比我年長的人是我爸爸。我最尊敬的不是某一個成就，而是他跟人相處的方式。\n\n他教我要先聽，先理解別人為什麼會有不同想法，再說明自己的觀點，不需要很強勢。\n\n我長大之後，要跟不同個性的人相處，才更理解這個道理有多重要。\n\n我們不需要特別做什麼。就算只是普通聊天也很有用，因為他常能用比我更冷靜的角度看問題。\n\n我欣賞他，是因為他的建議會給我方向，但不會試著替我控制決定。這也是我希望自己未來能有的成熟。"], ["Part 2", "擅⾧學習和講新語言的人", "Describe a person who is good at learning and speaking new languages", "A person I met during my exchange in Rhode Island was very good at learning languages. She could communicate comfortably in English even though it was not her first language, and she was also learning another language.\n\nWhat stood out was her method. She did not wait until every sentence was perfect. She used the language first, noticed what went wrong and corrected it later.\n\nShe also listened to podcasts and copied short expressions she heard in daily conversation.\n\nThat impressed me because I used to think language learning needd a lot of preparation before speaking.\n\nShe showed me the opposite: using the language is part of the learning process.\n\nThat is why I remember her. She was not fearless because she was perfect. she became confident because she kept using the language before she felt completely ready.", "交換朋友｜use the language before you feel ready", "Part 2｜Cue Card 逐題檢查", ["How you got to know him/her", "How he/she learns a new language", "What languages he/she can speak", "And explain how you feel about him/her"], "一個熟悉故事 → 題目角度 → WHY → impact", "我在羅德島交換時遇過一個很會學語言的人。英文不是她的母語，但她可以很自在地用英文溝通，而且還在學另一種語言。\n\n最讓我注意的是她的方法。她不會等每一句都完美才開口，而是先使用語言，發現哪裡錯了，再慢慢修正。\n\n她也會聽 Podcast，模仿日常對話裡聽到的短句。\n\n這讓我印象很深，因為我以前總覺得開口前要先準備很多。\n\n她讓我看到相反的事情：使用語言本身就是學習的一部分。\n\n所以我會記得她。她不是因為完美才不害怕，而是因為在還沒完全準備好以前就一直使用語言，所以慢慢變得有自信。"], ["Part 2", "在成功公司工作的人", "Describe a person who works in a successful company", "A person I know who works in a successful company is a university friend who joined a technology company after graduation. Her role involves coordinating information between different teams, so she has to understand both the technical side and what the client actually needs.\n\nWhat makes the company successful, from what she tells me, is consistency. It does not depend on one brilliant product launch. The team keeps improving the service and responding when customers report problems.\n\nI find that interesting because people often describe success only in terms of profit.\n\nHer experience made me see that long-term success comes from trust. Customers return when a company solves the same type of problem reliably, not only when its advertising is impressive.", "大學朋友＋科技公司｜consistency → customer trust", "Part 2｜Cue Card 逐題檢查", ["Who he/she is", "What he/she does in the company", "What business the company does", "And explain why you think it is a successful company"], "一個熟悉故事 → 題目角度 → WHY → impact", "我有一位大學朋友畢業後進了一間很成功的科技公司。她的工作需要協調不同團隊之間的資訊，所以她既要理解技術端，也要知道客戶真正需要什麼。\n\n從她告訴我的情況來看，這間公司成功的原因是穩定。它不是靠一次很厲害的產品發表，而是一直改善服務，也會回應客戶反映的問題。\n\n我覺得這點很有意思，因為大家常常只用賺多少錢來說一間公司成不成功。\n\n她的經驗讓我看到，長期成功其實來自信任。客戶會回來，是因為公司能一直可靠地解決同一類問題，而不是只有廣告看起來很厲害。"], ["Part 2", "擁有成功事業的人", "Describe a person you know who has a successful business", "A person I know with a successful small business is a university friend whose family runs a food shop. I heard about it because she sometimes helps there on weekends.\n\nThe business is not huge, but it has regular customers who come back because the food and service are consistent.\n\nWhat I find interesting is that the family does not try to change everything to follow trends. They keep the main products stable, listen to customer feedback and make small improvements.\n\nThat is why I call it successful. A business does not need to become a giant company to succeed.\n\nIf it earns stable income, keeps customers and can continue operating without constantly creating problems, that is already a strong form of success.", "朋友家小吃店｜consistency → repeat customers", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "How you got to know him/her", "Why and how he/she started the business", "What business he/she does", "And explain why you think the business is successful"], "一個熟悉故事 → 題目角度 → WHY → impact", "我認識一個有成功小生意的人，是一位大學朋友，她家裡經營一家食品店。我會知道是因為她週末有時會去幫忙。\n\n這個生意不大，但有固定客人一直回來，因為食物和服務都很穩定。\n\n我覺得有意思的是，他們不會為了追流行就一直改掉所有東西。他們把主要產品維持穩定，聽客人的意見，再做一些小改進。\n\n所以我會說這是一個成功的事業。成功不一定要變成超大的公司。\n\n只要收入穩定、客人願意回來，而且可以長期經營，不用一直處理新的麻煩，我覺得這就已經是很好的成功。"], ["Part 2", "想從事醫療行業的人", "Describe a person you know who would like to choose a career in the medical field (e.g. a doctor, a nurse)", "A person I know who is interested in the medical field is a friend who has always been patient with people and is considering nursing.\n\nShe became interested in it after seeing how nurses supported a family member during a hospital visit. What impressed her was that the job was not only about medical knowledge. Nurses also had to explain things clearly and make anxious patients feel safer.\n\nShe knows the work can be tiring and emotionally demanding, so she is not choosing it because it looks easy or prestigious.\n\nThat is actually why I respect the choice. She understands the difficult parts and still feels the work would be meaningful.\n\nFor her, healthcare is a combination of technical skill and human support, and that balance suits her personality.", "朋友想當護理師｜technical skill + human support", "Part 2｜Cue Card 逐題檢查", ["When you knew him/her", "When he/she started to think about that", "What he/she would like to do", "And explain why he/she would like to choose this career"], "一個熟悉故事 → 題目角度 → WHY → impact", "我認識一位對醫療工作有興趣的朋友，她一直都很有耐心，也正在考慮走護理。\n\n她會開始有興趣，是因為有一次家人住院時，她看到護理師怎麼照顧和支持病人。讓她印象深的是，這個工作不只有醫療知識，護理師還要把事情說清楚，也要讓焦慮的病人比較安心。\n\n她知道這個工作會很累，也有很多情緒壓力，所以不是因為看起來輕鬆或有地位才想做。\n\n其實這反而是我尊重她選擇的原因。她了解困難的部分，但還是覺得這份工作有意義。\n\n對她來說，醫療是專業技能和人與人支持的結合，而這個平衡很適合她的個性。"], ["Part 2", "喜歡在家或花園種植物的人", "Describe a person who loves to grow plants (e.g. vegetables, flowers) at home or in the garden", "A person I know who enjoys growing plants is my father. He keeps a few simple plants and herbs at home and takes care of them in a very regular way.\n\nHe checks the soil, waters them when necessary and moves them when the light is not suitable.\n\nWhat I notice is that he never expects quick results. Growing plants forces you to wait and pay attention to small changes.\n\nI am often impatient when I study or work because I want to see progress quickly, so I find his hobby interesting.\n\nI think he likes it because it creates a slower rhythm in daily life. A plant cannot be rushed. You simply take care of it consistently and let time do part of the work.", "爸爸種植物｜patience + consistency", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What plants he/she grows", "How he/she grows the plants", "And explain why he/she loves growing plants"], "一個熟悉故事 → 題目角度 → WHY → impact", "我認識喜歡種植物的人是我爸爸。他在家裡種幾盆簡單的植物和香草，而且照顧得很規律。\n\n他會看土壤狀況，需要時澆水，光線不適合時也會移位置。\n\n我注意到他不會期待很快看到結果。種植物會逼你等待，也會讓你注意很小的變化。\n\n我讀書或做事時常常比較沒耐心，希望很快看到進度，所以我覺得他的興趣很有意思。\n\n我想他會喜歡，是因為這讓日常生活多一個比較慢的節奏。植物不能被催快，你就是持續照顧，剩下的部分交給時間。"], ["Part 2", "愛護自然的人", "Describe a person who likes to look after the natural world", "A person I know who cares about nature is one of my university friends. She is not an environmental expert, but she is very consistent about small habits.\n\nShe carries a reusable bottle, avoids unnecessary plastic bags and always checks that we do not leave rubbish behind when we travel.\n\nWhat I like is that she does not lecture other people. She simply treats nature as something we are responsible for when we use it.\n\nSpending time with her made environmental protection feel much more practical to me.\n\nPeople often imagine that protecting nature needs a huge sacrifice. Her behaviour shows the opposite: small repeated choices can become normal, and normal habits are much easier to keep than dramatic promises.", "大學朋友｜small repeated choices → normal habit", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What he or she does", "How he or she does it", "How often he or she does it", "And explain how you feel about this person"], "一個熟悉故事 → 題目角度 → WHY → impact", "我有一位大學朋友很愛護自然。她不是環境專家，但她在很多小習慣上很一致。\n\n她會帶環保水瓶、避免不必要的塑膠袋，而且旅行時一定會確認我們沒有留下垃圾。\n\n我喜歡的是，她不會一直教訓別人，而是很自然地把自然環境當成我們使用時也應該負責的東西。\n\n跟她相處之後，環保對我來說變得更實際。\n\n很多人以為保護自然一定要做很大的犧牲，但她的行為讓我看到相反的事：小小的選擇如果一直重複，就會變成正常習慣，而正常習慣比很戲劇化的承諾更容易維持。"], ["Part 2", "樂於助人的人", "Describe a person who often helps others", "A person who often helps others is a close friend of mine. She is the type of person who notices practical problems quickly.\n\nFor example, if someone is confused about a form or a process, she does not just say 'good luck'. She sits down, looks at the problem and explains the next step.\n\nWhat I like is that she does not make the other person feel incapable. She helps enough to get them moving and then lets them continue by themselves.\n\nThat is why her help is effective. Helping someone does not mean taking over their responsibility.\n\nThe best help reduces confusion and gives the person enough confidence to handle the next similar problem independently.", "朋友｜help enough, don't take over", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "How often he/she helps others", "How/why he/she helps others", "And how you feel about this person"], "一個熟悉故事 → 題目角度 → WHY → impact", "我有一位很常幫助別人的好朋友。她很快就會注意到別人遇到的實際問題。\n\n例如有人看不懂表格或流程時，她不會只說加油，而是真的坐下來看問題，告訴對方下一步可以做什麼。\n\n我喜歡的是，她不會讓被幫助的人覺得自己很沒能力。她只幫到足夠讓對方開始做，接著就讓他自己繼續。\n\n所以她的幫助很有效。幫助別人不代表要把他的責任全部接過來。\n\n最好的幫助是減少混亂，讓對方有足夠信心，下次遇到類似問題可以自己處理。"], ["Part 2", "喜歡畫畫的孩子", "Describe a child who loves drawing/painting", "I'd like to talk about my niece. She likes drawing because there is no single correct answer, which is very different from subjects like maths.\n\nShe often draws small characters, houses or animals and then adds colours depending on her mood.\n\nWhat I find interesting is that she can stay focused on a picture much longer than she can on a worksheet. Drawing gives her control over the result, so it feels like play rather than a test.\n\nI like seeing that because children need activities where mistakes are not always treated as failure.\n\nFor her, drawing is not about becoming an artist. It is a simple space where she can make choices, use imagination and enjoy creating something that did not exist before.", "姪女畫畫｜choice + imagination, no single right answer", "Part 2｜Cue Card 逐題檢查", ["Who he/she is", "How/when you knew him/her", "How often he/she draws/paints", "And explain why you think he/she loves drawing/painting"], "一個熟悉故事 → 題目角度 → WHY → impact", "我想講我的姪女。她喜歡畫畫，因為畫畫沒有唯一正確答案，跟數學這種科目很不一樣。\n\n她常畫一些小角色、房子或動物，再看當下心情加上不同顏色。\n\n我覺得很有趣的是，她畫一張圖可以專心很久，比寫練習題久很多。因為畫畫的結果是她自己決定，所以比較像在玩，不像在考試。\n\n我很喜歡看到這一點，因為小孩需要一些不會把每個錯誤都當成失敗的活動。\n\n對她來說，畫畫不是為了當藝術家，而是一個很簡單的空間，讓她自己做選擇、用想像力，也享受創造一個原本不存在的東西。"], ["Part 2", "擅⾧做計畫的人", "Describe a person who makes plans a lot and is good at planning", "A person who is good at planning is my older sister.\n\nShe usually plans important things early, especially family events or trips. She checks the time, transport and what everyone needs before the day arrives.\n\nWhat I like is that her plans are clear but not too strict. If something changes, she can adjust without getting angry.\n\nI am more likely to think about many things at once, so I find her way much calmer.\n\nShe taught me that a good plan should reduce stress. It should give direction, not make people feel trapped.", "中文重點：older sister → plans early → clear but flexible → less stress", "Part 2｜Cue Card 逐題檢查", ["Who he/she is", "How you knew him/her", "What plans he/she makes", "And explain how you feel about this person"], "older sister → plans early → clear but flexible → less stress", "一個很會做計畫的人是我姐姐。\n\n她通常會提早安排重要的事情，尤其是家庭活動或旅行。她會先確認時間、交通方式，以及每個人在出發前需要準備什麼。\n\n我喜歡的是，她的計畫很清楚，但不會太死。如果事情有變化，她也能調整，不會因此生氣。\n\n我比較容易一次想很多事情，所以她的方法讓我覺得冷靜很多。\n\n她讓我知道，一個好的計畫應該減少壓力。它應該給人方向，而不是讓人覺得被綁住。"], ["Part 2", "機智地解決問題的人", "Describe a person who solved a problem in a smart way", "I'd like to talk about a classmate who solved a problem in a smart way during a university presentation.\n\nJust before our presentation, one file would not open on the classroom computer. Everyone became nervous because that file contained an important part of our slides.\n\nInstead of trying the same thing again and again, my classmate quickly opened the backup file from another device and shared it to the main computer.\n\nThe problem was solved in a few minutes, and we could continue normally.\n\nI thought it was smart because she stayed calm and looked for another path instead of wasting time on the same failed method.", "中文重點：presentation file failed → use backup path → calm solution → presentation continued", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What the problem was", "How he/she solved it", "And explain why you think he/she did it in a smart way"], "presentation file failed → use backup path → calm solution → presentation continued", "我想講一位大學同學，她曾經在一次簡報時用很聰明的方法解決問題。\n\n就在我們要上台前，有一個檔案在教室電腦上打不開。大家都很緊張，因為那個檔案裡有簡報很重要的一部分。\n\n她沒有一直重複做同一件事，而是立刻從另一台裝置打開備份檔，再分享回主要電腦。\n\n幾分鐘內問題就解決了，我們也能正常繼續。\n\n我覺得這個做法很聰明，因為她很冷靜，沒有把時間浪費在同一個失敗的方法上，而是直接找另一條路。"], ["Part 2", "青梅竹馬", "Describe a friend from your childhood", "A childhood friend I remember well was one of my classmates in elementary school.\n\nWe became friends because we sat near each other and saw each other almost every day. During breaks, we talked, shared snacks and sometimes played simple games together.\n\nWhat I liked about her was that being friends felt very easy. We did not need to plan anything special because school naturally gave us time together.\n\nWe are not very close now because our lives went in different directions, but I still remember that friendship warmly.\n\nIt reminds me that childhood friendships are often very simple. You like someone because you feel comfortable together.", "固定故事：elementary-school friend → daily time together → easy, simple friendship", "Part 2｜Cue Card 逐題檢查", ["Who he/she is", "Where and how you met each other", "What you often did together", "And explain what made you like him/her"], "elementary-school friend → daily time together → easy, simple friendship", "我很記得的一位童年朋友，是我小學同學。\n\n我們會變成朋友，是因為座位很近，而且幾乎每天都會見面。下課時我們會聊天、分享零食，有時也一起玩一些簡單的遊戲。\n\n我最喜歡的是，跟她當朋友很自然。我們不需要特別安排什麼，因為學校本來就讓我們每天有時間相處。\n\n現在因為人生走向不同，我們已經沒有那麼熟，但我還是很溫暖地記得那段友情。\n\n它會提醒我，小時候的友情常常很單純。你喜歡一個人，只是因為跟他待在一起很舒服，而不是因為這段關係能帶來什麼好處。"], ["Part 2", "本地名人", "Describe a famous person in your local area", "I do not know any celebrity from my exact neighborhood, so I would talk about Ashin, the lead singer of Mayday, who is very famous in Taiwan.\n\nHe is a singer and songwriter, and I have listened to Mayday's music for years.\n\nWhat makes him popular is that many of his songs talk about simple feelings, such as pressure, hope and growing up. The words are easy to understand, but people can connect them with their own lives.\n\nThat is also why I like his work.\n\nFor me, long-term popularity comes from a real connection with the audience, not only from being seen everywhere.", "中文重點：no celebrity in exact neighborhood → Ashin in Taiwan → simple lyrics → emotional connection", "Part 2｜Cue Card 逐題檢查", ["Who this person is", "What he/she has done", "Why he/she is popular", "And explain how you feel about this person"], "no celebrity in exact neighborhood → Ashin in Taiwan → simple lyrics → emotional connection", "我不認識住在我自己社區裡的名人，所以我會講五月天的主唱阿信，他在台灣非常有名。\n\n他是一位歌手和創作者，而我已經聽五月天的歌很多年。\n\n我覺得他會受歡迎，是因為很多歌都在講很簡單的情緒，例如壓力、希望和成長。歌詞不一定很難，但大家可以把它跟自己的生活連在一起。\n\n這也是我喜歡他作品的原因。\n\n對我來說，長期的受歡迎來自跟觀眾真的有連結，不只是到處都看得到這個人。"], ["Part 2", "想見的名人", "Describe a famous person you would like to meet", "A famous person I want to meet is Ashin from Mayday. I have listened to the band's music for years, so I would not mainly want a photo or an autograph.\n\nI would rather have a short conversation about how he turns ordinary emotions into lyrics that so many people remember.\n\nHis songs often use simple language to describe pressure, hope or growing up, and I find that difficult to do well.\n\nIf I could meet him, I would probably ask how he knows when a simple line is strong enough and when it still needs to be changed.\n\nThe reason I want to meet him is so quite specific. I am interested in the thinking behind the work, not only the famous person on the stage.", "Ashin｜想問創作思路，不只合照", "Part 2｜Cue Card 逐題檢查", ["Who he/she is", "How you knew him/her", "How/where you would like to meet him/her", "And explain why you would like to meet him/ her"], "一個熟悉故事 → 題目角度 → WHY → impact", "我想見的名人是五月天的阿信。我聽他們的音樂很多年，所以如果真的見到他，我不會只是想拍照或拿簽名。\n\n我反而比較想跟他短短聊一下，他是怎麼把很普通的情緒寫成那麼多人都記得的歌詞。\n\n他的歌常用簡單的語言寫壓力、希望或成長，而我覺得把這些寫得好其實很難。\n\n如果可以見到他，我大概會問，他怎麼知道一句簡單的歌詞已經夠有力量，什麼時候又覺得還需要修改。\n\n所以我想見他的理由其實很具體。我對作品背後的思考比較有興趣，不只是舞台上的名人本身。"], ["Part 2", "節省時間的方法/改變", "Describe a way/change that helps you save a lot of time", "A change that saves me a lot of time is using one simple digital task list instead of trying to remember everything.\n\nBefore, I kept small tasks in my head or wrote them in different places. That meant I spent time trying to remember what I had forgotten.\n\nNow I write important tasks in one place and add a reminder when there is a deadline. It only takes a few seconds, but it reduces repeated checking and mental stress.\n\nThe change was very easy to make. The difficult part was remembering to use the system consistently for the first few days.\n\nNow it feels automatic.\n\nWhat I like most is that the system does not make me work faster by rushing. It saves time by reducing confusion. Good organisation removes small decisions so I can focus on the actual task.", "單一 task list｜save time by reducing confusion", "Part 2｜Cue Card 逐題檢查", ["What it is", "How you implement it", "How difficult it is", "And explain how you feel about the way/change"], "一個熟悉故事 → 題目角度 → WHY → impact", "一個幫我省很多時間的改變，是我開始只用一個簡單的數位待辦清單，不再全部靠腦袋記。\n\n以前我會把小事情記在腦裡，或寫在不同地方，結果反而一直花時間想：我是不是忘了什麼？\n\n現在我把重要任務放在同一個地方，有截止日期的就設提醒。這只花幾秒鐘，但能減少我一直重複確認，也比較不會有心理壓力。\n\n這個改變本身很容易，真正難的是前幾天要記得持續使用。\n\n現在已經變成很自然的習慣。\n\n我最喜歡的是，它不是逼我更快、更趕，而是透過減少混亂來省時間。好的整理方式會拿掉一些小決定，讓我把注意力放在真正的任務上。"], ["Part 2", "印象深刻的课程", "Describe a course that impressed you a lot", "A course that impressed me was an Information Management course at university where we had to connect theory with a practical system problem.\n\nInstead of only memorising definitions, we had to analyse what a user actually needed, organise the information and explain our solution clearly.\n\nThe part I remember most was working with other people because a technically correct idea was not enough. If nobody understood the explanation, the solution was difficult to use.\n\nThat course changed the way I think about learning.\n\nAcademic knowledge gives you a foundation, but practical work shows you where the gaps are.\n\nI liked the course because it made the subject feel real. I was not studying only to pass an exam. I could see how the same way of thinking could be used outside the classroom.", "資管課｜theory + application", "Part 2｜Cue Card 逐題檢查", ["What the course was about", "Where you took the course", "What you did during the course", "And explain why it impressed you a lot"], "一個熟悉故事 → 題目角度 → WHY → impact", "讓我印象很深的一門課，是大學的一門資訊管理課。我們需要把理論跟一個真實的系統問題連在一起。\n\n不是只背定義，而是要分析使用者真正需要什麼、整理資訊，再把解決方式說清楚。\n\n我最記得的是團隊合作，因為一個技術上正確的想法還不夠。如果沒有人聽得懂你的說明，那個解法其實也很難真正使用。\n\n那門課改變了我對學習的看法。\n\n學術知識會給你基礎，但實作才會讓你看到自己哪裡還有缺口。\n\n我喜歡那門課，是因為它讓這個科目變得很真實。我不是只為了考試，而是真的看得到同一種思考方式可以怎麼用在教室之外。"], ["Part 2", "送朋友的禮物", "Describe a gift you would like to buy for your friend", "A gift I want to buy for a close friend is a small personalised photo book. We have known each other since university, so we already have many photos from meals, trips and completely ordinary days.\n\nI would choose a few photos that have a story behind them and add short notes beside each one.\n\nI prefer this to buying something expensive because my friend can easily buy practical things for herself, but she cannot buy our shared memories in the same way.\n\nThe book would probably be small and simple rather than luxurious.\n\nFor me, a good gift should show that you understand the person. Price tells you how much an object costs. it does not tell you how meaningful it is.", "照片書｜shared memory > price", "Part 2｜Cue Card 逐題檢查", ["How you knew your friend", "How long you have known him/her", "How you would choose a gift for him/her", "And explain why you would choose that gift for him/her"], "一個熟悉故事 → 題目角度 → WHY → impact", "我想送給一位好朋友的禮物，是一本小小的客製化照片書。我們從大學就認識，所以已經有很多吃飯、旅行，甚至很普通日子的照片。\n\n我會挑幾張背後有故事的照片，再在旁邊寫上很短的文字。\n\n我比較喜歡這種禮物，而不是買很貴的東西，因為實用的東西她自己也能買，但我們共同的回憶不是同樣可以用錢買到的。\n\n那本書應該會很小、很簡單，不會做得很豪華。\n\n對我來說，一個好禮物應該讓人感覺你真的了解對方。價格只能告訴你一個東西多少錢，不能告訴你它有多少意義。"], ["Part 2", "最不喜歡的電影", "Describe your least favorite movie", "My least favourite type of movie is a romance film where the whole story depends on repeated misunderstandings that could be solved by one honest conversation.\n\nI remember watching one at home because friends said it was emotional, but I became frustrated quite quickly.\n\nThe film looked beautiful and the actors were fine, but the characters kept making the same avoidable mistakes just to keep the plot going.\n\nI normally prefer thrillers or mysteries because I like feeling that each new detail changes what I understand.\n\nThis movie did the opposite. I could predict the conflict and I did not feel that the characters were learning from it.\n\nThat is why I did not enjoy it. A simple story can still be good, but I need the characters' choices to feel believable.", "不喜歡純愛情片｜conflict should feel believable", "Part 2｜Cue Card 逐題檢查", ["When you watched it", "Where you watched it", "What it was about", "And explain why it’s your least favorite movie"], "一個熟悉故事 → 題目角度 → WHY → impact", "我最不喜歡的電影類型，是那種整個劇情都靠一直誤會，而其實只要好好講一句話就能解決的愛情片。\n\n我記得有一次在家看，朋友說那部片很感人，但我很快就開始覺得煩。\n\n畫面很好看，演員也沒有問題，可是角色一直重複做同樣可以避免的錯誤，只是為了讓劇情繼續。\n\n我平常比較喜歡驚悚片或懸疑片，因為我喜歡每出現一個新細節，就會改變我對故事的理解。\n\n那部片剛好相反。我很容易猜到衝突會怎麼發生，而且覺得角色沒有從錯誤裡學到東西。\n\n所以我不喜歡它。簡單的故事也可以很好看，但角色做的選擇至少要讓我相信。"], ["Part 2", "和朋友度過的愉快夜晚", "Describe an enjoyable evening you had with your friends", "An enjoyable evening I remember was having Korean barbecue with a few university friends.\n\nWe met after everyone finished work, so nobody wanted a complicated plan. We simply chose a restaurant, ordered several kinds of meat and cooked everything ourselves on the grill.\n\nWhat made the evening enjoyable was that the food gave us something to do while talking. We could cook, share dishes and catch up without feeling that the conversation had to be serious all the time.\n\nWe talked about work, old university memories and some completely unimportant things.\n\nI went home feeling much lighter.\n\nThe evening reminded me that a good social event does not need to be expensive or impressive. The right people can make an ordinary dinner feel memorable.", "Korean BBQ＋大學朋友｜ordinary dinner, right people", "Part 2｜Cue Card 逐題檢查", ["When and where it was", "What you did", "Who you spent the evening with", "And explain why it was enjoyable"], "一個熟悉故事 → 題目角度 → WHY → impact", "我很享受的一個晚上，是跟幾個大學朋友去吃韓式烤肉。\n\n大家下班後碰面，所以沒有人想安排很複雜的活動。我們就選了一家餐廳，點幾種肉，然後自己在烤盤上烤。\n\n讓那個晚上很開心的原因，是食物本身就給我們一件可以一起做的事。我們可以一邊烤、一邊分食物、一邊聊天，不需要一直讓話題很認真。\n\n我們聊工作、以前大學的回憶，也聊很多完全不重要的小事。\n\n回家時我覺得整個人輕鬆很多。\n\n那個晚上提醒我，一個好的聚會不需要很貴或很厲害。對的人可以讓一頓很普通的晚餐變得很值得記住。"], ["Part 2", "小時候學到的新技能", "Describe a new skill you learned when you were a child", "The person who taught me a new skill was my father, and the skill was riding a bicycle. At first, he held the back of the bike because I was afraid of losing balance.\n\nHe kept telling me to look forward instead of staring at the ground. I fell a few times, but nothing serious happened, so he encouraged me to keep trying.\n\nThen one day I suddenly realised he was no longer holding the bike and I was riding by myself.\n\nWhat I remember most is not the technique. It is the way he gave me enough support without doing the whole thing for me.\n\nThat experience taught me that confidence often comes after practice, not before it. I became less afraid because I repeated the skill until my body knew what to do.\n\nThe part I would focus on most is and explain how you felt about learning the skill, because that is what makes this story fit the question.", "爸爸＋腳踏車｜support → practice → confidence｜這題重點：And explain how you felt about learning the skill", "Part 2｜Cue Card 逐題檢查", ["What the skill was", "Who taught you this skill", "How you learned it", "And explain how you felt about learning the skill"], "一個熟悉故事 → 題目角度 → WHY → impact", "教我一個新技能的人是我爸爸，而那個技能是騎腳踏車。一開始我很怕失去平衡，所以他會扶著腳踏車後面。\n\n他一直告訴我要看前面，不要一直盯著地面。我跌倒過幾次，但都不嚴重，所以他一直鼓勵我繼續試。\n\n有一天，我突然發現他已經沒有扶著車了，而我正在自己騎。\n\n我最記得的其實不是技巧，而是他給我足夠幫助，卻沒有把整件事情替我做完。\n\n這個經驗讓我知道，自信通常是在練習之後才來，不是在練習之前。我一直重複，直到身體自己知道怎麼做，就慢慢不害怕了。\n\n如果回答這題，我會特別講我學會之後的感受，因為那會讓這個故事更完整地對到題目。"], ["Part 2", "保護環境的法律", "Describe a law on environmental protection", "A law I want to see strengthened is a rule that reduces unnecessary single-use plastic.\n\nThe rule should focus on items that are easy to replace, such as disposable bags or cutlery, and it should be introduced with clear alternatives rather than only punishment.\n\nI support this kind of law because environmental behaviour becomes easier when the system supports the habit.\n\nFor example, if reusable options are convenient and the rule is easy to understand, people do not need to make a difficult decision every time.\n\nThe important point is enforcement and practicality. A law that looks strict on paper but is confusing in daily life will be ignored.\n\nFor me, good environmental rules should make the better choice easier, not simply make people feel guilty.", "環保法｜clear + practical + enforceable", "Part 2｜Cue Card 逐題檢查", ["What it is", "How you first learned about it", "Who benefits from it", "And explain how you feel about this law"], "一個熟悉故事 → 題目角度 → WHY → impact", "我希望能加強的一條環保法律，是減少不必要一次性塑膠的規定。\n\n這個規則應該先針對很容易被替代的東西，例如免洗塑膠袋或餐具，而且要同時提供清楚替代方案，不是只有處罰。\n\n我支持這種法律，是因為當制度本身幫助人建立習慣時，環保行為會容易很多。\n\n例如，如果可重複使用的選項很方便，而且規則很好懂，大家每天就不用一直做很困難的選擇。\n\n重點是執行和實用性。紙上看起來很嚴格，但日常生活中很混亂的法律，最後只會被忽略。\n\n對我來說，好的環保規則應該讓比較好的選擇變得更容易，而不是只讓人覺得有罪惡感。"], ["Part 2", "想要頒布的環保法律", "Describe an environmental law you would like your country to introduce", "A law I want to see strengthened is a rule that reduces unnecessary single-use plastic.\n\nThe rule should focus on items that are easy to replace, such as disposable bags or cutlery, and it should be introduced with clear alternatives rather than only punishment.\n\nI support this kind of law because environmental behaviour becomes easier when the system supports the habit.\n\nFor example, if reusable options are convenient and the rule is easy to understand, people do not need to make a difficult decision every time.\n\nThe important point is enforcement and practicality. A law that looks strict on paper but is confusing in daily life will be ignored.\n\nFor me, good environmental rules should make the better choice easier, not simply make people feel guilty.\n\nThe part I would focus on most is and explain how you feel about this law, because that is what makes this story fit the question.", "環保法｜clear + practical + enforceable｜這題重點：And explain how you feel about this law", "Part 2｜Cue Card 逐題檢查", ["What law it should be", "Why people should follow the law", "Whether the law will be popular", "And explain how you feel about this law"], "一個熟悉故事 → 題目角度 → WHY → impact", "我希望能加強的一條環保法律，是減少不必要一次性塑膠的規定。\n\n這個規則應該先針對很容易被替代的東西，例如免洗塑膠袋或餐具，而且要同時提供清楚替代方案，不是只有處罰。\n\n我支持這種法律，是因為當制度本身幫助人建立習慣時，環保行為會容易很多。\n\n例如，如果可重複使用的選項很方便，而且規則很好懂，大家每天就不用一直做很困難的選擇。\n\n重點是執行和實用性。紙上看起來很嚴格，但日常生活中很混亂的法律，最後只會被忽略。\n\n對我來說，好的環保規則應該讓比較好的選擇變得更容易，而不是只讓人覺得有罪惡感。\n\n這題回答時，我會再補上自己對這條法律的看法和感受，讓內容更完整地符合題目。"], ["Part 2", "想頒布的新法律", "Describe a new law you would like to introduce in your country", "A new law I would like to introduce is a stronger rule to protect people's personal data online.\n\nMany apps and websites collect a lot of information, but ordinary users do not always understand what is being collected or how long it is kept.\n\nI would like companies to explain this in simple language and make it easier for people to refuse unnecessary data collection.\n\nI think this law would be useful because technology is now part of almost every area of life.\n\nPeople should not need expert knowledge just to understand what happens to their own information.", "中文重點：online privacy law → simple data explanation + real choice → users control own information", "Part 2｜Cue Card 逐題檢查", ["What law it is", "What changes this law brings", "Whether this new law will be popular", "How you came up with the new law", "And explain how you feel about this new law"], "online privacy law → simple data explanation + real choice → users control own information", "我想新增的一條法律，是更嚴格保護大家在網路上的個人資料。\n\n很多 App 和網站收集很多資訊，但一般使用者不一定知道到底收集了什麼，或資料會被保存多久。\n\n我希望公司可以用簡單的語言說明，也讓使用者更容易拒絕不必要的資料收集。\n\n我覺得這條法律很有用，因為科技現在幾乎已經進入生活每一個部分。\n\n人們不應該需要專業知識，才能知道自己的資訊最後去了哪裡。"], ["Part 2", "⾧久目標/抱負", "Describe a long-term goal/ambition you would like to achieve", "A long-term goal I want to achieve is studying computer science at graduate level abroad.\n\nThe goal became clearer after university because I wanted stronger technical knowledge and more international experience.\n\nThe difficult part is that a big goal contains many small tasks: improving English, preparing applications, researching programmes and planning the financial side.\n\nIf I think about everything at once, it feels overwhelming. What helps me is breaking it into actions I can repeat, such as practising speaking or preparing one document at a time.\n\nIELTS is one immediate part of that larger goal.\n\nFor me, a goal is useful because it gives direction. But direction only becomes progress when I keep taking small, realistic actions.", "研究所 abroad｜direction + repeated small actions", "Part 2｜Cue Card 逐題檢查", ["How long you have had this goal/ambition", "What it is", "How you will achieve it", "And explain why you set it"], "一個熟悉故事 → 題目角度 → WHY → impact", "我想完成的一個長期目標，是到國外讀電腦科學相關研究所。\n\n大學畢業後，這個目標變得更清楚，因為我想要更強的技術知識，也想有更多國際經驗。\n\n困難的是，一個大目標裡面包含很多小任務：提升英文、準備申請、查研究所資料，還要規劃費用。\n\n如果一次想全部，我會覺得壓力很大。所以我會把它拆成可以重複的小行動，例如練口說，或一次準備一份文件。\n\nIELTS 就是這個大目標裡眼前很直接的一部分。\n\n對我來說，目標的作用是給方向。但只有我一直做小而實際的行動，方向才會真的變成進度。"], ["Part 2", "包含動物的故事或書籍", "Describe a story/book with animals in it", "A story involving animals that I remember is The Lion King.\n\nI first
