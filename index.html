ores can give more personal service. Shopping choices depend on price, convenience, quality and trust. Different products need different methods. For instance, someone may buy online for speed but visit a store for shoes or clothes.", "中文邏輯：先回答題目 → Many people like big stores for choice and convenience, while small stores can give more personal service.｜理由：Shopping choices depend on price, convenience, quality and trust.｜例子：Someone may buy online for speed but visit a store for shoes or clothes.｜結果：Different products need different methods.", "Part 3｜522/522 題目導向逐題校正", null, "Many people like big stores for choice and convenience, while small stores can give more personal service.", ""], ["Part 3", "擁有成功事業的人", "Should governments provide financial support to start-ups?", "Yes, but support should have clear rules so public money is not wasted. For example, helping a useful start-up may create jobs, but weak oversight can waste money. Support works best when results can be checked.", "中文邏輯：先回答題目 → Yes, but support should have clear rules so public money is not wasted.｜理由：Public support should have a clear goal and clear rules.｜例子：Helping a useful start-up may create jobs, but weak oversight can waste money.｜結果：Support works best when results can be checked.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, but support should have clear rules so public money is not wasted.", ""], ["Part 3", "擁有成功事業的人", "Why do some people start their own business?", "People start businesses because they want more control, see an opportunity or want to build their own idea. Business is difficult because competition, money and customer needs all change. You can see this in daily life. A good product can still fail if people do not need it or cannot find it. Success needs both value and good management.", "中文邏輯：先回答題目 → People start businesses because they want more control, see an opportunity or want to build their own idea.｜理由：Business is difficult because competition, money and customer needs all change.｜例子：A good product can still fail if people do not need it or cannot find it.｜結果：Success needs both value and good management.", "Part 3｜522/522 題目導向逐題校正", null, "People start businesses because they want more control, see an opportunity or want to build their own idea.", ""], ["Part 3", "擁有成功事業的人", "Is it easy to set up a new business in your country?", "Starting a business is possible, but keeping it alive is much harder. Business is difficult because competition, money and customer needs all change. For example, a good product can still fail if people do not need it or cannot find it. Success needs both value and good management.", "中文邏輯：先回答題目 → Starting a business is possible, but keeping it alive is much harder.｜理由：Business is difficult because competition, money and customer needs all change.｜例子：A good product can still fail if people do not need it or cannot find it.｜結果：Success needs both value and good management.", "Part 3｜522/522 題目導向逐題校正", null, "Starting a business is possible, but keeping it alive is much harder.", ""], ["Part 3", "想從事醫療行業的人", "Do you think learning biology is interesting for children?", "It can be interesting if children learn through the human body, animals and simple experiments. Seeing how the heart works is easier to remember than only reading a definition. So real examples make science more interesting. Children often enjoy biology when it connects with real animals, the body or simple experiments.", "中文邏輯：先回答題目 → It can be interesting if children learn through the human body, animals and simple experiments.｜理由：Children often enjoy biology when it connects with real animals, the body or simple experiments.｜例子：Seeing how the heart works is easier to remember than only reading a definition.｜結果：Real examples make science more interesting.", "Part 3｜522/522 題目導向逐題校正", null, "It can be interesting if children learn through the human body, animals and simple experiments.", ""], ["Part 3", "想從事醫療行業的人", "Do you think being a doctor is easy or difficult?", "Being a doctor is difficult because medical decisions can affect people's lives. Doctors need strong knowledge and careful judgement because mistakes can affect health. One clear example is they also need to explain difficult information to worried patients. Medical work combines technical skill and human support.", "中文邏輯：先回答題目 → Being a doctor is difficult because medical decisions can affect people's lives.｜理由：Doctors need strong knowledge and careful judgement because mistakes can affect health.｜例子：They also need to explain difficult information to worried patients.｜結果：Medical work combines technical skill and human support.", "Part 3｜522/522 題目導向逐題校正", null, "Being a doctor is difficult because medical decisions can affect people's lives.", ""], ["Part 3", "想從事醫療行業的人", "Why do some children want to become doctors?", "Some children want to become doctors because they want to help people or admire the profession. Doctors need strong knowledge and careful judgement because mistakes can affect health. One clear example is they also need to explain difficult information to worried patients. Medical work combines technical skill and human support.", "中文邏輯：先回答題目 → Some children want to become doctors because they want to help people or admire the profession.｜理由：Doctors need strong knowledge and careful judgement because mistakes can affect health.｜例子：They also need to explain difficult information to worried patients.｜結果：Medical work combines technical skill and human support.", "Part 3｜522/522 題目導向逐題校正", null, "Some children want to become doctors because they want to help people or admire the profession.", ""], ["Part 3", "想從事醫療行業的人", "Do you think governments should put a large amount of money into medical research?", "Yes, especially for diseases and treatments that can help many people. One reason is that medical research can prevent disease and improve treatment for many people. A simple example is public money is especially useful for problems that private companies may not study enough. The spending should still be transparent and based on real needs.", "中文邏輯：先回答題目 → Yes, especially for diseases and treatments that can help many people.｜理由：Medical research can prevent disease and improve treatment for many people.｜例子：Public money is especially useful for problems that private companies may not study enough.｜結果：The spending should still be transparent and based on real needs.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, especially for diseases and treatments that can help many people.", ""], ["Part 3", "喜歡在家或花園種植物的人", "Why do some people prefer to grow their own fruits and vegetables instead of buying them from the market?", "Some people grow food because they enjoy the process and like knowing where their food comes from. Growing food gives people control over the process and can feel rewarding. In real life, someone can see exactly how a tomato or herb was cared for. The value is partly fresh food and partly the experience.", "中文邏輯：先回答題目 → Some people grow food because they enjoy the process and like knowing where their food comes from.｜理由：Growing food gives people control over the process and can feel rewarding.｜例子：Someone can see exactly how a tomato or herb was cared for.｜結果：The value is partly fresh food and partly the experience.", "Part 3｜522/522 題目導向逐題校正", null, "Some people grow food because they enjoy the process and like knowing where their food comes from.", ""], ["Part 3", "喜歡在家或花園種植物的人", "Why do some people like to grow plants?", "People often grow plants because it is relaxing and gives a clear sense of progress. Plants teach people to care for something slowly and regularly. In real life, watering a small plant every day gives a clear result over time. The habit can build patience and responsibility.", "中文邏輯：先回答題目 → People often grow plants because it is relaxing and gives a clear sense of progress.｜理由：Plants teach people to care for something slowly and regularly.｜例子：Watering a small plant every day gives a clear result over time.｜結果：The habit can build patience and responsibility.", "Part 3｜522/522 題目導向逐題校正", null, "People often grow plants because it is relaxing and gives a clear sense of progress.", ""], ["Part 3", "喜歡在家或花園種植物的人", "Is it easy to grow plants at home?", "Some plants are easy to grow at home, but light, space and regular care still matter. Plants teach people to care for something slowly and regularly. The habit can build patience and responsibility. For instance, watering a small plant every day gives a clear result over time.", "中文邏輯：先回答題目 → Some plants are easy to grow at home, but light, space and regular care still matter.｜理由：Plants teach people to care for something slowly and regularly.｜例子：Watering a small plant every day gives a clear result over time.｜結果：The habit can build patience and responsibility.", "Part 3｜522/522 題目導向逐題校正", null, "Some plants are easy to grow at home, but light, space and regular care still matter.", ""], ["Part 3", "喜歡在家或花園種植物的人", "Do many people grow vegetables or flowers at home in your country?", "Some do, especially people with balconies, gardens or more space, but it is not possible for everyone. One reason is that home growing gives people a simple connection with nature. A simple example is a small balcony plant can still create a daily routine of care. The hobby can be relaxing even when the amount of food is small.", "中文邏輯：先回答題目 → Some do, especially people with balconies, gardens or more space, but it is not possible for everyone.｜理由：Home growing gives people a simple connection with nature.｜例子：A small balcony plant can still create a daily routine of care.｜結果：The hobby can be relaxing even when the amount of food is small.", "Part 3｜522/522 題目導向逐題校正", null, "Some do, especially people with balconies, gardens or more space, but it is not possible for everyone.", ""], ["Part 3", "喜歡在家或花園種植物的人", "What are the advantages of growing vegetables or flowers at home?", "Growing plants can be relaxing, educational and sometimes provide fresh food. Seeing something grow from a seed can be very satisfying. It also teaches patience.", "中文邏輯：先回答題目 → Growing plants can be relaxing, educational and sometimes provide fresh food.｜理由：Growing plants can provide fresh food, relaxation and a sense of progress.｜例子：Seeing something grow from a seed can be very satisfying.｜結果：It also teaches patience.", "Part 3｜522/522 題目導向逐題校正", null, "Growing plants can be relaxing, educational and sometimes provide fresh food.", ""], ["Part 3", "喜歡在家或花園種植物的人", "Do you think students should learn to grow plants?", "Yes. It is a simple way to teach patience, responsibility and basic knowledge about nature. Watering a small plant every day gives a clear result over time. So the habit can build patience and responsibility. Plants teach people to care for something slowly and regularly.", "中文邏輯：先回答題目 → Yes. It is a simple way to teach patience, responsibility and basic knowledge about nature.｜理由：Plants teach people to care for something slowly and regularly.｜例子：Watering a small plant every day gives a clear result over time.｜結果：The habit can build patience and responsibility.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. It is a simple way to teach patience, responsibility and basic knowledge about nature.", ""], ["Part 3", "愛護自然的人", "Is it important to teach students environmental protection at school?", "Yes. Environmental habits are easier to build when children learn them early. One reason is that school can turn environmental ideas into daily habits. A simple example is students can learn to sort waste, save water and avoid unnecessary plastic. Early practice makes responsible behaviour feel normal.", "中文邏輯：先回答題目 → Yes. Environmental habits are easier to build when children learn them early.｜理由：School can turn environmental ideas into daily habits.｜例子：Students can learn to sort waste, save water and avoid unnecessary plastic.｜結果：Early practice makes responsible behaviour feel normal.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Environmental habits are easier to build when children learn them early.", ""], ["Part 3", "愛護自然的人", "What can people do to protect the natural world?", "People can reduce waste, use fewer single-use products and respect natural spaces. The reason is that nature gives people space away from traffic, screens and constant information. A quiet walk among trees can help the mind slow down. Natural spaces support both mood and health.", "中文邏輯：先回答題目 → People can reduce waste, use fewer single-use products and respect natural spaces.｜理由：Nature gives people space away from traffic, screens and constant information.｜例子：A quiet walk among trees can help the mind slow down.｜結果：Natural spaces support both mood and health.", "Part 3｜522/522 題目導向逐題校正", null, "People can reduce waste, use fewer single-use products and respect natural spaces.", ""], ["Part 3", "愛護自然的人", "Is it easy for children in cities to get close to the natural world?", "It is harder, but parks, rivers and school trips can still give children contact with nature. A quiet walk among trees can help the mind slow down. That matters because nature gives people space away from traffic, screens and constant information. Natural spaces support both mood and health.", "中文邏輯：先回答題目 → It is harder, but parks, rivers and school trips can still give children contact with nature.｜理由：Nature gives people space away from traffic, screens and constant information.｜例子：A quiet walk among trees can help the mind slow down.｜結果：Natural spaces support both mood and health.", "Part 3｜522/522 題目導向逐題校正", null, "It is harder, but parks, rivers and school trips can still give children contact with nature.", ""], ["Part 3", "愛護自然的人", "Which do you think people prefer, rewards or punishment, when it comes to government intervention in environmental protection?", "Rewards usually work better for building habits, while punishment is useful for serious harm. Punishment should stop harmful behaviour and help people understand the result of their actions. The goal should be better behaviour. For instance, a fair consequence plus an explanation is better than fear alone.", "中文邏輯：先回答題目 → Rewards usually work better for building habits, while punishment is useful for serious harm.｜理由：Punishment should stop harmful behaviour and help people understand the result of their actions.｜例子：A fair consequence plus an explanation is better than fear alone.｜結果：The goal should be better behaviour.", "Part 3｜522/522 題目導向逐題校正", null, "Rewards usually work better for building habits, while punishment is useful for serious harm.", ""], ["Part 3", "愛護自然的人", "What laws about the environment are effective in your country?", "Rules on recycling, waste and pollution can be effective when they are clear and enforced. Environmental laws work best when they are clear, practical and actually enforced. Rules and systems need to work together. For instance, a recycling rule is stronger when people also have easy access to the right bins.", "中文邏輯：先回答題目 → Rules on recycling, waste and pollution can be effective when they are clear and enforced.｜理由：Environmental laws work best when they are clear, practical and actually enforced.｜例子：A recycling rule is stronger when people also have easy access to the right bins.｜結果：Rules and systems need to work together.", "Part 3｜522/522 題目導向逐題校正", null, "Rules on recycling, waste and pollution can be effective when they are clear and enforced.", ""], ["Part 3", "愛護自然的人", "Do you think parents should teach their children how to protect the environment?", "Yes. Children copy daily habits, so parents can teach a lot through simple actions. Children copy what adults do. This is because parents shape daily habits, so home is a good place to start environmental education. For example, using less plastic or sorting rubbish together is more powerful than only giving a lecture.", "中文邏輯：先回答題目 → Yes. Children copy daily habits, so parents can teach a lot through simple actions.｜理由：Parents shape daily habits, so home is a good place to start environmental education.｜例子：Using less plastic or sorting rubbish together is more powerful than only giving a lecture.｜結果：Children copy what adults do.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Children copy daily habits, so parents can teach a lot through simple actions.", ""], ["Part 3", "樂於助人的人", "Why are employees reluctant to ask their managers for help?", "Some employees worry that asking for help will make them look weak or unprepared. A simple example is a new worker may stay silent even when one short question could prevent a mistake. Good managers make reasonable questions feel safe.", "中文邏輯：先回答題目 → Some employees worry that asking for help will make them look weak or unprepared.｜理由：Employees may worry that asking for help makes them look weak or unprepared.｜例子：A new worker may stay silent even when one short question could prevent a mistake.｜結果：Good managers make reasonable questions feel safe.", "Part 3｜522/522 題目導向逐題校正", null, "Some employees worry that asking for help will make them look weak or unprepared.", ""], ["Part 3", "樂於助人的人", "Do you think schools should teach children to do household chores?", "Schools can teach basic life skills, but most household habits should also be learned at home. The reason is that chores teach responsibility through real daily work. A child who puts away dishes learns that family life includes shared duties. Small responsibilities build independence.", "中文邏輯：先回答題目 → Schools can teach basic life skills, but most household habits should also be learned at home.｜理由：Chores teach responsibility through real daily work.｜例子：A child who puts away dishes learns that family life includes shared duties.｜結果：Small responsibilities build independence.", "Part 3｜522/522 題目導向逐題校正", null, "Schools can teach basic life skills, but most household habits should also be learned at home.", ""], ["Part 3", "樂於助人的人", "Who should people ask for help, colleagues or family members?", "It depends on the problem. Work problems usually fit colleagues, while personal problems may fit family. Work problems usually fit colleagues, while personal problems may be easier to discuss with family. That matters because the best person depends on the problem. Relevant experience matters more than one fixed rule.", "中文邏輯：先回答題目 → It depends on the problem. Work problems usually fit colleagues, while personal problems may fit family.｜理由：The best person depends on the problem.｜例子：Work problems usually fit colleagues, while personal problems may be easier to discuss with family.｜結果：Relevant experience matters more than one fixed rule.", "Part 3｜522/522 題目導向逐題校正", null, "It depends on the problem. Work problems usually fit colleagues, while personal problems may fit family.", ""], ["Part 3", "樂於助人的人", "What kind of help do people need when looking for a new job?", "People often need help with CVs, interviews, job information and understanding the role. For example, a friend can review a CV or explain what an interview may be like. Practical help can reduce uncertainty.", "中文邏輯：先回答題目 → People often need help with CVs, interviews, job information and understanding the role.｜理由：Job seekers often need help with information, CVs, interviews and understanding the role.｜例子：A friend can review a CV or explain what an interview may be like.｜結果：Practical help can reduce uncertainty.", "Part 3｜522/522 題目導向逐題校正", null, "People often need help with CVs, interviews, job information and understanding the role.", ""], ["Part 3", "樂於助人的人", "Should children help their parents with household chores?", "Yes. Age-appropriate chores teach responsibility and make children part of family life. The reason is that children can help with simple chores such as tidying, dishes or carrying things. The tasks should match their age. Helping at home teaches that family responsibility is shared.", "中文邏輯：先回答題目 → Yes. Age-appropriate chores teach responsibility and make children part of family life.｜理由：Children can help with simple chores such as tidying, dishes or carrying things.｜例子：The tasks should match their age.｜結果：Helping at home teaches that family responsibility is shared.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Age-appropriate chores teach responsibility and make children part of family life.", ""], ["Part 3", "樂於助人的人", "What can children do to help their parents?", "Children can tidy their room, put away dishes and help with simple cleaning. Children can help with simple chores such as tidying, dishes or carrying things. In real life, the tasks should match their age. Helping at home teaches that family responsibility is shared.", "中文邏輯：先回答題目 → Children can tidy their room, put away dishes and help with simple cleaning.｜理由：Children can help with simple chores such as tidying, dishes or carrying things.｜例子：The tasks should match their age.｜結果：Helping at home teaches that family responsibility is shared.", "Part 3｜522/522 題目導向逐題校正", null, "Children can tidy their room, put away dishes and help with simple cleaning.", ""], ["Part 3", "喜歡畫畫的孩子", "What are the differences between reading a book and visiting a museum?", "Books give more detail, while museums let people see real objects and art in person. The reason is that museums make learning physical and visual. Seeing a real object can make history or art feel more real than a photo on a phone. Direct experience can improve memory.", "中文邏輯：先回答題目 → Books give more detail, while museums let people see real objects and art in person.｜理由：Museums make learning physical and visual.｜例子：Seeing a real object can make history or art feel more real than a photo on a phone.｜結果：Direct experience can improve memory.", "Part 3｜522/522 題目導向逐題校正", null, "Books give more detail, while museums let people see real objects and art in person.", ""], ["Part 3", "喜歡畫畫的孩子", "How do artworks inspire people?", "Art can inspire people by showing a new idea, feeling or way of seeing something familiar. A painting may change how someone sees an ordinary place or social problem. So inspiration often starts with a new point of view. Art can make people notice a feeling or idea in a new way.", "中文邏輯：先回答題目 → Art can inspire people by showing a new idea, feeling or way of seeing something familiar.｜理由：Art can make people notice a feeling or idea in a new way.｜例子：A painting may change how someone sees an ordinary place or social problem.｜結果：Inspiration often starts with a new point of view.", "Part 3｜522/522 題目導向逐題校正", null, "Art can inspire people by showing a new idea, feeling or way of seeing something familiar.", ""], ["Part 3", "喜歡畫畫的孩子", "Do you think galleries and museums should be free of charge?", "Basic access should be free or affordable when possible, especially for students and families. Seeing a real object can make history or art feel more real than a photo on a phone. That matters because museums make learning physical and visual. Direct experience can improve memory.", "中文邏輯：先回答題目 → Basic access should be free or affordable when possible, especially for students and families.｜理由：Museums make learning physical and visual.｜例子：Seeing a real object can make history or art feel more real than a photo on a phone.｜結果：Direct experience can improve memory.", "Part 3｜522/522 題目導向逐題校正", null, "Basic access should be free or affordable when possible, especially for students and families.", ""], ["Part 3", "喜歡畫畫的孩子", "Why do some people visit galleries or museums instead of viewing artworks online?", "People visit in person because real size, space and detail are hard to feel through a screen. Art can make people notice a feeling or idea in a new way. In real life, a painting may change how someone sees an ordinary place or social problem. Inspiration often starts with a new point of view.", "中文邏輯：先回答題目 → People visit in person because real size, space and detail are hard to feel through a screen.｜理由：Art can make people notice a feeling or idea in a new way.｜例子：A painting may change how someone sees an ordinary place or social problem.｜結果：Inspiration often starts with a new point of view.", "Part 3｜522/522 題目導向逐題校正", null, "People visit in person because real size, space and detail are hard to feel through a screen.", ""], ["Part 3", "喜歡畫畫的孩子", "Why do most children draw more often than adults do?", "Children draw more because they are less worried about whether the result looks perfect. They use drawing as play and communication. Adults often become more self-conscious and stop drawing.", "中文邏輯：先回答題目 → Children draw more because they are less worried about whether the result looks perfect.｜理由：Children are usually less worried about whether a drawing looks perfect.｜例子：They use drawing as play and communication.｜結果：Adults often become more self-conscious and stop drawing.", "Part 3｜522/522 題目導向逐題校正", null, "Children draw more because they are less worried about whether the result looks perfect.", ""], ["Part 3", "喜歡畫畫的孩子", "What is the right age for a child to learn drawing?", "Children can start very young because drawing can begin as simple play. Drawing is easy to start and does not need one correct answer. That freedom helps creativity. For instance, a child can turn a simple shape into many different things.", "中文邏輯：先回答題目 → Children can start very young because drawing can begin as simple play.｜理由：Drawing is easy to start and does not need one correct answer.｜例子：A child can turn a simple shape into many different things.｜結果：That freedom helps creativity.", "Part 3｜522/522 題目導向逐題校正", null, "Children can start very young because drawing can begin as simple play.", ""], ["Part 3", "擅⾧做計畫的人", "Should children ask their teachers and parents for advice when making plans?", "Yes, especially for important plans, but children should still make some choices by themselves. Parents usually shape daily values, while teachers strongly influence school and learning. You can see this in daily life. A child may ask parents about life choices and a teacher about study problems. Both roles matter in different areas.", "中文邏輯：先回答題目 → Yes, especially for important plans, but children should still make some choices by themselves.｜理由：Parents usually shape daily values, while teachers strongly influence school and learning.｜例子：A child may ask parents about life choices and a teacher about study problems.｜結果：Both roles matter in different areas.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, especially for important plans, but children should still make some choices by themselves.", ""], ["Part 3", "擅⾧做計畫的人", "What activities do we need to plan ahead?", "Travel, exams, large events and important work projects usually need planning. Booking transport or preparing documents early prevents simple problems. The bigger the consequence, the more useful planning becomes.", "中文邏輯：先回答題目 → Travel, exams, large events and important work projects usually need planning.｜理由：Travel, exams, large events and important projects usually need some planning.｜例子：Booking transport or preparing documents early prevents simple problems.｜結果：The bigger the consequence, the more useful planning becomes.", "Part 3｜522/522 題目導向逐題校正", null, "Travel, exams, large events and important work projects usually need planning.", ""], ["Part 3", "擅⾧做計畫的人", "Do you think choosing a college major is closely related to a person’s future career?", "It can be related, but one major does not decide a person's whole career. A student may discover a new strength after trying a project or course. That matters because career ideas can guide young people, but interests and skills change with experience. Exploration is important before a final choice.", "中文邏輯：先回答題目 → It can be related, but one major does not decide a person's whole career.｜理由：Career ideas can guide young people, but interests and skills change with experience.｜例子：A student may discover a new strength after trying a project or course.｜結果：Exploration is important before a final choice.", "Part 3｜522/522 題目導向逐題校正", null, "It can be related, but one major does not decide a person's whole career.", ""], ["Part 3", "擅⾧做計畫的人", "Is making study plans popular among young people?", "Yes, especially around exams, although many students do not follow plans perfectly. A friendly student who includes others may become popular without trying to show off. That matters because popularity often comes from visibility, confidence and connection with other people. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Yes, especially around exams, although many students do not follow plans perfectly.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, especially around exams, although many students do not follow plans perfectly.", ""], ["Part 3", "擅⾧做計畫的人", "Do you think children should plan their future careers?", "They can explore future careers, but they should not choose one fixed path too early. Children need guidance because they do not have much life experience yet. You can see this in daily life. Parents can explain risks, while children still make smaller choices themselves. Good planning support should build independence, not control every decision.", "中文邏輯：先回答題目 → They can explore future careers, but they should not choose one fixed path too early.｜理由：Children need guidance because they do not have much life experience yet.｜例子：Parents can explain risks, while children still make smaller choices themselves.｜結果：Good planning support should build independence, not control every decision.", "Part 3｜522/522 題目導向逐題校正", null, "They can explore future careers, but they should not choose one fixed path too early.", ""], ["Part 3", "擅⾧做計畫的人", "Do you think it’s important to plan ahead?", "Yes. Planning reduces avoidable stress, but the plan still needs flexibility. Preparing key things before an exam or trip lowers stress. That matters because planning reduces uncertainty and helps people see the next step. A good plan still leaves room for change.", "中文邏輯：先回答題目 → Yes. Planning reduces avoidable stress, but the plan still needs flexibility.｜理由：Planning reduces uncertainty and helps people see the next step.｜例子：Preparing key things before an exam or trip lowers stress.｜結果：A good plan still leaves room for change.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Planning reduces avoidable stress, but the plan still needs flexibility.", ""], ["Part 3", "機智地解決問題的人", "Why does modern society need talents of all kinds?", "Modern society needs different talents because problems are too varied for one type of skill. Healthcare, design, engineering and communication all solve different parts of society's needs. So no single talent is enough for everything. Modern problems need different types of knowledge.", "中文邏輯：先回答題目 → Modern society needs different talents because problems are too varied for one type of skill.｜理由：Modern problems need different types of knowledge.｜例子：Healthcare, design, engineering and communication all solve different parts of society's needs.｜結果：No single talent is enough for everything.", "Part 3｜522/522 題目導向逐題校正", null, "Modern society needs different talents because problems are too varied for one type of skill.", ""], ["Part 3", "機智地解決問題的人", "Why are some people well-rounded and others only good at one thing?", "People develop differently because of interest, practice, education and personality. People become strong in different ways because of interest, practice and opportunity. You can see this in daily life. Someone who spends years on one subject may become an expert, while another person tries many fields. Both paths can be useful.", "中文邏輯：先回答題目 → People develop differently because of interest, practice, education and personality.｜理由：People become strong in different ways because of interest, practice and opportunity.｜例子：Someone who spends years on one subject may become an expert, while another person tries many fields.｜結果：Both paths can be useful.", "Part 3｜522/522 題目導向逐題校正", null, "People develop differently because of interest, practice, education and personality.", ""], ["Part 3", "機智地解決問題的人", "How do children become smart at school?", "Children become better thinkers through practice, questions and useful feedback. For example, a teacher who asks 'why' helps a child explain the process, not only the answer. Thinking ability can grow with practice.", "中文邏輯：先回答題目 → Children become better thinkers through practice, questions and useful feedback.｜理由：Children improve thinking skills through questions, practice and useful feedback.｜例子：A teacher who asks 'why' helps a child explain the process, not only the answer.｜結果：Thinking ability can grow with practice.", "Part 3｜522/522 題目導向逐題校正", null, "Children become better thinkers through practice, questions and useful feedback.", ""], ["Part 3", "機智地解決問題的人", "Do you think children are born smart or they learn to become smart?", "Natural ability matters, but learning and environment can change performance a lot. A child can become much better at maths with good teaching and repeated practice. Ability is not completely fixed.", "中文邏輯：先回答題目 → Natural ability matters, but learning and environment can change performance a lot.｜理由：Natural ability matters, but practice and environment can change performance a lot.｜例子：A child can become much better at maths with good teaching and repeated practice.｜結果：Ability is not completely fixed.", "Part 3｜522/522 題目導向逐題校正", null, "Natural ability matters, but learning and environment can change performance a lot.", ""], ["Part 3", "機智地解決問題的人", "Do you think smart children are happier than other children?", "Not necessarily. Being smart does not guarantee good relationships, low stress or happiness. Happiness and intelligence solve different problems. You can see this in daily life. A high-achieving child can still feel lonely or under strong pressure. Support, friendship and balance matter more for happiness.", "中文邏輯：先回答題目 → Not necessarily. Being smart does not guarantee good relationships, low stress or happiness.｜理由：Happiness and intelligence solve different problems.｜例子：A high-achieving child can still feel lonely or under strong pressure.｜結果：Support, friendship and balance matter more for happiness.", "Part 3｜522/522 題目導向逐題校正", null, "Not necessarily. Being smart does not guarantee good relationships, low stress or happiness.", ""], ["Part 3", "機智地解決問題的人", "Is it important for schools to identify and develop each student’s talents?", "Yes, but schools should give students many chances before putting them into fixed labels. School can give students different chances to discover what they are good at. You can see this in daily life. Clubs, projects and different subjects can reveal strengths that exams miss. The goal should be exploration, not fixed labels.", "中文邏輯：先回答題目 → Yes, but schools should give students many chances before putting them into fixed labels.｜理由：School can give students different chances to discover what they are good at.｜例子：Clubs, projects and different subjects can reveal strengths that exams miss.｜結果：The goal should be exploration, not fixed labels.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, but schools should give students many chances before putting them into fixed labels.", ""], ["Part 3", "青梅竹馬", "Has technology changed people's friendships?", "Yes. Technology makes contact easier, but it can also make communication less personal. Technology is useful when it saves time or removes distance without taking away human judgement. One clear example is a map app can suggest a route, but the user still chooses what works best. The tool should support the person.", "中文邏輯：先回答題目 → Yes. Technology makes contact easier, but it can also make communication less personal.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Technology makes contact easier, but it can also make communication less personal.", ""], ["Part 3", "青梅竹馬", "What's the difference between having younger friends and older friends?", "Younger friends may share similar routines, while older friends can bring different experience. Age changes perspective, not the value of friendship. For example, both types of friendship can be useful in different ways.", "中文邏輯：先回答題目 → Younger friends may share similar routines, while older friends can bring different experience.｜理由：Younger friends may share similar daily experiences, while older friends can bring different life experience.｜例子：Both types of friendship can be useful in different ways.｜結果：Age changes perspective, not the value of friendship.", "Part 3｜522/522 題目導向逐題校正", null, "Younger friends may share similar routines, while older friends can bring different experience.", ""], ["Part 3", "青梅竹馬", "Do you think online communication through social media will replace face-to-face communication?", "No. Online communication is useful, but it cannot fully replace body language and real presence. A message can keep friends connected across distance, but it cannot fully replace being together. So each form is useful for a different purpose. Online communication is fast, but face-to-face talk shows tone and body language more clearly.", "中文邏輯：先回答題目 → No. Online communication is useful, but it cannot fully replace body language and real presence.｜理由：Online communication is fast, but face-to-face talk shows tone and body language more clearly.｜例子：A message can keep friends connected across distance, but it cannot fully replace being together.｜結果：Each form is useful for a different purpose.", "Part 3｜522/522 題目導向逐題校正", null, "No. Online communication is useful, but it cannot fully replace body language and real presence.", ""], ["Part 3", "青梅竹馬", "What do you think of communicating via social media?", "It is useful for staying in touch, but it should not become the only way people communicate. Social media is useful for staying in touch, but it can make communication shallow if people rely on it too much. One clear example is a short message is easy, but difficult topics are usually better in person. Online contact works best as a support, not a full replacement.", "中文邏輯：先回答題目 → It is useful for staying in touch, but it should not become the only way people communicate.｜理由：Social media is useful for staying in touch, but it can make communication shallow if people rely on it too much.｜例子：A short message is easy, but difficult topics are usually better in person.｜結果：Online contact works best as a support, not a full replacement.", "Part 3｜522/522 題目導向逐題校正", null, "It is useful for staying in touch, but it should not become the only way people communicate.", ""], ["Part 3", "青梅竹馬", "How important is childhood friendship to children?", "Childhood friendship is important because children learn trust, sharing and conflict through friends. A simple example is small disagreements during play teach social skills. Early friendship is part of learning how to live with other people.", "中文邏輯：先回答題目 → Childhood friendship is important because children learn trust, sharing and conflict through friends.｜理由：Childhood friendship helps children learn trust, sharing and conflict.｜例子：Small disagreements during play teach social skills.｜結果：Early friendship is part of learning how to live with other people.", "Part 3｜522/522 題目導向逐題校正", null, "Childhood friendship is important because children learn trust, sharing and conflict through friends.", ""], ["Part 3", "青梅竹馬", "Do you still keep in touch with your friends from childhood?", "Some people do, but it often becomes less frequent as life changes. People often lose regular contact as school, work and location change. You can see this in daily life. Some friendships still survive through occasional messages or meetings. Frequency can drop without the old memories disappearing.", "中文邏輯：先回答題目 → Some people do, but it often becomes less frequent as life changes.｜理由：People often lose regular contact as school, work and location change.｜例子：Some friendships still survive through occasional messages or meetings.｜結果：Frequency can drop without the old memories disappearing.", "Part 3｜522/522 題目導向逐題校正", null, "Some people do, but it often becomes less frequent as life changes.", ""], ["Part 3", "本地名人", "Why are some students popular?", "Students are often popular because they are friendly, confident or good at including others. The reason is that popularity often comes from visibility, confidence and connection with other people. A friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Students are often popular because they are friendly, confident or good at including others.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Students are often popular because they are friendly, confident or good at including others.", ""], ["Part 3", "本地名人", "Is it always good to be a popular student at school?", "No. Popularity can bring pressure, and being respected matters more than being known. Popularity often comes from visibility, confidence and connection with other people. One clear example is a friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → No. Popularity can bring pressure, and being respected matters more than being known.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "No. Popularity can bring pressure, and being respected matters more than being known.", ""], ["Part 3", "想見的名人", "Do people become famous because of their talent?", "Sometimes, but talent is not the only reason. Timing, media and personality also matter. Talent is easier to see after people have had enough time and chances to try different things. You can see this in daily life. A child who is quiet in class may still be excellent at art or sport. Early labels can miss abilities that appear later.", "中文邏輯：先回答題目 → Sometimes, but talent is not the only reason. Timing, media and personality also matter.｜理由：Talent is easier to see after people have had enough time and chances to try different things.｜例子：A child who is quiet in class may still be excellent at art or sport.｜結果：Early labels can miss abilities that appear later.", "Part 3｜522/522 題目導向逐題校正", null, "Sometimes, but talent is not the only reason. Timing, media and personality also matter.", ""], ["Part 3", "想見的名人", "What can children do with their fame?", "They can use it to support good causes, but adults should protect their privacy and education. For example, too much public pressure can affect normal development. Fame needs strong support around the child.", "中文邏輯：先回答題目 → They can use it to support good causes, but adults should protect their privacy and education.｜理由：A famous child can use attention for creative work or good causes, but adults need to protect privacy and education.｜例子：Too much public pressure can affect normal development.｜結果：Fame needs strong support around the child.", "Part 3｜522/522 題目導向逐題校正", null, "They can use it to support good causes, but adults should protect their privacy and education.", ""], ["Part 3", "想見的名人", "What can today's children do to become famous?", "Social media makes it possible through music, sport, games or online content. For example, however, attention online can be very unpredictable. Trying to build a real skill is safer than chasing fame alone.", "中文邏輯：先回答題目 → Social media makes it possible through music, sport, games or online content.｜理由：Social media makes fame possible through music, sport, games or short videos.｜例子：However, attention online can be very unpredictable.｜結果：Trying to build a real skill is safer than chasing fame alone.", "Part 3｜522/522 題目導向逐題校正", null, "Social media makes it possible through music, sport, games or online content.", ""], ["Part 3", "想見的名人", "What are the advantages and disadvantages of being a famous child?", "Fame can bring opportunities, but it can also take away privacy and create pressure. Strong adult support is very important. For example, a child may feel watched or judged before they are mature enough to handle it.", "中文邏輯：先回答題目 → Fame can bring opportunities, but it can also take away privacy and create pressure.｜理由：Fame can bring money and opportunities, but it can also take away privacy and create pressure.｜例子：A child may feel watched or judged before they are mature enough to handle it.｜結果：Strong adult support is very important.", "Part 3｜522/522 題目導向逐題校正", null, "Fame can bring opportunities, but it can also take away privacy and create pressure.", ""], ["Part 3", "想見的名人", "Do you want to be a famous person?", "No. I would rather be respected for something I do well than be known by everyone. Fame gives attention, but it also reduces privacy and creates pressure. You can see this in daily life. A public figure may be judged for small mistakes that normal people can make privately. Being respected for good work matters more to me than being widely known.", "中文邏輯：先回答題目 → No. I would rather be respected for something I do well than be known by everyone.｜理由：Fame gives attention, but it also reduces privacy and creates pressure.｜例子：A public figure may be judged for small mistakes that normal people can make privately.｜結果：Being respected for good work matters more to me than being widely known.", "Part 3｜522/522 題目導向逐題校正", null, "No. I would rather be respected for something I do well than be known by everyone.", ""], ["Part 3", "想見的名人", "Is it easy to become famous in your country?", "It is easier to become visible online, but becoming famous and staying famous are still difficult. One video can reach a huge audience quickly. So staying famous is much harder because attention moves fast. It is easier to become visible online than in the past.", "中文邏輯：先回答題目 → It is easier to become visible online, but becoming famous and staying famous are still difficult.｜理由：It is easier to become visible online than in the past.｜例子：One video can reach a huge audience quickly.｜結果：Staying famous is much harder because attention moves fast.", "Part 3｜522/522 題目導向逐題校正", null, "It is easier to become visible online, but becoming famous and staying famous are still difficult.", ""], ["Part 3", "節省時間的方法/改變", "What can schools do to help students learn time management?", "Schools can teach students to set priorities, break tasks into steps and use simple schedules. Small routines can become useful habits later. This is because time management reduces last-minute stress and helps people balance different tasks. For example, a child who packs a school bag the night before has a calmer morning.", "中文邏輯：先回答題目 → Schools can teach students to set priorities, break tasks into steps and use simple schedules.｜理由：Time management reduces last-minute stress and helps people balance different tasks.｜例子：A child who packs a school bag the night before has a calmer morning.｜結果：Small routines can become useful habits later.", "Part 3｜522/522 題目導向逐題校正", null, "Schools can teach students to set priorities, break tasks into steps and use simple schedules.", ""], ["Part 3", "節省時間的方法/改變", "Is it necessary for children to learn time management?", "Yes. Basic time management helps children handle study, rest and responsibilities more independently. A child who packs a school bag the night before has a calmer morning. So small routines can become useful habits later. Time management reduces last-minute stress and helps people balance different tasks.", "中文邏輯：先回答題目 → Yes. Basic time management helps children handle study, rest and responsibilities more independently.｜理由：Time management reduces last-minute stress and helps people balance different tasks.｜例子：A child who packs a school bag the night before has a calmer morning.｜結果：Small routines can become useful habits later.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Basic time management helps children handle study, rest and responsibilities more independently.", ""], ["Part 3", "節省時間的方法/改變", "Do people who can manage time well become successful more easily?", "Often, yes, because good time management helps people use their effort more effectively. It supports success, although skill and luck still matter too. For example, finishing important tasks first leaves more time for rest and unexpected problems.", "中文邏輯：先回答題目 → Often, yes, because good time management helps people use their effort more effectively.｜理由：Good time management helps people use their effort more effectively.｜例子：Finishing important tasks first leaves more time for rest and unexpected problems.｜結果：It supports success, although skill and luck still matter too.", "Part 3｜522/522 題目導向逐題校正", null, "Often, yes, because good time management helps people use their effort more effectively.", ""], ["Part 3", "節省時間的方法/改變", "Do you think parents should be responsible for teaching children to save time?", "Parents can help, but children also need to practise managing their own time. Preparing things the night before or using one clear task list can make a day smoother. So small systems often save more time than rushing. People save time by reducing repeated decisions and unnecessary steps.", "中文邏輯：先回答題目 → Parents can help, but children also need to practise managing their own time.｜理由：People save time by reducing repeated decisions and unnecessary steps.｜例子：Preparing things the night before or using one clear task list can make a day smoother.｜結果：Small systems often save more time than rushing.", "Part 3｜522/522 題目導向逐題校正", null, "Parents can help, but children also need to practise managing their own time.", ""], ["Part 3", "節省時間的方法/改變", "Does technology help people save time? How and why?", "Yes. Technology can remove repeated steps, such as banking, booking or finding routes. The reason is that technology is useful when it saves time or removes distance without taking away human judgement. A map app can suggest a route, but the user still chooses what works best. The tool should support the person.", "中文邏輯：先回答題目 → Yes. Technology can remove repeated steps, such as banking, booking or finding routes.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Technology can remove repeated steps, such as banking, booking or finding routes.", ""], ["Part 3", "節省時間的方法/改變", "What can people do to save time?", "People can set priorities, prepare things early and reduce unnecessary phone use. People save time by reducing repeated decisions and unnecessary steps. In real life, preparing things the night before or using one clear task list can make a day smoother. Small systems often save more time than rushing.", "中文邏輯：先回答題目 → People can set priorities, prepare things early and reduce unnecessary phone use.｜理由：People save time by reducing repeated decisions and unnecessary steps.｜例子：Preparing things the night before or using one clear task list can make a day smoother.｜結果：Small systems often save more time than rushing.", "Part 3｜522/522 題目導向逐題校正", null, "People can set priorities, prepare things early and reduce unnecessary phone use.", ""], ["Part 3", . For example, a map app can suggest a route, but the user still chooses what works best.", "中文邏輯：先回答題目 → Yes. Calendars, alarms and notes can reduce the need to remember everything mentally.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Calendars, alarms and notes can reduce the need to remember everything mentally.", ""], ["Part 3", "印象深刻的课程", "Which can help people remember things better, words or photos?", "Photos often bring back a memory faster, while words can give more exact detail. Photos are useful because they keep memories, but taking too many can reduce attention. For example, a traveller may remember the camera screen more than the place itself. A few meaningful photos are often enough.", "中文邏輯：先回答題目 → Photos often bring back a memory faster, while words can give more exact detail.｜理由：Photos are useful because they keep memories, but taking too many can reduce attention.｜例子：A traveller may remember the camera screen more than the place itself.｜結果：A few meaningful photos are often enough.", "Part 3｜522/522 題目導向逐題校正", null, "Photos often bring back a memory faster, while words can give more exact detail.", ""], ["Part 3", "印象深刻的课程", "Do people like things of memorial significance?", "Yes. Objects connected with important people or events can carry strong emotional value. Objects with memories can feel more valuable than expensive new things. For example, a small graduation gift may remind someone of an important stage of life. Emotional value often grows over time.", "中文邏輯：先回答題目 → Yes. Objects connected with important people or events can carry strong emotional value.｜理由：Objects with memories can feel more valuable than expensive new things.｜例子：A small graduation gift may remind someone of an important stage of life.｜結果：Emotional value often grows over time.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Objects connected with important people or events can carry strong emotional value.", ""], ["Part 3", "印象深刻的课程", "Why do some people have a better memory than others?", "Memory can differ because of attention, sleep, practice and how people connect information. Someone remembers a story more easily when it links to a strong image or personal experience. That matters because memory improves with attention, sleep and meaningful connections. Memory is not only natural talent.", "中文邏輯：先回答題目 → Memory can differ because of attention, sleep, practice and how people connect information.｜理由：Memory improves with attention, sleep and meaningful connections.｜例子：Someone remembers a story more easily when it links to a strong image or personal experience.｜結果：Memory is not only natural talent.", "Part 3｜522/522 題目導向逐題校正", null, "Memory can differ because of attention, sleep, practice and how people connect information.", ""], ["Part 3", "送朋友的禮物", "Are there any unlucky things that people should not buy as gifts in your country?", "Some people avoid certain gifts because of local beliefs, but these rules are not equally important to everyone. Some people avoid gifts connected with bad meanings or unlucky numbers. That matters because gift taboos usually come from cultural beliefs rather than the object itself. Knowing the receiver's beliefs is more important than memorising every rule.", "中文邏輯：先回答題目 → Some people avoid certain gifts because of local beliefs, but these rules are not equally important to everyone.｜理由：Gift taboos usually come from cultural beliefs rather than the object itself.｜例子：Some people avoid gifts connected with bad meanings or unlucky numbers.｜結果：Knowing the receiver's beliefs is more important than memorising every rule.", "Part 3｜522/522 題目導向逐題校正", null, "Some people avoid certain gifts because of local beliefs, but these rules are not equally important to everyone.", ""], ["Part 3", "送朋友的禮物", "What do people usually consider when buying gifts?", "People usually think about the person's interests, the occasion and their budget. The reason is that good gift choices start with the person's interests, the occasion and the budget. A small item linked to a hobby can feel more personal than an expensive random gift. Understanding the person makes the choice easier.", "中文邏輯：先回答題目 → People usually think about the person's interests, the occasion and their budget.｜理由：Good gift choices start with the person's interests, the occasion and the budget.｜例子：A small item linked to a hobby can feel more personal than an expensive random gift.｜結果：Understanding the person makes the choice easier.", "Part 3｜522/522 題目導向逐題校正", null, "People usually think about the person's interests, the occasion and their budget.", ""], ["Part 3", "送朋友的禮物", "Which do people give on traditional festivals, red envelopes or other kinds of gifts?", "Red envelopes are common during Lunar New Year, while other festivals may use food or small gifts. Different festivals use different kinds of gifts. You can see this in daily life. Red envelopes are common at Lunar New Year, while food or small presents may fit other occasions. The gift usually follows the meaning of the event.", "中文邏輯：先回答題目 → Red envelopes are common during Lunar New Year, while other festivals may use food or small gifts.｜理由：Different festivals use different kinds of gifts.｜例子：Red envelopes are common at Lunar New Year, while food or small presents may fit other occasions.｜結果：The gift usually follows the meaning of the event.", "Part 3｜522/522 題目導向逐題校正", null, "Red envelopes are common during Lunar New Year, while other festivals may use food or small gifts.", ""], ["Part 3", "送朋友的禮物", "Will people feel happy when receiving an expensive gift?", "It can make someone happy, but price alone does not make a gift meaningful. Happiness is usually connected with relationships, rest and a sense of progress. For example, a student may feel happier when they have friends and can see improvement. Constant excitement is not necessary for a good life.", "中文邏輯：先回答題目 → It can make someone happy, but price alone does not make a gift meaningful.｜理由：Happiness is usually connected with relationships, rest and a sense of progress.｜例子：A student may feel happier when they have friends and can see improvement.｜結果：Constant excitement is not necessary for a good life.", "Part 3｜522/522 題目導向逐題校正", null, "It can make someone happy, but price alone does not make a gift meaningful.", ""], ["Part 3", "送朋友的禮物", "Is it hard to choose a gift?", "It can be hard when we do not know what the person really likes or needs. The reason is that gift choice becomes easier when we know the person's interests and the occasion. A useful hobby-related item is safer than something chosen only because it is expensive. Personal knowledge matters most.", "中文邏輯：先回答題目 → It can be hard when we do not know what the person really likes or needs.｜理由：Gift choice becomes easier when we know the person's interests and the occasion.｜例子：A useful hobby-related item is safer than something chosen only because it is expensive.｜結果：Personal knowledge matters most.", "Part 3｜522/522 題目導向逐題校正", null, "It can be hard when we do not know what the person really likes or needs.", ""], ["Part 3", "送朋友的禮物", "When do people normally send gifts to others?", "People often give gifts on birthdays, weddings, holidays, graduations or when visiting someone. The timing gives the gift meaning. Not every gift needs to be expensive.", "中文邏輯：先回答題目 → People often give gifts on birthdays, weddings, holidays, graduations or when visiting someone.｜理由：People usually give gifts on birthdays, weddings, holidays, graduations or visits.｜例子：The timing gives the gift meaning.｜結果：Not every gift needs to be expensive.", "Part 3｜522/522 題目導向逐題校正", null, "People often give gifts on birthdays, weddings, holidays, graduations or when visiting someone.", ""], ["Part 3", "最不喜歡的電影", "Can movies help people better understand the cultural background of a country?", "Yes, to some degree. Movies can show language, food, family life and social habits. One reason is that movies work when story, characters and pacing keep people interested. A simple example is a famous actor can attract attention, but cannot fix a weak story. The experience matters more than the name on the poster.", "中文邏輯：先回答題目 → Yes, to some degree. Movies can show language, food, family life and social habits.｜理由：Movies work when story, characters and pacing keep people interested.｜例子：A famous actor can attract attention, but cannot fix a weak story.｜結果：The experience matters more than the name on the poster.", "Part 3｜522/522 題目導向逐題校正", null, "Yes, to some degree. Movies can show language, food, family life and social habits.", ""], ["Part 3", "最不喜歡的電影", "Are movies more likely to help people become more creative than books?", "Not necessarily. Books often leave more space for imagination because readers create the images themselves. A team may find a new design after one person suggests an unusual idea. So different thinking can improve the final result. Creative people help others see different ways to solve a problem.", "中文邏輯：先回答題目 → Not necessarily. Books often leave more space for imagination because readers create the images themselves.｜理由：Creative people help others see different ways to solve a problem.｜例子：A team may find a new design after one person suggests an unusual idea.｜結果：Different thinking can improve the final result.", "Part 3｜522/522 題目導向逐題校正", null, "Not necessarily. Books often leave more space for imagination because readers create the images themselves.", ""], ["Part 3", "最不喜歡的電影", "What are the differences between watching movies at home and in a cinema?", "Home is more comfortable, while a cinema gives stronger sound and a bigger screen. Movies work when story, characters and pacing keep people interested. For example, a famous actor can attract attention, but cannot fix a weak story. The experience matters more than the name on the poster.", "中文邏輯：先回答題目 → Home is more comfortable, while a cinema gives stronger sound and a bigger screen.｜理由：Movies work when story, characters and pacing keep people interested.｜例子：A famous actor can attract attention, but cannot fix a weak story.｜結果：The experience matters more than the name on the poster.", "Part 3｜522/522 題目導向逐題校正", null, "Home is more comfortable, while a cinema gives stronger sound and a bigger screen.", ""], ["Part 3", "最不喜歡的電影", "What kinds of movies are the most popular in Taiwan?", "Action films, comedies, animation and popular international movies are widely watched in Taiwan. Popularity often comes from visibility, confidence and connection with other people. In real life, a friendly student who includes others may become popular without trying to show off. Being liked is not the same as being respected.", "中文邏輯：先回答題目 → Action films, comedies, animation and popular international movies are widely watched in Taiwan.｜理由：Popularity often comes from visibility, confidence and connection with other people.｜例子：A friendly student who includes others may become popular without trying to show off.｜結果：Being liked is not the same as being respected.", "Part 3｜522/522 題目導向逐題校正", null, "Action films, comedies, animation and popular international movies are widely watched in Taiwan.", ""], ["Part 3", "和朋友度過的愉快夜晚", "What are the differences between young people’s leisure time activities and those of old people?", "Young people often choose more digital and social activities, while older people may prefer slower routines. Different age groups often relax in different ways because energy, technology and routines change. Life stage shapes leisure. For instance, young people may use more digital entertainment, while older people may prefer slower social activities.", "中文邏輯：先回答題目 → Young people often choose more digital and social activities, while older people may prefer slower routines.｜理由：Different age groups often relax in different ways because energy, technology and routines change.｜例子：Young people may use more digital entertainment, while older people may prefer slower social activities.｜結果：Life stage shapes leisure.", "Part 3｜522/522 題目導向逐題校正", null, "Young people often choose more digital and social activities, while older people may prefer slower routines.", ""], ["Part 3", "和朋友度過的愉快夜晚", "What can we do to bring family members closer together?", "Regular meals, shared activities and real conversation can bring family members closer. Regular shared time matters more than rare big events. In real life, eating together or taking a short walk gives people space to talk. Small routines can keep family relationships warm.", "中文邏輯：先回答題目 → Regular meals, shared activities and real conversation can bring family members closer.｜理由：Regular shared time matters more than rare big events.｜例子：Eating together or taking a short walk gives people space to talk.｜結果：Small routines can keep family relationships warm.", "Part 3｜522/522 題目導向逐題校正", null, "Regular meals, shared activities and real conversation can bring family members closer.", ""], ["Part 3", "和朋友度過的愉快夜晚", "How do people get along in a big family?", "Clear communication and respect for different habits are especially important in a big family. Good boundaries reduce small conflicts. For example, people cannot expect everyone to think the same way.", "中文邏輯：先回答題目 → Clear communication and respect for different habits are especially important in a big family.｜理由：Big families need patience, clear communication and respect for different habits.｜例子：People cannot expect everyone to think the same way.｜結果：Good boundaries reduce small conflicts.", "Part 3｜522/522 題目導向逐題校正", null, "Clear communication and respect for different habits are especially important in a big family.", ""], ["Part 3", "小時候學到的新技能", "Is it important for everyone to have a specialized skill?", "A strong skill is useful, but people also need basic communication and problem-solving skills. A simple example is a technical expert still needs to explain ideas to other people. One skill works best with other basic abilities.", "中文邏輯：先回答題目 → A strong skill is useful, but people also need basic communication and problem-solving skills.｜理由：A strong skill is useful, but people also need basic communication and problem-solving.｜例子：A technical expert still needs to explain ideas to other people.｜結果：One skill works best with other basic abilities.", "Part 3｜522/522 題目導向逐題校正", null, "A strong skill is useful, but people also need basic communication and problem-solving skills.", ""], ["Part 3", "小時候學到的新技能", "Can a child learn skills from another child?", "Yes. Children often copy each other and learn well through play and shared practice. One child can show another how to play a game or use a simple tool. That matters because children often learn well by copying and practising together. Peer learning can feel less stressful than formal teaching.", "中文邏輯：先回答題目 → Yes. Children often copy each other and learn well through play and shared practice.｜理由：Children often learn well by copying and practising together.｜例子：One child can show another how to play a game or use a simple tool.｜結果：Peer learning can feel less stressful than formal teaching.", "Part 3｜522/522 題目導向逐題校正", null, "Yes. Children often copy each other and learn well through play and shared practice.", ""], ["Part 3", "小時候學到的新技能", "Do you think it is easier for children to learn new skills than for adults?", "Children are often less afraid of mistakes, so they practise more naturally. Skills improve through practice, feedback and repetition. You can see this in daily life. An adult can watch a short lesson and then practise the same action several times. Understanding grows faster when people actually use the skill.", "中文邏輯：先回答題目 → Children are often less afraid of mistakes, so they practise more naturally.｜理由：Skills improve through practice, feedback and repetition.｜例子：An adult can watch a short lesson and then practise the same action several times.｜結果：Understanding grows faster when people actually use the skill.", "Part 3｜522/522 題目導向逐題校正", null, "Children are often less afraid of mistakes, so they practise more naturally.", ""], ["Part 3", "小時候學到的新技能", "What are the differences between the way adults learn and the way children learn?", "Adults often want a clear reason and method, while children learn more naturally through play and repetition. Age changes the learning style. For example, adults may worry more about mistakes, while children usually try again faster.", "中文邏輯：先回答題目 → Adults often want a clear reason and method, while children learn more naturally through play and repetition.｜理由：Adults often want a clear reason and method, while children learn more naturally through play and repetition.｜例子：Adults may worry more about mistakes, while children usually try again faster.｜結果：Age changes the learning style.", "Part 3｜522/522 題目導向逐題校正", null, "Adults often want a clear reason and method, while children learn more naturally through play and repetition.", ""], ["Part 3", "小時候學到的新技能", "What are the differences between learning in a group and learning by yourself?", "Group learning gives interaction, while learning alone gives more control over speed. For example, speaking practice works well in a group, while review can be easier alone. The better method depends on the task.", "中文邏輯：先回答題目 → Group learning gives interaction, while learning alone gives more control over speed.｜理由：Group learning gives interaction, while solo learning gives more control over speed.｜例子：Speaking practice works well in a group, while review can be easier alone.｜結果：The better method depends on the task.", "Part 3｜522/522 題目導向逐題校正", null, "Group learning gives interaction, while learning alone gives more control over speed.", ""], ["Part 3", "小時候學到的新技能", "What skills should children learn before they go to school?", "Basic communication, self-care, sharing and simple problem-solving are useful before school. Academic knowledge is not the only preparation. For example, these skills help children join a group and follow daily routines.", "中文邏輯：先回答題目 → Basic communication, self-care, sharing and simple problem-solving are useful before school.｜理由：Basic communication, self-care, sharing and simple problem-solving are useful before school.｜例子：These skills help children join a group and follow daily routines.｜結果：Academic knowledge is not the only preparation.", "Part 3｜522/522 題目導向逐題校正", null, "Basic communication, self-care, sharing and simple problem-solving are useful before school.", ""], ["Part 3", "保護環境的法律", "What is the purpose of punishment?", "Punishment should stop harmful behaviour and help people understand the result of their actions. A fair consequence plus an explanation is better than fear alone. The goal should be better behaviour.", "中文邏輯：先回答題目 → Punishment should stop harmful behaviour and help people understand the result of their actions.｜理由：Punishment should stop harmful behaviour and help people understand the result of their actions.｜例子：A fair consequence plus an explanation is better than fear alone.｜結果：The goal should be better behaviour.", "Part 3｜522/522 題目導向逐題校正", null, "Punishment should stop harmful behaviour and help people understand the result of their actions.", ""], ["Part 3", "保護環境的法律", "What are the rules people should obey at work?", "People should follow safety rules, respect others, protect private information and meet basic responsibilities. Work rules protect safety, trust and basic responsibility. In real life, employees may need to follow safety steps, protect private information and treat others respectfully. Clear rules prevent avoidable problems.", "中文邏輯：先回答題目 → People should follow safety rules, respect others, protect private information and meet basic responsibilities.｜理由：Work rules protect safety, trust and basic responsibility.｜例子：Employees may need to follow safety steps, protect private information and treat others respectfully.｜結果：Clear rules prevent avoidable problems.", "Part 3｜522/522 題目導向逐題校正", null, "People should follow safety rules, respect others, protect private information and meet basic responsibilities.", ""], ["Part 3", "保護環境的法律", "How can parents and teachers help children understand and follow rules?", "Adults should explain the reason for a rule and follow the same rule themselves. Parents usually shape daily values, while teachers strongly influence school and learning. For example, a child may ask parents about life choices and a teacher about study problems. Both roles matter in different areas.", "中文邏輯：先回答題目 → Adults should explain the reason for a rule and follow the same rule themselves.｜理由：Parents usually shape daily values, while teachers strongly influence school and learning.｜例子：A child may ask parents about life choices and a teacher about study problems.｜結果：Both roles matter in different areas.", "Part 3｜522/522 題目導向逐題校正", null, "Adults should explain the reason for a rule and follow the same rule themselves.", ""], ["Part 3", "保護環境的法律", "Are children unhappy with the school rules?", "Sometimes, especially when rules feel too strict or the reason is not clear. The reason is that rules make school safer and fairer when students understand the reason behind them. Rules against cheating protect students who study honestly. Clear rules work better than rules that feel random.", "中文邏輯：先回答題目 → Sometimes, especially when rules feel too strict or the reason is not clear.｜理由：Rules make school safer and fairer when students understand the reason behind them.｜例子：Rules against cheating protect students who study honestly.｜結果：Clear rules work better than rules that feel random.", "Part 3｜522/522 題目導向逐題校正", null, "Sometimes, especially when rules feel too strict or the reason is not clear.", ""], ["Part 3", "保護環境的法律", "Do you think school rules are important?", "Yes. Clear school rules protect safety, 由：Environmental rules work when people understand them and they are easy to follow.｜例子：Clear recycling rules are more useful when bins are also easy to find.｜結果：Rules need practical support.", "Part 3｜522/522 題目導向逐題校正", null, "Taiwan has rules about recycling, waste, pollution and some single-use plastics.", ""], ["Part 3", "想要頒布的環保法律", "Will there be a law that is universally accepted?", "Probably not. Laws affect people in different ways, so complete agreement is very rare. For example, a traffic rule may feel inconvenient to one person but protect many others. Fairness matters more than making everyone happy.", "中文邏輯：先回答題目 → Probably not. Laws affect people in different ways, so complete agreement is very rare.｜理由：Laws affect people in different ways, so complete agreement is almost impossible.｜例子：A traffic rule may feel inconvenient to one person but protect many others.｜結果：Fairness matters more than making everyone happy.", "Part 3｜522/522 題目導向逐題校正", null, "Probably not. Laws affect people in different ways, so complete agreement is very rare.", ""], ["Part 3", "想要頒布的環保法律", "How does technology affect the law?", "Technology creates new problems, so laws have to change around privacy, AI and online crime. The reason is that technology is useful when it saves time or removes distance without taking away human judgement. A map app can suggest a route, but the user still chooses what works best. The tool should support the person.", "中文邏輯：先回答題目 → Technology creates new problems, so laws have to change around privacy, AI and online crime.｜理由：Technology is useful when it saves time or removes distance without taking away human judgement.｜例子：A map app can suggest a route, but the user still chooses what works best.｜結果：The tool should support the person.", "Part 3｜522/522 題目導向逐題校正", null, "Technology creates new problems, so laws have to change around privacy, AI and online crime.", ""], ["Part 3", "想頒布的新法律", "How can parents teach children to obey rules?", "Parents can explain the reason, set a clear example and use fair consequences. Children follow rules better when adults explain the reason and model the same behaviour. In real life, a parent who follows a safety rule is more convincing than one who only gives orders. Consistency builds trust.", "中文邏輯：先回答題目 → Parents can explain the reason, set a clear example and use fair consequences.｜理由：Children follow rules better when adults explain the reason and model the same behaviour.｜例子：A parent who follows a safety rule is more convincing than one who only gives orders.｜結果：Consistency builds trust.", "Part 3｜522/522 題目導向逐題校正", null, "Parents can explain the reason, set a clear example and use fair consequences.", ""], ["Part 3", "想頒布的新法律", "What are the benefits for people to obey rules?", "Rules make behaviour more predictable and help protect safety and fairness. Traffic works better when everyone follows the same signals. Shared rules reduce confusion.", "中文邏輯：先回答題目 → Rules make behaviour more predictable and help protect safety and fairness.｜理由：Rules make behaviour more predictable and help protect fairness and safety.｜例子：Traffic works better when everyone follows the same signals.｜結果：Shared rules reduce confusion.", "Part 3｜522/522 題目導向逐題校正", null, "Rules make behaviour more predictable and help protect safety and fairness.", ""], ["Part 3", "想頒布的新法律", "Do you think children can learn about the law outside of school?", "Yes. Children can learn about laws from parents, news, public information and real situations. Children see rules in daily life, not only in textbooks. One clear example is crossing roads, using public transport and seeing news stories all teach simple legal ideas. Real situations can make rules easier to understand.", "中文邏輯：先回答題目 → Yes. Children can learn about laws from parents, news, public information and real situations.｜理由：Children see rules in daily life, not only in textbooks.｜例子：Crossing roads, using public transport and seeing news stories all teach
